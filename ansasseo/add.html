<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안샀어 — 기록</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; background:#ffffff; color:#0a0a0a; width:390px; margin:0 auto; min-height:844px; padding-bottom:100px; }
  .nav { display:flex; align-items:center; gap:12px; padding:16px 20px; }
  .nav .back { width:36px; height:36px; border-radius:8px; border:1px solid #e5e5e5; display:flex; align-items:center; justify-content:center; }
  .nav .t { font-size:18px; font-weight:600; }
  .body { padding:8px 20px; display:flex; flex-direction:column; gap:22px; }
  .field label { display:block; font-size:14px; font-weight:500; margin-bottom:8px; }
  .input { width:100%; height:48px; border:1px solid #e5e5e5; border-radius:8px; padding:0 14px; font-size:15px; color:#0a0a0a; display:flex; align-items:center; }
  .input.ph { color:#a3a3a3; }
  .input .price { margin-left:auto; font-weight:600; color:#171717; }
  .seg2 { display:flex; gap:8px; }
  .seg2 .opt { flex:1; height:48px; border:1px solid #e5e5e5; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:7px; font-size:14px; font-weight:500; color:#737373; }
  .seg2 .opt.sel { border-color:#171717; background:#171717; color:#fafafa; }
  .seg2 .opt.sel.red { border-color:#ef4444; background:#ef4444; }
  textarea { width:100%; min-height:96px; border:1px solid #e5e5e5; border-radius:8px; padding:12px 14px; font-size:15px; font-family:inherit; color:#0a0a0a; resize:none; }
  textarea::placeholder { color:#a3a3a3; }
  .ai-hint { display:flex; gap:8px; padding:12px 14px; background:#f5f5f5; border-radius:8px; margin-top:10px; }
  .ai-hint .txt { font-size:13px; color:#404040; line-height:18px; }
  .ai-hint .txt b { color:#171717; }
  .emo { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:9px 14px; border:1px solid #e5e5e5; border-radius:9999px; font-size:13px; font-weight:500; color:#404040; }
  .chip.sel { background:#171717; color:#fafafa; border-color:#171717; }
  .footer { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:390px; padding:14px 20px 28px; background:#ffffff; border-top:1px solid #e5e5e5; }
  .cta { width:100%; height:50px; background:#171717; color:#fafafa; border:none; border-radius:8px; font-size:16px; font-weight:600; }
  svg { display:block; }
</style>
</head>
<body>
  <div class="nav">
    <div class="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </div>
    <div class="t">관망 결정 기록</div>
  </div>

  <div class="body">
    <div class="field">
      <label>종목</label>
      <div class="input">
        <span>엔비디아 · NVDA</span>
        <span class="price">$118.20</span>
      </div>
    </div>

    <div class="field">
      <label>어떤 결정?</label>
      <div class="seg2">
        <div class="opt sel red">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          안 샀어
        </div>
        <div class="opt">안 팔았어</div>
      </div>
    </div>

    <div class="field">
      <label>왜 그렇게 했어?</label>
      <textarea placeholder="살까 말까 고민했던 진짜 이유를 적어줘. 솔직할수록 AI가 패턴을 잘 찾아.">너무 올랐어. 조정 오면 사자.</textarea>
      <div class="ai-hint">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M12 3a6 6 0 0 0-6 6c0 1.5.5 2.5 1.5 3.5S9 14 9 15h6c0-1 .5-1.5 1.5-2.5S18 10.5 18 9a6 6 0 0 0-6-6Z"/><path d="M9 18h6M10 21h4"/></svg>
        <div class="txt"><b>AI 메모:</b> "조정 오면 사자"는 너의 단골 멘트야. 최근 3번 중 2번은 조정 없이 올랐어.</div>
      </div>
    </div>

    <div class="field">
      <label>지금 감정은?</label>
      <div class="emo">
        <div class="chip sel">불안</div>
        <div class="chip">욕심</div>
        <div class="chip">확신없음</div>
        <div class="chip">FOMO</div>
        <div class="chip">신중</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="cta">관망 시작하기</button>
  </div>
</body>
</html>
