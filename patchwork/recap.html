<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patchwork — 세션 완료</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #f5f5f5;
  color: #0a0a0a;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.phone {
  width: 390px;
  min-height: 100vh;
  background: #ffffff;
  position: relative;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px 8px;
  font-size: 14px;
  font-weight: 600;
}
.status-bar .icons { display: flex; gap: 6px; align-items: center; }

/* Celebration */
.celebration {
  padding: 40px 24px 32px;
  text-align: center;
}
.check-circle {
  width: 72px;
  height: 72px;
  background: #22c55e;
  border-radius: 9999px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
}
.check-circle svg { width: 36px; height: 36px; color: #fff; }
.cele-title {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.025em;
  margin-bottom: 8px;
}
.cele-sub {
  font-size: 15px;
  color: #737373;
  line-height: 22px;
}

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 24px;
  margin-bottom: 28px;
}
.stat-card {
  background: #f9fafb;
  border: 1px solid #f0f0f0;
  border-radius: 12px;
  padding: 16px;
  text-align: center;
}
.stat-value {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.stat-value.blue { color: #3b82f6; }
.stat-value.green { color: #22c55e; }
.stat-value.orange { color: #f59e0b; }
.stat-value.purple { color: #8b5cf6; }
.stat-label {
  font-size: 12px;
  color: #737373;
  font-weight: 500;
}

/* AI Summary */
.ai-summary {
  margin: 0 24px 24px;
  background: #f9fafb;
  border: 1px solid #e5e5e5;
  border-radius: 12px;
  padding: 20px;
}
.ai-summary-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.ai-badge {
  width: 28px;
  height: 28px;
  background: #3b82f6;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ai-badge svg { width: 16px; height: 16px; color: #fff; }
.ai-summary-title {
  font-size: 15px;
  font-weight: 600;
}
.ai-summary-body {
  font-size: 14px;
  line-height: 22px;
  color: #525252;
}
.ai-summary-body strong { color: #0a0a0a; }
.ai-next {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #e5e5e5;
}
.ai-next-label {
  font-size: 12px;
  font-weight: 600;
  color: #3b82f6;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.ai-next-text {
  font-size: 14px;
  color: #525252;
  line-height: 20px;
}

/* Streak */
.streak-section {
  margin: 0 24px 28px;
}
.streak-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
}
.streak-days {
  display: flex;
  gap: 8px;
  justify-content: space-between;
}
.streak-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.streak-dot {
  width: 36px;
  height: 36px;
  border-radius: 9999px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.streak-dot.filled {
  background: #22c55e;
}
.streak-dot.filled svg { width: 18px; height: 18px; color: #fff; }
.streak-dot.today {
  background: #0a0a0a;
}
.streak-dot.today svg { width: 18px; height: 18px; color: #fff; }
.streak-dot.empty {
  background: #f5f5f5;
  border: 2px dashed #d4d4d4;
}
.streak-label {
  font-size: 11px;
  color: #a3a3a3;
  font-weight: 500;
}
.streak-label.today { color: #0a0a0a; font-weight: 600; }

/* CTA Buttons */
.cta-section {
  padding: 0 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #0a0a0a;
  color: #fafafa;
  border: none;
  border-radius: 10px;
  padding: 16px;
  font-size: 16px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  width: 100%;
}
.btn-secondary {
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: #737373;
  border: none;
  padding: 12px;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>14:35</span>
    <div class="icons">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>
    </div>
  </div>

  <!-- Celebration -->
  <div class="celebration">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="cele-title">잘했어!</div>
    <div class="cele-sub">오늘도 한 조각 이어 붙였어.<br>Tuckit이 조금 더 완성에 가까워졌어.</div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value blue">28분</div>
      <div class="stat-label">집중 시간</div>
    </div>
    <div class="stat-card">
      <div class="stat-value green">3개</div>
      <div class="stat-label">완료 태스크</div>
    </div>
    <div class="stat-card">
      <div class="stat-value orange">72%</div>
      <div class="stat-label">프로젝트 진행률</div>
    </div>
    <div class="stat-card">
      <div class="stat-value purple">5일</div>
      <div class="stat-label">연속 작업</div>
    </div>
  </div>

  <!-- AI Summary -->
  <div class="ai-summary">
    <div class="ai-summary-header">
      <div class="ai-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div class="ai-summary-title">AI 세션 요약</div>
    </div>
    <div class="ai-summary-body">
      로그인 화면의 <strong>이메일 유효성 검사</strong>와 <strong>비밀번호 재설정 와이어프레임</strong>을 완료했어. 소셜 로그인은 이미 끝나서 인증 기능은 거의 마무리 단계야.
    </div>
    <div class="ai-next">
      <div class="ai-next-label">다음 세션 추천</div>
      <div class="ai-next-text">온보딩 플로우 UI 작업 (예상 30분, 태스크 4개)</div>
    </div>
  </div>

  <!-- Streak -->
  <div class="streak-section">
    <div class="streak-title">이번 주 기록</div>
    <div class="streak-days">
      <div class="streak-day">
        <div class="streak-dot filled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="streak-label">월</span>
      </div>
      <div class="streak-day">
        <div class="streak-dot filled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="streak-label">화</span>
      </div>
      <div class="streak-day">
        <div class="streak-dot today">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="streak-label today">수</span>
      </div>
      <div class="streak-day">
        <div class="streak-dot empty"></div>
        <span class="streak-label">목</span>
      </div>
      <div class="streak-day">
        <div class="streak-dot empty"></div>
        <span class="streak-label">금</span>
      </div>
      <div class="streak-day">
        <div class="streak-dot empty"></div>
        <span class="streak-label">토</span>
      </div>
      <div class="streak-day">
        <div class="streak-dot empty"></div>
        <span class="streak-label">일</span>
      </div>
    </div>
  </div>

  <!-- CTA -->
  <div class="cta-section">
    <button class="btn-primary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      홈으로
    </button>
    <button class="btn-secondary">메모 남기기</button>
  </div>
</div>
</body>
</html>
