<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patchwork — 집중 세션</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #f5f5f5;
  color: #fafafa;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.phone {
  width: 390px;
  min-height: 100vh;
  background: #0a0a0a;
  position: relative;
  display: flex;
  flex-direction: column;
}
/* Status bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px 8px;
  font-size: 14px;
  font-weight: 600;
  color: #fafafa;
}
.status-bar .icons { display: flex; gap: 6px; align-items: center; }

/* Session Header */
.session-header {
  padding: 12px 24px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.session-back {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #a3a3a3;
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
}
.session-back svg { width: 20px; height: 20px; }
.session-end {
  background: transparent;
  border: 1px solid #404040;
  color: #fafafa;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
}

/* Timer Section */
.timer-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 24px;
}
.timer-project {
  font-size: 14px;
  color: #a3a3a3;
  font-weight: 500;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.timer-task {
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 40px;
  line-height: 30px;
}
.timer-ring {
  position: relative;
  width: 220px;
  height: 220px;
  margin-bottom: 40px;
}
.timer-ring svg {
  transform: rotate(-90deg);
  width: 220px;
  height: 220px;
}
.timer-ring .bg {
  stroke: #262626;
  fill: none;
  stroke-width: 6;
}
.timer-ring .progress {
  stroke: #fafafa;
  fill: none;
  stroke-width: 6;
  stroke-linecap: round;
  stroke-dasharray: 628.3;
  stroke-dashoffset: 157;
  transition: stroke-dashoffset 1s;
}
.timer-time {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.timer-time .big {
  font-size: 48px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}
.timer-time .small {
  font-size: 14px;
  color: #737373;
  margin-top: 4px;
}

/* Controls */
.controls {
  display: flex;
  gap: 24px;
  align-items: center;
}
.ctrl-btn {
  width: 56px;
  height: 56px;
  border-radius: 9999px;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: inherit;
}
.ctrl-btn.pause {
  background: #fafafa;
  color: #0a0a0a;
}
.ctrl-btn.skip {
  background: #262626;
  color: #fafafa;
}
.ctrl-btn svg { width: 24px; height: 24px; }

/* Task Progress */
.task-progress-section {
  padding: 32px 24px 40px;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.progress-label span {
  font-size: 13px;
  color: #737373;
  font-weight: 500;
}
.progress-label strong {
  color: #fafafa;
  font-weight: 600;
}
.progress-bar {
  width: 100%;
  height: 6px;
  background: #262626;
  border-radius: 9999px;
  overflow: hidden;
  margin-bottom: 20px;
}
.progress-fill {
  height: 100%;
  background: #fafafa;
  border-radius: 9999px;
  width: 40%;
}

/* Task List in Session */
.session-tasks {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.s-task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 10px;
}
.s-task.current {
  background: #1a1a1a;
  border: 1px solid #404040;
}
.s-task.done {
  opacity: 0.4;
}
.s-task.upcoming {
  opacity: 0.5;
}
.s-task-check {
  width: 20px;
  height: 20px;
  border: 2px solid #404040;
  border-radius: 6px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.s-task.current .s-task-check {
  border-color: #fafafa;
}
.s-task.done .s-task-check {
  background: #22c55e;
  border-color: #22c55e;
}
.s-task-check svg { width: 12px; height: 12px; }
.s-task-name {
  font-size: 14px;
  font-weight: 500;
  flex: 1;
}
.s-task.done .s-task-name {
  text-decoration: line-through;
}
.s-task-time {
  font-size: 12px;
  color: #737373;
  font-weight: 500;
}
.s-task.current .s-task-indicator {
  width: 6px;
  height: 6px;
  background: #3b82f6;
  border-radius: 9999px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>14:17</span>
    <div class="icons">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>
    </div>
  </div>

  <!-- Session Header -->
  <div class="session-header">
    <a href="#" class="session-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      나가기
    </a>
    <button class="session-end">세션 종료</button>
  </div>

  <!-- Timer -->
  <div class="timer-section">
    <div class="timer-project">Tuckit</div>
    <div class="timer-task">이메일 유효성 검사 로직 추가</div>
    <div class="timer-ring">
      <svg viewBox="0 0 220 220">
        <circle class="bg" cx="110" cy="110" r="100"/>
        <circle class="progress" cx="110" cy="110" r="100"/>
      </svg>
      <div class="timer-time">
        <div class="big">22:43</div>
        <div class="small">남은 시간</div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn skip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <button class="ctrl-btn pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="ctrl-btn skip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Task Progress -->
  <div class="task-progress-section">
    <div class="progress-label">
      <span>세션 진행률</span>
      <span><strong>1</strong>/3 완료</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="session-tasks">
      <div class="s-task done">
        <div class="s-task-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="s-task-name">소셜 로그인 버튼 레이아웃</div>
        <div class="s-task-time">10분</div>
      </div>
      <div class="s-task current">
        <div class="s-task-indicator"></div>
        <div class="s-task-check"></div>
        <div class="s-task-name">이메일 유효성 검사 로직 추가</div>
        <div class="s-task-time">15분</div>
      </div>
      <div class="s-task upcoming">
        <div class="s-task-check"></div>
        <div class="s-task-name">비밀번호 재설정 플로우</div>
        <div class="s-task-time">10분</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
