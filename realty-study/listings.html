<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>매물 · 부동산 공부</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --background:#ffffff; --foreground:#0a0a0a; --card:#ffffff;
    --primary:#171717; --primary-foreground:#fafafa;
    --secondary:#f5f5f5; --secondary-foreground:#171717;
    --muted:#f5f5f5; --muted-foreground:#737373;
    --accent:#f5f5f5; --border:#e5e5e5; --input:#e5e5e5; --ring:#a3a3a3;
    --success:#22c55e; --warning:#f59e0b; --info:#3b82f6; --destructive:#ef4444;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;color:var(--foreground);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100vh;}
  .phone{width:100%;max-width:390px;background:var(--background);min-height:100vh;position:relative;padding-bottom:80px;}
  svg{display:block;}
  /* topbar */
  .topbar{position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
  .logo{font-size:18px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px;}
  .logo .ic{width:22px;height:22px;color:var(--primary);}
  .who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-foreground);font-weight:500;}
  .who .dot{width:6px;height:6px;border-radius:9999px;background:var(--success);}
  /* body */
  .body{padding:20px;}
  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  h2{font-size:22px;font-weight:800;letter-spacing:-0.03em;}
  h2 .cnt{color:var(--muted-foreground);font-weight:600;font-size:18px;margin-left:4px;}
  .btn-primary{background:var(--primary);color:var(--primary-foreground);border:none;border-radius:10px;height:40px;padding:0 14px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary .ic{width:16px;height:16px;}
  .filters{display:flex;gap:8px;margin-bottom:18px;}
  .chip{padding:8px 16px;border-radius:9999px;border:1px solid var(--border);background:var(--background);color:var(--muted-foreground);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .chip.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);}
  .list{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s,transform .1s;}
  .card:active{transform:scale(.99);}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .cname{font-size:16px;font-weight:700;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3;}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:9999px;font-size:11px;font-weight:600;line-height:1;}
  .badge .ic{width:12px;height:12px;}
  .b-interest{background:#dcfce7;color:#15803d;}
  .b-visited{background:#fef3c7;color:#b45309;}
  .b-candidate{background:#dbeafe;color:#1d4ed8;}
  .b-out{background:var(--secondary);color:var(--muted-foreground);}
  .meta{font-size:13px;color:var(--muted-foreground);margin-top:6px;font-weight:500;}
  .addr{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted-foreground);margin-top:4px;}
  .addr .ic{width:13px;height:13px;flex-shrink:0;}
  .score-box{text-align:right;flex-shrink:0;}
  .score-big{font-size:28px;font-weight:800;line-height:1;letter-spacing:-0.03em;}
  .score-cap{font-size:10px;color:var(--muted-foreground);margin-top:4px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;}
  .users{display:flex;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .uchip{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--muted);border-radius:10px;padding:8px 12px;}
  .uname{font-size:12px;color:var(--muted-foreground);font-weight:600;}
  .uscore{font-size:14px;font-weight:700;}
  .uprog{font-size:10px;color:var(--ring);font-weight:600;}
  .uval{display:flex;align-items:baseline;gap:5px;}
  /* tabbar */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 14px;font-size:11px;color:var(--muted-foreground);font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;}
  .tab .ic{width:22px;height:22px;}
  .tab.on{color:var(--foreground);}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="logo">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      집공부
    </div>
    <div class="who"><span class="dot"></span>윤재 · 여친</div>
  </div>
  <div class="body">
    <div class="row"><h2>매물<span class="cnt">3</span></h2>
      <button class="btn-primary"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>매물 등록</button>
    </div>
    <div class="filters"><button class="chip">최근순</button><button class="chip on">점수순</button></div>
    <div class="list">

      <div class="card">
        <div class="card-head">
          <div style="flex:1;min-width:0;">
            <div class="cname">래미안 강남포레 84A
              <span class="badge b-interest"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l2.9 6.2 6.8.6-5.1 4.5 1.5 6.7L12 17l-6 3.5 1.5-6.7L2.4 9.3l6.8-.6z"/></svg>관심</span>
            </div>
            <div class="meta">매매 18.5억 · 아파트 · 84㎡ (34평)</div>
            <div class="addr"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>서울 강남구 도곡동</div>
          </div>
          <div class="score-box"><div class="score-big" style="color:var(--success);">82.4</div><div class="score-cap">평균</div></div>
        </div>
        <div class="users">
          <div class="uchip"><span class="uname">윤재</span><span class="uval"><span class="uscore" style="color:var(--success);">86.7</span><span class="uprog">13/23</span></span></div>
          <div class="uchip"><span class="uname">여친</span><span class="uval"><span class="uscore" style="color:var(--warning);">78.0</span><span class="uprog">13/23</span></span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div style="flex:1;min-width:0;">
            <div class="cname">마포 한강뷰 오피스텔
              <span class="badge b-visited"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>임장완료</span>
            </div>
            <div class="meta">전세 보증금 4.5억 · 오피스텔 · 59㎡ (23평)</div>
            <div class="addr"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>서울 마포구 합정동</div>
          </div>
          <div class="score-box"><div class="score-big" style="color:var(--warning);">62.1</div><div class="score-cap">평균</div></div>
        </div>
        <div class="users">
          <div class="uchip"><span class="uname">윤재</span><span class="uval"><span class="uscore" style="color:var(--warning);">64.3</span><span class="uprog">7/23</span></span></div>
          <div class="uchip"><span class="uname">여친</span><span class="uval"><span class="uscore" style="color:var(--warning);">60.0</span><span class="uprog">7/23</span></span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div style="flex:1;min-width:0;">
            <div class="cname">분당 정자 푸르지오
              <span class="badge b-candidate"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>후보</span>
            </div>
            <div class="meta">매매 12.8억 · 아파트 · 59㎡ (25평)</div>
            <div class="addr"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>경기 성남시 분당구 정자동</div>
          </div>
          <div class="score-box"><div class="score-big" style="color:var(--ring);">—</div><div class="score-cap">평균</div></div>
        </div>
        <div class="users">
          <div class="uchip"><span class="uname">윤재</span><span class="uscore" style="color:var(--ring);font-size:12px;">미평가</span></div>
          <div class="uchip"><span class="uname">여친</span><span class="uscore" style="color:var(--ring);font-size:12px;">미평가</span></div>
        </div>
      </div>

    </div>
  </div>

  <nav class="tabbar">
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2"/></svg>공부</button>
    <button class="tab on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>매물</button>
    <button class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3"/><path d="m15 6-3 3-1.5-1.5"/><path d="M11 18H3"/><path d="m21 6-7 7"/><path d="M21 12h-6"/><path d="M21 18h-8"/></svg>체크리스트</button>
  </nav>
</div>
</body>
</html>
