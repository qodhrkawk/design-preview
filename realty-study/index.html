<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집공부 · 디자인 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --background:#ffffff; --foreground:#0a0a0a; --card:#ffffff;
    --primary:#171717; --primary-foreground:#fafafa;
    --secondary:#f5f5f5; --muted:#f5f5f5; --muted-foreground:#737373;
    --border:#e5e5e5; --ring:#a3a3a3; --success:#22c55e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;color:var(--foreground);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100vh;}
  svg{display:block;}
  .wrap{width:100%;max-width:760px;padding:40px 24px 64px;}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .logo-ic{width:38px;height:38px;border-radius:11px;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;}
  .logo-ic .ic{width:21px;height:21px;}
  h1{font-size:28px;font-weight:800;letter-spacing:-0.03em;}
  .sub{font-size:14px;color:var(--muted-foreground);margin-bottom:32px;line-height:1.5;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s,transform .1s;}
  .card:hover{box-shadow:0 10px 15px rgba(0,0,0,.08),0 4px 6px rgba(0,0,0,.05);transform:translateY(-2px);}
  .thumb{height:120px;background:linear-gradient(135deg,#fafafa,#f0f0f0);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);color:var(--ring);}
  .thumb .ic{width:42px;height:42px;}
  .cbody{padding:16px;}
  .cnum{font-size:11px;font-weight:700;color:var(--ring);letter-spacing:.05em;}
  .cname{font-size:16px;font-weight:700;letter-spacing:-0.01em;margin-top:3px;}
  .cdesc{font-size:13px;color:var(--muted-foreground);margin-top:5px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo-ic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></div>
    <h1>집공부</h1>
  </div>
  <div class="sub">부동산 공부 + 임장 매물 점수 비교 · 디자인 시안 v2 (라이트모드, shadcn/ui)</div>
  <div class="grid">
    <a class="card" href="./listings.html">
      <div class="thumb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></div>
      <div class="cbody"><div class="cnum">01</div><div class="cname">매물 목록</div><div class="cdesc">점수순 정렬, 윤재·여친 비교, 상태 뱃지</div></div>
    </a>
    <a class="card" href="./detail.html">
      <div class="thumb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3"/><path d="m15 6-3 3-1.5-1.5"/><path d="M11 18H3"/><path d="m21 6-7 7"/><path d="M21 12h-6"/></svg></div>
      <div class="cbody"><div class="cnum">02</div><div class="cname">매물 상세</div><div class="cdesc">5점 척도 평가, 카테고리별 항목, 둘 비교</div></div>
    </a>
    <a class="card" href="./study.html">
      <div class="thumb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2"/></svg></div>
      <div class="cbody"><div class="cnum">03</div><div class="cname">공부 노트</div><div class="cdesc">카드형 노트, 검색, 태그</div></div>
    </a>
    <a class="card" href="./checklist.html">
      <div class="thumb"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3"/><path d="m15 6-3 3-1.5-1.5"/><path d="M11 18H3"/><path d="m21 6-7 7"/><path d="M21 12h-6"/><path d="M21 18h-8"/></svg></div>
      <div class="cbody"><div class="cnum">04</div><div class="cname">체크리스트</div><div class="cdesc">평가 항목 관리, 카테고리·가중치</div></div>
    </a>
  </div>
</div>
</body>
</html>
