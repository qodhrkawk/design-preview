<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>공부 · 부동산</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--background:#ffffff;--foreground:#0a0a0a;--card:#ffffff;--primary:#171717;--primary-foreground:#fafafa;--muted:#f5f5f5;--muted-foreground:#737373;--border:#e5e5e5;--ring:#a3a3a3;--info:#3b82f6;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;}
.phone{width:390px;background:var(--background);min-height:100vh;padding-bottom:72px;}
.topbar{position:sticky;top:0;background:var(--background);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:17px;font-weight:700;letter-spacing:-0.02em;}.sub{font-size:13px;color:var(--muted-foreground);font-weight:500;}
.body{padding:16px;}.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
h2{font-size:18px;font-weight:700;letter-spacing:-0.02em;}
.btn-primary{background:var(--primary);color:var(--primary-foreground);border:none;border-radius:8px;padding:0 14px;height:36px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
.list{display:flex;flex-direction:column;gap:12px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;}
.nt{font-size:15px;font-weight:600;}.nb{font-size:13px;color:var(--muted-foreground);margin-top:5px;line-height:19px;}
.tags{display:flex;gap:6px;margin-top:10px;}.tag{background:var(--muted);color:var(--info);font-size:11px;font-weight:500;padding:2px 9px;border-radius:6px;}
.tabbar{position:fixed;bottom:0;width:390px;background:var(--background);border-top:1px solid var(--border);display:flex;}
.tab{flex:1;text-align:center;padding:9px 0 12px;font-size:11px;color:var(--muted-foreground);font-weight:500;}.tab.on{color:var(--foreground);font-weight:600;}.tab .ic{font-size:20px;display:block;margin-bottom:2px;}
</style></head><body>
<div class="phone">
  <div class="topbar"><div class="logo">🏠 부동산 공부</div><div class="sub">윤재 · 여친</div></div>
  <div class="body">
    <div class="row"><h2>공부 노트</h2><button class="btn-primary">+ 새 노트</button></div>
    <div class="list">
      <div class="card"><div class="nt">📌 부동산 공부 시작하기</div><div class="nb">기초 용어(LTV/DTI/DSR), 근저당, 전입신고+확정일자, 선순위/후순위… 임장 전 등기부등본·건축물대장·시세 비교 체크</div><div class="tags"><span class="tag">기초</span><span class="tag">로드맵</span></div></div>
      <div class="card"><div class="nt">전세 보증금 지키는 법</div><div class="nb">확정일자 + 전입신고 = 대항력. 전세보증보험(HUG) 가입 조건. 선순위 근저당 확인 필수.</div><div class="tags"><span class="tag">전세</span><span class="tag">권리</span></div></div>
    </div>
  </div>
  <div class="tabbar"><div class="tab on"><span class="ic">📚</span>공부</div><div class="tab"><span class="ic">🏠</span>매물</div><div class="tab"><span class="ic">✅</span>체크리스트</div></div>
</div></body></html>
