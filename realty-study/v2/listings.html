<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>매물 · 집공부</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --background:#ffffff; --foreground:#0a0a0a; --card:#ffffff;
    --primary:#171717; --primary-foreground:#fafafa;
    --secondary:#f5f5f5; --secondary-foreground:#171717;
    --muted:#f5f5f5; --muted-foreground:#737373;
    --border:#e5e5e5; --ring:#a3a3a3;
    --success:#22c55e; --warning:#f59e0b; --info:#3b82f6; --destructive:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;color:var(--foreground);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100vh;}
  .phone{width:100%;max-width:390px;background:var(--background);min-height:100vh;position:relative;padding-bottom:80px;}
  svg{display:block;}
  .topbar{position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
  .logo{font-size:18px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px;}
  .logo .ic{width:22px;height:22px;color:var(--primary);}
  .who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-foreground);font-weight:500;}
  .who .dot{width:6px;height:6px;border-radius:9999px;background:var(--success);}
  .body{padding:20px;}
  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  h2{font-size:22px;font-weight:800;letter-spacing:-0.03em;}
  h2 .cnt{color:var(--muted-foreground);font-weight:600;font-size:18px;margin-left:4px;}
  .btn-primary{background:var(--primary);color:var(--primary-foreground);border:none;border-radius:10px;height:40px;padding:0 14px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary .ic{width:16px;height:16px;}
  .filters{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;}
  .chip{padding:8px 16px;border-radius:9999px;border:1px solid var(--border);background:var(--background);color:var(--muted-foreground);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;}
  .chip.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);}
  .list{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .1s;}
  .card:active{transform:scale(.99);}
  .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .cname{font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.35;}
  .meta{font-size:13px;color:var(--muted-foreground);margin-top:5px;font-weight:500;}
  .addr{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted-foreground);margin-top:4px;}
  .addr .ic{width:13px;height:13px;flex-shrink:0;}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:700;line-height:1;flex-shrink:0;}
  .badge .ic{width:12px;height:12px;}
  .b-interest{background:#dcfce7;color:#15803d;}
  .b-visited{background:#fef3c7;color:#b45309;}
  .b-candidate{background:#dbeafe;color:#1d4ed8;}
  .b-out{background:var(--secondary);color:var(--muted-foreground);}
  .cfoot{display:flex;align-items:center;gap:14px;margin-top:13px;padding-top:13px;border-top:1px solid var(--border);}
  .stat{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted-foreground);font-weight:600;}
  .stat .ic{width:14px;height:14px;}
  .stat.ok{color:#15803d;}
  .stat-arrow{margin-left:auto;}
  .stat-arrow .ic{width:16px;height:16px;color:var(--ring);}
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 14px;font-size:11px;color:var(--muted-foreground);font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;}
  .tab .ic{width:22px;height:22px;}
  .tab.on{color:var(--foreground);}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="logo">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      집공부
    </div>
    <div class="who"><span class="dot"></span>윤재</div>
  </div>

  <div class="body">
    <div class="row"><h2>매물<span class="cnt">4</span></h2>
      <button class="btn-primary"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>매물 등록</button>
    </div>
    <div class="filters">
      <button class="chip on">전체</button>
      <button class="chip">관심</button>
      <button class="chip">임장완료</button>
      <button class="chip">후보</button>
      <button class="chip">제외</button>
    </div>
    <div class="list">

      <div class="card">
        <div class="chead">
          <div style="flex:1;min-width:0;">
            <div class="cname">래미안 강남포레 84A</div>
            <div class="meta">매매 18.5억 · 아파트 · 84㎡ (34평)</div>
            <div class="addr"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>서울 강남구 도곡동</div>
          </div>
          <span class="badge b-interest"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l2.9 6.2 6.8.6-5.1 4.5 1.5 6.7L12 17l-6 3.5 1.5-6.7L2.4 9.3l6.8-.6z"/></svg>관심</span>
        </div>
        <div class="cfoot">
          <span class="stat ok"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>임장기록 18/23 확인</span>
          <span class="stat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>메모 5</span>
          <span class="stat-arrow"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
        </div>
      </div>

      <div class="card">
        <div class="chead">
          <div style="flex:1;min-width:0;">
            <div class="cname">과천 위버필드 59B</div>
            <div class="meta">전세 7.2억 · 아파트 · 59㎡ (25평)</div>
            <div class="addr"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>경기 과천시 원문동</div>
          </div>
          <span class="badge b-visited"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>임장완료</span>
        </div>
        <div class="cfoot">
          <span class="stat ok"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>임장기록 23/23 확인</span>
          <span class="stat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>메모 8</span>
          <span class="stat-arrow"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
        </div>
      </div>

      <div class="card">
        <div class="chead">
          <div style="flex:1;min-width:0;">
            <div class="cname">사당 롯데캐슬 골든포레 74</div>
            <div class="meta">매매 12.9억 · 아파트 · 74㎡ (30평)</div>
            <div class="addr"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>서울 동작구 사당동</div>
          </div>
          <span class="badge b-candidate"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>후보</span>
        </div>
        <div class="cfoot">
          <span class="stat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>임장 전</span>
          <span class="stat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>메모 2</span>
          <span class="stat-arrow"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
        </div>
      </div>

      <div class="card" style="opacity:.55;">
        <div class="chead">
          <div style="flex:1;min-width:0;">
            <div class="cname">신림 푸르지오 84C</div>
            <div class="meta">매매 9.8억 · 아파트 · 84㎡ (34평)</div>
            <div class="addr"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>서울 관악구 신림동</div>
          </div>
          <span class="badge b-out"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>제외</span>
        </div>
        <div class="cfoot">
          <span class="stat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>임장기록 12/23 확인</span>
          <span class="stat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>메모 3</span>
          <span class="stat-arrow"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
        </div>
      </div>

    </div>
  </div>

  <div class="tabbar">
    <button class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      학습
    </button>
    <button class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
      청약
    </button>
    <button class="tab on">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      매물
    </button>
    <button class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
      체크리스트
    </button>
  </div>
</div>
</body>
</html>
