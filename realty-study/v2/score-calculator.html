<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가점 계산기 · 집공부</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --background:#ffffff; --foreground:#0a0a0a; --card:#ffffff;
    --primary:#171717; --primary-foreground:#fafafa;
    --secondary:#f5f5f5; --secondary-foreground:#171717;
    --muted:#f5f5f5; --muted-foreground:#737373;
    --border:#e5e5e5; --ring:#a3a3a3;
    --success:#22c55e; --warning:#f59e0b; --info:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;color:var(--foreground);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100vh;}
  .phone{width:100%;max-width:390px;background:var(--background);min-height:100vh;position:relative;padding-bottom:120px;}
  svg{display:block;}
  .topbar{position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:10;}
  .back{width:36px;height:36px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--foreground);flex-shrink:0;}
  .back .ic{width:20px;height:20px;}
  .top-title{font-size:16px;font-weight:700;letter-spacing:-0.01em;}
  .body{padding:20px;}
  /* total */
  .total{background:var(--primary);color:var(--primary-foreground);border-radius:16px;padding:22px 20px;margin-bottom:22px;}
  .total-cap{font-size:12px;font-weight:600;opacity:.65;display:flex;align-items:center;gap:6px;}
  .total-cap .ic{width:14px;height:14px;}
  .total-val{display:flex;align-items:baseline;gap:6px;margin-top:8px;}
  .total-num{font-size:44px;font-weight:800;letter-spacing:-0.04em;line-height:1;}
  .total-max{font-size:15px;font-weight:600;opacity:.55;}
  .total-bar{height:7px;background:rgba(255,255,255,.18);border-radius:9999px;margin-top:16px;overflow:hidden;}
  .total-fill{height:100%;width:50%;background:#fafafa;border-radius:9999px;}
  .total-legend{display:flex;justify-content:space-between;margin-top:14px;gap:8px;}
  .tl{flex:1;}
  .tl-cap{font-size:10px;font-weight:600;opacity:.55;letter-spacing:.02em;}
  .tl-val{font-size:14px;font-weight:700;margin-top:2px;}
  /* section */
  .sec{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sec-name{font-size:15px;font-weight:700;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;}
  .sec-name .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sec-name .ico .ic{width:16px;height:16px;}
  .i-home{background:#dcfce7;color:#15803d;}
  .i-fam{background:#dbeafe;color:#1d4ed8;}
  .i-bank{background:#fef3c7;color:#b45309;}
  .sec-pt{font-size:14px;font-weight:800;letter-spacing:-0.01em;}
  .sec-pt small{font-size:11px;font-weight:600;color:var(--muted-foreground);margin-left:2px;}
  /* stepper */
  .stepper{display:flex;align-items:center;gap:12px;background:var(--muted);border-radius:12px;padding:8px;}
  .stp{width:40px;height:40px;border-radius:10px;background:var(--background);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .stp .ic{width:17px;height:17px;color:var(--foreground);}
  .stp-val{flex:1;text-align:center;font-size:15px;font-weight:700;letter-spacing:-0.01em;}
  .stp-val small{display:block;font-size:10px;font-weight:600;color:var(--muted-foreground);margin-top:1px;}
  .hint{font-size:11px;color:var(--ring);font-weight:500;margin-top:10px;line-height:1.5;display:flex;gap:5px;align-items:flex-start;}
  .hint .ic{width:12px;height:12px;flex-shrink:0;margin-top:1px;}
  /* save bar */
  .savebar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--border);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:20;}
  .btn-save{width:100%;height:50px;border:none;border-radius:13px;background:var(--primary);color:var(--primary-foreground);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-0.01em;}
  .btn-save .ic{width:18px;height:18px;}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <button class="back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="top-title">청약 가점 계산기</div>
  </div>

  <div class="body">
    <div class="total">
      <div class="total-cap">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
        내 청약 가점
      </div>
      <div class="total-val"><span class="total-num">42</span><span class="total-max">/ 84점</span></div>
      <div class="total-bar"><div class="total-fill"></div></div>
      <div class="total-legend">
        <div class="tl"><div class="tl-cap">무주택기간</div><div class="tl-val">14점</div></div>
        <div class="tl"><div class="tl-cap">부양가족</div><div class="tl-val">15점</div></div>
        <div class="tl"><div class="tl-cap">통장가입</div><div class="tl-val">13점</div></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-head">
        <div class="sec-name">
          <span class="ico i-home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>
          무주택 기간
        </div>
        <div class="sec-pt">14<small>/ 32점</small></div>
      </div>
      <div class="stepper">
        <button class="stp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button>
        <div class="stp-val">6년 이상 – 7년 미만<small>만 30세부터 산정</small></div>
        <button class="stp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
      <div class="hint">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        1년 미만 2점, 이후 1년마다 +2점, 15년 이상 32점 만점
      </div>
    </div>

    <div class="sec">
      <div class="sec-head">
        <div class="sec-name">
          <span class="ico i-fam"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          부양가족 수
        </div>
        <div class="sec-pt">15<small>/ 35점</small></div>
      </div>
      <div class="stepper">
        <button class="stp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button>
        <div class="stp-val">2명<small>본인 제외</small></div>
        <button class="stp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
      <div class="hint">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        0명 5점, 1명마다 +5점, 6명 이상 35점 만점 (배우자·직계존비속)
      </div>
    </div>

    <div class="sec">
      <div class="sec-head">
        <div class="sec-name">
          <span class="ico i-bank"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg></span>
          통장 가입 기간
        </div>
        <div class="sec-pt">13<small>/ 17점</small></div>
      </div>
      <div class="stepper">
        <button class="stp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button>
        <div class="stp-val">11년 이상 – 12년 미만<small>주택청약종합저축</small></div>
        <button class="stp"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
      <div class="hint">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        6개월 미만 1점, 이후 1년마다 +1점, 15년 이상 17점 만점
      </div>
    </div>
  </div>

  <div class="savebar">
    <button class="btn-save">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
      내 가점 저장
    </button>
  </div>
</div>
</body>
</html>
