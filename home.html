<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>홈 - 습관 트래커</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; padding-bottom: 72px; }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <!-- Status Bar Area -->
    <div style="height: 48px;"></div>

    <!-- Content -->
    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 16px;">

      <!-- Header -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="font-size: 14px; font-weight: 400; color: #737373;">3월 2일 일요일</div>
          <div style="font-size: 24px; font-weight: 800; color: #0a0a0a; margin-top: 2px;">오늘의 습관</div>
        </div>
        <div style="width: 40px; height: 40px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 20px;">👤</div>
      </div>

      <!-- Streak Banner -->
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #0a0a0a;">
        <div style="font-size: 28px;">🔥</div>
        <div style="flex: 1;">
          <div style="font-size: 16px; font-weight: 600; color: #fafafa;">12일 연속 달성 중!</div>
          <div style="font-size: 13px; color: #a3a3a3; margin-top: 2px;">오늘도 이어가세요</div>
        </div>
        <div style="background: #fafafa; color: #0a0a0a; border-radius: 9999px; padding: 4px 12px; font-size: 13px; font-weight: 600;">3/5</div>
      </div>

      <!-- Section Title -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
        <div style="font-size: 16px; font-weight: 600; color: #0a0a0a;">진행 중</div>
        <div style="font-size: 13px; color: #737373;">모두 보기</div>
      </div>

      <!-- Habit Cards -->
      <!-- 완료된 습관 -->
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid #e5e5e5; background: #ffffff;">
        <div style="font-size: 26px;">💧</div>
        <div style="flex: 1;">
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a;">물 2L 마시기</div>
          <div style="font-size: 12px; color: #737373; margin-top: 2px;">🔥 12일째 · 매일</div>
        </div>
        <div style="width: 32px; height: 32px; border-radius: 9999px; background: #22c55e; display: flex; align-items: center; justify-content: center;">
          <span style="color: #fff; font-size: 16px; font-weight: 700;">✓</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid #e5e5e5; background: #ffffff;">
        <div style="font-size: 26px;">🏃</div>
        <div style="flex: 1;">
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a;">30분 운동</div>
          <div style="font-size: 12px; color: #737373; margin-top: 2px;">🔥 8일째 · 매일</div>
        </div>
        <div style="width: 32px; height: 32px; border-radius: 9999px; background: #22c55e; display: flex; align-items: center; justify-content: center;">
          <span style="color: #fff; font-size: 16px; font-weight: 700;">✓</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid #e5e5e5; background: #ffffff;">
        <div style="font-size: 26px;">📖</div>
        <div style="flex: 1;">
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a;">독서 20분</div>
          <div style="font-size: 12px; color: #737373; margin-top: 2px;">🔥 5일째 · 매일</div>
        </div>
        <div style="width: 32px; height: 32px; border-radius: 9999px; background: #22c55e; display: flex; align-items: center; justify-content: center;">
          <span style="color: #fff; font-size: 16px; font-weight: 700;">✓</span>
        </div>
      </div>

      <!-- 미완료 습관 -->
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid #e5e5e5; background: #ffffff;">
        <div style="font-size: 26px;">🧘</div>
        <div style="flex: 1;">
          <div style="font-size: 15px; font-weight: 500; color: #0a0a0a;">명상 10분</div>
          <div style="font-size: 12px; color: #737373; margin-top: 2px;">오늘 아직! · 매일</div>
        </div>
        <div style="width: 32px; height: 32px; border-radius: 9999px; border: 2px solid #e5e5e5;"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid #e5e5e5; background: #ffffff;">
        <div style="font-size: 26px;">✍️</div>
        <div style="flex: 1;">
          <div style="font-size: 15px; font-weight: 500; color: #0a0a0a;">일기 쓰기</div>
          <div style="font-size: 12px; color: #737373; margin-top: 2px;">오늘 아직! · 매일</div>
        </div>
        <div style="width: 32px; height: 32px; border-radius: 9999px; border: 2px solid #e5e5e5;"></div>
      </div>

      <!-- Weekly Stats Card -->
      <div style="padding: 16px; border-radius: 12px; border: 1px solid #e5e5e5; background: #ffffff; margin-top: 4px;">
        <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 12px;">📊 이번 주</div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
          <div style="text-align: center; flex: 1;"><div style="font-size: 12px; color: #737373;">월</div><div style="font-size: 16px; margin-top: 4px;">✅</div></div>
          <div style="text-align: center; flex: 1;"><div style="font-size: 12px; color: #737373;">화</div><div style="font-size: 16px; margin-top: 4px;">✅</div></div>
          <div style="text-align: center; flex: 1;"><div style="font-size: 12px; color: #737373;">수</div><div style="font-size: 16px; margin-top: 4px;">✅</div></div>
          <div style="text-align: center; flex: 1;"><div style="font-size: 12px; color: #737373;">목</div><div style="font-size: 16px; margin-top: 4px;">⭕</div></div>
          <div style="text-align: center; flex: 1;"><div style="font-size: 12px; color: #737373;">금</div><div style="font-size: 16px; margin-top: 4px;">⭕</div></div>
          <div style="text-align: center; flex: 1;"><div style="font-size: 12px; color: #a3a3a3;">토</div><div style="font-size: 16px; margin-top: 4px; color: #a3a3a3;">·</div></div>
          <div style="text-align: center; flex: 1;"><div style="font-size: 12px; color: #a3a3a3;">일</div><div style="font-size: 16px; margin-top: 4px; color: #a3a3a3;">·</div></div>
        </div>
        <!-- Progress bar -->
        <div style="background: #f5f5f5; height: 6px; border-radius: 9999px; overflow: hidden;">
          <div style="background: #0a0a0a; height: 6px; border-radius: 9999px; width: 60%;"></div>
        </div>
        <div style="font-size: 13px; font-weight: 600; color: #0a0a0a; margin-top: 8px;">60% 달성</div>
      </div>

    </div>

    <!-- Tab Bar -->
    <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; height: 72px; background: #ffffff; border-top: 1px solid #e5e5e5; display: flex; justify-content: space-around; align-items: center; padding-bottom: 8px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <span style="font-size: 22px;">🏠</span>
        <span style="font-size: 10px; font-weight: 600; color: #0a0a0a;">홈</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <span style="font-size: 22px;">➕</span>
        <span style="font-size: 10px; color: #737373;">추가</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <span style="font-size: 22px;">📊</span>
        <span style="font-size: 10px; color: #737373;">통계</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <span style="font-size: 22px;">⚙️</span>
        <span style="font-size: 10px; color: #737373;">설정</span>
      </div>
    </div>
  </div>
</body>
</html>
