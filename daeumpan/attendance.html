<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다음판 — 오늘 참석</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; color: #0a0a0a; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 110px; }
  .tile { border:1px solid #e5e5e5; border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:8px; min-height:48px; }
  .tile.on { background:#171717; border-color:#171717; color:#fafafa; }
  .lv { width:20px; height:20px; border-radius:6px; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; background:#f5f5f5; color:#171717; }
  .tile.on .lv { background:#404040; color:#fafafa; }
  .nm { font-size:14px; font-weight:500; flex:1; }
  .g { font-size:11px; color:#a3a3a3; }
  .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
</style>
</head>
<body>
<div class="screen">

  <div style="padding:16px 20px 4px 20px; display:flex; justify-content:space-between; align-items:center;">
    <div>
      <div style="font-size:13px; color:#737373;">9월 25일 금</div>
      <div style="font-size:24px; font-weight:600; letter-spacing:-0.02em;">오늘 누구 왔어?</div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:24px; font-weight:600;">18</div>
      <div style="font-size:12px; color:#737373;">/ 회원 26</div>
    </div>
  </div>

  <!-- Search -->
  <div style="padding:12px 20px;">
    <div style="height:40px; border:1px solid #e5e5e5; border-radius:8px; display:flex; align-items:center; gap:8px; padding:0 12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span style="font-size:14px; color:#a3a3a3;">이름 검색 (초성 ㄱㄷㅇ 가능)</span>
    </div>
  </div>

  <!-- Composition -->
  <div style="padding:0 20px 16px 20px; display:flex; gap:6px; flex-wrap:wrap;">
    <span style="background:#f5f5f5; border-radius:9999px; padding:4px 10px; font-size:12px; font-weight:500;">남 11 · 여 7</span>
    <span style="background:#f5f5f5; border-radius:9999px; padding:4px 10px; font-size:12px; font-weight:500;">A 2 · B 4 · C 6 · D 5 · 초 1</span>
    <span style="background:#f5f5f5; border-radius:9999px; padding:4px 10px; font-size:12px; font-weight:500;">게스트 1</span>
  </div>

  <div style="padding:0 20px;">
    <div style="font-size:13px; font-weight:600; color:#737373; margin-bottom:8px;">자주 오는 순</div>
    <div class="grid">
      <div class="tile on"><span class="lv">A</span><span class="nm">정우성</span></div>
      <div class="tile on"><span class="lv">B</span><span class="nm">김도윤</span></div>
      <div class="tile on"><span class="lv">B</span><span class="nm">강태현</span></div>
      <div class="tile on"><span class="lv">C</span><span class="nm">이한결</span></div>
      <div class="tile on"><span class="lv">C</span><span class="nm">최민재</span></div>
      <div class="tile on"><span class="lv">C</span><span class="nm">한지호</span></div>
      <div class="tile on"><span class="lv">C</span><span class="nm">오하린</span></div>
      <div class="tile on"><span class="lv">C</span><span class="nm">서지훈</span></div>
      <div class="tile on"><span class="lv">C</span><span class="nm">임재원</span></div>
      <div class="tile on"><span class="lv">D</span><span class="nm">박세준</span></div>
      <div class="tile on"><span class="lv">D</span><span class="nm">윤서아</span></div>
      <div class="tile on"><span class="lv">D</span><span class="nm">문경호</span></div>
      <div class="tile on"><span class="lv">D</span><span class="nm">장유나</span></div>
      <div class="tile"><span class="lv">B</span><span class="nm">조현우</span></div>
      <div class="tile"><span class="lv">C</span><span class="nm">배수빈</span></div>
      <div class="tile on"><span class="lv">A</span><span class="nm">권민호</span></div>
      <div class="tile on"><span class="lv">B</span><span class="nm">남궁현</span></div>
      <div class="tile"><span class="lv">D</span><span class="nm">송지아</span></div>
    </div>

    <div style="font-size:13px; font-weight:600; color:#737373; margin:18px 0 8px 0;">오늘만 온 게스트</div>
    <div class="grid">
      <div class="tile on"><span class="lv">초</span><span class="nm">신다은</span></div>
      <div class="tile" style="border-style:dashed; justify-content:center; color:#737373;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span style="font-size:14px; font-weight:500;">게스트</span>
      </div>
    </div>

    <div style="margin-top:18px; background:#f5f5f5; border-radius:12px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <div style="font-size:13px; color:#525252; line-height:19px;">늦게 온 사람은 나중에 탭하면 돼요. 들어온 순간부터 대기열 맨 앞 그룹에 들어가요 (게임수 0판).</div>
    </div>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:0; padding:12px 20px 28px 20px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; gap:8px; align-items:center;">
    <div style="flex:1;">
      <div style="font-size:13px; color:#737373;">코트</div>
      <div style="display:flex; align-items:center; gap:10px; margin-top:2px;">
        <button style="width:32px; height:32px; border-radius:8px; border:1px solid #e5e5e5; background:#ffffff; font-size:16px;">−</button>
        <span style="font-size:18px; font-weight:600;">3면</span>
        <button style="width:32px; height:32px; border-radius:8px; border:1px solid #e5e5e5; background:#ffffff; font-size:16px;">+</button>
      </div>
    </div>
    <button style="flex:1.4; height:48px; border-radius:8px; border:none; background:#171717; color:#fafafa; font-size:15px; font-weight:500;">운동 시작</button>
  </div>
</div>
</body>
</html>
