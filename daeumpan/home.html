<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다음판 — 코트 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; color: #0a0a0a; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 96px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 9999px; padding: 2px 8px; font-size: 12px; font-weight: 500; background: #f5f5f5; color: #171717; }
  .p { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
  .lv { width: 20px; height: 20px; border-radius: 6px; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px 20px;">
    <div>
      <div style="font-size:13px; color:#737373;">9월 25일 금 · 19:00 시작 · 경과 1:12</div>
      <div style="font-size:24px; font-weight:600; letter-spacing:-0.02em; margin-top:2px;">성수 목금 콕클럽</div>
    </div>
    <button style="width:40px; height:40px; border-radius:8px; border:1px solid #e5e5e5; background:#ffffff; display:flex; align-items:center; justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </button>
  </div>

  <!-- Stats -->
  <div style="display:flex; gap:8px; padding:8px 20px 16px 20px;">
    <div style="flex:1; border:1px solid #e5e5e5; border-radius:12px; padding:12px;">
      <div style="font-size:12px; color:#737373;">참석</div>
      <div style="font-size:20px; font-weight:600;">18<span style="font-size:13px; color:#737373; font-weight:400;">명</span></div>
    </div>
    <div style="flex:1; border:1px solid #e5e5e5; border-radius:12px; padding:12px;">
      <div style="font-size:12px; color:#737373;">진행 게임</div>
      <div style="font-size:20px; font-weight:600;">14<span style="font-size:13px; color:#737373; font-weight:400;">판</span></div>
    </div>
    <div style="flex:1; border:1px solid #e5e5e5; border-radius:12px; padding:12px;">
      <div style="font-size:12px; color:#737373;">1인 게임수</div>
      <div style="font-size:20px; font-weight:600;">3<span style="font-size:13px; color:#737373; font-weight:400;">±1</span></div>
    </div>
  </div>

  <!-- Courts -->
  <div style="padding:0 20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div style="font-size:16px; font-weight:600;">코트</div>
      <div style="font-size:13px; color:#737373;">3면</div>
    </div>

    <!-- Court 1 -->
    <div style="border:1px solid #e5e5e5; border-radius:12px; padding:14px 16px; margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:14px; font-weight:600;">1코트</span>
          <span class="chip">남복</span>
        </div>
        <div style="display:flex; align-items:center; gap:4px; font-size:13px; color:#737373;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>11분
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
          <div class="p"><span class="lv" style="background:#171717; color:#fafafa;">B</span>김도윤</div>
          <div class="p"><span class="lv" style="background:#f5f5f5;">D</span>박세준</div>
        </div>
        <div style="font-size:12px; color:#a3a3a3; font-weight:600;">VS</div>
        <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
          <div class="p">이한결<span class="lv" style="background:#e5e5e5;">C</span></div>
          <div class="p">최민재<span class="lv" style="background:#e5e5e5;">C</span></div>
        </div>
      </div>
      <button style="margin-top:12px; width:100%; height:40px; border-radius:8px; border:1px solid #e5e5e5; background:#ffffff; font-size:14px; font-weight:500; color:#171717;">경기 끝</button>
    </div>

    <!-- Court 2 -->
    <div style="border:1px solid #e5e5e5; border-radius:12px; padding:14px 16px; margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:14px; font-weight:600;">2코트</span>
          <span class="chip">혼복</span>
        </div>
        <div style="display:flex; align-items:center; gap:4px; font-size:13px; color:#f59e0b; font-weight:500;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>24분
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
          <div class="p"><span class="lv" style="background:#171717; color:#fafafa;">A</span>정우성</div>
          <div class="p"><span class="lv" style="background:#f5f5f5;">D</span>윤서아</div>
        </div>
        <div style="font-size:12px; color:#a3a3a3; font-weight:600;">VS</div>
        <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
          <div class="p">한지호<span class="lv" style="background:#e5e5e5;">C</span></div>
          <div class="p">오하린<span class="lv" style="background:#e5e5e5;">C</span></div>
        </div>
      </div>
      <button style="margin-top:12px; width:100%; height:40px; border-radius:8px; border:1px solid #e5e5e5; background:#ffffff; font-size:14px; font-weight:500; color:#171717;">경기 끝</button>
    </div>

    <!-- Court 3 empty -->
    <div style="border:1px dashed #a3a3a3; border-radius:12px; padding:16px; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between;">
      <div>
        <div style="font-size:14px; font-weight:600;">3코트 비었음</div>
        <div style="font-size:13px; color:#737373; margin-top:2px;">다음판이 바로 들어갈 수 있어요</div>
      </div>
      <button style="height:40px; padding:0 16px; border-radius:8px; border:none; background:#171717; color:#fafafa; font-size:14px; font-weight:500;">투입</button>
    </div>
  </div>

  <!-- Next up -->
  <div style="padding:0 20px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div style="font-size:16px; font-weight:600;">다음판</div>
      <div style="font-size:13px; color:#737373;">대기 6명</div>
    </div>
    <div style="background:#f5f5f5; border-radius:12px; padding:14px 16px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="chip" style="background:#ffffff;">남복 · 밸런스 B+D vs C+C</span>
        <span style="font-size:12px; color:#737373;">최장 대기 18분</span>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;">
        <span class="chip" style="background:#ffffff; padding:6px 10px; font-size:13px;">강태현 · 2판</span>
        <span class="chip" style="background:#ffffff; padding:6px 10px; font-size:13px;">서지훈 · 2판</span>
        <span class="chip" style="background:#ffffff; padding:6px 10px; font-size:13px;">문경호 · 3판</span>
        <span class="chip" style="background:#ffffff; padding:6px 10px; font-size:13px;">임재원 · 3판</span>
      </div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div style="position:absolute; left:0; right:0; bottom:0; padding:12px 20px 28px 20px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; gap:8px;">
    <button style="flex:1; height:48px; border-radius:8px; border:1px solid #e5e5e5; background:#ffffff; font-size:15px; font-weight:500; display:flex; align-items:center; justify-content:center; gap:6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>대기열
    </button>
    <button style="flex:2; height:48px; border-radius:8px; border:none; background:#171717; color:#fafafa; font-size:15px; font-weight:500; display:flex; align-items:center; justify-content:center; gap:6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>다음판 짜기
    </button>
  </div>
</div>
</body>
</html>
