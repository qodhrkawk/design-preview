<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hunchbook — 정산</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#fafafa;color:#0a0a0a;-webkit-font-smoothing:antialiased}.frame{width:390px;margin:0 auto;background:#fff;min-height:844px;position:relative}</style></head>
<body><div class="frame" style="display:flex;flex-direction:column">
<div style="height:44px"></div>
<header style="padding:14px 20px;display:flex;align-items:center;justify-content:space-between">
  <button style="width:36px;height:36px;background:none;border:none;display:flex;align-items:center;justify-content:center;margin-left:-8px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </button>
  <span style="font-size:15px;font-weight:600">정산 #17</span>
  <div style="width:36px"></div>
</header>

<!-- Question -->
<div style="padding:20px 20px 12px">
  <span style="font-size:11px;font-weight:600;color:#737373;text-transform:uppercase;letter-spacing:0.05em">30일 전의 예측</span>
</div>
<div style="margin:0 20px;padding:18px;background:#fafafa;border:1px solid #e5e5e5;border-radius:14px">
  <p style="font-size:17px;font-weight:700;line-height:24px;margin-bottom:10px">삼성전자 4월 월봉이 5% 이상 상승한다</p>
  <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:#737373">
    <span>자신감 <span style="color:#0a0a0a;font-weight:600">70%</span></span>
    <span style="width:3px;height:3px;background:#d4d4d4;border-radius:9999px"></span>
    <span>투자</span>
    <span style="width:3px;height:3px;background:#d4d4d4;border-radius:9999px"></span>
    <span>3월 31일 작성</span>
  </div>
</div>

<!-- Verdict buttons -->
<div style="padding:28px 20px 12px">
  <span style="font-size:15px;font-weight:600;line-height:22px">어떻게 됐어?</span>
</div>
<div style="padding:0 20px;display:flex;flex-direction:column;gap:10px">
  <button style="padding:18px;background:#f0fdf4;border:2px solid #22c55e;border-radius:14px;display:flex;align-items:center;gap:12px">
    <div style="width:40px;height:40px;background:#22c55e;border-radius:9999px;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
      <span style="font-size:15px;font-weight:700;color:#14532d">맞았다</span>
      <span style="font-size:12px;color:#166534">예측대로 일어났다</span>
    </div>
  </button>
  <button style="padding:18px;background:#fff;border:1px solid #e5e5e5;border-radius:14px;display:flex;align-items:center;gap:12px">
    <div style="width:40px;height:40px;background:#f5f5f5;border-radius:9999px;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
      <span style="font-size:15px;font-weight:700">빗나갔다</span>
      <span style="font-size:12px;color:#737373">예측과 다르게 됐다</span>
    </div>
  </button>
  <button style="padding:18px;background:#fff;border:1px solid #e5e5e5;border-radius:14px;display:flex;align-items:center;gap:12px">
    <div style="width:40px;height:40px;background:#f5f5f5;border-radius:9999px;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
      <span style="font-size:15px;font-weight:700">애매하다 / 무효</span>
      <span style="font-size:12px;color:#737373">판정 불가능하거나 전제 붕괴</span>
    </div>
  </button>
</div>

<!-- AI feedback -->
<div style="margin:24px 20px 0;padding:20px;background:#0a0a0a;border-radius:16px;color:#fafafa">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <span style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em">AI 코치의 회고</span>
  </div>
  <p style="font-size:14px;line-height:22px;color:#fafafa;margin-bottom:14px">이번 건은 결과만 보면 적중이지만, 너는 "반도체 업사이클"을 근거로 들었는데 실제로는 <span style="color:#fcd34d;font-weight:600">환율 효과</span>가 더 컸어. 이유가 틀렸으니까 같은 패턴 반복 조심.</p>
  <div style="height:1px;background:#404040;margin:14px 0"></div>
  <div style="display:flex;gap:20px">
    <div style="flex:1">
      <div style="font-size:11px;color:#a3a3a3;margin-bottom:4px">투자 캘리브레이션</div>
      <div style="font-size:22px;font-weight:800;letter-spacing:-0.025em">0.72</div>
    </div>
    <div style="flex:1">
      <div style="font-size:11px;color:#a3a3a3;margin-bottom:4px">총 예측 수</div>
      <div style="font-size:22px;font-weight:800;letter-spacing:-0.025em">34</div>
    </div>
  </div>
</div>

<!-- Lesson input -->
<div style="padding:24px 20px 12px">
  <span style="font-size:11px;font-weight:600;color:#737373;text-transform:uppercase;letter-spacing:0.05em">한 줄 교훈 <span style="color:#a3a3a3;text-transform:none;font-weight:400">(선택)</span></span>
</div>
<div style="padding:0 20px 24px">
  <input type="text" placeholder="예: 결과가 맞아도 이유가 틀리면 운이다" value="결과가 맞아도 이유가 틀리면 운이다" style="width:100%;padding:14px;border:1px solid #e5e5e5;border-radius:12px;font-size:14px;outline:none">
</div>

<div style="padding:0 20px 24px">
  <button style="width:100%;padding:14px;background:#0a0a0a;color:#fafafa;border:none;border-radius:12px;font-size:15px;font-weight:600">저장하고 다음 예측으로</button>
</div>

</div></body></html>
