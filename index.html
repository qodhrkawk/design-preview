<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Design Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 390px; background: #ffffff; min-height: 100vh; padding: 56px 20px 24px; }
    h1 { font-size: 24px; font-weight: 800; color: #0a0a0a; margin-bottom: 8px; }
    p { font-size: 14px; color: #737373; margin-bottom: 24px; }
    .project-label { font-size: 11px; font-weight: 600; color: #22c55e; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 24px; margin-bottom: 8px; }
    .screen-list { display: flex; flex-direction: column; gap: 12px; }
    a { text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; transition: background 0.15s; }
    a:active { background: #f5f5f5; }
    .screen-name { font-size: 16px; font-weight: 600; color: #0a0a0a; }
    .screen-desc { font-size: 13px; color: #737373; margin-top: 2px; }
    .arrow { font-size: 18px; color: #a3a3a3; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Design Preview</h1>
    <p>화면을 선택해서 모바일 미리보기를 확인하세요.</p>

    <div class="project-label">📊 StockRead (주읽이)</div>
    <div class="screen-list">
      <a href="stockread/landing.html">
        <div>
          <div class="screen-name">🌐 랜딩 페이지</div>
          <div class="screen-desc">서비스 소개 + 리포트 프리뷰 + CTA</div>
        </div>
        <span class="arrow">→</span>
      </a>
    </div>

    <div class="project-label" style="margin-top: 32px;">🧘 습관 트래커 (테스트)</div>
    <div class="screen-list">
      <a href="home.html">
        <div>
          <div class="screen-name">🏠 홈</div>
          <div class="screen-desc">습관 목록 + 오늘의 진행 상황</div>
        </div>
        <span class="arrow">→</span>
      </a>
      <a href="add-habit.html">
        <div>
          <div class="screen-name">➕ 습관 추가</div>
          <div class="screen-desc">새 습관 등록 화면</div>
        </div>
        <span class="arrow">→</span>
      </a>
      <a href="stats.html">
        <div>
          <div class="screen-name">📊 통계</div>
          <div class="screen-desc">주간/월간 달성률</div>
        </div>
        <span class="arrow">→</span>
      </a>
    </div>
  </div>
</body>
</html>
