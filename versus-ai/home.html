<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갑론을박 - 홈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    color: #0a0a0a;
  }
  .screen {
    width: 390px;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="screen">

  <!-- Status Bar -->
  <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 24px 8px; font-size:12px; font-weight:600; color:#0a0a0a;">
    <span>9:41</span>
    <div style="display:flex; gap:6px; align-items:center;">
      <svg width="16" height="12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#0a0a0a"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1" fill="#0a0a0a"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#0a0a0a"/><rect x="13" y="0" width="3" height="12" rx="1" fill="#0a0a0a" opacity="0.3"/></svg>
      <svg width="24" height="12" fill="none"><rect x="0" y="1" width="20" height="10" rx="2" stroke="#0a0a0a" stroke-width="1.5"/><rect x="2" y="3" width="14" height="6" rx="1" fill="#0a0a0a"/><rect x="21" y="4" width="3" height="4" rx="1" fill="#0a0a0a" opacity="0.4"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div style="padding:16px 24px 8px;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div>
        <div style="font-size:28px; font-weight:800; letter-spacing:-0.025em; color:#0a0a0a;">갑론을박</div>
        <div style="font-size:14px; font-weight:400; color:#737373; margin-top:2px;">AI가 대신 싸워드립니다</div>
      </div>
      <div style="width:40px; height:40px; border-radius:9999px; background:#f5f5f5; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
    </div>
  </div>

  <!-- New Debate CTA -->
  <div style="padding:16px 24px;">
    <div style="background:linear-gradient(135deg, #171717, #404040); border-radius:16px; padding:24px; position:relative; overflow:hidden;">
      <div style="position:absolute; top:-20px; right:-20px; width:100px; height:100px; border-radius:9999px; background:rgba(255,255,255,0.05);"></div>
      <div style="position:absolute; bottom:-30px; left:-30px; width:80px; height:80px; border-radius:9999px; background:rgba(255,255,255,0.03);"></div>
      <div style="font-size:18px; font-weight:600; color:#fafafa; margin-bottom:6px;">새로운 고민이 있나요?</div>
      <div style="font-size:13px; color:rgba(250,250,250,0.6); margin-bottom:20px; line-height:1.5;">질문을 던지면 AI 두 명이<br>찬반 토론을 벌여드려요</div>
      <div style="display:flex; align-items:center; gap:8px; background:#fafafa; color:#171717; border-radius:10px; padding:12px 16px; font-size:15px; font-weight:500; width:fit-content; cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        토론 시작하기
      </div>
    </div>
  </div>

  <!-- Stats Row -->
  <div style="display:flex; gap:12px; padding:0 24px; margin-bottom:20px;">
    <div style="flex:1; background:#f5f5f5; border-radius:12px; padding:16px; text-align:center;">
      <div style="font-size:24px; font-weight:800; color:#0a0a0a;">7</div>
      <div style="font-size:12px; color:#737373; margin-top:2px;">총 토론</div>
    </div>
    <div style="flex:1; background:#f5f5f5; border-radius:12px; padding:16px; text-align:center;">
      <div style="font-size:24px; font-weight:800; color:#ef4444;">3</div>
      <div style="font-size:12px; color:#737373; margin-top:2px;">찬성 승</div>
    </div>
    <div style="flex:1; background:#f5f5f5; border-radius:12px; padding:16px; text-align:center;">
      <div style="font-size:24px; font-weight:800; color:#3b82f6;">4</div>
      <div style="font-size:12px; color:#737373; margin-top:2px;">반대 승</div>
    </div>
  </div>

  <!-- Recent Debates -->
  <div style="padding:0 24px;">
    <div style="font-size:16px; font-weight:600; color:#0a0a0a; margin-bottom:12px;">최근 토론</div>

    <!-- Debate Card 1 -->
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; margin-bottom:10px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <div style="display:flex; align-items:center; gap:6px;">
          <div style="width:8px; height:8px; border-radius:9999px; background:#3b82f6;"></div>
          <span style="font-size:12px; font-weight:500; color:#3b82f6;">반대 승</span>
        </div>
        <span style="font-size:12px; color:#a3a3a3;">오늘</span>
      </div>
      <div style="font-size:15px; font-weight:500; color:#0a0a0a; line-height:1.4; margin-bottom:10px;">이직을 지금 해야 할까, 1년 더 다녀야 할까?</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="display:flex; align-items:center; gap:4px; background:#fef2f2; border-radius:6px; padding:4px 8px;">
          <div style="width:6px; height:6px; border-radius:9999px; background:#ef4444;"></div>
          <span style="font-size:11px; font-weight:500; color:#ef4444;">찬성 42%</span>
        </div>
        <div style="flex:1; height:4px; background:#e5e5e5; border-radius:9999px; overflow:hidden;">
          <div style="height:100%; width:42%; background:linear-gradient(90deg, #ef4444, #f87171); border-radius:9999px;"></div>
        </div>
        <div style="display:flex; align-items:center; gap:4px; background:#eff6ff; border-radius:6px; padding:4px 8px;">
          <div style="width:6px; height:6px; border-radius:9999px; background:#3b82f6;"></div>
          <span style="font-size:11px; font-weight:500; color:#3b82f6;">반대 58%</span>
        </div>
      </div>
    </div>

    <!-- Debate Card 2 -->
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; margin-bottom:10px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <div style="display:flex; align-items:center; gap:6px;">
          <div style="width:8px; height:8px; border-radius:9999px; background:#ef4444;"></div>
          <span style="font-size:12px; font-weight:500; color:#ef4444;">찬성 승</span>
        </div>
        <span style="font-size:12px; color:#a3a3a3;">어제</span>
      </div>
      <div style="font-size:15px; font-weight:500; color:#0a0a0a; line-height:1.4; margin-bottom:10px;">테슬라 주식 지금 추가 매수해도 될까?</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="display:flex; align-items:center; gap:4px; background:#fef2f2; border-radius:6px; padding:4px 8px;">
          <div style="width:6px; height:6px; border-radius:9999px; background:#ef4444;"></div>
          <span style="font-size:11px; font-weight:500; color:#ef4444;">찬성 65%</span>
        </div>
        <div style="flex:1; height:4px; background:#e5e5e5; border-radius:9999px; overflow:hidden;">
          <div style="height:100%; width:65%; background:linear-gradient(90deg, #ef4444, #f87171); border-radius:9999px;"></div>
        </div>
        <div style="display:flex; align-items:center; gap:4px; background:#eff6ff; border-radius:6px; padding:4px 8px;">
          <div style="width:6px; height:6px; border-radius:9999px; background:#3b82f6;"></div>
          <span style="font-size:11px; font-weight:500; color:#3b82f6;">반대 35%</span>
        </div>
      </div>
    </div>

    <!-- Debate Card 3 -->
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; margin-bottom:10px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <div style="display:flex; align-items:center; gap:6px;">
          <div style="width:8px; height:8px; border-radius:9999px; background:#3b82f6;"></div>
          <span style="font-size:12px; font-weight:500; color:#3b82f6;">반대 승</span>
        </div>
        <span style="font-size:12px; color:#a3a3a3;">3일 전</span>
      </div>
      <div style="font-size:15px; font-weight:500; color:#0a0a0a; line-height:1.4; margin-bottom:10px;">맥북 프로 M5 나올 때까지 기다려야 할까?</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="display:flex; align-items:center; gap:4px; background:#fef2f2; border-radius:6px; padding:4px 8px;">
          <div style="width:6px; height:6px; border-radius:9999px; background:#ef4444;"></div>
          <span style="font-size:11px; font-weight:500; color:#ef4444;">찬성 38%</span>
        </div>
        <div style="flex:1; height:4px; background:#e5e5e5; border-radius:9999px; overflow:hidden;">
          <div style="height:100%; width:38%; background:linear-gradient(90deg, #ef4444, #f87171); border-radius:9999px;"></div>
        </div>
        <div style="display:flex; align-items:center; gap:4px; background:#eff6ff; border-radius:6px; padding:4px 8px;">
          <div style="width:6px; height:6px; border-radius:9999px; background:#3b82f6;"></div>
          <span style="font-size:11px; font-weight:500; color:#3b82f6;">반대 62%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <div style="position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:390px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; padding:8px 0 28px; z-index:10;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size:10px; font-weight:600; color:#0a0a0a;">홈</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span style="font-size:10px; font-weight:500; color:#a3a3a3;">탐색</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span style="font-size:10px; font-weight:500; color:#a3a3a3;">기록</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size:10px; font-weight:500; color:#a3a3a3;">프로필</span>
    </div>
  </div>

</div>
</body>
</html>
