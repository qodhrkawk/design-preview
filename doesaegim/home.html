<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그럴수도 — 입력</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; background:#ffffff; color:#0a0a0a; width:390px; margin:0 auto; min-height:844px; padding-bottom:88px; }
  .header { padding:24px 20px 8px; }
  .greet { font-size:14px; color:#737373; }
  .title { font-size:30px; font-weight:600; letter-spacing:-0.025em; margin-top:2px; }
  .sub { font-size:14px; color:#737373; margin-top:6px; line-height:20px; }
  .section { padding:20px; }
  .label { font-size:14px; font-weight:600; margin-bottom:8px; }
  .ta { width:100%; min-height:150px; border:1px solid #e5e5e5; border-radius:12px; padding:14px; font-family:inherit; font-size:15px; line-height:22px; color:#0a0a0a; resize:none; }
  .ta::placeholder { color:#a3a3a3; }
  .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .chip { font-size:13px; font-weight:500; padding:7px 12px; border-radius:9999px; border:1px solid #e5e5e5; background:#ffffff; color:#404040; display:flex; align-items:center; gap:6px; }
  .chip.on { background:#171717; color:#fafafa; border-color:#171717; }
  .chiplab { font-size:12px; color:#737373; margin:18px 0 8px; font-weight:500; }
  .cta { margin:22px 20px 0; height:52px; background:#171717; color:#fafafa; border:none; border-radius:12px; font-size:16px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; width:calc(100% - 40px); }
  .hint { text-align:center; font-size:12px; color:#a3a3a3; margin-top:10px; }
  .recent { padding:8px 20px 0; }
  .rtitle { font-size:13px; color:#737373; font-weight:500; margin-bottom:10px; }
  .ritem { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border:1px solid #e5e5e5; border-radius:12px; margin-bottom:10px; }
  .rtxt { font-size:14px; color:#404040; flex:1; margin-right:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gauge { font-size:13px; font-weight:600; padding:3px 9px; border-radius:9999px; }
  .g-low { background:#dcfce7; color:#16a34a; }
  .g-mid { background:#fef3c7; color:#d97706; }
  .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:390px; height:72px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; align-items:center; justify-content:space-around; padding-bottom:8px; }
  .tab { display:flex; flex-direction:column; align-items:center; gap:3px; color:#a3a3a3; font-size:11px; font-weight:500; }
  .tab.active { color:#171717; }
  svg { display:block; }
</style>
</head>
<body>
  <div class="header">
    <div class="greet">또 곱씹는 중이야?</div>
    <div class="title">그럴수도</div>
    <div class="sub">방금 무슨 일 있었어? 적어두면 별일인지 아닌지 같이 따져줄게.</div>
  </div>

  <div class="section">
    <div class="label">지금 머릿속에 도는 그 장면</div>
    <textarea class="ta" placeholder="예) 회식에서 부장님 농담에 영혼 없이 '아 네...' 하고 말았는데, 분위기 싸해진 것 같았다. 다들 신경 쓰는 거 아니야?"></textarea>

    <div class="chiplab">어디서 있었던 일이야?</div>
    <div class="row">
      <span class="chip on">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        회식·모임
      </span>
      <span class="chip">카톡·DM</span>
      <span class="chip">회의·발표</span>
      <span class="chip">상사·윗사람</span>
      <span class="chip">친구</span>
      <span class="chip">기타</span>
    </div>
  </div>

  <button class="cta">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>
    별일인지 따져보기
  </button>
  <div class="hint">걱정이 vs 쿨이가 각자 의견을 줄게 · 오늘 2/3회 남음</div>

  <div class="recent" style="margin-top:28px;">
    <div class="rtitle">최근에 곱씹은 것들</div>
    <div class="ritem">
      <div class="rtxt">단톡방에 보낸 짤이 안 웃겼나...</div>
      <span class="gauge g-low">별일 9</span>
    </div>
    <div class="ritem">
      <div class="rtxt">면접에서 말 더듬은 거</div>
      <span class="gauge g-mid">별일 41</span>
    </div>
    <div class="ritem">
      <div class="rtxt">친구한테 답장 너무 짧게 했나</div>
      <span class="gauge g-low">별일 14</span>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      따져보기
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      패턴
    </div>
    <div class="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
      나
    </div>
  </div>
</body>
</html>
