<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoodTrade - 매매 기록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
    color: #0a0a0a;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 390px;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
    padding-bottom: 40px;
  }
  .status-bar {
    height: 54px;
    padding: 14px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: 600;
  }
  .status-icons { display: flex; gap: 6px; font-size: 13px; }

  /* Nav */
  .nav {
    padding: 8px 24px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .nav-back {
    width: 36px;
    height: 36px;
    border-radius: 9999px;
    background: #f5f5f5;
    border: none;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .nav-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.025em;
  }

  /* Form */
  .form-section {
    padding: 0 24px;
    margin-bottom: 24px;
  }
  .form-label {
    font-size: 14px;
    font-weight: 600;
    color: #0a0a0a;
    margin-bottom: 8px;
    display: block;
  }
  .form-sublabel {
    font-size: 12px;
    color: #737373;
    font-weight: 400;
    margin-left: 4px;
  }

  /* Mood Selector */
  .mood-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .mood-option {
    flex: 1;
    min-width: 75px;
    padding: 14px 8px;
    border: 2px solid #e5e5e5;
    border-radius: 12px;
    background: #ffffff;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .mood-option.selected {
    border-color: #171717;
    background: #f5f5f5;
  }
  .mood-option-emoji {
    font-size: 28px;
    display: block;
    margin-bottom: 4px;
  }
  .mood-option-label {
    font-size: 11px;
    font-weight: 600;
    color: #737373;
  }
  .mood-option.selected .mood-option-label {
    color: #0a0a0a;
  }

  /* Input */
  .form-input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    color: #0a0a0a;
    background: #ffffff;
    outline: none;
  }
  .form-input:focus { border-color: #a3a3a3; }
  .form-input::placeholder { color: #a3a3a3; }

  /* Toggle Row */
  .toggle-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .toggle-btn {
    flex: 1;
    padding: 12px;
    border: 2px solid #e5e5e5;
    border-radius: 10px;
    background: #ffffff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    color: #737373;
    cursor: pointer;
    text-align: center;
  }
  .toggle-btn.active-buy {
    border-color: #ef4444;
    color: #ef4444;
    background: #fef2f2;
  }
  .toggle-btn.active-sell {
    border-color: #3b82f6;
    color: #3b82f6;
    background: #eff6ff;
  }

  /* Textarea */
  .form-textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: #0a0a0a;
    background: #ffffff;
    outline: none;
    resize: none;
    line-height: 22px;
  }
  .form-textarea:focus { border-color: #a3a3a3; }
  .form-textarea::placeholder { color: #a3a3a3; }

  /* AI Hint */
  .ai-hint {
    margin: 0 24px 24px;
    padding: 14px 16px;
    background: #fefce8;
    border-radius: 12px;
    border: 1px solid #fde68a;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .ai-hint-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .ai-hint-text {
    font-size: 13px;
    line-height: 20px;
    color: #713f12;
  }
  .ai-hint-text strong { color: #451a03; }

  /* Submit Button */
  .submit-btn {
    margin: 0 24px;
    width: calc(100% - 48px);
    padding: 16px;
    background: #171717;
    color: #fafafa;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }

  /* Input Row */
  .input-row {
    display: flex;
    gap: 10px;
  }
  .input-row .form-input { flex: 1; }

  /* Confidence Slider */
  .confidence-bar {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .conf-dot {
    flex: 1;
    height: 8px;
    border-radius: 4px;
    background: #e5e5e5;
  }
  .conf-dot.filled { background: #171717; }
  .conf-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    color: #a3a3a3;
  }
</style>
</head>
<body>
<div class="app">
  <div class="status-bar">
    <span>14:03</span>
    <div class="status-icons">📶 📡 🔋</div>
  </div>

  <div class="nav">
    <button class="nav-back">←</button>
    <span class="nav-title">매매 기록</span>
  </div>

  <!-- Step 1: 감정 -->
  <div class="form-section">
    <label class="form-label">
      지금 감정은? <span class="form-sublabel">매매 시점의 기분</span>
    </label>
    <div class="mood-selector">
      <div class="mood-option">
        <span class="mood-option-emoji">😰</span>
        <span class="mood-option-label">공포</span>
      </div>
      <div class="mood-option">
        <span class="mood-option-emoji">😟</span>
        <span class="mood-option-label">불안</span>
      </div>
      <div class="mood-option selected">
        <span class="mood-option-emoji">😌</span>
        <span class="mood-option-label">침착</span>
      </div>
      <div class="mood-option">
        <span class="mood-option-emoji">😊</span>
        <span class="mood-option-label">확신</span>
      </div>
      <div class="mood-option">
        <span class="mood-option-emoji">🤑</span>
        <span class="mood-option-label">탐욕</span>
      </div>
    </div>
  </div>

  <!-- Step 2: 매매 정보 -->
  <div class="form-section">
    <label class="form-label">매매 정보</label>
    <div class="toggle-row">
      <button class="toggle-btn active-buy">🔴 매수</button>
      <button class="toggle-btn">🔵 매도</button>
    </div>
    <div style="margin-bottom: 10px;">
      <input class="form-input" type="text" placeholder="종목명 (예: 삼성전자)" value="삼성전자">
    </div>
    <div class="input-row">
      <input class="form-input" type="text" placeholder="매매가" value="68,500">
      <input class="form-input" type="text" placeholder="수량" value="10주" style="max-width: 100px;">
    </div>
  </div>

  <!-- Step 3: 확신도 -->
  <div class="form-section">
    <label class="form-label">확신도</label>
    <div class="confidence-bar">
      <div class="conf-dot filled"></div>
      <div class="conf-dot filled"></div>
      <div class="conf-dot filled"></div>
      <div class="conf-dot filled"></div>
      <div class="conf-dot"></div>
    </div>
    <div class="conf-labels">
      <span>반신반의</span>
      <span>확신</span>
    </div>
  </div>

  <!-- Step 4: 메모 -->
  <div class="form-section">
    <label class="form-label">
      왜 이 매매를 했나요? <span class="form-sublabel">선택</span>
    </label>
    <textarea class="form-textarea" rows="3" placeholder="매매 근거나 그때 든 생각을 자유롭게...">분할매수 2차. 지지선 근처에서 반등 시그널. 일봉 MACD 골든크로스 확인.</textarea>
  </div>

  <!-- AI Hint -->
  <div class="ai-hint">
    <span class="ai-hint-icon">🤖</span>
    <div class="ai-hint-text">
      <strong>AI 팁:</strong> 최근 "침착" 상태에서의 매수는 평균 +3.8% 수익. 현재 감정 상태가 가장 좋은 컨디션이에요.
    </div>
  </div>

  <button class="submit-btn">기록 완료 ✓</button>
</div>
</body>
</html>
