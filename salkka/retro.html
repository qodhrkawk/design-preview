<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>살까말까 — 구매 회고</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; }
  </style>
</head>
<body>
<div class="mobile-frame" style="padding-bottom:40px;">
  <div style="height:48px;"></div>
  <div style="padding:12px 20px 4px;">
    <span style="display:inline-block; background:#f5f5f5; color:#737373; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">구매 2주 후 · 회고 시트</span>
  </div>

  <!-- Dimmed background hint -->
  <div style="margin:8px 20px; height:48px; background:#f5f5f5; border-radius:12px; opacity:0.5;"></div>

  <!-- Bottom sheet -->
  <div style="margin:0 8px; background:#ffffff; border:1px solid #e5e5e5; border-radius:20px 20px 16px 16px; box-shadow:0 -10px 30px rgba(0,0,0,0.08); overflow:hidden;">
    <div style="background:#faf5e6; padding:12px 20px 0; text-align:center;">
      <div style="width:36px; height:4px; background:#e6d9b8; border-radius:9999px; margin:0 auto 8px;"></div>
      <img src="assets/think.png" width="170" height="170" alt="도리 생각" style="display:block; margin:0 auto;">
    </div>

    <div style="padding:20px 20px 28px;">
      <h2 style="font-size:22px; line-height:30px; font-weight:700; color:#0a0a0a; text-align:center; letter-spacing:-0.025em;">그 헤드폰, 지금 어때?</h2>
      <p style="font-size:13px; line-height:19px; color:#737373; text-align:center; margin-top:6px;">산 지 2주 됐어. 솔직하게 말해줘도 돼.</p>

      <!-- Item recap -->
      <div style="margin-top:16px; background:#f5f5f5; border-radius:12px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <p style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a;">소니 WH-1000XM5 헤드폰</p>
          <p style="font-size:12px; line-height:17px; color:#a3a3a3; margin-top:2px;">7월 8일 구매 · 전자기기</p>
        </div>
        <p style="font-size:14px; line-height:20px; font-weight:700; color:#0a0a0a;">129,000원</p>
      </div>

      <!-- 3 choices -->
      <div style="display:flex; gap:10px; margin-top:20px;">
        <!-- 잘 샀어 (selected) -->
        <div style="flex:1; background:#f0fdf4; border:1.5px solid #22c55e; border-radius:12px; padding:16px 8px; text-align:center;">
          <div style="width:44px; height:44px; margin:0 auto; background:#dcfce7; border-radius:9999px; display:flex; align-items:center; justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
          </div>
          <p style="font-size:14px; font-weight:700; color:#16a34a; margin-top:8px;">잘 샀어</p>
        </div>
        <!-- 그냥 그래 -->
        <div style="flex:1; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px 8px; text-align:center;">
          <div style="width:44px; height:44px; margin:0 auto; background:#f5f5f5; border-radius:9999px; display:flex; align-items:center; justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </div>
          <p style="font-size:14px; font-weight:600; color:#737373; margin-top:8px;">그냥 그래</p>
        </div>
        <!-- 후회돼 -->
        <div style="flex:1; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px 8px; text-align:center;">
          <div style="width:44px; height:44px; margin:0 auto; background:#f5f5f5; border-radius:9999px; display:flex; align-items:center; justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>
          </div>
          <p style="font-size:14px; font-weight:600; color:#737373; margin-top:8px;">후회돼</p>
        </div>
      </div>

      <!-- Memo -->
      <div style="margin-top:16px;">
        <label style="display:block; font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; margin-bottom:6px;">한 줄 메모 <span style="color:#a3a3a3; font-weight:400;">(선택)</span></label>
        <textarea placeholder="예: 출퇴근이 달라졌다. 이건 진짜 잘 샀어" style="width:100%; height:72px; background:#ffffff; border:1px solid #e5e5e5; border-radius:8px; padding:10px 12px; font-size:14px; line-height:20px; font-family:inherit; color:#0a0a0a; outline:none; resize:none;"></textarea>
      </div>

      <!-- Dori reaction -->
      <div style="margin-top:14px; background:#faf5e6; border:1px solid #f0e6c8; border-radius:10px; padding:10px 14px;">
        <p style="font-size:13px; line-height:19px; color:#a16207; text-align:center;">2주 지나도 좋으면 진짜 잘 산 거야. 이런 소비는 참지 마.</p>
      </div>

      <button style="width:100%; margin-top:16px; background:#171717; color:#fafafa; border:none; border-radius:10px; height:48px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer;">기록하기</button>
      <p style="font-size:12px; line-height:17px; color:#a3a3a3; text-align:center; margin-top:12px;">이 기록은 카테고리별 만족도 통계에 쌓여.</p>
    </div>
  </div>

</div>
</body>
</html>
