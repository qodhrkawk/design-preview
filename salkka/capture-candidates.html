<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>살까말까 — 상품 여러 개 감지</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; }
  </style>
</head>
<body>
<div class="mobile-frame" style="padding-bottom:96px;">
  <div style="height:48px;"></div>

  <div style="text-align:center; padding:8px 0 0;">
    <div style="width:36px; height:4px; background:#e6d9b8; border-radius:9999px; margin:0 auto 12px;"></div>
  </div>
  <div style="display:flex; align-items:center; justify-content:space-between; padding:0 20px;">
    <button style="width:40px; height:40px; margin-left:-8px; border:none; background:transparent; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 style="font-size:18px; line-height:28px; font-weight:600; color:#0a0a0a;">어떤 걸 담을까?</h1>
    <div style="width:32px;"></div>
  </div>

  <!-- Dori prompt -->
  <div style="margin:12px 20px 0; background:#faf5e6; border:1px solid #f0e6c8; border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:12px;">
    <img src="assets/curious.png" width="48" height="48" alt="도리" style="display:block; border-radius:10px; flex-shrink:0;">
    <p style="font-size:13px; line-height:19px; color:#57534e;"><b style="color:#a16207;">화면에서 상품 4개를 찾았어.</b> 담고 싶은 걸 골라줘.</p>
  </div>

  <!-- Candidate list -->
  <div style="padding:16px 20px 0; display:flex; flex-direction:column; gap:10px;">

    <!-- Candidate 1 (selected) -->
    <button style="width:100%; background:#faf5e6; border:1.5px solid #d97706; border-radius:12px; padding:12px; display:flex; gap:12px; align-items:center; cursor:pointer; text-align:left; box-shadow:0 2px 6px rgba(217,119,6,0.1);">
      <div style="width:56px; height:56px; background:#ffffff; border:1px solid #e6d9b8; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 0 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">소니 WH-1000XM5 헤드폰</p>
        <p style="font-size:14px; line-height:20px; font-weight:700; color:#d97706; margin-top:1px;">129,000원</p>
      </div>
      <div style="width:24px; height:24px; border-radius:9999px; background:#d97706; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
    </button>

    <!-- Candidate 2 -->
    <button style="width:100%; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:12px; display:flex; gap:12px; align-items:center; cursor:pointer; text-align:left;">
      <div style="width:56px; height:56px; background:#f5f5f5; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 0 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">보스 QC 울트라 헤드폰</p>
        <p style="font-size:14px; line-height:20px; font-weight:700; color:#0a0a0a; margin-top:1px;">419,000원</p>
      </div>
      <div style="width:24px; height:24px; border-radius:9999px; border:1.5px solid #d4d4d4; flex-shrink:0;"></div>
    </button>

    <!-- Candidate 3 -->
    <button style="width:100%; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:12px; display:flex; gap:12px; align-items:center; cursor:pointer; text-align:left;">
      <div style="width:56px; height:56px; background:#f5f5f5; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">에어팟 맥스 (USB-C)</p>
        <p style="font-size:14px; line-height:20px; font-weight:700; color:#0a0a0a; margin-top:1px;">769,000원</p>
      </div>
      <div style="width:24px; height:24px; border-radius:9999px; border:1.5px solid #d4d4d4; flex-shrink:0;"></div>
    </button>

    <!-- Candidate 4 (low confidence) -->
    <button style="width:100%; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:12px; display:flex; gap:12px; align-items:center; cursor:pointer; text-align:left;">
      <div style="width:56px; height:56px; background:#f5f5f5; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 0 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">젠하이저 모멘텀 4</p>
        <div style="display:flex; align-items:center; gap:6px; margin-top:2px;">
          <p style="font-size:14px; line-height:20px; font-weight:700; color:#737373;">가격 못 읽음</p>
          <span style="font-size:11px; color:#a3a3a3;">· 직접 입력</span>
        </div>
      </div>
      <div style="width:24px; height:24px; border-radius:9999px; border:1.5px solid #d4d4d4; flex-shrink:0;"></div>
    </button>

  </div>

  <!-- Manual fallback link -->
  <div style="text-align:center; margin-top:18px;">
    <button style="background:transparent; border:none; color:#a16207; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">찾는 게 없어? 직접 입력하기</button>
  </div>

  <!-- Bottom CTA -->
  <div style="position:fixed; bottom:0; width:100%; max-width:390px; background:#ffffff; border-top:1px solid #e5e5e5; padding:12px 20px 28px;">
    <button style="width:100%; background:#d97706; color:#ffffff; border:none; border-radius:10px; height:48px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer;">1개 담기</button>
  </div>
</div>
</body>
</html>
