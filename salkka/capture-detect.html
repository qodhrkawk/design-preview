<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>살까말까 — 담기 (캡쳐 감지)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; }
  </style>
</head>
<body>
<div class="mobile-frame" style="padding-bottom:110px;">
  <div style="height:48px;"></div>

  <!-- Top bar -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 20px 4px;">
    <h1 style="font-size:20px; line-height:28px; font-weight:700; color:#0a0a0a; letter-spacing:-0.025em;">담기</h1>
    <button style="width:40px; height:40px; margin-right:-8px; border:none; background:transparent; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    </button>
  </div>

  <!-- Detected screenshot card (primary flow) -->
  <div style="padding:12px 20px 0;">
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:10px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><path d="M14.5 4h6"/><path d="M17.5 1v6"/><rect width="18" height="14" x="3" y="7" rx="2"/></svg>
      <span style="font-size:13px; line-height:18px; font-weight:600; color:#a16207;">방금 찍은 스크린샷을 찾았어</span>
    </div>

    <div style="background:#faf5e6; border:1.5px solid #d97706; border-radius:16px; padding:16px; box-shadow:0 4px 6px rgba(217,119,6,0.08), 0 2px 4px rgba(0,0,0,0.04);">
      <div style="display:flex; gap:14px;">
        <!-- thumbnail -->
        <div style="width:96px; flex-shrink:0; position:relative;">
          <div style="width:96px; height:160px; background:linear-gradient(160deg,#ffffff,#f5f5f5); border:1px solid #e6d9b8; border-radius:12px; overflow:hidden; display:flex; flex-direction:column;">
            <div style="height:24px; background:#f0e6c8; display:flex; align-items:center; padding:0 8px;">
              <div style="width:32px; height:5px; background:#d9c99a; border-radius:9999px;"></div>
            </div>
            <div style="flex:1; padding:8px; display:flex; flex-direction:column; gap:6px;">
              <div style="width:100%; aspect-ratio:1; background:#e6d9b8; border-radius:6px;"></div>
              <div style="width:80%; height:7px; background:#e0e0e0; border-radius:9999px;"></div>
              <div style="width:55%; height:7px; background:#d97706; border-radius:9999px;"></div>
              <div style="width:70%; height:6px; background:#ededed; border-radius:9999px;"></div>
            </div>
          </div>
          <span style="position:absolute; bottom:6px; right:6px; background:rgba(10,10,10,0.72); color:#fafafa; font-size:10px; font-weight:600; border-radius:6px; padding:2px 6px;">방금</span>
        </div>

        <!-- copy -->
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center; min-width:0;">
          <p style="font-size:16px; line-height:22px; font-weight:700; color:#713f12; letter-spacing:-0.01em;">이거 담을까?</p>
          <p style="font-size:13px; line-height:19px; color:#a16207; margin-top:6px;">화면 속 상품을 읽어서 이름·가격·카테고리까지 자동으로 채워줄게.</p>
          <div style="display:flex; align-items:center; gap:6px; margin-top:10px; background:#ffffff; border:1px solid #f0e6c8; border-radius:9999px; padding:4px 10px; align-self:flex-start;">
            <img src="assets/curious.png" width="22" height="22" alt="도리" style="display:block; border-radius:9999px;">
            <span style="font-size:11px; font-weight:600; color:#a16207;">도리가 읽어줄게</span>
          </div>
        </div>
      </div>

      <!-- one-tap CTA -->
      <button style="width:100%; margin-top:14px; background:#d97706; color:#ffffff; border:none; border-radius:10px; height:48px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8h8"/><path d="M7 12h10"/><path d="M7 16h6"/></svg>
        이거 담기
      </button>
      <button style="width:100%; margin-top:8px; background:transparent; color:#a16207; border:none; height:36px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;">다른 스크린샷 고르기</button>
    </div>
  </div>

  <!-- Divider -->
  <div style="display:flex; align-items:center; gap:12px; margin:24px 20px 0;">
    <div style="flex:1; height:1px; background:#e5e5e5;"></div>
    <span style="font-size:12px; color:#a3a3a3;">다른 방법으로</span>
    <div style="flex:1; height:1px; background:#e5e5e5;"></div>
  </div>

  <!-- Secondary entry points (link / manual) -->
  <div style="padding:16px 20px 0; display:flex; flex-direction:column; gap:10px;">
    <button style="width:100%; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; text-align:left;">
      <div style="width:40px; height:40px; background:#f5f5f5; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a;">링크로 담기</p>
        <p style="font-size:12px; line-height:17px; color:#a3a3a3; margin-top:1px;">상품 페이지 주소 붙여넣기</p>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c4c4c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
    </button>

    <button style="width:100%; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; text-align:left;">
      <div style="width:40px; height:40px; background:#f5f5f5; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <p style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a;">직접 입력</p>
        <p style="font-size:12px; line-height:17px; color:#a3a3a3; margin-top:1px;">이름·가격 손으로 적기</p>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c4c4c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <p style="font-size:12px; line-height:17px; color:#a3a3a3; text-align:center; margin:18px 32px 0;">스크린샷 접근은 담을 때만 쓰고, 다른 사진은 안 봐.</p>

  <!-- Tab bar -->
  <div style="position:fixed; bottom:0; width:100%; max-width:390px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; padding:8px 0 24px;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding-top:6px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span style="font-size:11px; font-weight:500; color:#a3a3a3;">홈</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding-top:6px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>
      <span style="font-size:11px; font-weight:600; color:#171717;">담기</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding-top:6px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
      <span style="font-size:11px; font-weight:500; color:#a3a3a3;">기록</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding-top:6px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      <span style="font-size:11px; font-weight:500; color:#a3a3a3;">통계</span>
    </div>
  </div>
</div>
</body>
</html>
