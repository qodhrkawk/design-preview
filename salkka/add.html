<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>살까말까 — 담기</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; }
  </style>
</head>
<body>
<div class="mobile-frame" style="padding-bottom:120px;">
  <div style="height:48px;"></div>

  <!-- Top bar -->
  <div style="display:flex; align-items:center; gap:8px; padding:12px 20px;">
    <button style="width:40px; height:40px; margin-left:-8px; border:none; background:transparent; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <h1 style="font-size:18px; line-height:28px; font-weight:600; color:#0a0a0a;">위시리스트에 담기</h1>
  </div>

  <!-- Link paste zone (parsed success state) -->
  <div style="padding:8px 20px 0;">
    <p style="font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; margin-bottom:8px;">링크로 담기</p>
    <div style="background:#faf5e6; border:1px solid #f0e6c8; border-radius:12px; padding:14px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <p style="font-size:12px; line-height:16px; color:#a16207; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">prod.danawa.com/info/?pcode=1782...</p>
        <div style="display:flex; align-items:center; gap:4px; background:#dcfce7; border-radius:9999px; padding:2px 8px; flex-shrink:0;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <span style="font-size:11px; font-weight:600; color:#16a34a;">가져옴</span>
        </div>
      </div>
      <!-- Parsed result -->
      <div style="margin-top:12px; background:#ffffff; border:1px solid #f0e6c8; border-radius:10px; padding:12px; display:flex; gap:12px; align-items:center;">
        <div style="width:48px; height:48px; background:#f5f5f5; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 0 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/></svg>
        </div>
        <div style="flex:1; min-width:0;">
          <p style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">소니 WH-1000XM5 헤드폰</p>
          <p style="font-size:14px; line-height:20px; font-weight:700; color:#d97706; margin-top:1px;">129,000원</p>
        </div>
        <button style="border:none; background:transparent; padding:8px; cursor:pointer; flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
        </button>
      </div>
      <p style="font-size:12px; line-height:17px; color:#a16207; margin-top:10px; opacity:0.85;">이름이랑 가격 자동으로 채웠어. 다르면 고쳐줘.</p>
    </div>
    <div style="display:flex; align-items:center; gap:12px; margin:20px 0 4px;">
      <div style="flex:1; height:1px; background:#e5e5e5;"></div>
      <span style="font-size:12px; color:#a3a3a3;">또는 직접 입력</span>
      <div style="flex:1; height:1px; background:#e5e5e5;"></div>
    </div>
  </div>

  <!-- Manual form -->
  <div style="padding:12px 20px 0; display:flex; flex-direction:column; gap:16px;">

    <div>
      <label style="display:block; font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; margin-bottom:6px;">상품명</label>
      <input type="text" value="소니 WH-1000XM5 헤드폰" style="width:100%; height:40px; background:#ffffff; border:1px solid #e5e5e5; border-radius:8px; padding:8px 12px; font-size:14px; font-family:inherit; color:#0a0a0a; outline:none;">
    </div>

    <div>
      <label style="display:block; font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; margin-bottom:6px;">가격</label>
      <div style="position:relative;">
        <input type="text" value="129,000" style="width:100%; height:40px; background:#ffffff; border:1px solid #e5e5e5; border-radius:8px; padding:8px 36px 8px 12px; font-size:14px; font-family:inherit; color:#0a0a0a; outline:none;">
        <span style="position:absolute; right:12px; top:10px; font-size:14px; color:#737373;">원</span>
      </div>
    </div>

    <div>
      <label style="display:block; font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; margin-bottom:6px;">카테고리</label>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <span style="height:34px; display:inline-flex; align-items:center; background:#171717; color:#fafafa; border:1px solid #171717; border-radius:9999px; padding:0 14px; font-size:13px; font-weight:500;">전자기기</span>
        <span style="height:34px; display:inline-flex; align-items:center; background:#ffffff; color:#737373; border:1px solid #e5e5e5; border-radius:9999px; padding:0 14px; font-size:13px; font-weight:500;">패션</span>
        <span style="height:34px; display:inline-flex; align-items:center; background:#ffffff; color:#737373; border:1px solid #e5e5e5; border-radius:9999px; padding:0 14px; font-size:13px; font-weight:500;">취미</span>
        <span style="height:34px; display:inline-flex; align-items:center; background:#ffffff; color:#737373; border:1px solid #e5e5e5; border-radius:9999px; padding:0 14px; font-size:13px; font-weight:500;">생활</span>
        <span style="height:34px; display:inline-flex; align-items:center; background:#ffffff; color:#737373; border:1px solid #e5e5e5; border-radius:9999px; padding:0 14px; font-size:13px; font-weight:500;">뷰티</span>
        <span style="height:34px; display:inline-flex; align-items:center; background:#ffffff; color:#737373; border:1px solid #e5e5e5; border-radius:9999px; padding:0 14px; font-size:13px; font-weight:500;">기타</span>
      </div>
    </div>

    <div>
      <label style="display:block; font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; margin-bottom:6px;">왜 갖고 싶어? <span style="color:#a3a3a3; font-weight:400;">(선택)</span></label>
      <input type="text" placeholder="예: 지하철에서 노캔 없인 못 살겠어" style="width:100%; height:40px; background:#ffffff; border:1px solid #e5e5e5; border-radius:8px; padding:8px 12px; font-size:14px; font-family:inherit; color:#0a0a0a; outline:none;">
      <p style="font-size:12px; line-height:17px; color:#a3a3a3; margin-top:6px;">결정할 때 도리가 이 이유를 다시 보여줄 거야.</p>
    </div>

    <!-- Cooldown select -->
    <div>
      <label style="display:block; font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; margin-bottom:6px;">얼마나 기다려볼까?</label>
      <div style="display:flex; gap:8px;">
        <div style="flex:1; background:#ffffff; border:1px solid #e5e5e5; border-radius:10px; padding:12px 8px; text-align:center;">
          <p style="font-size:15px; font-weight:600; color:#737373;">24시간</p>
          <p style="font-size:11px; color:#a3a3a3; margin-top:2px;">가벼운 것</p>
        </div>
        <div style="flex:1; background:#faf5e6; border:1.5px solid #d97706; border-radius:10px; padding:12px 8px; text-align:center; position:relative;">
          <p style="font-size:15px; font-weight:700; color:#a16207;">72시간</p>
          <p style="font-size:11px; color:#b45309; margin-top:2px;">기본 추천</p>
          <span style="position:absolute; top:-8px; right:8px; background:#d97706; color:#ffffff; font-size:10px; font-weight:600; border-radius:9999px; padding:1px 7px;">추천</span>
        </div>
        <div style="flex:1; background:#ffffff; border:1px solid #e5e5e5; border-radius:10px; padding:12px 8px; text-align:center;">
          <p style="font-size:15px; font-weight:600; color:#737373;">7일</p>
          <p style="font-size:11px; color:#a3a3a3; margin-top:2px;">큰 지출</p>
        </div>
      </div>
    </div>

    <!-- Dori comment -->
    <div style="display:flex; gap:12px; align-items:center; background:#faf5e6; border:1px solid #f0e6c8; border-radius:12px; padding:10px 14px;">
      <img src="assets/curious.png" width="56" height="56" alt="도리" style="display:block; border-radius:10px; flex-shrink:0;">
      <p style="font-size:13px; line-height:19px; color:#57534e;">오, 12만원짜리 헤드폰? 3일 뒤에 다시 물어볼게. 그때도 설레면 진짜인 거야.</p>
    </div>

  </div>

  <!-- Bottom CTA -->
  <div style="position:fixed; bottom:0; width:100%; max-width:390px; background:#ffffff; border-top:1px solid #e5e5e5; padding:12px 20px 28px;">
    <button style="width:100%; background:#d97706; color:#ffffff; border:none; border-radius:10px; height:48px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer;">위시리스트에 담기</button>
  </div>
</div>
</body>
</html>
