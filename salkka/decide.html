<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>살까말까 — 결정 시트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; }
  </style>
</head>
<body>
<div class="mobile-frame">

  <!-- ===== State A: Decision sheet ===== -->
  <div style="height:48px;"></div>
  <div style="padding:12px 20px 4px;">
    <span style="display:inline-block; background:#f5f5f5; color:#737373; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">State A · 결정 시트</span>
  </div>

  <!-- Dimmed background hint -->
  <div style="margin:8px 20px; height:48px; background:#f5f5f5; border-radius:12px; opacity:0.5;"></div>

  <!-- Bottom sheet -->
  <div style="margin:0 8px; background:#ffffff; border:1px solid #e5e5e5; border-radius:20px 20px 16px 16px; box-shadow:0 -10px 30px rgba(0,0,0,0.08); overflow:hidden;">
    <div style="background:#faf5e6; padding:12px 20px 0; text-align:center;">
      <div style="width:36px; height:4px; background:#e6d9b8; border-radius:9999px; margin:0 auto 8px;"></div>
      <img src="assets/curious.png" width="170" height="170" alt="도리" style="display:block; margin:0 auto;">
    </div>

    <div style="padding:20px 20px 24px;">
      <h2 style="font-size:22px; line-height:30px; font-weight:700; color:#0a0a0a; text-align:center; letter-spacing:-0.025em;">3일 지났어. 아직도 설레?</h2>

      <!-- Item recap -->
      <div style="margin-top:16px; background:#f5f5f5; border-radius:12px; padding:14px 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <p style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a;">소니 WH-1000XM5 헤드폰</p>
          <p style="font-size:14px; line-height:20px; font-weight:700; color:#0a0a0a;">129,000원</p>
        </div>
        <div style="display:flex; gap:6px; align-items:center; margin-top:8px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <p style="font-size:13px; line-height:18px; color:#737373;">"지하철에서 노캔 없인 못 살겠어" — 3일 전의 나</p>
        </div>
      </div>

      <!-- 3 choices -->
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
        <button style="width:100%; height:52px; background:#171717; color:#fafafa; border:none; border-radius:10px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
          샀어
        </button>
        <button style="width:100%; height:52px; background:#d97706; color:#ffffff; border:none; border-radius:10px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
          안 살래 — 아낀 돈으로
        </button>
        <button style="width:100%; height:52px; background:#ffffff; color:#171717; border:1px solid #e5e5e5; border-radius:10px; font-size:15px; font-weight:500; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
          더 고민할래 <span style="color:#a3a3a3; font-weight:400;">(+72h)</span>
        </button>
      </div>
      <p style="font-size:12px; line-height:17px; color:#a3a3a3; text-align:center; margin-top:14px;">뭘 골라도 괜찮아. 사는 것도 결정이야.</p>
    </div>
  </div>

  <!-- ===== State B: Saved celebration ===== -->
  <div style="padding:32px 20px 4px;">
    <span style="display:inline-block; background:#f5f5f5; color:#737373; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">State B · "안 살래" 적립 연출</span>
  </div>

  <div style="margin:8px 8px 40px; background:#faf5e6; border:1px solid #f0e6c8; border-radius:16px; padding:28px 20px; text-align:center; position:relative; overflow:hidden;">
    <!-- sparkles -->
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="position:absolute; top:26px; left:40px;"><path d="M12 3l2.2 5.3L20 10l-5.8 1.7L12 17l-2.2-5.3L4 10l5.8-1.7z" fill="#f0b429"/></svg>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="position:absolute; top:70px; right:44px;"><path d="M12 3l2.2 5.3L20 10l-5.8 1.7L12 17l-2.2-5.3L4 10l5.8-1.7z" fill="#f0b429" opacity="0.7"/></svg>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="position:absolute; top:34px; right:96px;"><path d="M12 3l2.2 5.3L20 10l-5.8 1.7L12 17l-2.2-5.3L4 10l5.8-1.7z" fill="#d97706" opacity="0.5"/></svg>

    <img src="assets/joy.png" width="200" height="200" alt="도리 기쁨" style="display:block; margin:0 auto;">

    <p style="font-size:14px; line-height:20px; color:#a16207; margin-top:4px; font-weight:500;">주머니에 쏙</p>
    <p style="font-size:36px; line-height:40px; font-weight:800; color:#713f12; letter-spacing:-0.025em; margin-top:6px;">+129,000원</p>
    <p style="font-size:13px; line-height:19px; color:#a16207; margin-top:10px;">이걸로 아낀 돈 총 557,000원! 설렘은 공짜였네.</p>

    <!-- progress -->
    <div style="margin:18px auto 0; max-width:260px; display:flex; align-items:center; gap:8px;">
      <div style="flex:1; height:10px; background:#f0e6c8; border-radius:9999px; overflow:hidden;">
        <div style="width:82%; height:10px; background:#d97706; border-radius:9999px;"></div>
      </div>
      <span style="font-size:12px; color:#a16207; font-weight:700; flex-shrink:0;">Lv.4까지 82%</span>
    </div>

    <button style="margin-top:20px; background:#171717; color:#fafafa; border:none; border-radius:10px; height:44px; padding:0 32px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;">홈으로</button>
  </div>

</div>
</body>
</html>
