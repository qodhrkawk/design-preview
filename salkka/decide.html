<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>살까말까 — 결정 시트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; }
  </style>
</head>
<body>
<div class="mobile-frame">

  <!-- ===== State A: Decision sheet ===== -->
  <div style="height:48px;"></div>
  <div style="padding:12px 20px 4px;">
    <span style="display:inline-block; background:#f5f5f5; color:#737373; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">State A · 결정 시트</span>
  </div>

  <!-- Dimmed background hint -->
  <div style="margin:8px 20px; height:56px; background:#f5f5f5; border-radius:12px; opacity:0.5;"></div>

  <!-- Bottom sheet -->
  <div style="margin:0 8px; background:#ffffff; border:1px solid #e5e5e5; border-radius:20px 20px 16px 16px; box-shadow:0 -10px 30px rgba(0,0,0,0.08); padding:12px 20px 24px;">
    <div style="width:36px; height:4px; background:#e5e5e5; border-radius:9999px; margin:0 auto 20px;"></div>

    <!-- Dori 궁금 포즈 -->
    <div style="display:flex; justify-content:center;">
      <svg width="96" height="96" viewBox="0 0 120 120" fill="none">
        <path d="M78 84c20-4 30-20 27-36-2-11-11-19-21-19 8 7 11 16 8 26-3 12-11 19-20 21z" fill="#b45309"/>
        <path d="M80 79c13-4 20-14 18-25-1-7-5-12-11-13 5 5 6 12 4 18-3 9-7 14-14 17z" fill="#d97706" opacity="0.45"/>
        <ellipse cx="56" cy="88" rx="24" ry="19" fill="#d97706"/>
        <ellipse cx="56" cy="92" rx="15" ry="12" fill="#fde68a"/>
        <ellipse cx="45" cy="91" rx="5" ry="4" fill="#d97706"/>
        <ellipse cx="67" cy="91" rx="5" ry="4" fill="#d97706"/>
        <g transform="rotate(-8 56 46)">
          <path d="M39 31c-4-9 0-17 8-18 3 5 2 12-2 17z" fill="#b45309"/>
          <path d="M73 31c4-9 0-17-8-18-3 5-2 12 2 17z" fill="#b45309"/>
          <circle cx="56" cy="46" r="23" fill="#d97706"/>
          <path d="M56 38c9 0 15 7 15 14 0 9-7 15-15 15s-15-6-15-15c0-7 6-14 15-14z" fill="#fde68a"/>
          <circle cx="47" cy="46" r="3" fill="#451a03"/>
          <circle cx="65" cy="46" r="3" fill="#451a03"/>
          <circle cx="48" cy="45" r="1" fill="#ffffff"/>
          <circle cx="66" cy="45" r="1" fill="#ffffff"/>
          <circle cx="41" cy="53" r="4" fill="#fdba74" opacity="0.7"/>
          <circle cx="71" cy="53" r="4" fill="#fdba74" opacity="0.7"/>
          <ellipse cx="56" cy="52" rx="2.5" ry="2" fill="#92400e"/>
          <ellipse cx="56" cy="58" rx="3" ry="3.5" fill="#92400e"/>
        </g>
        <path d="M90 30c0-5.5 4-9 8.5-9s8.5 3.5 8.5 8.5c0 4-2.6 5.5-4.8 7.3-1.7 1.4-2.7 2.7-2.7 5.2" stroke="#d97706" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="99.5" cy="49" r="2.4" fill="#d97706"/>
      </svg>
    </div>

    <h2 style="font-size:20px; line-height:28px; font-weight:700; color:#0a0a0a; text-align:center; margin-top:12px; letter-spacing:-0.025em;">3일 지났어. 아직도 설레?</h2>

    <!-- Item recap -->
    <div style="margin-top:16px; background:#f5f5f5; border-radius:12px; padding:14px 16px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <p style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a;">소니 WH-1000XM5 헤드폰</p>
        <p style="font-size:14px; line-height:20px; font-weight:700; color:#0a0a0a;">129,000원</p>
      </div>
      <div style="display:flex; gap:6px; align-items:center; margin-top:8px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p style="font-size:13px; line-height:18px; color:#737373;">"지하철에서 노캔 없인 못 살겠어" — 3일 전의 나</p>
      </div>
    </div>

    <!-- 3 choices -->
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
      <button style="width:100%; height:52px; background:#171717; color:#fafafa; border:none; border-radius:10px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        샀어
      </button>
      <button style="width:100%; height:52px; background:#d97706; color:#ffffff; border:none; border-radius:10px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><path d="M12 3c-4.2 0-7 2-7 4.6h14C19 5 16.2 3 12 3z" fill="#ffffff"/><path d="M6.2 7.6c.3 6 2.4 10.4 5.8 13.4 3.4-3 5.5-7.4 5.8-13.4z" fill="#ffffff" opacity="0.75"/></svg>
        안 살래 — 도토리로 적립
      </button>
      <button style="width:100%; height:52px; background:#ffffff; color:#171717; border:1px solid #e5e5e5; border-radius:10px; font-size:15px; font-weight:500; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
        더 고민할래 <span style="color:#a3a3a3; font-weight:400;">(+72h)</span>
      </button>
    </div>
    <p style="font-size:12px; line-height:17px; color:#a3a3a3; text-align:center; margin-top:14px;">뭘 골라도 괜찮아. 사는 것도 결정이야.</p>
  </div>

  <!-- ===== State B: Saved celebration ===== -->
  <div style="padding:32px 20px 4px;">
    <span style="display:inline-block; background:#f5f5f5; color:#737373; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">State B · "안 살래" 적립 연출</span>
  </div>

  <div style="margin:8px 8px 40px; background:#fffbeb; border:1px solid #fde68a; border-radius:16px; padding:32px 20px 28px; text-align:center; position:relative; overflow:hidden;">
    <!-- floating acorns -->
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="position:absolute; top:22px; left:36px; transform:rotate(-15deg);"><path d="M12 3c-4.2 0-7 2-7 4.6h14C19 5 16.2 3 12 3z" fill="#78350f"/><path d="M6.2 7.6c.3 6 2.4 10.4 5.8 13.4 3.4-3 5.5-7.4 5.8-13.4z" fill="#b45309"/></svg>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="position:absolute; top:64px; right:40px; transform:rotate(20deg);"><path d="M12 3c-4.2 0-7 2-7 4.6h14C19 5 16.2 3 12 3z" fill="#78350f"/><path d="M6.2 7.6c.3 6 2.4 10.4 5.8 13.4 3.4-3 5.5-7.4 5.8-13.4z" fill="#b45309"/></svg>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="position:absolute; top:30px; right:88px; transform:rotate(-30deg);"><path d="M12 3c-4.2 0-7 2-7 4.6h14C19 5 16.2 3 12 3z" fill="#78350f"/><path d="M6.2 7.6c.3 6 2.4 10.4 5.8 13.4 3.4-3 5.5-7.4 5.8-13.4z" fill="#b45309"/></svg>

    <!-- Dori 기쁨 포즈 -->
    <div style="display:flex; justify-content:center;">
      <svg width="110" height="110" viewBox="0 0 120 120" fill="none">
        <path d="M78 84c20-4 30-20 27-36-2-11-11-19-21-19 8 7 11 16 8 26-3 12-11 19-20 21z" fill="#b45309"/>
        <path d="M80 79c13-4 20-14 18-25-1-7-5-12-11-13 5 5 6 12 4 18-3 9-7 14-14 17z" fill="#d97706" opacity="0.45"/>
        <path d="M39 31c-4-9 0-17 8-18 3 5 2 12-2 17z" fill="#b45309"/>
        <path d="M73 31c4-9 0-17-8-18-3 5-2 12 2 17z" fill="#b45309"/>
        <ellipse cx="56" cy="88" rx="24" ry="19" fill="#d97706"/>
        <ellipse cx="56" cy="92" rx="15" ry="12" fill="#fde68a"/>
        <ellipse cx="33" cy="74" rx="5" ry="7" fill="#d97706" transform="rotate(-35 33 74)"/>
        <ellipse cx="79" cy="74" rx="5" ry="7" fill="#d97706" transform="rotate(35 79 74)"/>
        <circle cx="56" cy="46" r="23" fill="#d97706"/>
        <path d="M56 38c9 0 15 7 15 14 0 9-7 15-15 15s-15-6-15-15c0-7 6-14 15-14z" fill="#fde68a"/>
        <path d="M43.5 46q3.5-4.5 7 0" stroke="#451a03" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M61.5 46q3.5-4.5 7 0" stroke="#451a03" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <circle cx="41" cy="53" r="4" fill="#fdba74" opacity="0.7"/>
        <circle cx="71" cy="53" r="4" fill="#fdba74" opacity="0.7"/>
        <ellipse cx="56" cy="51" rx="2.5" ry="2" fill="#92400e"/>
        <path d="M51 55q5 6 10 0z" fill="#92400e"/>
        <path d="M22 42l2.2 4.6 4.6 2.2-4.6 2.2-2.2 4.6-2.2-4.6-4.6-2.2 4.6-2.2z" fill="#f59e0b"/>
        <path d="M96 52l1.6 3.4 3.4 1.6-3.4 1.6-1.6 3.4-1.6-3.4-3.4-1.6 3.4-1.6z" fill="#fbbf24"/>
      </svg>
    </div>

    <p style="font-size:14px; line-height:20px; color:#92400e; margin-top:8px; font-weight:500;">도토리 창고에 쏙</p>
    <p style="font-size:36px; line-height:40px; font-weight:800; color:#78350f; letter-spacing:-0.025em; margin-top:6px;">+129,000원</p>
    <p style="font-size:13px; line-height:19px; color:#92400e; margin-top:10px;">이걸로 창고 총 557,000원! 설렘은 공짜였네.</p>

    <!-- storage progress -->
    <div style="margin:18px auto 0; max-width:260px; display:flex; align-items:center; gap:8px;">
      <div style="flex:1; height:10px; background:#fde68a; border-radius:9999px; overflow:hidden;">
        <div style="width:82%; height:10px; background:#d97706; border-radius:9999px;"></div>
      </div>
      <span style="font-size:12px; color:#92400e; font-weight:700; flex-shrink:0;">Lv.4까지 82%</span>
    </div>

    <button style="margin-top:20px; background:#171717; color:#fafafa; border:none; border-radius:10px; height:44px; padding:0 32px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;">홈으로</button>
  </div>

</div>
</body>
</html>
