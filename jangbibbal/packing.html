<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장비빨 — 짐 체크</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: Inter, system-ui, sans-serif; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="display:flex; align-items:center; gap:12px; padding:16px 20px 12px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <div style="flex:1;">
      <div style="font-size:18px; font-weight:600; color:#0a0a0a;">출발 전 짐 체크</div>
      <div style="font-size:13px; color:#737373; margin-top:1px;">가평 자라섬 · 가을 오토캠핑 로드아웃</div>
    </div>
    <div style="background:#f5f5f5; border-radius:9999px; padding:4px 12px; font-size:13px; font-weight:600; color:#171717;">18/32</div>
  </div>

  <!-- Progress -->
  <div style="padding:0 20px 4px;">
    <div style="height:6px; background:#f5f5f5; border-radius:9999px; overflow:hidden;">
      <div style="width:56%; height:6px; background:#22c55e; border-radius:9999px;"></div>
    </div>
  </div>

  <!-- Box tabs -->
  <div style="display:flex; gap:8px; padding:16px 20px 4px; overflow-x:hidden;">
    <div style="background:#171717; color:#fafafa; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:600; white-space:nowrap;">리빙박스 A</div>
    <div style="background:#f5f5f5; color:#737373; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:500; white-space:nowrap;">리빙박스 B</div>
    <div style="background:#f5f5f5; color:#737373; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:500; white-space:nowrap;">아이스박스</div>
    <div style="background:#f5f5f5; color:#737373; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:500; white-space:nowrap;">트렁크</div>
  </div>

  <!-- Box hint -->
  <div style="margin:12px 20px 0; background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:10px 12px; display:flex; align-items:center; gap:8px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span style="font-size:13px; color:#1e40af;">리빙박스 A — 주방·화기 담당. 베란다 왼쪽 선반에 있어요.</span>
  </div>

  <!-- Checklist -->
  <div style="padding:16px 20px 0; display:flex; flex-direction:column; gap:8px;">

    <!-- checked item -->
    <div style="display:flex; align-items:center; gap:12px; border:1px solid #e5e5e5; border-radius:12px; padding:14px 16px; background:#fafafa;">
      <div style="width:24px; height:24px; border-radius:9999px; background:#22c55e; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:15px; font-weight:500; color:#737373; text-decoration:line-through;">이소가스 버너</div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:12px; border:1px solid #e5e5e5; border-radius:12px; padding:14px 16px; background:#fafafa;">
      <div style="width:24px; height:24px; border-radius:9999px; background:#22c55e; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:15px; font-weight:500; color:#737373; text-decoration:line-through;">코펠 세트</div>
      </div>
    </div>

    <!-- unchecked, consumable warning -->
    <div style="display:flex; align-items:center; gap:12px; border:1px solid #fde68a; border-radius:12px; padding:14px 16px; background:#fffbeb;">
      <div style="width:24px; height:24px; border-radius:9999px; border:2px solid #d4d4d4; background:#ffffff; flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="font-size:15px; font-weight:500; color:#0a0a0a;">이소가스 (연료)</div>
        <div style="font-size:12px; color:#b45309; margin-top:2px; display:flex; align-items:center; gap:4px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          지난 캠핑에서 "거의 다 씀" 표시 — 새로 사야 해요
        </div>
      </div>
      <div style="background:#f59e0b; color:#ffffff; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600;">장보기</div>
    </div>

    <div style="display:flex; align-items:center; gap:12px; border:1px solid #e5e5e5; border-radius:12px; padding:14px 16px; background:#ffffff;">
      <div style="width:24px; height:24px; border-radius:9999px; border:2px solid #d4d4d4; background:#ffffff; flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="font-size:15px; font-weight:500; color:#0a0a0a;">시에라컵 4개</div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:12px; border:1px solid #e5e5e5; border-radius:12px; padding:14px 16px; background:#ffffff;">
      <div style="width:24px; height:24px; border-radius:9999px; border:2px solid #d4d4d4; background:#ffffff; flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="font-size:15px; font-weight:500; color:#0a0a0a;">키친툴 파우치</div>
        <div style="font-size:12px; color:#737373; margin-top:2px;">집게·가위·칼 포함</div>
      </div>
    </div>

    <!-- frequently forgotten -->
    <div style="display:flex; align-items:center; gap:12px; border:1px solid #fecaca; border-radius:12px; padding:14px 16px; background:#fef2f2;">
      <div style="width:24px; height:24px; border-radius:9999px; border:2px solid #d4d4d4; background:#ffffff; flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="font-size:15px; font-weight:500; color:#0a0a0a;">키친타올</div>
        <div style="font-size:12px; color:#b91c1c; margin-top:2px; display:flex; align-items:center; gap:4px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          최근 3회 중 2회 빼먹은 품목
        </div>
      </div>
    </div>

  </div>

  <!-- Return check note -->
  <div style="margin:20px 20px 0; border-top:1px solid #e5e5e5; padding-top:16px;">
    <div style="display:flex; align-items:center; gap:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      <span style="font-size:13px; color:#737373;">철수할 때 이 리스트가 "철수 체크"로 바뀌어요 — 두고 오는 물건 방지</span>
    </div>
  </div>

  <!-- Bottom CTA -->
  <div style="margin-top:auto; padding:16px 20px 32px; border-top:1px solid #e5e5e5;">
    <div style="display:flex; gap:10px;">
      <div style="flex:1; background:#171717; color:#fafafa; border-radius:8px; height:48px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; font-weight:600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        박스 A 완료 (4개 남음)
      </div>
      <div style="width:48px; height:48px; border:1px solid #e5e5e5; border-radius:8px; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </div>
    </div>
  </div>

</div>
</body>
</html>
