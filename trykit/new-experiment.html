<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TryKit - 새 실험</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
    color: #0a0a0a;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
    overflow-y: auto;
  }
  .status-bar {
    height: 54px;
    padding: 14px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
  }
  .nav-bar {
    padding: 8px 24px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-bar .back {
    font-size: 16px;
    color: #737373;
    cursor: pointer;
    font-weight: 500;
  }
  .nav-bar h2 {
    font-size: 18px;
    font-weight: 600;
    line-height: 28px;
  }
  .nav-bar .placeholder { width: 40px; }

  .ai-suggest {
    margin: 0 24px 24px;
    background: linear-gradient(135deg, #171717 0%, #374151 100%);
    color: #fafafa;
    border-radius: 16px;
    padding: 20px;
  }
  .ai-suggest .ai-label {
    font-size: 12px;
    font-weight: 500;
    color: #a3a3a3;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ai-suggest h3 {
    font-size: 18px;
    font-weight: 600;
    line-height: 28px;
    margin-bottom: 4px;
  }
  .ai-suggest p {
    font-size: 14px;
    color: #d4d4d4;
    line-height: 20px;
    margin-bottom: 16px;
  }
  .ai-suggest .ai-reason {
    font-size: 12px;
    color: #a3a3a3;
    line-height: 18px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
  }
  .ai-actions {
    display: flex;
    gap: 8px;
  }
  .btn-start {
    flex: 1;
    background: #fafafa;
    color: #171717;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    height: 40px;
    cursor: pointer;
  }
  .btn-refresh {
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .divider {
    margin: 8px 24px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: #a3a3a3;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e5e5e5;
  }

  .section-label {
    padding: 0 24px;
    font-size: 14px;
    font-weight: 500;
    color: #737373;
    margin-bottom: 12px;
  }

  .category-chips {
    padding: 0 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .chip {
    padding: 8px 16px;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    border-radius: 9999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chip.selected {
    background: #171717;
    color: #fafafa;
    border-color: #171717;
  }

  .form-group {
    padding: 0 24px;
    margin-bottom: 20px;
  }
  .form-label {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
    display: block;
  }
  .form-input {
    width: 100%;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    height: 40px;
    font-family: inherit;
    outline: none;
  }
  .form-input:focus {
    border-color: #a3a3a3;
    box-shadow: 0 0 0 2px rgba(163,163,163,0.15);
  }
  .form-textarea {
    width: 100%;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    resize: none;
    height: 80px;
    line-height: 20px;
  }

  .duration-options {
    padding: 0 24px;
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .duration-btn {
    flex: 1;
    padding: 12px;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
  }
  .duration-btn.selected {
    background: #171717;
    color: #fafafa;
    border-color: #171717;
  }
  .duration-btn .dur-num {
    font-size: 24px;
    font-weight: 800;
    line-height: 32px;
  }
  .duration-btn .dur-label {
    font-size: 12px;
    color: #737373;
    line-height: 16px;
    margin-top: 2px;
  }
  .duration-btn.selected .dur-label { color: #a3a3a3; }

  .submit-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 390px;
    background: #ffffff;
    border-top: 1px solid #e5e5e5;
    padding: 16px 24px 40px;
  }
  .btn-primary {
    width: 100%;
    background: #171717;
    color: #fafafa;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: 600;
    height: 48px;
    cursor: pointer;
  }
  .spacer { height: 120px; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●● 📶 🔋</span>
  </div>

  <div class="nav-bar">
    <span class="back">← 뒤로</span>
    <h2>새 실험</h2>
    <span class="placeholder"></span>
  </div>

  <!-- AI 추천 실험 -->
  <div class="ai-suggest">
    <div class="ai-label">✨ AI 추천 실험</div>
    <h3>🧘 아침 5분 명상</h3>
    <p>기상 직후 5분간 호흡에 집중하기</p>
    <div class="ai-reason">
      💬 "최근 조깅 실험에서 아침 루틴에 강한 편이에요. 명상을 추가하면 집중력도 같이 올라갈 수 있어요."
    </div>
    <div class="ai-actions">
      <button class="btn-start">이 실험 시작하기</button>
      <button class="btn-refresh">🔄</button>
    </div>
  </div>

  <div class="divider">또는 직접 만들기</div>

  <!-- 카테고리 -->
  <div class="section-label">카테고리</div>
  <div class="category-chips">
    <div class="chip selected">🏃 운동</div>
    <div class="chip">📚 학습</div>
    <div class="chip">🍎 식습관</div>
    <div class="chip">😴 수면</div>
    <div class="chip">🧘 마음</div>
    <div class="chip">💼 생산성</div>
    <div class="chip">📵 디지털</div>
    <div class="chip">💰 재테크</div>
  </div>

  <!-- 실험 이름 -->
  <div class="form-group">
    <label class="form-label">실험 이름</label>
    <input class="form-input" placeholder="예: 아침 30분 독서" />
  </div>

  <!-- 구체적 규칙 -->
  <div class="form-group">
    <label class="form-label">실험 규칙 (선택)</label>
    <textarea class="form-textarea" placeholder="언제, 어디서, 얼마나? &#10;AI가 자동으로 정리해줘요"></textarea>
  </div>

  <!-- 실험 기간 -->
  <div class="section-label">실험 기간</div>
  <div class="duration-options">
    <div class="duration-btn">
      <div class="dur-num">3</div>
      <div class="dur-label">일 맛보기</div>
    </div>
    <div class="duration-btn selected">
      <div class="dur-num">7</div>
      <div class="dur-label">일 기본</div>
    </div>
    <div class="duration-btn">
      <div class="dur-num">14</div>
      <div class="dur-label">일 본격</div>
    </div>
    <div class="duration-btn">
      <div class="dur-num">30</div>
      <div class="dur-label">일 도전</div>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="submit-bar">
    <button class="btn-primary">🧪 실험 시작!</button>
  </div>
</div>
</body>
</html>
