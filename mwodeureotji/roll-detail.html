<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뭐들었지 — 롤 상세</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 24px 20px 12px; display: flex; align-items: center; gap: 12px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <div style="flex: 1;">
      <div style="font-size: 20px; line-height: 28px; font-weight: 600; color: #0a0a0a;">Portra 400 <span style="color: #737373; font-weight: 400; font-size: 14px;">#R-014</span></div>
      <div style="font-size: 13px; line-height: 18px; color: #737373;">Nikon FM2 · 8월 30일 장전 · ISO 400</div>
    </div>
    <span style="background: #dcfce7; color: #15803d; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500;">장전 중</span>
  </div>

  <!-- 진행 바 -->
  <div style="margin: 8px 20px 16px; background: #f5f5f5; border-radius: 12px; padding: 16px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-size: 14px; color: #737373;">촬영 진행</div>
      <div><span style="font-size: 24px; font-weight: 700; color: #0a0a0a;">27</span><span style="font-size: 14px; color: #737373;"> / 36컷</span></div>
    </div>
    <div style="margin-top: 10px; height: 8px; background: #e5e5e5; border-radius: 9999px; overflow: hidden;">
      <div style="width: 75%; height: 100%; background: #171717; border-radius: 9999px;"></div>
    </div>
  </div>

  <!-- 컷 카운터 버튼 -->
  <div style="margin: 0 20px 20px; display: flex; gap: 10px;">
    <button style="flex: 1; height: 56px; background: #171717; color: #fafafa; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      한 컷 찍음
    </button>
    <button style="width: 56px; height: 56px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    </button>
  </div>

  <!-- 컷 로그 -->
  <div style="padding: 0 20px 8px; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 14px; font-weight: 500; color: #737373;">컷 로그</div>
    <div style="font-size: 12px; color: #a3a3a3;">탭해서 메모 추가</div>
  </div>

  <div style="margin: 0 20px 10px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden;">
    <!-- 컷 아이템 -->
    <div style="padding: 13px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f5f5f5;">
      <div style="width: 32px; height: 32px; border-radius: 6px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #171717;">27</div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">망원한강공원 노을</div>
        <div style="font-size: 12px; color: #737373; margin-top: 1px;">f/5.6 · 1/250 · 오늘 18:42</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
    </div>
    <div style="padding: 13px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f5f5f5;">
      <div style="width: 32px; height: 32px; border-radius: 6px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #171717;">26</div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">자전거 탄 사람 역광</div>
        <div style="font-size: 12px; color: #737373; margin-top: 1px;">f/8 · 1/500 · 오늘 18:30</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
    </div>
    <div style="padding: 13px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f5f5f5;">
      <div style="width: 32px; height: 32px; border-radius: 6px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #a3a3a3;">25</div>
      <div style="flex: 1;">
        <div style="font-size: 14px; color: #a3a3a3;">메모 없음</div>
        <div style="font-size: 12px; color: #a3a3a3; margin-top: 1px;">9월 7일 14:11</div>
      </div>
    </div>
    <div style="padding: 13px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 32px; height: 32px; border-radius: 6px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #171717;">24</div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">골목 고양이, 노출 -1스톱</div>
        <div style="font-size: 12px; color: #737373; margin-top: 1px;">f/2.8 · 1/125 · 9월 7일 13:58</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
    </div>
  </div>
  <div style="padding: 0 20px; font-size: 12px; color: #a3a3a3; text-align: center;">이전 컷 23개 더 보기</div>

  <div style="flex: 1;"></div>

  <!-- 하단 액션 -->
  <div style="padding: 16px 20px 32px; display: flex; gap: 10px; border-top: 1px solid #f5f5f5;">
    <button style="flex: 1; height: 48px; background: #ffffff; color: #171717; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
      되감기 완료
    </button>
    <button style="flex: 1; height: 48px; background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="M12 3v3"/><path d="M4 6a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/></svg>
      롤 정보 수정
    </button>
  </div>

</div>
</body>
</html>
