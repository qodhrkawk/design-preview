<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뭐들었지 — 홈</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 24px 20px 16px; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div style="font-size: 24px; line-height: 32px; font-weight: 600; color: #0a0a0a;">뭐들었지</div>
      <div style="font-size: 14px; line-height: 20px; color: #737373; margin-top: 2px;">카메라 3대 · 장전 중 2롤</div>
    </div>
    <button style="width: 40px; height: 40px; border-radius: 8px; background: #171717; border: none; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
  </div>

  <!-- 현상 대기 배너 -->
  <div style="margin: 0 20px 16px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <div style="flex: 1;">
      <div style="font-size: 14px; line-height: 20px; font-weight: 500; color: #0a0a0a;">현상 안 맡긴 롤이 2개 있어요</div>
      <div style="font-size: 12px; line-height: 16px; color: #737373; margin-top: 1px;">가장 오래된 롤: 되감은 지 23일</div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </div>

  <!-- 섹션 타이틀 -->
  <div style="padding: 0 20px 10px; font-size: 14px; font-weight: 500; color: #737373;">내 카메라</div>

  <!-- 카메라 카드 1: 장전 중 -->
  <div style="margin: 0 20px 12px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </div>
        <div>
          <div style="font-size: 16px; line-height: 24px; font-weight: 600; color: #0a0a0a;">Nikon FM2</div>
          <div style="font-size: 12px; line-height: 16px; color: #737373;">135 · 8월 30일 장전</div>
        </div>
      </div>
      <span style="background: #dcfce7; color: #15803d; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500;">장전 중</span>
    </div>
    <div style="margin-top: 14px; background: #f5f5f5; border-radius: 8px; padding: 12px 14px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">Kodak Portra 400</div>
        <div style="font-size: 14px; color: #0a0a0a;"><span style="font-weight: 700; font-size: 18px;">27</span><span style="color: #737373;"> / 36컷</span></div>
      </div>
      <div style="margin-top: 8px; height: 6px; background: #e5e5e5; border-radius: 9999px; overflow: hidden;">
        <div style="width: 75%; height: 100%; background: #171717; border-radius: 9999px;"></div>
      </div>
      <div style="margin-top: 6px; font-size: 12px; color: #737373;">9컷 남음</div>
    </div>
  </div>

  <!-- 카메라 카드 2: 장전 중 (거의 다 씀) -->
  <div style="margin: 0 20px 12px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </div>
        <div>
          <div style="font-size: 16px; line-height: 24px; font-weight: 600; color: #0a0a0a;">Rollei 35</div>
          <div style="font-size: 12px; line-height: 16px; color: #737373;">135 · 9월 6일 장전</div>
        </div>
      </div>
      <span style="background: #dcfce7; color: #15803d; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500;">장전 중</span>
    </div>
    <div style="margin-top: 14px; background: #f5f5f5; border-radius: 8px; padding: 12px 14px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">Ilford HP5 Plus 400</div>
        <div style="font-size: 14px; color: #0a0a0a;"><span style="font-weight: 700; font-size: 18px; color: #f59e0b;">34</span><span style="color: #737373;"> / 36컷</span></div>
      </div>
      <div style="margin-top: 8px; height: 6px; background: #e5e5e5; border-radius: 9999px; overflow: hidden;">
        <div style="width: 94%; height: 100%; background: #f59e0b; border-radius: 9999px;"></div>
      </div>
      <div style="margin-top: 6px; font-size: 12px; color: #f59e0b; font-weight: 500;">2컷 남음 — 곧 되감을 때예요</div>
    </div>
  </div>

  <!-- 카메라 카드 3: 비어있음 -->
  <div style="margin: 0 20px 12px; background: #ffffff; border: 1px dashed #e5e5e5; border-radius: 12px; padding: 18px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </div>
        <div>
          <div style="font-size: 16px; line-height: 24px; font-weight: 600; color: #737373;">Hasselblad 500C/M</div>
          <div style="font-size: 12px; line-height: 16px; color: #a3a3a3;">120 · 필름 없음</div>
        </div>
      </div>
      <button style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 500; font-family: inherit;">장전하기</button>
    </div>
  </div>

  <div style="flex: 1;"></div>

  <!-- 탭바 -->
  <div style="border-top: 1px solid #e5e5e5; display: flex; padding: 10px 0 28px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #171717;">카메라</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h10"/><path d="M5 6h14"/><rect width="18" height="12" x="3" y="10" rx="2"/></svg>
      <span style="font-size: 11px; color: #a3a3a3;">롤 보관함</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      <span style="font-size: 11px; color: #a3a3a3;">통계</span>
    </div>
  </div>

</div>
</body>
</html>
