<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오분이 - 홈</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;color:#0a0a0a;display:flex;justify-content:center;min-height:100vh}
.app{width:390px;background:#ffffff;min-height:100vh;display:flex;flex-direction:column}
.header{padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:700;letter-spacing:-0.02em}
.icon-btn{width:36px;height:36px;border:1px solid #e5e5e5;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:#ffffff;cursor:pointer}
.section{padding:16px 20px}
.greet{font-size:14px;color:#737373;margin-bottom:4px}
.title{font-size:24px;font-weight:700;letter-spacing:-0.025em;line-height:32px}
.mood-card{margin:16px 20px;background:#171717;color:#fafafa;border-radius:16px;padding:24px}
.mood-card .label{font-size:12px;font-weight:500;opacity:0.7;margin-bottom:8px;letter-spacing:0.04em;text-transform:uppercase}
.mood-card .q{font-size:18px;font-weight:600;margin-bottom:20px;line-height:26px}
.mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mood-pill{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.mood-pill svg{width:20px;height:20px;stroke:#fafafa}
.mood-pill span{font-size:11px;font-weight:500}
.mood-pill.active{background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.3)}
.input-row{margin:12px 20px 0;display:flex;gap:8px}
.text-input{flex:1;height:44px;border:1px solid #e5e5e5;border-radius:10px;padding:0 14px;font-size:14px;font-family:inherit;background:#ffffff}
.cta{height:44px;padding:0 18px;background:#171717;color:#fafafa;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.cta svg{width:16px;height:16px;stroke:#fafafa}
.section-title{padding:20px 20px 12px;font-size:13px;font-weight:600;color:#737373;letter-spacing:0.04em;text-transform:uppercase}
.recent-card{margin:0 20px 10px;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px}
.recent-emoji{width:40px;height:40px;background:#f5f5f5;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.recent-emoji svg{width:20px;height:20px;stroke:#171717}
.recent-body{flex:1;min-width:0}
.recent-title{font-size:14px;font-weight:600;margin-bottom:2px}
.recent-meta{font-size:12px;color:#737373}
.recent-score{font-size:12px;font-weight:600;color:#22c55e;background:#dcfce7;padding:4px 10px;border-radius:9999px}
.recent-score.low{color:#737373;background:#f5f5f5}
.bottom-nav{margin-top:auto;border-top:1px solid #e5e5e5;background:#ffffff;display:flex;padding:8px 0 16px;position:sticky;bottom:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;cursor:pointer;color:#737373}
.nav-item.active{color:#171717}
.nav-item svg{width:20px;height:20px;stroke:currentColor}
.nav-item span{font-size:11px;font-weight:500}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">오분이</div>
    <button class="icon-btn" aria-label="설정">
      <svg fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="section">
    <div class="greet">금요일 오후 2시</div>
    <div class="title">지금 기분 어때?</div>
  </div>
  <div class="mood-card">
    <div class="label">QUICK CHECK</div>
    <div class="q">한 단어로 골라봐 — 5분이면 회복돼</div>
    <div class="mood-grid">
      <div class="mood-pill"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg><span>괜찮음</span></div>
      <div class="mood-pill active"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9 14h6"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg><span>불안</span></div>
      <div class="mood-pill"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg><span>우울</span></div>
      <div class="mood-pill"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span>분노</span></div>
      <div class="mood-pill"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span>피곤</span></div>
      <div class="mood-pill"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>막막</span></div>
      <div class="mood-pill"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/></svg><span>스트레스</span></div>
      <div class="mood-pill"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>조급</span></div>
    </div>
  </div>
  <div class="input-row">
    <input class="text-input" placeholder="한 줄 더 (선택)" />
    <button class="cta">5분 받기 <svg fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  </div>
  <div class="section-title">최근 회복 기록</div>
  <div class="recent-card">
    <div class="recent-emoji"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
    <div class="recent-body"><div class="recent-title">창문 열고 50번 깊은 호흡</div><div class="recent-meta">어제 오후 4시 · 불안</div></div>
    <div class="recent-score">+82%</div>
  </div>
  <div class="recent-card">
    <div class="recent-emoji"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></div>
    <div class="recent-body"><div class="recent-title">따뜻한 차 한잔 + 음악</div><div class="recent-meta">어제 오전 11시 · 막막</div></div>
    <div class="recent-score">+67%</div>
  </div>
  <div class="recent-card">
    <div class="recent-emoji"><svg fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg></div>
    <div class="recent-body"><div class="recent-title">동네 한바퀴 걷기</div><div class="recent-meta">그제 저녁 7시 · 스트레스</div></div>
    <div class="recent-score low">+34%</div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item active"><svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>홈</span></div>
    <div class="nav-item"><svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>기록</span></div>
    <div class="nav-item"><svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>인사이트</span></div>
    <div class="nav-item"><svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg><span>나</span></div>
  </div>
</div>
</body>
</html>
