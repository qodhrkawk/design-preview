<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>얼마였지 — 가격 기록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #f5f5f5;
    color: #0a0a0a;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
  }
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 24px 0; font-size:12px; font-weight:600; color:#0a0a0a;">
    <span>14:02</span>
    <div style="display:flex; gap:4px; align-items:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="10" x2="23" y2="14"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div style="display:flex; justify-content:space-between; align-items:center; padding:20px 24px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:36px; height:36px; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </div>
      <span style="font-size:20px; font-weight:700;">가격 기록</span>
    </div>
  </div>

  <!-- Form -->
  <div style="padding:0 24px;">
    <!-- Item Name -->
    <div style="margin-bottom:24px;">
      <label style="font-size:14px; font-weight:600; color:#0a0a0a; display:block; margin-bottom:8px;">아이템 이름</label>
      <div style="position:relative;">
        <input type="text" value="우유 1L" style="width:100%; height:48px; background:#ffffff; border:1.5px solid #171717; border-radius:10px; padding:0 16px; font-size:16px; font-family:Inter, system-ui, sans-serif; outline:none;" />
      </div>
      <!-- AI Suggestion -->
      <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
        <div style="background:#f5f5f5; border-radius:9999px; padding:6px 14px; font-size:12px; font-weight:500; color:#737373; border:1px solid #e5e5e5;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline; vertical-align:-1px; margin-right:4px;"><path d="M12 2v4"/><path d="m6.34 6.34 2.83 2.83"/><path d="M2 12h4"/></svg>기존: 서울우유 1L
        </div>
        <div style="background:#f5f5f5; border-radius:9999px; padding:6px 14px; font-size:12px; font-weight:500; color:#737373; border:1px solid #e5e5e5;">매일우유 1L</div>
      </div>
    </div>

    <!-- Price -->
    <div style="margin-bottom:24px;">
      <label style="font-size:14px; font-weight:600; color:#0a0a0a; display:block; margin-bottom:8px;">가격</label>
      <div style="position:relative;">
        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:16px; font-weight:600; color:#737373;">₩</span>
        <input type="text" value="2,980" style="width:100%; height:48px; background:#ffffff; border:1.5px solid #e5e5e5; border-radius:10px; padding:0 16px 0 36px; font-size:24px; font-weight:700; font-family:Inter, system-ui, sans-serif; outline:none; text-align:right;" />
      </div>
      <!-- Previous Price Reference -->
      <div style="margin-top:10px; background:#f0fdf4; border-radius:10px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-size:12px; color:#737373; font-weight:500;">지난 기록 평균</div>
          <div style="font-size:16px; font-weight:700; color:#0a0a0a; margin-top:2px;">₩3,180</div>
        </div>
        <div style="background:#dcfce7; border-radius:9999px; padding:4px 12px; font-size:13px; font-weight:600; color:#16a34a;">
          -6.3% 저렴
        </div>
      </div>
    </div>

    <!-- Place -->
    <div style="margin-bottom:24px;">
      <label style="font-size:14px; font-weight:600; color:#0a0a0a; display:block; margin-bottom:8px;">구매처</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <div style="background:#171717; color:#fafafa; border-radius:9999px; padding:10px 18px; font-size:14px; font-weight:500;">이마트</div>
        <div style="background:#f5f5f5; color:#0a0a0a; border-radius:9999px; padding:10px 18px; font-size:14px; font-weight:500; border:1px solid #e5e5e5;">GS25</div>
        <div style="background:#f5f5f5; color:#0a0a0a; border-radius:9999px; padding:10px 18px; font-size:14px; font-weight:500; border:1px solid #e5e5e5;">쿠팡</div>
        <div style="background:#f5f5f5; color:#737373; border-radius:9999px; padding:10px 18px; font-size:14px; font-weight:500; border:1px dashed #d4d4d4;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline; vertical-align:-2px; margin-right:4px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>직접 입력
        </div>
      </div>
    </div>

    <!-- Category -->
    <div style="margin-bottom:24px;">
      <label style="font-size:14px; font-weight:600; color:#0a0a0a; display:block; margin-bottom:8px;">카테고리</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <div style="background:#171717; color:#fafafa; border-radius:9999px; padding:10px 18px; font-size:14px; font-weight:500;">식료품</div>
        <div style="background:#f5f5f5; color:#0a0a0a; border-radius:9999px; padding:10px 18px; font-size:14px; font-weight:500; border:1px solid #e5e5e5;">생활용품</div>
        <div style="background:#f5f5f5; color:#0a0a0a; border-radius:9999px; padding:10px 18px; font-size:14px; font-weight:500; border:1px solid #e5e5e5;">서비스</div>
        <div style="background:#f5f5f5; color:#0a0a0a; border-radius:9999px; padding:10px 18px; font-size:14px; font-weight:500; border:1px solid #e5e5e5;">교통</div>
        <div style="background:#f5f5f5; color:#0a0a0a; border-radius:9999px; padding:10px 18px; font-size:14px; font-weight:500; border:1px solid #e5e5e5;">외식</div>
      </div>
    </div>

    <!-- Memo -->
    <div style="margin-bottom:24px;">
      <label style="font-size:14px; font-weight:600; color:#0a0a0a; display:block; margin-bottom:8px;">메모 <span style="color:#a3a3a3; font-weight:400;">(선택)</span></label>
      <textarea placeholder="할인 행사 중이었음, 유통기한 짧은 제품..." style="width:100%; height:80px; background:#ffffff; border:1.5px solid #e5e5e5; border-radius:10px; padding:12px 16px; font-size:14px; font-family:Inter, system-ui, sans-serif; outline:none; resize:none; color:#a3a3a3;"></textarea>
    </div>

    <!-- Date -->
    <div style="margin-bottom:32px;">
      <label style="font-size:14px; font-weight:600; color:#0a0a0a; display:block; margin-bottom:8px;">날짜</label>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="flex:1; height:48px; background:#f5f5f5; border-radius:10px; padding:0 16px; display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:15px; font-weight:500;">2026년 5월 10일 (일)</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Submit Button -->
  <div style="padding:0 24px 40px;">
    <button style="width:100%; height:54px; background:#171717; color:#fafafa; border:none; border-radius:12px; font-size:16px; font-weight:600; font-family:Inter, system-ui, sans-serif; cursor:pointer;">
      기록 저장
    </button>
  </div>
</div>
</body>
</html>
