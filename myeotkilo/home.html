<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몇킬로였지 — 홈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 96px; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 24px 20px 12px 20px; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div style="font-size: 24px; line-height: 32px; font-weight: 600; color: #0a0a0a;">몇킬로였지</div>
      <div style="font-size: 14px; line-height: 20px; color: #737373; margin-top: 2px;">파워짐 강남점 · 머신 12개</div>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    </div>
  </div>

  <!-- Search -->
  <div style="padding: 8px 20px 16px 20px;">
    <div style="display: flex; align-items: center; gap: 8px; height: 40px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span style="font-size: 14px; color: #737373;">머신 이름 검색 (예: 랫풀)</span>
    </div>
  </div>

  <!-- Body part filter -->
  <div style="display: flex; gap: 8px; padding: 0 20px 16px 20px; overflow-x: auto;">
    <div style="background: #171717; color: #fafafa; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500; white-space: nowrap;">전체</div>
    <div style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500; white-space: nowrap;">가슴</div>
    <div style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500; white-space: nowrap;">등</div>
    <div style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500; white-space: nowrap;">하체</div>
    <div style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500; white-space: nowrap;">어깨</div>
  </div>

  <!-- Machine cards -->
  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 12px;">

    <!-- Card 1 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/></svg>
          </div>
          <div>
            <div style="font-size: 16px; line-height: 22px; font-weight: 600; color: #0a0a0a;">체스트 프레스</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373; margin-top: 1px;">가슴 · 3일 전 업데이트</div>
          </div>
        </div>
        <div style="background: #f5f5f5; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500; color: #171717;">40kg</div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <div style="flex: 1; background: #f5f5f5; border-radius: 8px; padding: 8px 10px;">
          <div style="font-size: 11px; color: #737373;">시트 높이</div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-top: 1px;">4번</div>
        </div>
        <div style="flex: 1; background: #f5f5f5; border-radius: 8px; padding: 8px 10px;">
          <div style="font-size: 11px; color: #737373;">핀 무게</div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-top: 1px;">40kg</div>
        </div>
        <div style="flex: 1; background: #f5f5f5; border-radius: 8px; padding: 8px 10px;">
          <div style="font-size: 11px; color: #737373;">그립</div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-top: 1px;">중간</div>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/></svg>
          </div>
          <div>
            <div style="font-size: 16px; line-height: 22px; font-weight: 600; color: #0a0a0a;">랫풀다운</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373; margin-top: 1px;">등 · 어제 업데이트</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; background: #f0fdf4; border-radius: 9999px; padding: 2px 10px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m17 7 5 5-5 5"/><path d="M2 12h20"/></svg>
          <span style="font-size: 12px; font-weight: 500; color: #22c55e;">+2.5kg</span>
        </div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <div style="flex: 1; background: #f5f5f5; border-radius: 8px; padding: 8px 10px;">
          <div style="font-size: 11px; color: #737373;">무릎 패드</div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-top: 1px;">3번</div>
        </div>
        <div style="flex: 1; background: #f5f5f5; border-radius: 8px; padding: 8px 10px;">
          <div style="font-size: 11px; color: #737373;">핀 무게</div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-top: 1px;">32.5kg</div>
        </div>
        <div style="flex: 1; background: #f5f5f5; border-radius: 8px; padding: 8px 10px;">
          <div style="font-size: 11px; color: #737373;">그립</div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-top: 1px;">와이드</div>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/></svg>
          </div>
          <div>
            <div style="font-size: 16px; line-height: 22px; font-weight: 600; color: #0a0a0a;">레그 프레스</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373; margin-top: 1px;">하체 · 2주 전 업데이트</div>
          </div>
        </div>
        <div style="background: #f5f5f5; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500; color: #171717;">90kg</div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <div style="flex: 1; background: #f5f5f5; border-radius: 8px; padding: 8px 10px;">
          <div style="font-size: 11px; color: #737373;">등받이</div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-top: 1px;">2단</div>
        </div>
        <div style="flex: 1; background: #f5f5f5; border-radius: 8px; padding: 8px 10px;">
          <div style="font-size: 11px; color: #737373;">플레이트</div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-top: 1px;">90kg</div>
        </div>
        <div style="flex: 1; background: #f5f5f5; border-radius: 8px; padding: 8px 10px;">
          <div style="font-size: 11px; color: #737373;">발 위치</div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-top: 1px;">상단</div>
        </div>
      </div>
    </div>

    <!-- Card 4 (memo only) -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/></svg>
          </div>
          <div>
            <div style="font-size: 16px; line-height: 22px; font-weight: 600; color: #0a0a0a;">숄더 프레스</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373; margin-top: 1px;">어깨 · 시트 6번 · 25kg</div>
          </div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>

  </div>

  <!-- FAB -->
  <div style="position: absolute; bottom: 92px; right: 20px; width: 56px; height: 56px; border-radius: 9999px; background: #171717; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
  </div>

  <!-- Bottom nav -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: #ffffff; border-top: 1px solid #e5e5e5; display: flex; padding-bottom: 20px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #171717;">내 머신</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
      <span style="font-size: 11px; font-weight: 400; color: #a3a3a3;">오늘 루틴</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <span style="font-size: 11px; font-weight: 400; color: #a3a3a3;">설정</span>
    </div>
  </div>

</div>
</body>
</html>
