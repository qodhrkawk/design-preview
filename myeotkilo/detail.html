<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몇킬로였지 — 머신 상세</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 100px; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 24px 20px 16px 20px; display: flex; align-items: center; gap: 12px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    <div style="flex: 1;">
      <div style="font-size: 20px; line-height: 28px; font-weight: 600; color: #0a0a0a;">랫풀다운</div>
      <div style="font-size: 13px; line-height: 18px; color: #737373;">등 · 파워짐 강남점</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
  </div>

  <!-- Photo area -->
  <div style="margin: 0 20px; height: 180px; background: #f5f5f5; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: 1px solid #e5e5e5;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    <span style="font-size: 13px; color: #737373;">머신 사진 (핀 위치가 보이게)</span>
  </div>

  <!-- Current setting — big display -->
  <div style="margin: 16px 20px 0 20px; background: #171717; border-radius: 16px; padding: 24px;">
    <div style="font-size: 13px; font-weight: 500; color: #a3a3a3;">현재 세팅</div>
    <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 8px;">
      <span style="font-size: 44px; line-height: 48px; font-weight: 800; color: #fafafa; letter-spacing: -0.025em;">32.5</span>
      <span style="font-size: 20px; font-weight: 600; color: #a3a3a3;">kg</span>
      <div style="display: flex; align-items: center; gap: 4px; margin-left: auto; background: #262626; border-radius: 9999px; padding: 4px 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        <span style="font-size: 13px; font-weight: 600; color: #22c55e;">+2.5kg</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 20px;">
      <div style="flex: 1; background: #262626; border-radius: 10px; padding: 12px;">
        <div style="font-size: 11px; color: #a3a3a3;">무릎 패드</div>
        <div style="font-size: 18px; font-weight: 600; color: #fafafa; margin-top: 2px;">3번</div>
      </div>
      <div style="flex: 1; background: #262626; border-radius: 10px; padding: 12px;">
        <div style="font-size: 11px; color: #a3a3a3;">그립</div>
        <div style="font-size: 18px; font-weight: 600; color: #fafafa; margin-top: 2px;">와이드</div>
      </div>
      <div style="flex: 1; background: #262626; border-radius: 10px; padding: 12px;">
        <div style="font-size: 11px; color: #a3a3a3;">횟수</div>
        <div style="font-size: 18px; font-weight: 600; color: #fafafa; margin-top: 2px;">10×4</div>
      </div>
    </div>
  </div>

  <!-- Quick adjust -->
  <div style="margin: 16px 20px 0 20px; display: flex; gap: 8px;">
    <div style="flex: 1; height: 48px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
      <span style="font-size: 15px; font-weight: 600; color: #171717;">2.5kg</span>
    </div>
    <div style="flex: 1; height: 48px; background: #171717; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span style="font-size: 15px; font-weight: 600; color: #fafafa;">2.5kg</span>
    </div>
  </div>
  <div style="margin: 8px 20px 0 20px; text-align: center; font-size: 12px; color: #737373;">탭 한 번으로 오늘 무게 업데이트</div>

  <!-- Memo -->
  <div style="margin: 20px 20px 0 20px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 14px 16px; display: flex; gap: 10px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
    <div style="font-size: 14px; line-height: 20px; color: #78350f;">어깨 으쓱하지 말 것. 등 하부 조이는 느낌 유지. 다음엔 35kg 도전.</div>
  </div>

  <!-- History -->
  <div style="margin: 24px 20px 0 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="font-size: 16px; font-weight: 600; color: #0a0a0a;">무게 변화</div>
      <div style="font-size: 13px; color: #737373;">최근 8주</div>
    </div>
    <!-- simple bar chart -->
    <div style="display: flex; align-items: flex-end; gap: 8px; height: 100px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="width: 100%; height: 36px; background: #e5e5e5; border-radius: 4px 4px 0 0;"></div><span style="font-size: 10px; color: #a3a3a3;">25</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="width: 100%; height: 36px; background: #e5e5e5; border-radius: 4px 4px 0 0;"></div><span style="font-size: 10px; color: #a3a3a3;">25</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="width: 100%; height: 44px; background: #d4d4d4; border-radius: 4px 4px 0 0;"></div><span style="font-size: 10px; color: #a3a3a3;">27.5</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="width: 100%; height: 44px; background: #d4d4d4; border-radius: 4px 4px 0 0;"></div><span style="font-size: 10px; color: #a3a3a3;">27.5</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="width: 100%; height: 52px; background: #a3a3a3; border-radius: 4px 4px 0 0;"></div><span style="font-size: 10px; color: #a3a3a3;">30</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="width: 100%; height: 52px; background: #a3a3a3; border-radius: 4px 4px 0 0;"></div><span style="font-size: 10px; color: #a3a3a3;">30</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="width: 100%; height: 52px; background: #a3a3a3; border-radius: 4px 4px 0 0;"></div><span style="font-size: 10px; color: #a3a3a3;">30</span></div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;"><div style="width: 100%; height: 60px; background: #171717; border-radius: 4px 4px 0 0;"></div><span style="font-size: 10px; font-weight: 600; color: #171717;">32.5</span></div>
    </div>
  </div>

  <!-- History log -->
  <div style="margin: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px;">
      <div style="font-size: 14px; color: #0a0a0a;">8월 27일</div>
      <div style="font-size: 14px; font-weight: 600; color: #0a0a0a;">32.5kg <span style="font-weight: 400; color: #22c55e; font-size: 13px;">+2.5</span></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px;">
      <div style="font-size: 14px; color: #0a0a0a;">8월 20일</div>
      <div style="font-size: 14px; font-weight: 600; color: #737373;">30kg</div>
    </div>
  </div>

</div>
</body>
</html>
