<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>안부 — 홈</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;}
  body{background:#f5f5f5;color:#0a0a0a;display:flex;justify-content:center;}
  .app{width:390px;min-height:844px;background:#ffffff;display:flex;flex-direction:column;}
  .status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600;}
  .header{padding:16px 20px 8px;}
  .greet{font-size:14px;color:#737373;margin-bottom:4px;}
  .title{font-size:24px;font-weight:700;letter-spacing:-0.02em;}
  .quote{margin:12px 20px 20px;padding:14px 16px;background:#f5f5f5;border-radius:12px;font-size:13px;color:#525252;line-height:18px;display:flex;gap:10px;align-items:flex-start;}
  .quote svg{flex-shrink:0;margin-top:1px;}
  .section{padding:0 20px;margin-bottom:24px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .section-title{font-size:14px;font-weight:600;color:#0a0a0a;}
  .section-count{font-size:12px;color:#737373;background:#f5f5f5;border-radius:9999px;padding:2px 10px;font-weight:500;}
  .card{background:#ffffff;border:1px solid #e5e5e5;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,0.04);}
  .avatar{width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fafafa;flex-shrink:0;}
  .a1{background:#171717;}
  .a2{background:#3b82f6;}
  .a3{background:#22c55e;}
  .a4{background:#f59e0b;}
  .info{flex:1;min-width:0;}
  .name-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
  .name{font-size:15px;font-weight:600;color:#0a0a0a;}
  .badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:9999px;background:#fef3c7;color:#92400e;}
  .badge.danger{background:#fee2e2;color:#991b1b;}
  .badge.success{background:#dcfce7;color:#166534;}
  .meta{font-size:12px;color:#737373;line-height:16px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .cta{flex-shrink:0;width:36px;height:36px;border-radius:9999px;background:#171717;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}
  .pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
  .pill-row::-webkit-scrollbar{display:none;}
  .pill{flex-shrink:0;padding:8px 14px;border-radius:9999px;background:#f5f5f5;font-size:13px;font-weight:500;color:#525252;border:1px solid transparent;}
  .pill.active{background:#171717;color:#fafafa;}
  .stats{display:flex;gap:10px;padding:0 20px 20px;}
  .stat{flex:1;background:#fafafa;border:1px solid #e5e5e5;border-radius:12px;padding:12px;}
  .stat-num{font-size:20px;font-weight:700;color:#0a0a0a;letter-spacing:-0.02em;}
  .stat-label{font-size:11px;color:#737373;margin-top:2px;}
  .nav{position:sticky;bottom:0;background:#ffffff;border-top:1px solid #e5e5e5;display:flex;padding:8px 0 14px;margin-top:auto;}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#a3a3a3;}
  .nav-item.on{color:#0a0a0a;font-weight:600;}
  .fab{position:fixed;bottom:80px;left:50%;transform:translateX(calc(195px - 80px));width:52px;height:52px;border-radius:9999px;background:#171717;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,0.15);border:none;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <div class="status">
    <span>9:41</span>
    <span style="display:flex;gap:4px;align-items:center;">
      <svg width="16" height="12" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.5"><path d="M2 9h20M2 14h20M2 19h20"/></svg>
    </span>
  </div>

  <div class="header">
    <div class="greet">목요일 오후 · 윤재</div>
    <div class="title">오늘은 3명 챙길 차례야</div>
  </div>

  <div class="quote">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
    <span><b style="color:#0a0a0a;">민지</b>가 6주 전에 이직 소식 알려줬어. 잘 적응했는지 슬쩍 물어보면 좋을 타이밍.</span>
  </div>

  <div class="pill-row" style="padding:0 20px;">
    <div class="pill active">전체</div>
    <div class="pill">가족</div>
    <div class="pill">친구</div>
    <div class="pill">동료</div>
    <div class="pill">멘토</div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">지금 안부 물어볼 사람</div>
      <span class="section-count">3</span>
    </div>

    <div class="card">
      <div class="avatar a2">민</div>
      <div class="info">
        <div class="name-row"><div class="name">김민지</div><span class="badge danger">42일째</span></div>
        <div class="meta">이직 6주차 · 토스 → 당근 · 새 팀 적응 중</div>
      </div>
      <button class="cta" aria-label="안부 보내기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.4"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </div>

    <div class="card">
      <div class="avatar a3">엄</div>
      <div class="info">
        <div class="name-row"><div class="name">엄마</div><span class="badge">9일째</span></div>
        <div class="meta">지난주 무릎 치료 시작 · 결과 안 물어봄</div>
      </div>
      <button class="cta" aria-label="안부 보내기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.4"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </div>

    <div class="card">
      <div class="avatar a4">현</div>
      <div class="info">
        <div class="name-row"><div class="name">박현우</div><span class="badge success">생일 D-3</span></div>
        <div class="meta">대학동기 · 작년엔 짧은 메시지만 보냄</div>
      </div>
      <button class="cta" aria-label="안부 보내기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.4"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">8</div>
      <div class="stat-label">이번 달 챙긴 사람</div>
    </div>
    <div class="stat">
      <div class="stat-num">24</div>
      <div class="stat-label">관리 중인 인맥</div>
    </div>
    <div class="stat">
      <div class="stat-num">12일</div>
      <div class="stat-label">평균 연락 주기</div>
    </div>
  </div>

  <button class="fab" aria-label="새 메모">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.4"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </button>

  <div class="nav">
    <div class="nav-item on">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>홈</span>
    </div>
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>인맥</span>
    </div>
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>일정</span>
    </div>
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
      <span>나</span>
    </div>
  </div>
</div>
</body>
</html>
