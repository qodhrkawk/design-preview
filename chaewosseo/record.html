<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채웠어 — 충전 기록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 120px; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 20px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <span style="font-size: 20px; line-height: 28px; font-weight: 600; color: #0a0a0a;">충전 기록</span>
  </div>

  <!-- Charger preset chips -->
  <div style="padding: 4px 20px 0 20px;">
    <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 10px;">어디서 충전했어?</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 6px; background: #171717; color: #fafafa; border-radius: 9999px; padding: 8px 16px; font-size: 14px; font-weight: 500;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        아파트 완속
      </div>
      <div style="background: #ffffff; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 14px; font-weight: 500;">SK일렉링크</div>
      <div style="background: #ffffff; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 14px; font-weight: 500;">환경부</div>
      <div style="background: #ffffff; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 14px; font-weight: 500;">차지비</div>
      <div style="background: #ffffff; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 14px; font-weight: 500;">에버온</div>
      <div style="display: flex; align-items: center; gap: 4px; background: #ffffff; color: #737373; border: 1px dashed #d4d4d4; border-radius: 9999px; padding: 8px 16px; font-size: 14px; font-weight: 500;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        추가
      </div>
    </div>
  </div>

  <!-- Speed segment -->
  <div style="padding: 24px 20px 0 20px;">
    <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 10px;">충전 방식</div>
    <div style="display: flex; background: #f5f5f5; border-radius: 10px; padding: 4px;">
      <div style="flex: 1; text-align: center; padding: 8px 0; background: #ffffff; border-radius: 8px; font-size: 14px; font-weight: 600; color: #171717; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">완속</div>
      <div style="flex: 1; text-align: center; padding: 8px 0; font-size: 14px; font-weight: 500; color: #737373;">급속</div>
      <div style="flex: 1; text-align: center; padding: 8px 0; font-size: 14px; font-weight: 500; color: #737373;">초급속</div>
    </div>
  </div>

  <!-- kWh + amount inputs -->
  <div style="display: flex; gap: 12px; padding: 24px 20px 0 20px;">
    <div style="flex: 1;">
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">충전량 (kWh)</div>
      <div style="display: flex; align-items: center; border: 1px solid #e5e5e5; border-radius: 8px; padding: 0 12px; height: 52px;">
        <span style="font-size: 20px; font-weight: 600; color: #0a0a0a;">42.1</span>
        <span style="font-size: 14px; color: #737373; margin-left: auto;">kWh</span>
      </div>
    </div>
    <div style="flex: 1;">
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">결제 금액</div>
      <div style="display: flex; align-items: center; border: 1px solid #a3a3a3; border-radius: 8px; padding: 0 12px; height: 52px; box-shadow: 0 0 0 3px rgba(163,163,163,0.15);">
        <span style="font-size: 20px; font-weight: 600; color: #0a0a0a;">5,890</span>
        <span style="font-size: 14px; color: #737373; margin-left: auto;">원</span>
      </div>
    </div>
  </div>

  <!-- Auto unit price -->
  <div style="margin: 12px 20px 0 20px; background: #f5f5f5; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 8px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span style="font-size: 13px; color: #737373;">단가 자동 계산: <span style="font-weight: 600; color: #171717;">140원/kWh</span> — 지난달 평균보다 저렴해</span>
  </div>

  <!-- Odometer -->
  <div style="padding: 24px 20px 0 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-size: 14px; font-weight: 500; color: #0a0a0a;">계기판 주행거리</span>
      <span style="font-size: 12px; color: #737373;">전비 계산에 사용 (선택)</span>
    </div>
    <div style="display: flex; align-items: center; border: 1px solid #e5e5e5; border-radius: 8px; padding: 0 12px; height: 52px;">
      <span style="font-size: 20px; font-weight: 600; color: #0a0a0a;">24,318</span>
      <span style="font-size: 14px; color: #737373; margin-left: auto;">km</span>
    </div>
  </div>

  <!-- Date row -->
  <div style="padding: 24px 20px 0 20px;">
    <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">날짜</div>
    <div style="display: flex; align-items: center; gap: 10px; border: 1px solid #e5e5e5; border-radius: 8px; padding: 0 12px; height: 52px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
      <span style="font-size: 15px; font-weight: 500; color: #0a0a0a;">2026년 9월 4일 (오늘)</span>
      <svg style="margin-left: auto;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
  </div>

  <!-- Save button -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px 32px 20px; background: #ffffff; border-top: 1px solid #e5e5e5;">
    <div style="height: 52px; background: #171717; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span style="font-size: 16px; font-weight: 600; color: #fafafa;">기록 저장</span>
    </div>
  </div>

</div>
</body>
</html>
