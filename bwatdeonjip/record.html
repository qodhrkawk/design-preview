<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>봤던집 — 집 기록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 100px; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e5e5e5;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    <div style="font-size: 20px; line-height: 28px; font-weight: 600; color: #0a0a0a;">집 기록하기</div>
    <span style="margin-left: auto; font-size: 12px; color: #737373;">현장에서 60초 컷</span>
  </div>

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">

    <!-- Basic info -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">별명</div>
      <input value="역 3분 신축 오피스텔" style="width: 100%; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 14px; height: 40px; font-family: inherit; color: #0a0a0a;">
    </div>

    <div style="display: flex; gap: 8px;">
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">보증금 (만원)</div>
        <input value="1,000" style="width: 100%; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 14px; height: 40px; font-family: inherit; color: #0a0a0a;">
      </div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">월세</div>
        <input value="65" style="width: 100%; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 14px; height: 40px; font-family: inherit; color: #0a0a0a;">
      </div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">관리비</div>
        <input value="7" style="width: 100%; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 14px; height: 40px; font-family: inherit; color: #0a0a0a;">
      </div>
    </div>

    <!-- Photos -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">사진</div>
      <div style="display: flex; gap: 8px;">
        <div style="width: 72px; height: 72px; border: 1px dashed #a3a3a3; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          <span style="font-size: 12px; color: #737373;">촬영</span>
        </div>
        <div style="width: 72px; height: 72px; background: #f5f5f5; border-radius: 8px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; color: #737373;">현관</span></div>
        <div style="width: 72px; height: 72px; background: #f5f5f5; border-radius: 8px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; color: #737373;">화장실</span></div>
        <div style="width: 72px; height: 72px; background: #f5f5f5; border-radius: 8px; display: flex; align-items: center; justify-content: center;"><span style="font-size: 12px; color: #737373;">창밖</span></div>
      </div>
      <div style="font-size: 12px; color: #737373; margin-top: 6px;">항목별 가이드 순서로 찍으면 나중에 집끼리 비교가 쉬워요</div>
    </div>

    <!-- Quick check items -->
    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">체크 항목</div>
        <span style="font-size: 12px; color: #737373;">탭 한 번으로 O / △ / X</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">

        <div style="display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px;">
          <span style="font-size: 14px; color: #0a0a0a;">채광 (낮에 불 꺼보기)</span>
          <div style="display: flex; gap: 4px;">
            <span style="width: 32px; height: 32px; background: #22c55e; color: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">O</span>
            <span style="width: 32px; height: 32px; background: #f5f5f5; color: #737373; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">△</span>
            <span style="width: 32px; height: 32px; background: #f5f5f5; color: #737373; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">X</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px;">
          <span style="font-size: 14px; color: #0a0a0a;">수압 (세면대+변기 동시에)</span>
          <div style="display: flex; gap: 4px;">
            <span style="width: 32px; height: 32px; background: #22c55e; color: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">O</span>
            <span style="width: 32px; height: 32px; background: #f5f5f5; color: #737373; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">△</span>
            <span style="width: 32px; height: 32px; background: #f5f5f5; color: #737373; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">X</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px;">
          <span style="font-size: 14px; color: #0a0a0a;">방음 (벽 두드려보기)</span>
          <div style="display: flex; gap: 4px;">
            <span style="width: 32px; height: 32px; background: #f5f5f5; color: #737373; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">O</span>
            <span style="width: 32px; height: 32px; background: #f5f5f5; color: #737373; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">△</span>
            <span style="width: 32px; height: 32px; background: #ef4444; color: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">X</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px;">
          <span style="font-size: 14px; color: #0a0a0a;">곰팡이·결로 (창틀, 벽 모서리)</span>
          <div style="display: flex; gap: 4px;">
            <span style="width: 32px; height: 32px; background: #22c55e; color: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">O</span>
            <span style="width: 32px; height: 32px; background: #f5f5f5; color: #737373; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">△</span>
            <span style="width: 32px; height: 32px; background: #f5f5f5; color: #737373; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">X</span>
          </div>
        </div>

      </div>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 10px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span style="font-size: 12px; color: #3b82f6;">항목 14개 더 · 내 기준에서 편집 가능</span>
      </div>
    </div>

    <!-- One line memo -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">한 줄 느낌</div>
      <input value="밝고 깔끔한데 옆방 소리 들림" style="width: 100%; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 14px; height: 40px; font-family: inherit; color: #0a0a0a;">
    </div>

  </div>

  <!-- Bottom CTA -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px 32px; background: #ffffff; border-top: 1px solid #e5e5e5;">
    <button style="width: 100%; background: #171717; color: #fafafa; border: none; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: 500; font-family: inherit; height: 48px;">저장 — 점수 자동 계산</button>
  </div>

</div>
</body>
</html>
