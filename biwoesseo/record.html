<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>비웠어 - 기록</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#fafafa;display:flex;justify-content:center;min-height:100vh;color:#0a0a0a}
.app{width:390px;background:#ffffff;min-height:100vh;display:flex;flex-direction:column}
.chip{padding:8px 14px;border-radius:9999px;font-size:13px;font-weight:500;border:1px solid #e5e5e5;background:#ffffff;color:#0a0a0a;cursor:pointer}
.chip-active{background:#171717;color:#fafafa;border-color:#171717}
</style></head>
<body>
<div class="app">
  <!-- Header -->
  <div style="padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e5e5e5">
    <div style="width:36px;height:36px;border-radius:9999px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </div>
    <div style="font-size:18px;font-weight:600;letter-spacing:-0.025em">오늘 비운 거</div>
  </div>

  <div style="padding:20px;display:flex;flex-direction:column;gap:20px;flex:1">

    <!-- 카메라 / 한 줄 입력 -->
    <div>
      <div style="font-size:12px;color:#737373;font-weight:500;margin-bottom:8px">뭘 비웠어?</div>
      <div style="padding:14px 14px;border:1px solid #e5e5e5;border-radius:12px;background:#ffffff;display:flex;align-items:center;gap:10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <div style="font-size:14px;color:#0a0a0a;flex:1">검은색 청바지</div>
      </div>
    </div>

    <!-- 처분 방법 -->
    <div>
      <div style="font-size:12px;color:#737373;font-weight:500;margin-bottom:8px">어떻게 처리했어?</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="chip chip-active">
          <span style="display:inline-flex;align-items:center;gap:6px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            기부
          </span>
        </div>
        <div class="chip">판매</div>
        <div class="chip">버림</div>
        <div class="chip">선물</div>
        <div class="chip">교환</div>
      </div>
    </div>

    <!-- 보유 기간 -->
    <div>
      <div style="font-size:12px;color:#737373;font-weight:500;margin-bottom:8px">얼마나 가지고 있었어?</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="chip">1년 미만</div>
        <div class="chip chip-active">1~3년</div>
        <div class="chip">3년 이상</div>
        <div class="chip">기억 안 남</div>
      </div>
    </div>

    <!-- AI 회고 카드 -->
    <div style="padding:16px;background:#171717;color:#fafafa;border-radius:14px">
      <div style="display:flex;align-items:center;gap:6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <div style="font-size:11px;opacity:0.7;font-weight:600;letter-spacing:0.02em">AI 회고 질문</div>
      </div>
      <div style="font-size:15px;font-weight:600;margin-top:10px;line-height:22px">
        살 때는 어떤 기분이었어?<br>비울 때 후회됐어?
      </div>
      <div style="margin-top:12px;padding:12px;background:rgba(255,255,255,0.08);border-radius:10px">
        <textarea placeholder="한 줄로 적어봐" style="width:100%;background:transparent;border:none;color:#fafafa;font-family:inherit;font-size:13px;resize:none;outline:none;min-height:48px" rows="2">3년 안 입었으면 평생 안 입는 거였어</textarea>
      </div>
    </div>

    <!-- 사진 (선택) -->
    <div>
      <div style="font-size:12px;color:#737373;font-weight:500;margin-bottom:8px">사진 (선택)</div>
      <div style="height:100px;border:1.5px dashed #e5e5e5;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fafafa;cursor:pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <div style="font-size:12px;color:#737373;font-weight:500">마지막 모습 한 컷</div>
      </div>
    </div>

  </div>

  <!-- 저장 -->
  <div style="padding:16px 20px 24px;border-top:1px solid #e5e5e5;background:#ffffff">
    <button style="width:100%;background:#171717;color:#fafafa;border:none;border-radius:10px;height:52px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer">
      비웠어, 기록하기
    </button>
  </div>
</div>
</body></html>
