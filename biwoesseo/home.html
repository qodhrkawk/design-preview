<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>비웠어 - 홈</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#fafafa;display:flex;justify-content:center;min-height:100vh;color:#0a0a0a}
.app{width:390px;background:#ffffff;min-height:100vh;display:flex;flex-direction:column}
</style></head>
<body>
<div class="app">
  <!-- Header -->
  <div style="padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-size:12px;color:#737373;font-weight:500">2026년 6월 10일 수요일</div>
      <div style="font-size:24px;font-weight:600;letter-spacing:-0.025em;margin-top:4px">비웠어</div>
    </div>
    <div style="width:40px;height:40px;border-radius:9999px;background:#f5f5f5;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
  </div>

  <!-- Hero Card: 이번달 통계 -->
  <div style="margin:16px 20px 0;padding:20px;background:#171717;color:#fafafa;border-radius:16px">
    <div style="font-size:12px;opacity:0.7;font-weight:500">이번 달 비움</div>
    <div style="display:flex;align-items:baseline;gap:6px;margin-top:6px">
      <div style="font-size:36px;font-weight:800;letter-spacing:-0.025em">23</div>
      <div style="font-size:14px;opacity:0.7">개 정리함</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <div style="flex:1;background:rgba(255,255,255,0.08);border-radius:10px;padding:10px">
        <div style="font-size:11px;opacity:0.6">기부</div>
        <div style="font-size:18px;font-weight:600;margin-top:2px">8</div>
      </div>
      <div style="flex:1;background:rgba(255,255,255,0.08);border-radius:10px;padding:10px">
        <div style="font-size:11px;opacity:0.6">판매</div>
        <div style="font-size:18px;font-weight:600;margin-top:2px">5</div>
      </div>
      <div style="flex:1;background:rgba(255,255,255,0.08);border-radius:10px;padding:10px">
        <div style="font-size:11px;opacity:0.6">버림</div>
        <div style="font-size:18px;font-weight:600;margin-top:2px">10</div>
      </div>
    </div>
  </div>

  <!-- AI 인사이트 -->
  <div style="margin:14px 20px 0;padding:16px;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px">
    <div style="display:flex;align-items:center;gap:6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <div style="font-size:11px;color:#3b82f6;font-weight:600;letter-spacing:0.02em">AI 인사이트</div>
    </div>
    <div style="font-size:14px;font-weight:500;margin-top:8px;line-height:20px">
      "충동구매한 옷"이 가장 빨리 비워져요. 평균 47일.
    </div>
    <div style="font-size:12px;color:#737373;margin-top:6px;line-height:18px">
      이 패턴, 다음 옷 살 때 떠올려볼까요?
    </div>
  </div>

  <!-- 오늘 기록 CTA -->
  <div style="margin:14px 20px 0">
    <button style="width:100%;background:#171717;color:#fafafa;border:none;border-radius:10px;height:52px;font-size:15px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      오늘 비운 거 기록
    </button>
  </div>

  <!-- 최근 비움 -->
  <div style="margin:24px 20px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:16px;font-weight:600">최근 비움</div>
      <div style="font-size:12px;color:#737373">전체 보기</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">

      <!-- Item 1 -->
      <div style="padding:14px;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;display:flex;gap:12px">
        <div style="width:36px;height:36px;border-radius:9999px;background:#dcfce7;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div style="font-size:14px;font-weight:600">검은색 청바지</div>
            <div style="font-size:11px;color:#737373">2시간 전</div>
          </div>
          <div style="font-size:12px;color:#737373;margin-top:2px">기부 · 보유 421일</div>
          <div style="font-size:13px;margin-top:6px;line-height:18px;color:#404040">"3년 안 입었으면 평생 안 입는 거였어"</div>
        </div>
      </div>

      <!-- Item 2 -->
      <div style="padding:14px;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;display:flex;gap:12px">
        <div style="width:36px;height:36px;border-radius:9999px;background:#fef3c7;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div style="font-size:14px;font-weight:600">에어팟 1세대</div>
            <div style="font-size:11px;color:#737373">어제</div>
          </div>
          <div style="font-size:12px;color:#737373;margin-top:2px">판매 · 35,000원</div>
          <div style="font-size:13px;margin-top:6px;line-height:18px;color:#404040">"배터리 다 됐는데 미련 남았었지"</div>
        </div>
      </div>

      <!-- Item 3 -->
      <div style="padding:14px;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;display:flex;gap:12px">
        <div style="width:36px;height:36px;border-radius:9999px;background:#fee2e2;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14H7L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div style="font-size:14px;font-weight:600">서랍 속 잡템 7개</div>
            <div style="font-size:11px;color:#737373">3일 전</div>
          </div>
          <div style="font-size:12px;color:#737373;margin-top:2px">버림</div>
          <div style="font-size:13px;margin-top:6px;line-height:18px;color:#404040">"왜 모아뒀는지 기억도 안 남"</div>
        </div>
      </div>

    </div>
  </div>

  <!-- Tab bar spacer -->
  <div style="height:80px"></div>

  <!-- Bottom Nav -->
  <div style="position:sticky;bottom:0;background:#ffffff;border-top:1px solid #e5e5e5;display:flex;padding:10px 20px 20px;margin-top:auto">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <div style="font-size:10px;font-weight:600;color:#171717">홈</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <div style="font-size:10px;font-weight:500;color:#a3a3a3">기록</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <div style="font-size:10px;font-weight:500;color:#a3a3a3">통계</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <div style="font-size:10px;font-weight:500;color:#a3a3a3">내정보</div>
    </div>
  </div>
</div>
</body></html>
