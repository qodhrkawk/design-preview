<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stanto — 설정</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;display:flex;justify-content:center;min-height:100vh;}
.mobile-frame{width:100%;max-width:390px;min-height:100vh;background:#fafafa;padding-bottom:40px;position:relative;}
.section-label{font-size:11px;font-weight:700;color:#737373;text-transform:uppercase;letter-spacing:.05em;padding:0 20px 10px;margin-top:24px;}
.list{background:#fff;border:1px solid #e5e5e5;border-radius:16px;margin:0 16px;overflow:hidden;}
.row{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f5f5f5;}
.row:last-child{border-bottom:none;}
.row-label{font-size:14px;font-weight:500;color:#0a0a0a;}
.row-value{font-size:14px;color:#737373;font-weight:500;}
.toggle{width:44px;height:26px;background:#0a0a0a;border-radius:9999px;position:relative;cursor:pointer;flex-shrink:0;}
.toggle::after{content:'';position:absolute;top:2px;right:2px;width:22px;height:22px;background:#fff;border-radius:9999px;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.off{background:#d4d4d4;}
.toggle.off::after{right:auto;left:2px;}
.seg{display:flex;background:#f5f5f5;border-radius:10px;padding:3px;margin:0 16px;}
.seg > div{flex:1;text-align:center;padding:8px 0;font-size:12px;font-weight:600;color:#737373;border-radius:7px;cursor:pointer;}
.seg > div.on{background:#fff;color:#0a0a0a;box-shadow:0 1px 3px rgba(0,0,0,.08);}
</style>
</head>
<body>
<div class="mobile-frame">
<div style="height:48px;"></div>

<!-- Header -->
<div style="padding:8px 16px 16px;display:flex;justify-content:space-between;align-items:center;">
  <button style="width:40px;height:40px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0a0a0a;">
    <span style="display:inline-flex;width:22px;height:22px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
  </button>
  <p style="font-size:15px;font-weight:600;color:#0a0a0a;">설정</p>
  <div style="width:40px;"></div>
</div>

<!-- Profile -->
<div style="padding:8px 16px 8px;">
  <div style="background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center;">
    <div style="width:56px;height:56px;border-radius:9999px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;flex-shrink:0;">Y</div>
    <div style="flex:1;min-width:0;">
      <p style="font-size:16px;font-weight:700;color:#0a0a0a;margin-bottom:2px;">윤재</p>
      <p style="font-size:12px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">qodhrkawk@gmail.com</p>
    </div>
  </div>
</div>
<!-- Notifications -->
<p class="section-label">알림</p>
<div class="list">
  <div class="row">
    <div>
      <p class="row-label">스탠드업 알림</p>
      <p style="font-size:11px;color:#a3a3a3;margin-top:2px;">매일 아침 조용히 알려드려요</p>
    </div>
    <div class="toggle"></div>
  </div>
  <div class="row">
    <p class="row-label">알림 시간</p>
    <p class="row-value">09:00 →</p>
  </div>
</div>

<!-- 주 시작 요일 -->
<p class="section-label">주 시작 요일</p>
<div class="seg">
  <div class="on">월</div>
  <div>화</div>
  <div>수</div>
  <div>목</div>
  <div>금</div>
  <div>토</div>
  <div>일</div>
</div>
<p style="font-size:11px;color:#a3a3a3;padding:8px 20px 0;">변경 시 다음 주부터 적용돼요</p>

<!-- 계정 -->
<p class="section-label">계정</p>
<div class="list">
  <div class="row" style="cursor:pointer;">
    <p class="row-label">로그아웃</p>
    <span style="display:inline-flex;width:16px;height:16px;color:#a3a3a3;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
  </div>
  <div class="row" style="cursor:pointer;">
    <p class="row-label" style="color:#ef4444;">계정 삭제</p>
    <span style="display:inline-flex;width:16px;height:16px;color:#fca5a5;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
  </div>
</div>

<!-- 앱 정보 -->
<p class="section-label">앱 정보</p>
<div class="list">
  <div class="row">
    <p class="row-label">버전</p>
    <p class="row-value">v1.0.0</p>
  </div>
  <div class="row" style="cursor:pointer;">
    <p class="row-label">이용약관</p>
    <span style="display:inline-flex;width:14px;height:14px;color:#a3a3a3;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>
  </div>
  <div class="row" style="cursor:pointer;">
    <p class="row-label">개인정보처리방침</p>
    <span style="display:inline-flex;width:14px;height:14px;color:#a3a3a3;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>
  </div>
</div>

<p style="text-align:center;font-size:11px;color:#a3a3a3;padding:32px 0 20px;">Stanto · Made with ☕ in Seoul</p>

</div>
</body>
</html>
