<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stanto — 스탠드업 대화</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #f5f5f5;
    color: #0a0a0a;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    min-height: 100vh;
    background: #fafafa;
    position: relative;
    overflow-x: hidden;
    padding-bottom: 120px;
  }
</style>
</head>
<body>
  <div class="phone">
    <!-- Status bar -->
    <div style="height:54px;padding:14px 24px 0;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;">
      <span>9:43</span>
      <span>●●● 🔋</span>
    </div>

    <!-- Nav header -->
    <div style="padding:12px 20px 16px;display:flex;align-items:center;justify-content:space-between;background:#fafafa;border-bottom:1px solid #e5e5e5;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:22px;color:#0a0a0a;">←</span>
        <div>
          <div style="font-size:15px;font-weight:600;">Stanto</div>
          <div style="font-size:11px;color:#22c55e;display:flex;align-items:center;gap:4px;">
            <span style="width:6px;height:6px;background:#22c55e;border-radius:9999px;"></span>
            스탠드업 진행 중
          </div>
        </div>
      </div>
      <span style="font-size:12px;color:#737373;">03:12</span>
    </div>

    <!-- Chat stream -->
    <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:14px;">

      <!-- Date chip -->
      <div style="align-self:center;background:#ffffff;border:1px solid #e5e5e5;border-radius:9999px;padding:4px 12px;font-size:11px;color:#737373;font-weight:500;">화요일 · 아침 9:40</div>

      <!-- AI Bubble -->
      <div style="align-self:flex-start;max-width:80%;">
        <div style="background:#ffffff;border:1px solid #e5e5e5;border-radius:16px 16px 16px 4px;padding:14px 16px;font-size:14px;line-height:21px;">
          좋은 아침! ☀️ 어제는 OAuth 리팩터링 1/3, 토큰 정리, 배포 파이프라인까지 3개 마쳤어. <br>랜딩 카피는 못 끝냈던데 — 오늘 이어갈까 아니면 OAuth 2/3 먼저 치울까?
        </div>
        <div style="font-size:10px;color:#a3a3a3;margin-top:4px;margin-left:6px;">Stanto · 9:40</div>
      </div>

      <!-- User Bubble -->
      <div style="align-self:flex-end;max-width:80%;">
        <div style="background:#0a0a0a;color:#fafafa;border-radius:16px 16px 4px 16px;padding:14px 16px;font-size:14px;line-height:21px;">
          OAuth 2/3 먼저. 오전 집중해서 끝내고 싶어
        </div>
        <div style="font-size:10px;color:#a3a3a3;margin-top:4px;margin-right:6px;text-align:right;">9:41</div>
      </div>

      <!-- AI Bubble with task extraction -->
      <div style="align-self:flex-start;max-width:88%;">
        <div style="background:#ffffff;border:1px solid #e5e5e5;border-radius:16px 16px 16px 4px;padding:14px 16px;font-size:14px;line-height:21px;">
          좋아, 오늘 할 일 정리했어 👇
        </div>
        <!-- Extracted task card -->
        <div style="background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;margin-top:8px;overflow:hidden;">
          <div style="padding:14px 16px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:10px;">
            <div style="width:24px;height:24px;border-radius:6px;background:#eff6ff;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;">1</div>
            <div style="flex:1;">
              <div style="font-size:14px;font-weight:600;">OAuth 리팩터링 2/3</div>
              <div style="font-size:11px;color:#737373;margin-top:2px;">오전 집중 • 예상 3h</div>
            </div>
          </div>
          <div style="padding:14px 16px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:10px;">
            <div style="width:24px;height:24px;border-radius:6px;background:#f5f5f5;color:#737373;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;">2</div>
            <div style="flex:1;">
              <div style="font-size:14px;font-weight:600;">랜딩 카피 초안 (이월)</div>
              <div style="font-size:11px;color:#737373;margin-top:2px;">오후 • 예상 1.5h</div>
            </div>
          </div>
          <div style="padding:12px 16px;display:flex;gap:8px;">
            <button style="flex:1;background:#0a0a0a;color:#fafafa;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;">확정</button>
            <button style="background:#ffffff;color:#0a0a0a;border:1px solid #e5e5e5;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:500;cursor:pointer;">+ 추가</button>
          </div>
        </div>
        <div style="font-size:10px;color:#a3a3a3;margin-top:4px;margin-left:6px;">Stanto · 9:42</div>
      </div>

      <!-- Typing indicator -->
      <div style="align-self:flex-start;">
        <div style="background:#ffffff;border:1px solid #e5e5e5;border-radius:16px;padding:12px 14px;display:flex;gap:4px;">
          <span style="width:6px;height:6px;background:#a3a3a3;border-radius:9999px;"></span>
          <span style="width:6px;height:6px;background:#a3a3a3;border-radius:9999px;opacity:0.6;"></span>
          <span style="width:6px;height:6px;background:#a3a3a3;border-radius:9999px;opacity:0.3;"></span>
        </div>
      </div>
    </div>

    <!-- Input bar -->
    <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:390px;background:#ffffff;border-top:1px solid #e5e5e5;padding:12px 16px 28px;">
      <div style="display:flex;align-items:center;gap:10px;background:#f5f5f5;border-radius:9999px;padding:6px 6px 6px 18px;">
        <input style="flex:1;background:transparent;border:none;outline:none;font-size:14px;font-family:inherit;color:#0a0a0a;" placeholder="대답하거나, 할 일을 적어봐">
        <button style="width:36px;height:36px;border:none;border-radius:9999px;background:#ffffff;color:#0a0a0a;font-size:15px;cursor:pointer;">🎙️</button>
        <button style="width:36px;height:36px;border:none;border-radius:9999px;background:#0a0a0a;color:#fafafa;font-size:15px;cursor:pointer;">↑</button>
      </div>
    </div>
  </div>
</body>
</html>
