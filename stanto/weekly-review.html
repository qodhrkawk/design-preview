<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stanto — 주간 회고</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#fafafa;display:flex;justify-content:center;min-height:100vh;}
.mobile-frame{width:100%;max-width:390px;min-height:100vh;background:#fafafa;padding-bottom:96px;position:relative;}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:20px;margin-bottom:12px;}
.section-title{font-size:12px;font-weight:600;color:#737373;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;}
</style>
</head>
<body>
<div class="mobile-frame">
<div style="height:48px;"></div>

<!-- Header -->
<div style="padding:8px 16px 8px;display:flex;justify-content:space-between;align-items:center;">
  <button style="width:40px;height:40px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0a0a0a;">
    <span style="display:inline-flex;width:22px;height:22px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
  </button>
  <p style="font-size:15px;font-weight:600;color:#0a0a0a;">주간 회고</p>
  <button style="width:40px;height:40px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#a3a3a3;">
    <span style="display:inline-flex;width:20px;height:20px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg></span>
  </button>
</div>

<!-- Date range -->
<div style="padding:4px 16px 20px;text-align:center;">
  <p style="font-size:13px;color:#737373;font-weight:500;">3월 31일(월) ~ 4월 6일(일)</p>
  <h1 style="font-size:30px;line-height:36px;font-weight:800;letter-spacing:-0.025em;color:#0a0a0a;margin-top:4px;">6주차 회고</h1>
</div>

<div style="padding:0 16px;">

  <!-- 완료율 카드 -->
  <div class="card">
    <p class="section-title">이번 주 완료율</p>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:16px;">
      <span style="font-size:44px;font-weight:800;color:#0a0a0a;letter-spacing:-.03em;line-height:1;">67</span>
      <span style="font-size:20px;font-weight:700;color:#0a0a0a;">%</span>
      <span style="font-size:13px;color:#737373;font-weight:500;margin-left:6px;">20개 중 13개</span>
    </div>
    <div style="height:10px;background:#f5f5f5;border-radius:9999px;overflow:hidden;">
      <div style="width:67%;height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:9999px;"></div>
    </div>
    <div style="display:flex;gap:6px;margin-top:14px;">
      <div style="flex:1;height:28px;background:#f0fdf4;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#15803d;">월</div>
      <div style="flex:1;height:28px;background:#dcfce7;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#166534;">화</div>
      <div style="flex:1;height:28px;background:#f0fdf4;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#15803d;">수</div>
      <div style="flex:1;height:28px;background:#dcfce7;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#166534;">목</div>
      <div style="flex:1;height:28px;background:#f5f5f5;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#a3a3a3;">금</div>
      <div style="flex:1;height:28px;background:#f0fdf4;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#15803d;">토</div>
      <div style="flex:1;height:28px;background:#f5f5f5;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#a3a3a3;">일</div>
    </div>
  </div>

  <!-- 프로젝트 분배 -->
  <div class="card">
    <p class="section-title">프로젝트 분배</p>

    <div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="display:inline-flex;width:18px;height:18px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
          <p style="font-size:13px;font-weight:600;color:#0a0a0a;">사이드앱</p>
        </div>
        <p style="font-size:12px;font-weight:700;color:#3b82f6;">45% · 9개</p>
      </div>
      <div style="height:6px;background:#eff6ff;border-radius:9999px;overflow:hidden;">
        <div style="width:45%;height:100%;background:#3b82f6;border-radius:9999px;"></div>
      </div>
    </div>

    <div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="display:inline-flex;width:18px;height:18px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></span>
          <p style="font-size:13px;font-weight:600;color:#0a0a0a;">본업</p>
        </div>
        <p style="font-size:12px;font-weight:700;color:#22c55e;">40% · 8개</p>
      </div>
      <div style="height:6px;background:#f0fdf4;border-radius:9999px;overflow:hidden;">
        <div style="width:40%;height:100%;background:#22c55e;border-radius:9999px;"></div>
      </div>
    </div>

    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="display:inline-flex;width:18px;height:18px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
          <p style="font-size:13px;font-weight:600;color:#0a0a0a;">블로그</p>
        </div>
        <p style="font-size:12px;font-weight:700;color:#8b5cf6;">15% · 3개</p>
      </div>
      <div style="height:6px;background:#f5f3ff;border-radius:9999px;overflow:hidden;">
        <div style="width:15%;height:100%;background:#8b5cf6;border-radius:9999px;"></div>
      </div>
    </div>
  </div>
  <!-- AI 인사이트 카드 -->
  <div class="card" style="background:linear-gradient(180deg,#fafafa,#fff);border:1px solid #e5e5e5;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
      <div style="width:28px;height:28px;background:#fef3c7;border-radius:8px;display:flex;align-items:center;justify-content:center;"><span style="display:inline-flex;width:16px;height:16px;color:#d97706;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span></div>
      <p style="font-size:13px;font-weight:700;color:#0a0a0a;text-transform:uppercase;letter-spacing:.05em;">이번 주 인사이트</p>
    </div>

    <div style="margin-bottom:14px;padding:14px;background:#fafafa;border:1px solid #f5f5f5;border-radius:12px;">
      <p style="font-size:14px;line-height:22px;color:#0a0a0a;font-weight:500;">사이드앱이 <strong style="color:#3b82f6;">디자인 단계로 넘어갔어요</strong> 이번 주 가장 큰 진전이에요.</p>
    </div>

    <div style="margin-bottom:18px;padding:14px;background:#fafafa;border:1px solid #f5f5f5;border-radius:12px;">
      <p style="font-size:14px;line-height:22px;color:#0a0a0a;font-weight:500;"><strong>화요일, 목요일</strong>에 완료율이 특히 높았어요. 오전 집중이 잘 된 날이에요.</p>
    </div>

    <div style="border-top:1px dashed #e5e5e5;padding-top:16px;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
        <span style="display:inline-flex;width:16px;height:16px;color:#737373;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M M17 19h4"/></svg></span>
        <p style="font-size:12px;font-weight:700;color:#737373;text-transform:uppercase;letter-spacing:.05em;">다음 주 집중 포인트</p>
      </div>
      <p style="font-size:14px;line-height:22px;color:#0a0a0a;font-weight:500;">API 연동을 마무리하면 <strong>QA 단계 진입</strong>이 가능해요.</p>
    </div>
  </div>

  <!-- 스탠드업 기록 (접이식) -->
  <button style="width:100%;background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:16px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="display:inline-flex;width:18px;height:18px;color:#737373;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></span>
      <p style="font-size:14px;font-weight:600;color:#0a0a0a;">이번 주 스탠드업 기록 보기</p>
    </div>
    <span style="display:inline-flex;width:16px;height:16px;color:#737373;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
  </button>

</div>

<!-- Tab bar -->
<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;height:72px;background:#fff;border-top:1px solid #e5e5e5;display:flex;align-items:center;padding:0 16px;">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:500;">오늘</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:500;">프로젝트</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#0a0a0a;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16V9"/><path d="M12 16V5"/><path d="M17 16v-3"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:600;">회고</span>
  </div>
</div>

</div>
</body>
</html>
