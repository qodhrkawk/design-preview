<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stanto — 프로젝트 목록</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;display:flex;justify-content:center;min-height:100vh;}
.mobile-frame{width:100%;max-width:390px;min-height:100vh;background:#fff;padding-bottom:96px;position:relative;}
.pcard{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:18px;margin-bottom:12px;}
.pchip{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:9999px;}
</style>
</head>
<body>
<div class="mobile-frame">
<div style="height:48px;"></div>
<div style="padding:8px 16px 20px;display:flex;justify-content:space-between;align-items:center;">
  <h1 style="font-size:30px;line-height:36px;font-weight:600;letter-spacing:-0.025em;color:#0a0a0a;">프로젝트</h1>
  <button style="width:40px;height:40px;background:#0a0a0a;border:none;border-radius:9999px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
    <span style="display:inline-flex;width:18px;height:18px;color:#fafafa;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>
  </button>
</div>
<div style="padding:0 16px;">

<!-- Card 1: 사이드앱 -->
<div class="pcard" style="border-left:3px solid #3b82f6;">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;">
    <div style="display:flex;gap:12px;align-items:center;min-width:0;flex:1;">
      <div style="width:44px;height:44px;background:#eff6ff;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><span style="display:inline-flex;width:22px;height:22px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span></div>
      <div style="min-width:0;flex:1;">
        <p style="font-size:16px;font-weight:700;color:#0a0a0a;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Stanto 사이드앱</p>
        <span class="pchip" style="background:#eff6ff;color:#1d4ed8;">디자인</span>
      </div>
    </div>
    <div style="text-align:right;flex-shrink:0;">
      <p style="font-size:18px;font-weight:800;color:#0a0a0a;line-height:1;">2/4</p>
      <p style="font-size:11px;color:#737373;margin-top:2px;">오늘</p>
    </div>
  </div>
  <p style="font-size:13px;color:#737373;margin-bottom:14px;line-height:18px;">4월 안에 MVP 출시</p>
  <div style="display:flex;gap:4px;align-items:center;">
    <div style="flex:1;height:4px;background:#dbeafe;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#3b82f6;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#e5e5e5;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#e5e5e5;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#e5e5e5;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#e5e5e5;border-radius:9999px;"></div>
  </div>
  <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#a3a3a3;font-weight:500;">
    <span>기획</span><span style="color:#3b82f6;font-weight:700;">디자인</span><span>개발</span><span>QA</span><span>출시</span><span>운영</span>
  </div>
</div>

<!-- Card 2: 본업 -->
<div class="pcard" style="border-left:3px solid #22c55e;">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;">
    <div style="display:flex;gap:12px;align-items:center;min-width:0;flex:1;">
      <div style="width:44px;height:44px;background:#f0fdf4;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><span style="display:inline-flex;width:22px;height:22px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></span></div>
      <div style="min-width:0;flex:1;">
        <p style="font-size:16px;font-weight:700;color:#0a0a0a;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">본업 스프린트</p>
        <span class="pchip" style="background:#f0fdf4;color:#15803d;">개발</span>
      </div>
    </div>
    <div style="text-align:right;flex-shrink:0;">
      <p style="font-size:18px;font-weight:800;color:#0a0a0a;line-height:1;">0/2</p>
      <p style="font-size:11px;color:#737373;margin-top:2px;">오늘</p>
    </div>
  </div>
  <p style="font-size:13px;color:#737373;margin-bottom:14px;line-height:18px;">Q2 스프린트 완주</p>
  <div style="display:flex;gap:4px;align-items:center;">
    <div style="flex:1;height:4px;background:#dcfce7;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#dcfce7;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#22c55e;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#e5e5e5;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#e5e5e5;border-radius:9999px;"></div>
  </div>
  <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#a3a3a3;font-weight:500;">
    <span>기획</span><span>디자인</span><span style="color:#22c55e;font-weight:700;">개발</span><span>QA</span><span>출시</span>
  </div>
</div>

<!-- Card 3: 블로그 -->
<div class="pcard" style="border-left:3px solid #8b5cf6;">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;">
    <div style="display:flex;gap:12px;align-items:center;min-width:0;flex:1;">
      <div style="width:44px;height:44px;background:#f5f3ff;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><span style="display:inline-flex;width:22px;height:22px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span></div>
      <div style="min-width:0;flex:1;">
        <p style="font-size:16px;font-weight:700;color:#0a0a0a;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">개발 블로그</p>
        <span class="pchip" style="background:#f5f3ff;color:#6d28d9;">연재</span>
      </div>
    </div>
    <div style="text-align:right;flex-shrink:0;">
      <p style="font-size:18px;font-weight:800;color:#0a0a0a;line-height:1;">1/1</p>
      <p style="font-size:11px;color:#22c55e;margin-top:2px;font-weight:600;">완료 ✓</p>
    </div>
  </div>
  <p style="font-size:13px;color:#737373;margin-bottom:14px;line-height:18px;">월 2편 발행</p>
  <div style="display:flex;gap:4px;align-items:center;">
    <div style="flex:1;height:4px;background:#ede9fe;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#8b5cf6;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#e5e5e5;border-radius:9999px;"></div>
    <div style="flex:1;height:4px;background:#e5e5e5;border-radius:9999px;"></div>
  </div>
  <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#a3a3a3;font-weight:500;">
    <span>기획</span><span style="color:#8b5cf6;font-weight:700;">연재</span><span>정리</span><span>아카이브</span>
  </div>
</div>

</div>
<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;height:72px;background:#fff;border-top:1px solid #e5e5e5;display:flex;align-items:center;padding:0 16px;">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:500;">오늘</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#0a0a0a;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:600;">프로젝트</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16V9"/><path d="M12 16V5"/><path d="M17 16v-3"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:500;">회고</span>
  </div>
</div>
</div>
</body>
</html>
