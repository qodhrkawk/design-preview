<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stanto — 프로젝트 상세</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;display:flex;justify-content:center;min-height:100vh;}
.mobile-frame{width:100%;max-width:390px;min-height:100vh;background:#fafafa;padding-bottom:96px;position:relative;}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:18px;margin-bottom:12px;}
.section-title{font-size:12px;font-weight:600;color:#737373;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
</style>
</head>
<body>
<div class="mobile-frame">
<div style="height:48px;"></div>

<!-- Header -->
<div style="padding:8px 16px 16px;display:flex;justify-content:space-between;align-items:center;">
  <button style="width:40px;height:40px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0a0a0a;">
    <span style="display:inline-flex;width:22px;height:22px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
  </button>
  <p style="font-size:15px;font-weight:600;color:#0a0a0a;">Stanto 사이드앱</p>
  <button style="width:40px;height:40px;background:transparent;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#0a0a0a;">
    <span style="display:inline-flex;width:22px;height:22px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></span>
  </button>
</div>

<!-- Summary Card -->
<div style="padding:0 16px;">
<div class="card" style="display:flex;gap:14px;align-items:center;">
  <div style="width:56px;height:56px;background:#eff6ff;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><span style="display:inline-flex;width:28px;height:28px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span></div>
  <div style="flex:1;min-width:0;">
    <p style="font-size:18px;font-weight:700;color:#0a0a0a;margin-bottom:4px;">Stanto 사이드앱</p>
    <p style="font-size:13px;color:#737373;line-height:18px;">4월 안에 MVP 출시</p>
    <p style="font-size:11px;color:#a3a3a3;margin-top:6px;">2026.04.05 시작 · 오늘 업데이트</p>
  </div>
</div>
</div>
<!-- 단계 진행도 바 -->
<div style="padding:0 16px;">
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <p class="section-title" style="margin:0;">단계 진행</p>
    <button style="font-size:12px;font-weight:600;color:#3b82f6;background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;">
      <span style="display:inline-flex;width:12px;height:12px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg></span>
      피봇하기
    </button>
  </div>

  <!-- Progress Rail -->
  <div style="position:relative;padding:24px 0 8px;">
    <div style="position:absolute;left:12px;right:12px;top:32px;height:3px;background:#e5e5e5;border-radius:9999px;"></div>
    <div style="position:absolute;left:12px;width:calc((100% - 24px) / 5 * 2);top:32px;height:3px;background:#3b82f6;border-radius:9999px;"></div>
    <div style="display:flex;justify-content:space-between;position:relative;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
        <div style="width:24px;height:24px;background:#3b82f6;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;">
          <span style="display:inline-flex;width:12px;height:12px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </div>
        <p style="font-size:10px;font-weight:600;color:#737373;">기획</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
        <div style="width:24px;height:24px;background:#3b82f6;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;">
          <span style="display:inline-flex;width:12px;height:12px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </div>
        <p style="font-size:10px;font-weight:600;color:#737373;">디자인</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
        <div style="width:32px;height:32px;background:#fff;border:3px solid #3b82f6;border-radius:9999px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #eff6ff;margin-top:-4px;margin-bottom:-4px;">
          <div style="width:10px;height:10px;background:#3b82f6;border-radius:9999px;"></div>
        </div>
        <p style="font-size:11px;font-weight:800;color:#3b82f6;">개발</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
        <div style="width:24px;height:24px;background:#fff;border:2px solid #e5e5e5;border-radius:9999px;"></div>
        <p style="font-size:10px;font-weight:500;color:#a3a3a3;">QA</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
        <div style="width:24px;height:24px;background:#fff;border:2px solid #e5e5e5;border-radius:9999px;"></div>
        <p style="font-size:10px;font-weight:500;color:#a3a3a3;">출시</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;">
        <div style="width:24px;height:24px;background:#fff;border:2px solid #e5e5e5;border-radius:9999px;"></div>
        <p style="font-size:10px;font-weight:500;color:#a3a3a3;">운영</p>
      </div>
    </div>
  </div>
  <p style="font-size:11px;color:#a3a3a3;text-align:center;margin-top:12px;">단계를 탭해서 변경할 수 있어요</p>
</div>
</div>
<!-- 이번 주 요약 -->
<div style="padding:0 16px;">
<div class="card">
  <p class="section-title">이번 주 진행</p>
  <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px;">
    <span style="font-size:32px;font-weight:800;color:#0a0a0a;letter-spacing:-.025em;line-height:1;">12</span>
    <span style="font-size:16px;color:#737373;font-weight:500;">/ 18 완료</span>
  </div>
  <div style="height:8px;background:#f5f5f5;border-radius:9999px;overflow:hidden;">
    <div style="width:66%;height:100%;background:#3b82f6;border-radius:9999px;"></div>
  </div>
</div>
</div>

<!-- 최근 히스토리 -->
<div style="padding:0 16px 16px;">
<div class="card" style="padding:18px 18px 8px;">
  <p class="section-title" style="margin-bottom:14px;">최근 완료</p>

  <p style="font-size:11px;font-weight:600;color:#a3a3a3;margin:0 0 8px;">4월 10일</p>
  <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5;">
    <div style="width:18px;height:18px;background:#22c55e;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <span style="display:inline-flex;width:11px;height:11px;color:#fff;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    </div>
    <p style="font-size:13px;color:#0a0a0a;flex:1;font-weight:500;">홈 화면 와이어 정리</p>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5;">
    <div style="width:18px;height:18px;background:#22c55e;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <span style="display:inline-flex;width:11px;height:11px;color:#fff;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    </div>
    <p style="font-size:13px;color:#0a0a0a;flex:1;font-weight:500;">PRD 초안 작성</p>
  </div>

  <p style="font-size:11px;font-weight:600;color:#a3a3a3;margin:14px 0 8px;">4월 9일</p>
  <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5;">
    <div style="width:18px;height:18px;background:#22c55e;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <span style="display:inline-flex;width:11px;height:11px;color:#fff;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    </div>
    <p style="font-size:13px;color:#0a0a0a;flex:1;font-weight:500;">경쟁 앱 리서치</p>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:8px 0;">
    <div style="width:18px;height:18px;background:#f5f5f5;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <span style="display:inline-flex;width:11px;height:11px;color:#a3a3a3;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
    </div>
    <p style="font-size:13px;color:#a3a3a3;flex:1;font-weight:500;text-decoration:line-through;">유사 서비스 분석</p>
  </div>
</div>
</div>

<!-- 피봇 히스토리 -->
<div style="padding:0 16px;">
<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;">
  <span style="display:inline-flex;width:16px;height:16px;flex-shrink:0;color:#92400e;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></span>
  <div style="flex:1;">
    <p style="font-size:12px;color:#92400e;font-weight:600;margin-bottom:2px;">3월 15일 피봇</p>
    <p style="font-size:12px;color:#b45309;line-height:17px;">기획 → 디자인으로 전환 (사유: MVP 스코프 축소)</p>
  </div>
</div>
</div>
<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;height:72px;background:#fff;border-top:1px solid #e5e5e5;display:flex;align-items:center;padding:0 16px;">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:500;">오늘</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#0a0a0a;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:600;">프로젝트</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16V9"/><path d="M12 16V5"/><path d="M17 16v-3"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:500;">회고</span>
  </div>
</div>
</div>
</body>
</html>
