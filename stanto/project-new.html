<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stanto — 새 프로젝트</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#fafafa;display:flex;justify-content:center;min-height:100vh;}
.mobile-frame{width:100%;max-width:390px;min-height:100vh;background:#fafafa;position:relative;}
.section-title{font-size:12px;font-weight:600;color:#737373;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.input{width:100%;background:#fff;border:1.5px solid #e5e5e5;border-radius:14px;padding:16px;font-size:15px;font-weight:500;color:#0a0a0a;font-family:inherit;outline:none;}
.input::placeholder{color:#a3a3a3;font-weight:400;}
.tpl-card{background:#fff;border:1.5px solid #e5e5e5;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;}
.tpl-card.on{border-color:#0a0a0a;border-width:2px;background:#fff;}
.chip{display:inline-flex;align-items:center;background:#fff;border:1.5px solid #e5e5e5;border-radius:9999px;padding:9px 16px;font-size:13px;font-weight:600;color:#737373;white-space:nowrap;flex-shrink:0;cursor:pointer;}
.chip.on{background:#0a0a0a;color:#fff;border-color:#0a0a0a;}
</style>
</head>
<body>
<div class="mobile-frame">
<div style="height:48px;"></div>

<!-- Header -->
<div style="padding:8px 16px 16px;display:flex;justify-content:space-between;align-items:center;">
  <button style="background:none;border:none;font-size:15px;font-weight:500;color:#737373;cursor:pointer;padding:8px 4px;">취소</button>
  <p style="font-size:15px;font-weight:600;color:#0a0a0a;">새 프로젝트</p>
  <button style="background:none;border:none;font-size:15px;font-weight:700;color:#0a0a0a;cursor:pointer;padding:8px 4px;">만들기</button>
</div>

<!-- Form -->
<div style="padding:8px 16px 32px;">

  <!-- 프로젝트 이름 -->
  <div style="margin-bottom:24px;">
    <p class="section-title">프로젝트 이름</p>
    <input class="input" placeholder="예: 앱 사이드, 유튜브 채널" maxlength="30" value="Stanto 사이드앱">
  </div>

  <!-- 한줄 목표 -->
  <div style="margin-bottom:28px;">
    <p class="section-title">한줄 목표 <span style="color:#a3a3a3;font-weight:500;text-transform:none;letter-spacing:0;">(선택)</span></p>
    <input class="input" placeholder="예: 3월 안에 앱스토어 출시" maxlength="60" value="4월 안에 MVP 출시">
  </div>
  <!-- 템플릿 선택 (2열 그리드) -->
  <div style="margin-bottom:28px;">
    <p class="section-title">템플릿</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="tpl-card on">
        <span style="display:inline-flex;width:28px;height:28px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
        <p style="font-size:13px;font-weight:600;color:#0a0a0a;">IT/앱 제작</p>
        <p style="font-size:11px;color:#737373;line-height:16px;">기획 → 디자인 → 개발 → QA → 출시 → 운영</p>
      </div>
      <div class="tpl-card">
        <span style="display:inline-flex;width:28px;height:28px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg></span>
        <p style="font-size:13px;font-weight:600;color:#0a0a0a;">유튜브 영상</p>
        <p style="font-size:11px;color:#737373;line-height:16px;">기획 → 촬영 → 편집 → 업로드</p>
      </div>
      <div class="tpl-card">
        <span style="display:inline-flex;width:28px;height:28px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
        <p style="font-size:13px;font-weight:600;color:#0a0a0a;">글쓰기/블로그</p>
        <p style="font-size:11px;color:#737373;line-height:16px;">아이디어 → 초안 → 퇴고 → 발행</p>
      </div>
      <div class="tpl-card">
        <span style="display:inline-flex;width:28px;height:28px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>
        <p style="font-size:13px;font-weight:600;color:#0a0a0a;">학습/강의</p>
        <p style="font-size:11px;color:#737373;line-height:16px;">입문 → 심화 → 실습 → 완강</p>
      </div>
      <div class="tpl-card">
        <span style="display:inline-flex;width:28px;height:28px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/></svg></span>
        <p style="font-size:13px;font-weight:600;color:#0a0a0a;">판매/커머스</p>
        <p style="font-size:11px;color:#737373;line-height:16px;">소싱 → 등록 → 마케팅 → 출고</p>
      </div>
      <div class="tpl-card">
        <span style="display:inline-flex;width:28px;height:28px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></span>
        <p style="font-size:13px;font-weight:600;color:#0a0a0a;">창업 준비</p>
        <p style="font-size:11px;color:#737373;line-height:16px;">아이디어 → 시장조사 → MVP → 런칭</p>
      </div>
      <div class="tpl-card" style="grid-column:1 / span 2;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="display:inline-flex;width:26px;height:26px;color:currentColor;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg></span>
          <div>
            <p style="font-size:13px;font-weight:600;color:#0a0a0a;">커스텀</p>
            <p style="font-size:11px;color:#737373;">단계를 직접 만들기</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 현재 단계 -->
  <div style="margin-bottom:24px;">
    <p class="section-title">현재 단계</p>
    <div style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;">
      <div class="chip">기획</div>
      <div class="chip on">디자인</div>
      <div class="chip">개발</div>
      <div class="chip">QA</div>
      <div class="chip">출시</div>
      <div class="chip">운영</div>
    </div>
  </div>

</div>
</div>
</body>
</html>
