<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stanto — 회고 목록</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;display:flex;justify-content:center;min-height:100vh;}
.mobile-frame{width:100%;max-width:390px;min-height:100vh;background:#fff;padding-bottom:96px;position:relative;}
.rcard{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer;}
.rcard:hover{border-color:#171717;}
</style>
</head>
<body>
<div class="mobile-frame">
<div style="height:48px;"></div>

<div style="padding:8px 16px 20px;">
  <h1 style="font-size:30px;line-height:36px;font-weight:800;letter-spacing:-0.025em;color:#0a0a0a;">회고</h1>
</div>

<div style="padding:0 16px;">

  <!-- Latest: 이번 주 (이전 주 회고 생성됨) -->
  <div class="rcard" style="border:2px solid #0a0a0a;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
      <div>
        <p style="font-size:11px;font-weight:700;color:#fff;background:#0a0a0a;padding:2px 8px;border-radius:9999px;display:inline-block;margin-bottom:8px;">NEW</p>
        <p style="font-size:16px;font-weight:700;color:#0a0a0a;">3월 31일 ~ 4월 6일</p>
        <p style="font-size:12px;color:#737373;margin-top:2px;">6주차</p>
      </div>
      <div style="text-align:right;">
        <p style="font-size:22px;font-weight:800;color:#0a0a0a;letter-spacing:-.02em;line-height:1;">67%</p>
        <p style="font-size:11px;color:#737373;margin-top:2px;">13/20</p>
      </div>
    </div>
    <p style="font-size:13px;color:#737373;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"><span style="display:inline-flex;width:13px;height:13px;color:#d97706;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span> 사이드앱이 디자인 단계로 넘어갔어요. 이번 주 가장 큰 진전이에요.</p>
  </div>

  <!-- 5주차 -->
  <div class="rcard">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
      <div>
        <p style="font-size:16px;font-weight:700;color:#0a0a0a;">3월 24일 ~ 3월 30일</p>
        <p style="font-size:12px;color:#737373;margin-top:2px;">5주차</p>
      </div>
      <div style="text-align:right;">
        <p style="font-size:22px;font-weight:800;color:#0a0a0a;letter-spacing:-.02em;line-height:1;">82%</p>
        <p style="font-size:11px;color:#737373;margin-top:2px;">14/17</p>
      </div>
    </div>
    <p style="font-size:13px;color:#737373;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"><span style="display:inline-flex;width:13px;height:13px;color:#d97706;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span> 본업 스프린트를 조기 완료했어요. 페이스가 안정적이에요.</p>
  </div>

  <!-- 4주차 -->
  <div class="rcard">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
      <div>
        <p style="font-size:16px;font-weight:700;color:#0a0a0a;">3월 17일 ~ 3월 23일</p>
        <p style="font-size:12px;color:#737373;margin-top:2px;">4주차</p>
      </div>
      <div style="text-align:right;">
        <p style="font-size:22px;font-weight:800;color:#737373;letter-spacing:-.02em;line-height:1;">48%</p>
        <p style="font-size:11px;color:#737373;margin-top:2px;">12/25</p>
      </div>
    </div>
    <p style="font-size:13px;color:#737373;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"><span style="display:inline-flex;width:13px;height:13px;color:#d97706;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span> 목표가 너무 컸어요. 한 주에 25개는 과해요.</p>
  </div>

  <!-- 3주차 -->
  <div class="rcard">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
      <div>
        <p style="font-size:16px;font-weight:700;color:#0a0a0a;">3월 10일 ~ 3월 16일</p>
        <p style="font-size:12px;color:#737373;margin-top:2px;">3주차 · 피봇</p>
      </div>
      <div style="text-align:right;">
        <p style="font-size:22px;font-weight:800;color:#737373;letter-spacing:-.02em;line-height:1;">71%</p>
        <p style="font-size:11px;color:#737373;margin-top:2px;">10/14</p>
      </div>
    </div>
    <p style="font-size:13px;color:#737373;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"><span style="display:inline-flex;width:13px;height:13px;color:#d97706;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span> MVP 스코프를 줄인 게 주효했어요. 피봇 후 페이스 회복.</p>
  </div>

</div>

<!-- Tab bar -->
<div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;height:72px;background:#fff;border-top:1px solid #e5e5e5;display:flex;align-items:center;padding:0 16px;">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:500;">오늘</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:500;">프로젝트</span>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#0a0a0a;">
    <span style="display:inline-flex;width:24px;height:24px;"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="display:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16V9"/><path d="M12 16V5"/><path d="M17 16v-3"/></svg></span>
    <span style="font-size:11px;line-height:14px;font-weight:600;">회고</span>
  </div>
</div>
</div>
</body>
</html>
