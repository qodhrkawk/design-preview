<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분담 (Bundam) - 디자인 프리뷰</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
  body{background:#fafafa;min-height:100vh;padding:40px 20px}
  .wrap{max-width:1280px;margin:0 auto}
  h1{font-size:30px;font-weight:700;letter-spacing:-0.025em;color:#0a0a0a}
  .desc{font-size:15px;color:#737373;margin-top:8px;line-height:22px}
  .grid{display:flex;gap:24px;margin-top:32px;flex-wrap:wrap;justify-content:center}
  .item{display:flex;flex-direction:column;align-items:center;gap:12px}
  .label{font-size:14px;color:#0a0a0a;font-weight:600}
  .frame{width:390px;height:780px;border:1px solid #e5e5e5;border-radius:24px;overflow:hidden;background:#fff}
  iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>분담 (Bundam)</h1>
  <div class="desc">AI 동거 가사 분담 코치 — 한 줄 입력하면 AI가 분류·집계, 주간 분담지수 + 케어 멘트</div>
  <div class="grid">
    <div class="item"><div class="label">홈</div><div class="frame"><iframe src="home.html"></iframe></div></div>
    <div class="item"><div class="label">기록</div><div class="frame"><iframe src="log.html"></iframe></div></div>
    <div class="item"><div class="label">주간 리포트</div><div class="frame"><iframe src="report.html"></iframe></div></div>
  </div>
</div>
</body>
</html>
