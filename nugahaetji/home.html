<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>분담 - 홈</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:#fafafa;min-height:100vh;display:flex;justify-content:center}
  .app{width:390px;background:#ffffff;min-height:100vh}
</style>
</head>
<body>
<div class="app">

  <!-- Status bar -->
  <div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600;color:#0a0a0a">
    <span>9:41</span>
    <span style="display:flex;gap:6px;align-items:center">
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M1 7L3 9L7 5M9 7L11 9L15 5" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#0a0a0a" opacity="0.4"/><rect x="2" y="2" width="18" height="7" rx="1.5" fill="#0a0a0a"/><rect x="22.5" y="3.5" width="1" height="4" rx="0.5" fill="#0a0a0a" opacity="0.4"/></svg>
    </span>
  </div>

  <!-- Header -->
  <div style="padding:16px 20px 8px 20px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:9999px;background:#171717;color:#fafafa;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600">분</div>
      <div>
        <div style="font-size:12px;color:#737373;font-weight:500">우리집</div>
        <div style="font-size:14px;color:#0a0a0a;font-weight:600">윤재 · 지은</div>
      </div>
    </div>
    <button style="width:40px;height:40px;border-radius:9999px;background:#f5f5f5;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
  </div>

  <!-- Greeting -->
  <div style="padding:8px 20px 20px 20px">
    <div style="font-size:24px;font-weight:700;color:#0a0a0a;letter-spacing:-0.025em;line-height:32px">이번 주, 잘 굴러가고 있어</div>
    <div style="font-size:14px;color:#737373;margin-top:4px">5월 28일 ~ 6월 3일</div>
  </div>

  <!-- Balance score card -->
  <div style="margin:0 20px;padding:24px;border:1px solid #e5e5e5;border-radius:12px;background:#ffffff">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div style="font-size:14px;color:#737373;font-weight:500">이번주 분담지수</div>
      <span style="background:#dcfce7;color:#15803d;border-radius:9999px;padding:3px 10px;font-size:11px;font-weight:600">균형</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:6px">
      <div style="font-size:42px;font-weight:800;color:#0a0a0a;letter-spacing:-0.025em;line-height:1">82</div>
      <div style="font-size:14px;color:#737373;font-weight:500">/ 100</div>
    </div>
    <!-- Bar -->
    <div style="margin-top:20px;display:flex;height:8px;border-radius:9999px;overflow:hidden;background:#f5f5f5">
      <div style="flex:48;background:#171717"></div>
      <div style="flex:52;background:#a3a3a3"></div>
    </div>
    <div style="margin-top:10px;display:flex;justify-content:space-between;font-size:12px;color:#737373">
      <span><span style="color:#0a0a0a;font-weight:600">윤재</span> 48%</span>
      <span><span style="color:#0a0a0a;font-weight:600">지은</span> 52%</span>
    </div>
  </div>

  <!-- AI care message -->
  <div style="margin:20px 20px 0 20px;padding:20px;border-radius:12px;background:#f5f5f5;display:flex;gap:12px">
    <div style="flex-shrink:0;width:32px;height:32px;border-radius:9999px;background:#171717;display:flex;align-items:center;justify-content:center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L13.5 6.5 18 8 13.5 9.5 12 14 10.5 9.5 6 8 10.5 6.5z"/></svg>
    </div>
    <div style="flex:1">
      <div style="font-size:12px;color:#737373;font-weight:500;margin-bottom:4px">AI 코치</div>
      <div style="font-size:14px;color:#0a0a0a;line-height:21px;font-weight:500">지은이 3주 연속 설거지 도맡고 있어. 오늘 저녁엔 한번 슬쩍 챙겨주는 게 어때?</div>
    </div>
  </div>

  <!-- Today section -->
  <div style="padding:28px 20px 8px 20px;display:flex;align-items:center;justify-content:space-between">
    <div style="font-size:16px;font-weight:600;color:#0a0a0a">오늘 한 일</div>
    <div style="font-size:13px;color:#737373">6월 1일 월</div>
  </div>

  <!-- Activity list -->
  <div style="padding:0 20px">

    <div style="display:flex;align-items:center;padding:14px 0;border-bottom:1px solid #f5f5f5;gap:12px">
      <div style="width:36px;height:36px;border-radius:8px;background:#f5f5f5;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8l4 10H4z"/><path d="M12 12v8"/><path d="M4 22h16"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:500;color:#0a0a0a">설거지</div>
        <div style="font-size:12px;color:#737373;margin-top:2px">지은 · 30분 전</div>
      </div>
      <div style="font-size:12px;color:#737373;font-weight:500">+15분</div>
    </div>

    <div style="display:flex;align-items:center;padding:14px 0;border-bottom:1px solid #f5f5f5;gap:12px">
      <div style="width:36px;height:36px;border-radius:8px;background:#f5f5f5;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:500;color:#0a0a0a">분리수거</div>
        <div style="font-size:12px;color:#737373;margin-top:2px">윤재 · 2시간 전</div>
      </div>
      <div style="font-size:12px;color:#737373;font-weight:500">+20분</div>
    </div>

    <div style="display:flex;align-items:center;padding:14px 0;border-bottom:1px solid #f5f5f5;gap:12px">
      <div style="width:36px;height:36px;border-radius:8px;background:#f5f5f5;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:500;color:#0a0a0a">빨래 개기</div>
        <div style="font-size:12px;color:#737373;margin-top:2px">지은 · 어제</div>
      </div>
      <div style="font-size:12px;color:#737373;font-weight:500">+25분</div>
    </div>

  </div>

  <!-- Add button (FAB position) -->
  <div style="padding:24px 20px 32px 20px">
    <button style="width:100%;height:48px;border-radius:8px;background:#171717;color:#fafafa;border:none;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      한 줄로 기록하기
    </button>
  </div>

  <!-- Bottom nav -->
  <div style="border-top:1px solid #e5e5e5;display:flex;height:64px;padding:0 8px">
    <button style="flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#171717" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span style="font-size:11px;color:#0a0a0a;font-weight:600">홈</span>
    </button>
    <button style="flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span style="font-size:11px;color:#a3a3a3;font-weight:500">기록</span>
    </button>
    <button style="flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 5-5"/></svg>
      <span style="font-size:11px;color:#a3a3a3;font-weight:500">리포트</span>
    </button>
    <button style="flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span style="font-size:11px;color:#a3a3a3;font-weight:500">설정</span>
    </button>
  </div>

</div>
</body>
</html>
