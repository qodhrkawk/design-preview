<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몇번남았지 — 홈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: Inter, system-ui, sans-serif; color: #0a0a0a; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 96px; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px 20px;">
    <div>
      <div style="font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.025em;">몇번남았지</div>
      <div style="font-size: 14px; line-height: 20px; color: #737373; margin-top: 2px;">회차권 3개 · 이번 달 7회 사용</div>
    </div>
    <button style="width: 40px; height: 40px; border: 1px solid #e5e5e5; border-radius: 9999px; background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
  </div>

  <!-- Summary strip -->
  <div style="display: flex; gap: 8px; padding: 12px 20px 4px 20px;">
    <div style="flex: 1; background: #f5f5f5; border-radius: 12px; padding: 12px;">
      <div style="font-size: 12px; line-height: 16px; color: #737373;">남은 횟수 합계</div>
      <div style="font-size: 20px; line-height: 28px; font-weight: 600;">21회</div>
    </div>
    <div style="flex: 1; background: #f5f5f5; border-radius: 12px; padding: 12px;">
      <div style="font-size: 12px; line-height: 16px; color: #737373;">남은 금액 가치</div>
      <div style="font-size: 20px; line-height: 28px; font-weight: 600;">86.4만원</div>
    </div>
  </div>

  <!-- Pass cards -->
  <div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px;">

    <!-- Card 1: PT -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 10px; background: #171717; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/></svg>
          </div>
          <div>
            <div style="font-size: 16px; line-height: 24px; font-weight: 600;">PT 김코치</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373;">바디짐 강남점 · 회당 55,000원</div>
          </div>
        </div>
        <span style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500;">D-42</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 16px;">
        <span style="font-size: 36px; line-height: 40px; font-weight: 800; letter-spacing: -0.025em;">7</span>
        <span style="font-size: 14px; line-height: 20px; color: #737373;">/ 20회 남음</span>
      </div>
      <div style="height: 8px; background: #f5f5f5; border-radius: 9999px; margin-top: 12px; overflow: hidden;">
        <div style="width: 35%; height: 8px; background: #171717; border-radius: 9999px;"></div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button style="flex: 1; height: 44px; background: #171717; color: #fafafa; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          오늘 1회 사용
        </button>
        <button style="width: 44px; height: 44px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        </button>
      </div>
    </div>

    <!-- Card 2: Pilates — warning pace -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg>
          </div>
          <div>
            <div style="font-size: 16px; line-height: 24px; font-weight: 600;">필라테스 10회권</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373;">코어핏 스튜디오 · 회당 38,000원</div>
          </div>
        </div>
        <span style="background: #fef3c7; color: #b45309; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500;">D-19</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 16px;">
        <span style="font-size: 36px; line-height: 40px; font-weight: 800; letter-spacing: -0.025em;">6</span>
        <span style="font-size: 14px; line-height: 20px; color: #737373;">/ 10회 남음</span>
      </div>
      <div style="height: 8px; background: #f5f5f5; border-radius: 9999px; margin-top: 12px; overflow: hidden;">
        <div style="width: 60%; height: 8px; background: #f59e0b; border-radius: 9999px;"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px; margin-top: 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <span style="font-size: 12px; line-height: 16px; color: #b45309;">지금 페이스(주 1.2회)면 만기까지 3회를 못 써요. 주 2회 이상 가야 해요.</span>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button style="flex: 1; height: 44px; background: #171717; color: #fafafa; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          오늘 1회 사용
        </button>
        <button style="width: 44px; height: 44px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        </button>
      </div>
    </div>

    <!-- Card 3: Massage — small -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
          </div>
          <div>
            <div style="font-size: 16px; line-height: 24px; font-weight: 600;">타이마사지 5회권</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373;">힐링스파 · 유효기간 없음</div>
          </div>
        </div>
        <div style="display: flex; align-items: baseline; gap: 4px;">
          <span style="font-size: 24px; line-height: 32px; font-weight: 800;">4</span>
          <span style="font-size: 13px; color: #737373;">/ 5회</span>
        </div>
      </div>
    </div>

    <!-- Expired / done section -->
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #737373;">끝난 회차권</span>
      <div style="flex: 1; height: 1px; background: #e5e5e5;"></div>
    </div>
    <div style="background: #fafafa; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; opacity: 0.7;">
      <div>
        <div style="font-size: 14px; line-height: 20px; font-weight: 500; color: #737373;">요가 20회권 · 요가랩</div>
        <div style="font-size: 12px; line-height: 16px; color: #a3a3a3;">20회 모두 사용 · 3월~6월</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
    </div>

  </div>

  <!-- FAB -->
  <button style="position: absolute; bottom: 32px; right: 20px; width: 56px; height: 56px; border-radius: 9999px; background: #171717; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05); cursor: pointer;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
  </button>

</div>
</body>
</html>
