<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몇번남았지 — 회차권 추가</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: Inter, system-ui, sans-serif; color: #0a0a0a; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; padding-bottom: 40px; }
  input, select { font-family: inherit; }
  input::placeholder { color: #a3a3a3; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;">
    <button style="width: 40px; height: 40px; border: none; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: -8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <span style="font-size: 16px; font-weight: 600;">회차권 추가</span>
    <div style="width: 40px;"></div>
  </div>

  <!-- Category chips -->
  <div style="padding: 8px 20px 0 20px;">
    <div style="font-size: 14px; font-weight: 500; margin-bottom: 10px;">종류</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <span style="background: #171717; color: #fafafa; border-radius: 9999px; padding: 8px 14px; font-size: 13px; font-weight: 500;">PT</span>
      <span style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 7px 13px; font-size: 13px; font-weight: 500;">필라테스</span>
      <span style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 7px 13px; font-size: 13px; font-weight: 500;">요가</span>
      <span style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 7px 13px; font-size: 13px; font-weight: 500;">마사지</span>
      <span style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 7px 13px; font-size: 13px; font-weight: 500;">골프</span>
      <span style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 7px 13px; font-size: 13px; font-weight: 500;">테니스</span>
      <span style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 7px 13px; font-size: 13px; font-weight: 500;">카페 쿠폰</span>
      <span style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 7px 13px; font-size: 13px; font-weight: 500;">직접 입력</span>
    </div>
  </div>

  <!-- Form -->
  <div style="padding: 24px 20px 0 20px; display: flex; flex-direction: column; gap: 20px;">

    <div>
      <div style="font-size: 14px; font-weight: 500; margin-bottom: 8px;">이름</div>
      <input type="text" value="PT 김코치" style="width: 100%; height: 44px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #0a0a0a; outline: none;">
    </div>

    <div>
      <div style="font-size: 14px; font-weight: 500; margin-bottom: 8px;">장소 (선택)</div>
      <input type="text" placeholder="바디짐 강남점" style="width: 100%; height: 44px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #0a0a0a; outline: none;">
    </div>

    <div style="display: flex; gap: 12px;">
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 500; margin-bottom: 8px;">총 횟수</div>
        <div style="display: flex; align-items: center; border: 1px solid #e5e5e5; border-radius: 8px; height: 44px; overflow: hidden;">
          <button style="width: 44px; height: 44px; border: none; background: #f5f5f5; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <span style="flex: 1; text-align: center; font-size: 16px; font-weight: 600;">20</span>
          <button style="width: 44px; height: 44px; border: none; background: #f5f5f5; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>
      </div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 500; margin-bottom: 8px;">총 금액 (선택)</div>
        <input type="text" value="1,100,000" style="width: 100%; height: 44px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #0a0a0a; text-align: right; outline: none;">
      </div>
    </div>

    <div style="background: #f5f5f5; border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span style="font-size: 13px; color: #737373;">회당 <b style="color: #171717;">55,000원</b> — 1회 쓸 때마다 이만큼 소진돼요</span>
    </div>

    <div>
      <div style="font-size: 14px; font-weight: 500; margin-bottom: 8px;">유효기간</div>
      <div style="display: flex; gap: 8px;">
        <span style="background: #171717; color: #fafafa; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 500;">날짜 지정</span>
        <span style="background: #ffffff; color: #171717; border: 1px solid #e5e5e5; border-radius: 8px; padding: 9px 13px; font-size: 13px; font-weight: 500;">없음</span>
        <input type="text" value="2026. 9. 5." style="flex: 1; height: 41px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #0a0a0a; outline: none;">
      </div>
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="font-size: 14px; font-weight: 500;">페이스 알림</div>
          <div style="font-size: 12px; color: #737373; margin-top: 2px;">이 페이스로는 만기까지 못 쓸 것 같으면 알려줘요</div>
        </div>
        <div style="width: 44px; height: 26px; background: #171717; border-radius: 9999px; position: relative; flex-shrink: 0;">
          <div style="width: 22px; height: 22px; background: #ffffff; border-radius: 9999px; position: absolute; top: 2px; right: 2px;"></div>
        </div>
      </div>
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="font-size: 14px; font-weight: 500;">잔여 3회 알림</div>
          <div style="font-size: 12px; color: #737373; margin-top: 2px;">재등록 결정 타이밍을 알려줘요</div>
        </div>
        <div style="width: 44px; height: 26px; background: #171717; border-radius: 9999px; position: relative; flex-shrink: 0;">
          <div style="width: 22px; height: 22px; background: #ffffff; border-radius: 9999px; position: absolute; top: 2px; right: 2px;"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- CTA -->
  <div style="padding: 32px 20px 0 20px;">
    <button style="width: 100%; height: 52px; background: #171717; color: #fafafa; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;">저장</button>
  </div>

</div>
</body>
</html>
