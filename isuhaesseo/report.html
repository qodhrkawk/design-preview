<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이수했어 — 증빙 묶음</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; position: relative; }
  .num { font-variant-numeric: tabular-nums; }
  .badge { border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #737373; text-decoration: none; }
  .bar { height: 8px; border-radius: 9999px; background: #f5f5f5; overflow: hidden; display: flex; }
  .chip { height: 36px; padding: 0 14px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #ffffff; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; color: #171717; }
  .chip.on { background: #171717; color: #fafafa; border-color: #171717; }
  .label { font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<main class="screen">
  <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 600;"><span class="num">21:40</span><span style="display: flex; gap: 6px; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/></svg><svg width="20" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="10" x="2" y="7" rx="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg></span></div>
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 16px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; color: #737373;">면허신고 · 이직 · 감사 대비</span>
      <h1 style="font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.025em;">증빙 묶음</h1>
    </div>
  </header>

  <section style="padding: 0 20px 170px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; gap: 8px;">
      <span class="chip on">간호사</span>
      <span class="chip">사회복지사 1급</span>
      <span class="chip">법정의무</span>
    </div>

    <!-- 신고 주기 요약 -->
    <article style="border: 1px solid #e5e5e5; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 16px; font-weight: 600;">이번 신고 주기</span>
        <span class="badge num" style="background: #f5f5f5; color: #171717;">2024 – 2026</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1; border-radius: 12px; background: #fafafa; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 12px; color: #737373;">2024</span><span class="num" style="font-size: 18px; font-weight: 700;">8h</span><span style="font-size: 11px; color: #15803d;">충족</span>
        </div>
        <div style="flex: 1; border-radius: 12px; background: #fafafa; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 12px; color: #737373;">2025</span><span class="num" style="font-size: 18px; font-weight: 700;">8h</span><span style="font-size: 11px; color: #15803d;">충족</span>
        </div>
        <div style="flex: 1; border-radius: 12px; background: #fafafa; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 12px; color: #737373;">2026</span><span class="num" style="font-size: 18px; font-weight: 700;">8h</span><span style="font-size: 11px; color: #15803d;">충족</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <span>면허신고 기간 <b class="num">2027.01 – 12</b> · 1월에 알려드릴게요</span>
      </div>
    </article>

    <!-- 수료증 목록 -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 14px; font-weight: 600;">수료증 9건</span>
      <span style="font-size: 12px; color: #b91c1c;">미첨부 1건</span>
    </div>
    <div style="border: 1px solid #e5e5e5; border-radius: 12px; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #e5e5e5;">
        <div style="width: 36px; height: 44px; border-radius: 6px; background: #f5f5f5; border: 1px solid #e5e5e5;"></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 500;">감염관리 실무 업데이트</span><span class="num" style="font-size: 12px; color: #737373;">2026.09.14 · 4h · 온라인</span></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #e5e5e5;">
        <div style="width: 36px; height: 44px; border-radius: 6px; background: #f5f5f5; border: 1px solid #e5e5e5;"></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 500;">환자안전과 의료윤리</span><span class="num" style="font-size: 12px; color: #737373;">2026.05.02 · 4h · 집합</span></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px;">
        <div style="width: 36px; height: 44px; border-radius: 6px; background: #ffffff; border: 1px dashed #fca5a5; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 500;">학술대회 참석</span><span class="num" style="font-size: 12px; color: #737373;">2025.10.18 · 4h · 수료증 없음</span></div>
        <span style="font-size: 12px; font-weight: 500; color: #b91c1c;">첨부</span>
      </div>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 76px; padding: 12px 20px; background: #ffffff; border-top: 1px solid #e5e5e5; display: flex; gap: 8px;">
    <button style="flex: 1; height: 44px; border-radius: 8px; border: 1px solid #e5e5e5; background: #f5f5f5; color: #171717; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>요약표 공유</button>
    <button style="flex: 1; height: 44px; border-radius: 8px; border: none; background: #171717; color: #fafafa; font-size: 14px; font-weight: 500;">PDF 묶음 내보내기</button>
  </div>
  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; border-top: 1px solid #e5e5e5; background: #ffffff; display: flex; padding: 10px 0 20px;">
    <a class="tab" href="home.html" style="color: #737373;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>홈</a>
    <a class="tab" href="log.html" style="color: #737373;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>기록</a>
    <a class="tab" href="report.html" style="color: #171717;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/></svg>증빙</a>
  </nav>
</main>
</body>
</html>
