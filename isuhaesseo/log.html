<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이수했어 — 이수 기록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; position: relative; }
  .num { font-variant-numeric: tabular-nums; }
  .badge { border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #737373; text-decoration: none; }
  .bar { height: 8px; border-radius: 9999px; background: #f5f5f5; overflow: hidden; display: flex; }
  .chip { height: 36px; padding: 0 14px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #ffffff; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; color: #171717; }
  .chip.on { background: #171717; color: #fafafa; border-color: #171717; }
  .label { font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<main class="screen">
  <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 600;"><span class="num">21:40</span><span style="display: flex; gap: 6px; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/></svg><svg width="20" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="10" x="2" y="7" rx="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg></span></div>
  <header style="display: flex; align-items: center; gap: 12px; padding: 8px 20px 16px;">
    <a href="home.html" style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="font-size: 20px; line-height: 28px; font-weight: 600;">이수 기록</h1>
  </header>

  <section style="padding: 0 20px 170px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">어느 자격증에?</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <span class="chip">간호사</span>
        <span class="chip on">사회복지사 1급</span>
        <span class="chip">법정의무</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">교육명</span>
      <div style="height: 44px; border: 1px solid #e5e5e5; border-radius: 8px; padding: 0 12px; display: flex; align-items: center; font-size: 14px;">사회복지 실천과 인권감수성</div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <span style="font-size: 12px; color: #737373;">최근:</span>
        <span class="badge" style="background: #f5f5f5; color: #171717;">협회 온라인</span>
        <span class="badge" style="background: #f5f5f5; color: #171717;">시군구 집합교육</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">영역</span>
      <div style="display: flex; gap: 8px;">
        <span class="chip on" style="flex: 1; justify-content: center;">필수 · 인권/윤리</span>
        <span class="chip" style="flex: 1; justify-content: center;">선택</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">인정 시간</span>
      <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #e5e5e5; border-radius: 12px; padding: 8px;">
        <button style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #e5e5e5; background: #ffffff; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <span class="num" style="font-size: 28px; font-weight: 700; letter-spacing: -0.025em;">4<span style="font-size: 16px; color: #737373; font-weight: 500;"> 시간</span></span>
        <button style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #e5e5e5; background: #ffffff; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
    </div>

    <div style="display: flex; gap: 12px;">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
        <span class="label">이수일</span>
        <div class="num" style="height: 44px; border: 1px solid #e5e5e5; border-radius: 8px; padding: 0 12px; display: flex; align-items: center; font-size: 14px;">2026.11.01</div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
        <span class="label">상태</span>
        <div style="height: 44px; border: 1px solid #e5e5e5; border-radius: 8px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; font-size: 14px;">수강 완료<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">수료증</span>
      <div style="display: flex; gap: 8px;">
        <div style="width: 72px; height: 72px; border-radius: 12px; border: 1px solid #e5e5e5; background: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          <span style="font-size: 11px; color: #737373;">촬영</span>
        </div>
        <div style="width: 72px; height: 72px; border-radius: 12px; border: 1px solid #e5e5e5; background: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
          <span style="font-size: 11px; color: #737373;">PDF</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 미리보기 + 저장 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 76px; padding: 12px 20px; background: #ffffff; border-top: 1px solid #e5e5e5; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
      <span style="color: #737373;">저장하면</span>
      <span class="num" style="font-weight: 600;">필수 0→4h <span style="color: #15803d;">충족</span> · 총 3→7h</span>
    </div>
    <button style="height: 44px; border-radius: 8px; border: none; background: #171717; color: #fafafa; font-size: 14px; font-weight: 500;">저장</button>
  </div>
  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; border-top: 1px solid #e5e5e5; background: #ffffff; display: flex; padding: 10px 0 20px;">
    <a class="tab" href="home.html" style="color: #737373;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>홈</a>
    <a class="tab" href="log.html" style="color: #171717;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>기록</a>
    <a class="tab" href="report.html" style="color: #737373;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/></svg>증빙</a>
  </nav>
</main>
</body>
</html>
