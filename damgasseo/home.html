<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>담갔어 — 홈</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#f5f5f5;display:flex;justify-content:center}
.screen{width:390px;min-height:844px;background:#ffffff;display:flex;flex-direction:column;position:relative}
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="padding:24px 20px 16px 20px;display:flex;align-items:center;justify-content:space-between;">
    <div>
      <div style="font-size:24px;font-weight:600;letter-spacing:-0.025em;">담갔어</div>
      <div style="font-size:14px;color:#737373;margin-top:2px;">숙성 중 4 · 완성 2</div>
    </div>
    <button style="width:40px;height:40px;border-radius:8px;border:1px solid #e5e5e5;background:#ffffff;display:flex;align-items:center;justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <!-- D-day highlight banner -->
  <div style="margin:0 20px 16px 20px;background:#171717;border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;">
    <div style="width:40px;height:40px;border-radius:9999px;background:#262626;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <div style="flex:1;">
      <div style="font-size:14px;font-weight:600;color:#fafafa;">매실청 건질 날이 3일 남았어요</div>
      <div style="font-size:12px;color:#a3a3a3;margin-top:2px;">6월 2일 담금 · 100일 차 9월 10일</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </div>

  <!-- Filter tabs -->
  <div style="display:flex;gap:8px;padding:0 20px 16px 20px;">
    <div style="background:#171717;color:#fafafa;border-radius:9999px;padding:6px 14px;font-size:13px;font-weight:500;">전체</div>
    <div style="background:#f5f5f5;color:#171717;border-radius:9999px;padding:6px 14px;font-size:13px;font-weight:500;">숙성 중</div>
    <div style="background:#f5f5f5;color:#171717;border-radius:9999px;padding:6px 14px;font-size:13px;font-weight:500;">완성</div>
  </div>

  <!-- List -->
  <div style="flex:1;padding:0 20px;display:flex;flex-direction:column;gap:12px;">

    <!-- Card 1: 매실청 urgent -->
    <div style="background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:16px;font-weight:600;">매실청 2026</span>
          <span style="background:#fef3c7;color:#b45309;border-radius:9999px;padding:2px 10px;font-size:12px;font-weight:500;">D-3 건지기</span>
        </div>
        <span style="font-size:12px;color:#737373;">97일 차</span>
      </div>
      <div style="margin-top:12px;height:8px;background:#f5f5f5;border-radius:9999px;overflow:hidden;">
        <div style="width:97%;height:100%;background:#f59e0b;border-radius:9999px;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;">
        <span style="font-size:12px;color:#737373;">6/2 담금 · 청매실 5kg + 설탕 5kg</span>
        <span style="font-size:12px;font-weight:500;color:#b45309;">건지기 9/10</span>
      </div>
    </div>

    <!-- Card 2: 담금주 -->
    <div style="background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:16px;font-weight:600;">매실 담금주</span>
          <span style="background:#f5f5f5;color:#171717;border-radius:9999px;padding:2px 10px;font-size:12px;font-weight:500;">숙성 중</span>
        </div>
        <span style="font-size:12px;color:#737373;">62일 차</span>
      </div>
      <div style="margin-top:12px;height:8px;background:#f5f5f5;border-radius:9999px;overflow:hidden;">
        <div style="width:17%;height:100%;background:#171717;border-radius:9999px;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;">
        <span style="font-size:12px;color:#737373;">6/30 담금 · 목표 1년</span>
        <span style="font-size:12px;color:#737373;">D-303</span>
      </div>
    </div>

    <!-- Card 3: 레몬청 -->
    <div style="background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:16px;font-weight:600;">레몬청</span>
          <span style="background:#dcfce7;color:#15803d;border-radius:9999px;padding:2px 10px;font-size:12px;font-weight:500;">먹을 수 있음</span>
        </div>
        <span style="font-size:12px;color:#737373;">18일 차</span>
      </div>
      <div style="margin-top:12px;height:8px;background:#f5f5f5;border-radius:9999px;overflow:hidden;">
        <div style="width:100%;height:100%;background:#22c55e;border-radius:9999px;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;">
        <span style="font-size:12px;color:#737373;">8/13 담금 · 냉장 보관</span>
        <span style="font-size:12px;font-weight:500;color:#15803d;">권장 소비 ~11/13</span>
      </div>
    </div>

    <!-- Card 4: 완성 -->
    <div style="background:#fafafa;border:1px solid #e5e5e5;border-radius:12px;padding:16px;opacity:0.85;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:16px;font-weight:600;color:#404040;">매실청 2025</span>
          <span style="background:#e5e5e5;color:#525252;border-radius:9999px;padding:2px 10px;font-size:12px;font-weight:500;">완성</span>
        </div>
        <div style="display:flex;gap:2px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
      </div>
      <div style="margin-top:8px;font-size:12px;color:#737373;">작년엔 설탕 1:0.9 — "다음엔 1:1로, 조금 달게" 메모</div>
    </div>

  </div>

  <!-- FAB -->
  <div style="position:absolute;bottom:96px;right:20px;">
    <button style="width:56px;height:56px;border-radius:9999px;background:#171717;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 15px rgba(0,0,0,0.1),0 4px 6px rgba(0,0,0,0.05);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <!-- Tab bar -->
  <div style="border-top:1px solid #e5e5e5;background:#ffffff;display:flex;padding:10px 0 24px 0;">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span style="font-size:11px;font-weight:600;color:#171717;">홈</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span style="font-size:11px;color:#737373;">캘린더</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span style="font-size:11px;color:#737373;">레시피</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span style="font-size:11px;color:#737373;">설정</span>
    </div>
  </div>

</div>
</body>
</html>
