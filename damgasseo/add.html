<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>담갔어 — 새 담금</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#f5f5f5;display:flex;justify-content:center}
.screen{width:390px;min-height:844px;background:#ffffff;display:flex;flex-direction:column}
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="padding:24px 20px 16px 20px;display:flex;align-items:center;gap:12px;">
    <button style="width:40px;height:40px;border-radius:8px;border:1px solid #e5e5e5;background:#ffffff;display:flex;align-items:center;justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div style="font-size:20px;font-weight:600;letter-spacing:-0.025em;">새 담금 시작</div>
  </div>

  <div style="flex:1;padding:0 20px;overflow-y:auto;">

    <!-- Preset section -->
    <div style="font-size:14px;font-weight:600;margin-bottom:12px;">뭘 담그세요?</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
      <div style="border:2px solid #171717;background:#171717;color:#fafafa;border-radius:9999px;padding:8px 16px;font-size:14px;font-weight:500;">매실청</div>
      <div style="border:1px solid #e5e5e5;background:#ffffff;color:#171717;border-radius:9999px;padding:8px 16px;font-size:14px;font-weight:500;">레몬청</div>
      <div style="border:1px solid #e5e5e5;background:#ffffff;color:#171717;border-radius:9999px;padding:8px 16px;font-size:14px;font-weight:500;">담금주</div>
      <div style="border:1px solid #e5e5e5;background:#ffffff;color:#171717;border-radius:9999px;padding:8px 16px;font-size:14px;font-weight:500;">장아찌</div>
      <div style="border:1px solid #e5e5e5;background:#ffffff;color:#171717;border-radius:9999px;padding:8px 16px;font-size:14px;font-weight:500;">김치</div>
      <div style="border:1px solid #e5e5e5;background:#ffffff;color:#171717;border-radius:9999px;padding:8px 16px;font-size:14px;font-weight:500;">기타</div>
    </div>

    <!-- Preset auto schedule card -->
    <div style="background:#f5f5f5;border-radius:12px;padding:16px;margin:16px 0;">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span style="font-size:13px;font-weight:600;">매실청 표준 일정이 자동 등록돼요</span>
      </div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:#737373;">D+3~7 저어주기</span><span style="font-weight:500;">알림 ON</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:#737373;">D+100 매실 건지기</span><span style="font-weight:500;">알림 ON</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;">
          <span style="color:#737373;">D+365 숙성 완료</span><span style="font-weight:500;">알림 ON</span>
        </div>
      </div>
      <div style="margin-top:10px;font-size:12px;color:#737373;">일정은 등록 후 자유롭게 수정할 수 있어요</div>
    </div>

    <!-- Name -->
    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">이름</div>
    <input value="매실청 2026" style="width:100%;height:44px;border:1px solid #e5e5e5;border-radius:8px;padding:8px 12px;font-size:14px;background:#ffffff;color:#0a0a0a;margin-bottom:20px;">

    <!-- Date -->
    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">담근 날짜</div>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <div style="flex:1;height:44px;border:1px solid #e5e5e5;border-radius:8px;padding:8px 12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;">
        <span>2026년 8월 31일</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
    </div>

    <!-- Ratio -->
    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">배합 (선택)</div>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <div style="flex:1;">
        <div style="font-size:12px;color:#737373;margin-bottom:4px;">재료</div>
        <input value="청매실 5kg" style="width:100%;height:44px;border:1px solid #e5e5e5;border-radius:8px;padding:8px 12px;font-size:14px;background:#ffffff;color:#0a0a0a;">
      </div>
      <div style="flex:1;">
        <div style="font-size:12px;color:#737373;margin-bottom:4px;">설탕/소주</div>
        <input value="설탕 5kg" style="width:100%;height:44px;border:1px solid #e5e5e5;border-radius:8px;padding:8px 12px;font-size:14px;background:#ffffff;color:#0a0a0a;">
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:20px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span style="font-size:12px;color:#3b82f6;">비율 1:1 — 곰팡이 예방에 좋은 표준 배합이에요</span>
    </div>

    <!-- Photo -->
    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">시작 사진 (선택)</div>
    <div style="width:96px;height:96px;border:1px dashed #d4d4d4;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-bottom:24px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span style="font-size:11px;color:#a3a3a3;">사진 추가</span>
    </div>

  </div>

  <!-- Bottom CTA -->
  <div style="padding:16px 20px 32px 20px;border-top:1px solid #e5e5e5;">
    <button style="width:100%;height:48px;background:#171717;color:#fafafa;border:none;border-radius:8px;font-size:15px;font-weight:600;">담금 시작하기</button>
  </div>

</div>
</body>
</html>
