<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LinkDrop - 링크 추가</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <div style="height: 48px;"></div>

    <div style="padding: 0 20px 100px; display: flex; flex-direction: column; gap: 20px;">

      <!-- Header -->
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #0a0a0a;">←</div>
          <div style="font-size: 20px; font-weight: 700; color: #0a0a0a;">링크 추가</div>
        </div>
      </div>

      <!-- URL Input -->
      <div>
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">URL</div>
        <div style="display: flex; gap: 8px;">
          <div style="flex: 1; padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 14px; color: #0a0a0a; height: 44px; display: flex; align-items: center;">https://ui.shadcn.com</div>
          <div style="padding: 10px 16px; background: #0a0a0a; color: #fafafa; border-radius: 8px; font-size: 14px; font-weight: 500; display: flex; align-items: center; white-space: nowrap;">가져오기</div>
        </div>
      </div>

      <!-- Preview (메타데이터 추출 후) -->
      <div style="border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden;">
        <div style="width: 100%; height: 140px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>
        <div style="padding: 12px 14px;">
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a;">shadcn/ui - Beautiful designed components</div>
          <div style="font-size: 12px; color: #737373; margin-top: 4px;">Beautifully designed components built with Radix UI and Tailwind CSS.</div>
        </div>
      </div>

      <!-- Title (editable) -->
      <div>
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">제목</div>
        <div style="padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 14px; color: #0a0a0a; height: 44px; display: flex; align-items: center;">shadcn/ui - Beautiful designed components</div>
      </div>

      <!-- Collection -->
      <div>
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">컬렉션</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <div style="padding: 8px 14px; border-radius: 8px; background: #0a0a0a; color: #fafafa; font-size: 14px; font-weight: 500;">개발</div>
          <div style="padding: 8px 14px; border-radius: 8px; border: 1px solid #e5e5e5; color: #0a0a0a; font-size: 14px;">디자인</div>
          <div style="padding: 8px 14px; border-radius: 8px; border: 1px solid #e5e5e5; color: #0a0a0a; font-size: 14px;">읽을거리</div>
          <div style="padding: 8px 14px; border-radius: 8px; border: 1px dashed #e5e5e5; color: #737373; font-size: 14px;">+ 새 컬렉션</div>
        </div>
      </div>

      <!-- Tags -->
      <div>
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">태그</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;">
          <div style="display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 9999px; background: #f5f5f5; font-size: 13px; color: #0a0a0a;">UI <span style="color: #a3a3a3; font-size: 11px; cursor: pointer;">✕</span></div>
          <div style="display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 9999px; background: #f5f5f5; font-size: 13px; color: #0a0a0a;">React <span style="color: #a3a3a3; font-size: 11px; cursor: pointer;">✕</span></div>
        </div>
        <div style="padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 14px; color: #a3a3a3; height: 44px; display: flex; align-items: center;">태그 입력 후 Enter</div>
      </div>

    </div>

    <!-- Bottom Button -->
    <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; padding: 12px 20px 32px; background: #ffffff; border-top: 1px solid #e5e5e5;">
      <div style="width: 100%; padding: 14px; background: #0a0a0a; color: #fafafa; border-radius: 10px; text-align: center; font-size: 16px; font-weight: 600;">저장하기</div>
    </div>
  </div>
</body>
</html>
