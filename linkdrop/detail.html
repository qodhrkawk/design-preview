<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LinkDrop - 링크 상세</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <div style="height: 48px;"></div>

    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 16px;">

      <!-- Header -->
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #0a0a0a;">←</div>
          <div style="font-size: 20px; font-weight: 700; color: #0a0a0a;">링크 상세</div>
        </div>
        <div style="display: flex; gap: 8px;">
          <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 16px;">✏️</div>
          <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 16px;">🗑️</div>
        </div>
      </div>

      <!-- Thumbnail -->
      <div style="width: 100%; height: 200px; border-radius: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); overflow: hidden;"></div>

      <!-- Title & URL -->
      <div>
        <div style="font-size: 20px; font-weight: 700; color: #0a0a0a; line-height: 1.4;">shadcn/ui - Beautiful designed components built with Radix UI and Tailwind CSS</div>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px;">
          <div style="width: 16px; height: 16px; border-radius: 4px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 10px;">🔗</div>
          <span style="font-size: 13px; color: #3b82f6;">ui.shadcn.com</span>
          <span style="font-size: 13px; color: #737373;">→</span>
        </div>
      </div>

      <!-- Description -->
      <div style="font-size: 14px; color: #737373; line-height: 1.6;">Beautifully designed components built with Radix UI and Tailwind CSS. Copy and paste into your apps. Open Source.</div>

      <!-- Divider -->
      <div style="height: 1px; background: #e5e5e5;"></div>

      <!-- Collection -->
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 14px; color: #737373;">컬렉션</div>
        <div style="padding: 4px 12px; border-radius: 9999px; background: #f5f5f5; font-size: 13px; font-weight: 500; color: #0a0a0a;">개발</div>
      </div>

      <!-- Tags -->
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 14px; color: #737373;">태그</div>
        <div style="display: flex; gap: 6px;">
          <span style="padding: 4px 10px; border-radius: 9999px; background: #f5f5f5; font-size: 12px; color: #737373;">UI</span>
          <span style="padding: 4px 10px; border-radius: 9999px; background: #f5f5f5; font-size: 12px; color: #737373;">React</span>
          <span style="padding: 4px 10px; border-radius: 9999px; background: #f5f5f5; font-size: 12px; color: #737373;">Tailwind</span>
        </div>
      </div>

      <!-- Saved date -->
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 14px; color: #737373;">저장일</div>
        <div style="font-size: 13px; color: #737373;">2026년 3월 2일</div>
      </div>

      <div style="height: 1px; background: #e5e5e5;"></div>

      <!-- Open Link Button -->
      <div style="width: 100%; padding: 14px; background: #0a0a0a; color: #fafafa; border-radius: 10px; text-align: center; font-size: 16px; font-weight: 600;">링크 열기 ↗</div>

      <!-- Delete -->
      <div style="width: 100%; padding: 14px; border: 1px solid #e5e5e5; color: #ef4444; border-radius: 10px; text-align: center; font-size: 14px; font-weight: 500;">링크 삭제</div>

    </div>

    <div style="height: 40px;"></div>
  </div>
</body>
</html>
