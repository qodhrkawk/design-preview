<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>덜탔어 — 디자인 시안</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; padding: 32px 16px; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; }
  p { font-size: 14px; color: #737373; margin-top: 4px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; margin-top: 24px; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .item span { font-size: 13px; font-weight: 500; }
  iframe { width: 390px; height: 844px; border: 1px solid #e5e5e5; border-radius: 16px; background: #ffffff; }
</style>

<body>
  <div style="text-align: center;">
    <h1>덜탔어 (Deoltasseo)</h1>
    <p>자동차보험 마일리지 특약 환급 페이스 트래커 — 월 1회 계기판 검침 + 만기 예상 주행거리·구간 경계 경고 + "하루 N km 이하" 페이스 + 정산 기간 D-day·사진 증빙 보관</p>
  </div>
  <div class="grid">
    <div class="item"><span>1. 페이스 (만기 예상 + 구간 경계)</span><iframe src="home.html"></iframe></div>
    <div class="item"><span>2. 계기판 검침 (ODO 체크 + 이벤트 태그)</span><iframe src="log.html"></iframe></div>
    <div class="item"><span>3. 환급 정산 (제출 기간 + 구간표 + 준비물)</span><iframe src="settle.html"></iframe></div>
  </div>
</body>
</html>
