<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>구웠어 — 굽기 기록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 390px; background: #ffffff; min-height: 100vh; padding-bottom: 120px; }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div style="padding: 56px 20px 16px; display: flex; align-items: center; gap: 12px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <div>
      <div style="font-size: 20px; font-weight: 600; color: #0a0a0a; letter-spacing: -0.025em;">오늘의 굽기</div>
      <div style="font-size: 13px; color: #737373; margin-top: 1px;">바나나 파운드 · 8번째</div>
    </div>
  </div>

  <!-- 지난번 요약 -->
  <div style="margin: 4px 20px 0; background: #f5f5f5; border-radius: 12px; padding: 14px 16px;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
      <span style="font-size: 12px; font-weight: 600; color: #737373;">지난번 (3일 전) · 성공</span>
    </div>
    <div style="display: flex; gap: 16px; margin-top: 8px;">
      <div style="font-size: 14px; font-weight: 600; color: #0a0a0a;">165°C · 29분</div>
      <div style="font-size: 14px; color: #737373;">윗불 그대로 · 가운데 칸</div>
    </div>
    <div style="font-size: 13px; color: #737373; margin-top: 6px; line-height: 18px;">"쿠킹호일 15분에 덮은 게 신의 한 수. 다음엔 설탕 10g 줄이기"</div>
  </div>

  <!-- 오늘 세팅 -->
  <div style="padding: 24px 20px 0;">
    <div style="font-size: 16px; font-weight: 600; color: #0a0a0a; margin-bottom: 12px;">오늘 세팅</div>

    <!-- 온도 -->
    <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"/></svg>
        <span style="font-size: 14px; font-weight: 500; color: #0a0a0a;">온도</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 32px; height: 32px; border: 1px solid #e5e5e5; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </div>
        <span style="font-size: 18px; font-weight: 600; color: #0a0a0a; min-width: 64px; text-align: center;">165°C</span>
        <div style="width: 32px; height: 32px; border: 1px solid #e5e5e5; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </div>
      </div>
    </div>

    <!-- 시간 -->
    <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px; margin-top: 10px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span style="font-size: 14px; font-weight: 500; color: #0a0a0a;">시간</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 32px; height: 32px; border: 1px solid #e5e5e5; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </div>
        <span style="font-size: 18px; font-weight: 600; color: #0a0a0a; min-width: 64px; text-align: center;">29분</span>
        <div style="width: 32px; height: 32px; border: 1px solid #e5e5e5; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </div>
      </div>
    </div>

    <!-- 칸 위치 / 예열 -->
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <div style="flex: 1; border: 1px solid #e5e5e5; border-radius: 12px; padding: 12px 14px;">
        <div style="font-size: 12px; color: #737373;">오븐 칸</div>
        <div style="display: flex; gap: 6px; margin-top: 8px;">
          <span style="flex:1; text-align:center; background: #f5f5f5; color: #737373; border-radius: 6px; padding: 6px 0; font-size: 12px; font-weight: 500;">위</span>
          <span style="flex:1; text-align:center; background: #171717; color: #fafafa; border-radius: 6px; padding: 6px 0; font-size: 12px; font-weight: 500;">중간</span>
          <span style="flex:1; text-align:center; background: #f5f5f5; color: #737373; border-radius: 6px; padding: 6px 0; font-size: 12px; font-weight: 500;">아래</span>
        </div>
      </div>
      <div style="flex: 1; border: 1px solid #e5e5e5; border-radius: 12px; padding: 12px 14px;">
        <div style="font-size: 12px; color: #737373;">예열</div>
        <div style="display: flex; gap: 6px; margin-top: 8px;">
          <span style="flex:1; text-align:center; background: #171717; color: #fafafa; border-radius: 6px; padding: 6px 0; font-size: 12px; font-weight: 500;">10분</span>
          <span style="flex:1; text-align:center; background: #f5f5f5; color: #737373; border-radius: 6px; padding: 6px 0; font-size: 12px; font-weight: 500;">15분</span>
        </div>
      </div>
    </div>

    <!-- 반죽 변경 메모 -->
    <div style="border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px; margin-top: 10px;">
      <div style="font-size: 12px; color: #737373; margin-bottom: 8px;">오늘 바꾼 것 (선택)</div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <span style="background: #171717; color: #fafafa; border-radius: 9999px; padding: 5px 12px; font-size: 12px; font-weight: 500;">설탕 -10g</span>
        <span style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 5px 12px; font-size: 12px; font-weight: 500;">버터 변경</span>
        <span style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 5px 12px; font-size: 12px; font-weight: 500;">호일 덮기</span>
        <span style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 5px 12px; font-size: 12px; font-weight: 500;">+ 직접 입력</span>
      </div>
    </div>
  </div>

  <!-- 타이머 CTA -->
  <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: #ffffff; border-top: 1px solid #e5e5e5; padding: 12px 20px 28px;">
    <div style="background: #171717; border-radius: 10px; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
      <span style="font-size: 15px; font-weight: 600; color: #fafafa;">29분 타이머 시작하고 굽기</span>
    </div>
    <div style="text-align: center; font-size: 12px; color: #737373; margin-top: 10px;">타이머가 끝나면 결과 기록 화면으로 이어져요</div>
  </div>

</div>
</body>
</html>
