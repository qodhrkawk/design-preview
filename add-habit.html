<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>습관 추가 - 습관 트래커</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <div style="height: 48px;"></div>

    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 20px;">

      <!-- Header -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #0a0a0a;">←</div>
        <div style="font-size: 20px; font-weight: 700; color: #0a0a0a;">새 습관 추가</div>
      </div>

      <!-- Icon Picker -->
      <div>
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">아이콘</div>
        <div style="display: flex; gap: 8px;">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: #0a0a0a; display: flex; align-items: center; justify-content: center; font-size: 24px;">💧</div>
          <div style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center; font-size: 24px;">🏃</div>
          <div style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center; font-size: 24px;">📖</div>
          <div style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center; font-size: 24px;">🧘</div>
          <div style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center; font-size: 24px;">✍️</div>
          <div style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #737373;">+</div>
        </div>
      </div>

      <!-- Name Input -->
      <div>
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">습관 이름</div>
        <div style="padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 15px; color: #a3a3a3; height: 44px; display: flex; align-items: center;">예: 물 2L 마시기</div>
      </div>

      <!-- Frequency -->
      <div>
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">반복 주기</div>
        <div style="display: flex; gap: 8px;">
          <div style="flex: 1; padding: 10px; border-radius: 8px; background: #0a0a0a; color: #fafafa; text-align: center; font-size: 14px; font-weight: 500;">매일</div>
          <div style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #e5e5e5; color: #0a0a0a; text-align: center; font-size: 14px; font-weight: 500;">평일만</div>
          <div style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #e5e5e5; color: #0a0a0a; text-align: center; font-size: 14px; font-weight: 500;">주말만</div>
        </div>
      </div>

      <!-- Reminder -->
      <div>
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">알림 시간</div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid #e5e5e5; border-radius: 8px;">
          <span style="font-size: 15px; color: #0a0a0a;">오전 8:00</span>
          <span style="font-size: 14px; color: #737373;">변경</span>
        </div>
      </div>

      <!-- Goal -->
      <div>
        <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">목표 기간</div>
        <div style="display: flex; gap: 8px;">
          <div style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #e5e5e5; color: #0a0a0a; text-align: center; font-size: 14px;">21일</div>
          <div style="flex: 1; padding: 10px; border-radius: 8px; background: #0a0a0a; color: #fafafa; text-align: center; font-size: 14px; font-weight: 500;">30일</div>
          <div style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #e5e5e5; color: #0a0a0a; text-align: center; font-size: 14px;">66일</div>
          <div style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #e5e5e5; color: #0a0a0a; text-align: center; font-size: 14px;">무한</div>
        </div>
      </div>

    </div>

    <!-- Bottom Button -->
    <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; padding: 12px 20px 32px; background: #ffffff; border-top: 1px solid #e5e5e5;">
      <div style="width: 100%; padding: 14px; background: #0a0a0a; color: #fafafa; border-radius: 10px; text-align: center; font-size: 16px; font-weight: 600;">습관 추가하기</div>
    </div>
  </div>
</body>
</html>
