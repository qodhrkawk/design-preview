<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>틀어봤어 — 검침 기록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; position: relative; }
  .num { font-variant-numeric: tabular-nums; }
  .badge { border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #737373; text-decoration: none; }
  .chip { height: 36px; padding: 0 14px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #ffffff; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; color: #171717; }
  .chip.on { background: #171717; color: #fafafa; border-color: #171717; }
  .label { font-size: 13px; font-weight: 600; }
  .muted { font-size: 12px; color: #737373; }
  .card { border: 1px solid #e5e5e5; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .key { height: 52px; border-radius: 10px; background: #f5f5f5; border: none; font-size: 22px; font-weight: 500; display: flex; align-items: center; justify-content: center; color: #171717; font-family: inherit; }
</style>
</head>
<body>
<main class="screen">
  <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 600;"><span class="num">08:12</span><span style="display: flex; gap: 6px; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/></svg><svg width="20" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="10" x="2" y="7" rx="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg></span></div>
  <header style="display: flex; align-items: center; gap: 12px; padding: 8px 20px 12px;">
    <a href="home.html" style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column;">
      <h1 style="font-size: 20px; line-height: 28px; font-weight: 600;">오늘 검침</h1>
      <span class="muted num">11월 4일 (수) 08:12</span>
    </div>
  </header>

  <section style="padding: 0 20px 100px; display: flex; flex-direction: column; gap: 16px;">

    <!-- 계량기 숫자 -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">계량기 숫자 (㎥)</span>
      <div style="border: 2px solid #171717; border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;">
        <span class="num" style="font-size: 34px; font-weight: 700; letter-spacing: 0.04em;">2,484<span style="color: #a3a3a3;">.</span>2<span style="display: inline-block; width: 2px; height: 30px; background: #171717; vertical-align: middle; margin-left: 2px;"></span></span>
        <span class="badge num" style="background: #f0fdf4; color: #15803d;">+2.6㎥</span>
      </div>
      <span class="muted num">어제 2,481.6 → 앞 4자리는 자동으로 채워져요. 빨간 소수점 자리까지만.</span>
    </div>

    <!-- 어젯밤 설정 -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="label">어제 보일러 어떻게 했어?</span>
        <span class="badge" style="background: #eff6ff; color: #1d4ed8;">실험 B 자동 선택</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span class="chip">외출모드</span>
        <span class="chip on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>18℃로 낮춤</span>
        <span class="chip">예약 2시간</span>
        <span class="chip">그대로 켜둠</span>
        <span class="chip">껐음</span>
      </div>
    </div>

    <!-- 예외 -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">평소랑 다른 일 <span style="font-weight: 400; color: #737373;">(있으면 비교에서 빼요)</span></span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span class="chip">손님 왔음</span>
        <span class="chip">하루종일 집</span>
        <span class="chip">빨래 온수 많이</span>
        <span class="chip">창문 열어둠</span>
      </div>
    </div>

    <!-- 기온 -->
    <div style="border-radius: 12px; background: #f5f5f5; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 13px; font-weight: 600;">어제 바깥 평균 3.6℃</span>
          <span class="muted">직접 입력 · 기온 다르면 사용량 보정에 써요</span>
        </div>
      </div>
      <span style="font-size: 13px; font-weight: 500; text-decoration: underline;">수정</span>
    </div>

    <!-- 키패드 -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px;">
      <button class="key num">1</button><button class="key num">2</button><button class="key num">3</button>
      <button class="key num">4</button><button class="key num">5</button><button class="key num">6</button>
      <button class="key num">7</button><button class="key num">8</button><button class="key num">9</button>
      <button class="key num">.</button><button class="key num">0</button>
      <button class="key"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg></button>
    </div>

    <button style="height: 48px; border-radius: 8px; border: none; background: #171717; color: #fafafa; font-size: 15px; font-weight: 600; font-family: inherit;">저장 · 실험 B 4일차</button>
  </section>
  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; border-top: 1px solid #e5e5e5; background: #ffffff; display: flex; padding: 10px 0 20px;">
    <a class="tab" href="home.html" style="color: #737373;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>홈</a>
    <a class="tab" href="log.html" style="color: #171717;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>검침</a>
    <a class="tab" href="result.html" style="color: #737373;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>실험</a>
  </nav>
</main>
</body>
</html>
