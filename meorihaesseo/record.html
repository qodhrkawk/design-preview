<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>머리했어 — 기록</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; padding-bottom: 100px; position: relative; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid #e5e5e5;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <span style="font-size:18px; font-weight:600; color:#0a0a0a;">오늘 머리했어</span>
  </div>

  <!-- Photo grid -->
  <div style="padding:20px;">
    <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:10px;">사진 <span style="color:#737373; font-weight:400;">— 앞 · 옆 · 뒤</span></div>
    <div style="display:flex; gap:10px;">
      <div style="flex:1; aspect-ratio:3/4; border-radius:12px; background:linear-gradient(135deg,#e5e5e5,#d4d4d4); display:flex; align-items:center; justify-content:center; position:relative;">
        <span style="position:absolute; bottom:8px; left:8px; background:rgba(23,23,23,0.8); color:#fafafa; font-size:11px; font-weight:500; padding:2px 8px; border-radius:9999px;">앞</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </div>
      <div style="flex:1; aspect-ratio:3/4; border-radius:12px; background:linear-gradient(135deg,#e5e5e5,#d4d4d4); display:flex; align-items:center; justify-content:center; position:relative;">
        <span style="position:absolute; bottom:8px; left:8px; background:rgba(23,23,23,0.8); color:#fafafa; font-size:11px; font-weight:500; padding:2px 8px; border-radius:9999px;">옆</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </div>
      <div style="flex:1; aspect-ratio:3/4; border-radius:12px; border:1.5px dashed #d4d4d4; background:#fafafa; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        <span style="font-size:11px; color:#737373;">뒤 추가</span>
      </div>
    </div>
  </div>

  <!-- Treatment type chips -->
  <div style="padding:0 20px 20px;">
    <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:10px;">시술 종류 <span style="color:#737373; font-weight:400;">— 복수 선택</span></div>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      <span style="background:#171717; color:#fafafa; font-size:13px; font-weight:500; padding:8px 16px; border-radius:9999px;">컷</span>
      <span style="background:#171717; color:#fafafa; font-size:13px; font-weight:500; padding:8px 16px; border-radius:9999px;">펌</span>
      <span style="background:#f5f5f5; color:#171717; font-size:13px; font-weight:500; padding:8px 16px; border-radius:9999px; border:1px solid #e5e5e5;">염색</span>
      <span style="background:#f5f5f5; color:#171717; font-size:13px; font-weight:500; padding:8px 16px; border-radius:9999px; border:1px solid #e5e5e5;">뿌리염색</span>
      <span style="background:#f5f5f5; color:#171717; font-size:13px; font-weight:500; padding:8px 16px; border-radius:9999px; border:1px solid #e5e5e5;">클리닉</span>
      <span style="background:#f5f5f5; color:#171717; font-size:13px; font-weight:500; padding:8px 16px; border-radius:9999px; border:1px solid #e5e5e5;">매직</span>
      <span style="background:#f5f5f5; color:#171717; font-size:13px; font-weight:500; padding:8px 16px; border-radius:9999px; border:1px solid #e5e5e5;">드라이</span>
    </div>
  </div>

  <!-- Fields -->
  <div style="padding:0 20px; display:flex; flex-direction:column; gap:16px;">

    <div>
      <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:8px;">시술 이름</div>
      <input value="히피펌" style="width:100%; height:44px; border:1px solid #e5e5e5; border-radius:8px; padding:8px 12px; font-size:14px; font-family:inherit; color:#0a0a0a; background:#ffffff;">
    </div>

    <div style="display:flex; gap:12px;">
      <div style="flex:1;">
        <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:8px;">미용실</div>
        <div style="height:44px; border:1px solid #e5e5e5; border-radius:8px; padding:8px 12px; font-size:14px; color:#0a0a0a; display:flex; align-items:center; justify-content:space-between; background:#ffffff;">
          <span>준오헤어 성수점</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div style="font-size:12px; color:#737373; margin-top:6px;">최근 방문한 곳이 먼저 떠요</div>
      </div>
      <div style="width:120px;">
        <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:8px;">가격</div>
        <input value="98,000" style="width:100%; height:44px; border:1px solid #e5e5e5; border-radius:8px; padding:8px 12px; font-size:14px; font-family:inherit; color:#0a0a0a; text-align:right; background:#ffffff;">
      </div>
    </div>

    <div>
      <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:8px;">디자이너 <span style="color:#737373; font-weight:400;">(선택)</span></div>
      <input value="지현" style="width:100%; height:44px; border:1px solid #e5e5e5; border-radius:8px; padding:8px 12px; font-size:14px; font-family:inherit; color:#0a0a0a; background:#ffffff;">
    </div>

    <div>
      <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:8px;">디테일 메모 <span style="color:#737373; font-weight:400;">— 다음에 똑같이 하려면</span></div>
      <div style="border:1px solid #e5e5e5; border-radius:8px; padding:12px; font-size:14px; color:#0a0a0a; line-height:22px; min-height:88px; background:#ffffff;">중간 롯드, 앞머리는 약하게. 약제 오래 두면 푸석해짐 — 디자이너한테 15분만 해달라고 하기</div>
      <div style="display:flex; gap:6px; margin-top:8px;">
        <span style="background:#f5f5f5; color:#737373; font-size:12px; padding:4px 10px; border-radius:9999px; border:1px solid #e5e5e5;">+ 염색약 번호</span>
        <span style="background:#f5f5f5; color:#737373; font-size:12px; padding:4px 10px; border-radius:9999px; border:1px solid #e5e5e5;">+ 롯드 크기</span>
        <span style="background:#f5f5f5; color:#737373; font-size:12px; padding:4px 10px; border-radius:9999px; border:1px solid #e5e5e5;">+ 방치 시간</span>
      </div>
    </div>

    <!-- Satisfaction -->
    <div>
      <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:8px;">만족도 <span style="color:#737373; font-weight:400;">— 2주 뒤에 다시 물어볼게요</span></div>
      <div style="display:flex; gap:8px;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
    </div>

  </div>

  <!-- Save button -->
  <div style="position:absolute; bottom:0; left:0; right:0; padding:16px 20px 28px; background:#ffffff; border-top:1px solid #e5e5e5;">
    <button style="width:100%; height:52px; background:#171717; color:#fafafa; border:none; border-radius:10px; font-size:16px; font-weight:600; font-family:inherit; cursor:pointer;">저장</button>
  </div>

</div>
</body>
</html>
