<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>머리했어 — 미용실 모드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #0a0a0a; position: relative; padding-bottom: 40px; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px;">
    <div style="display:flex; align-items:center; gap:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      <span style="font-size:16px; font-weight:600; color:#fafafa;">미용실에서 보여주기</span>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </div>

  <div style="padding:0 20px 8px; font-size:13px; color:#a3a3a3; line-height:20px;">디자이너에게 화면을 그대로 보여주세요. 사진 · 시술 디테일 · 주의사항이 한 화면에 있어요.</div>

  <!-- Big photos -->
  <div style="display:flex; gap:8px; padding:16px 20px 0;">
    <div style="flex:1.4; aspect-ratio:3/4; border-radius:14px; background:linear-gradient(135deg,#404040,#262626); display:flex; align-items:center; justify-content:center; position:relative;">
      <span style="position:absolute; top:10px; left:10px; background:rgba(250,250,250,0.15); color:#fafafa; font-size:11px; font-weight:500; padding:3px 10px; border-radius:9999px;">앞</span>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
      <div style="flex:1; border-radius:14px; background:linear-gradient(135deg,#404040,#262626); display:flex; align-items:center; justify-content:center; position:relative;">
        <span style="position:absolute; top:8px; left:8px; background:rgba(250,250,250,0.15); color:#fafafa; font-size:11px; font-weight:500; padding:3px 10px; border-radius:9999px;">옆</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </div>
      <div style="flex:1; border-radius:14px; background:linear-gradient(135deg,#404040,#262626); display:flex; align-items:center; justify-content:center; position:relative;">
        <span style="position:absolute; top:8px; left:8px; background:rgba(250,250,250,0.15); color:#fafafa; font-size:11px; font-weight:500; padding:3px 10px; border-radius:9999px;">뒤</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </div>
    </div>
  </div>

  <!-- Treatment spec card -->
  <div style="margin:16px 20px 0; background:#171717; border:1px solid #262626; border-radius:14px; padding:20px;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:17px; font-weight:600; color:#fafafa;">히피펌 + 애쉬브라운</span>
      <span style="background:#262626; color:#a3a3a3; font-size:12px; font-weight:500; padding:3px 10px; border-radius:9999px;">2026.5.9</span>
    </div>
    <div style="display:flex; flex-direction:column; gap:0; margin-top:14px;">
      <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #262626;">
        <span style="font-size:14px; color:#a3a3a3;">염색약</span>
        <span style="font-size:14px; font-weight:500; color:#fafafa;">8A 애쉬브라운</span>
      </div>
      <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #262626;">
        <span style="font-size:14px; color:#a3a3a3;">롯드</span>
        <span style="font-size:14px; font-weight:500; color:#fafafa;">중간 (앞머리 약하게)</span>
      </div>
      <div style="display:flex; justify-content:space-between; padding:10px 0;">
        <span style="font-size:14px; color:#a3a3a3;">방치 시간</span>
        <span style="font-size:14px; font-weight:500; color:#fafafa;">15분</span>
      </div>
    </div>
  </div>

  <!-- Caution card -->
  <div style="margin:12px 20px 0; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); border-radius:14px; padding:16px 18px; display:flex; gap:12px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:2px;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <div>
      <div style="font-size:14px; font-weight:600; color:#fafafa;">이렇게는 하지 말아주세요</div>
      <div style="font-size:14px; color:#d4d4d4; margin-top:4px; line-height:21px;">약제 오래 두면 푸석해져요. 숱을 너무 많이 치면 붕 뜹니다.</div>
    </div>
  </div>

  <!-- Compare strip -->
  <div style="margin:20px 20px 0;">
    <div style="font-size:14px; font-weight:600; color:#fafafa; margin-bottom:10px;">이전 스타일과 비교</div>
    <div style="display:flex; gap:8px; overflow:hidden;">
      <div style="width:88px; flex-shrink:0;">
        <div style="aspect-ratio:3/4; border-radius:10px; background:#262626; display:flex; align-items:center; justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="font-size:11px; color:#a3a3a3; margin-top:6px; text-align:center;">3월 · 레이어드컷</div>
      </div>
      <div style="width:88px; flex-shrink:0;">
        <div style="aspect-ratio:3/4; border-radius:10px; background:#262626; display:flex; align-items:center; justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="font-size:11px; color:#a3a3a3; margin-top:6px; text-align:center;">1월 · 다크브라운</div>
      </div>
      <div style="width:88px; flex-shrink:0;">
        <div style="aspect-ratio:3/4; border-radius:10px; background:#262626; display:flex; align-items:center; justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="font-size:11px; color:#a3a3a3; margin-top:6px; text-align:center;">작년 11월 · 단발</div>
      </div>
      <div style="width:88px; flex-shrink:0;">
        <div style="aspect-ratio:3/4; border-radius:10px; background:#262626; display:flex; align-items:center; justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="font-size:11px; color:#a3a3a3; margin-top:6px; text-align:center;">작년 9월 · 허쉬컷</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
