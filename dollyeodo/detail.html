<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>돌려도돼 — 옷 상세</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: Inter, system-ui, sans-serif; color: #0a0a0a; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 40px; }
  .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon-lg { width: 28px; height: 28px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      <h2 style="font-size: 18px; font-weight: 600;">회색 캐시미어 니트</h2>
    </div>
    <svg class="icon" viewBox="0 0 24 24" style="color: #737373;"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
  </div>

  <!-- Big answer card -->
  <div style="margin: 0 20px 16px 20px; background: #171717; border-radius: 16px; padding: 24px; color: #fafafa;">
    <p style="font-size: 13px; color: #a3a3a3; font-weight: 500;">한 줄 요약</p>
    <p style="font-size: 20px; line-height: 28px; font-weight: 700; margin-top: 8px;">손세탁만, 건조기 절대 금지.<br>눕혀서 그늘 건조.</p>
  </div>

  <!-- Care grid -->
  <div style="padding: 0 20px;">
    <h3 style="font-size: 14px; font-weight: 600; color: #737373; margin-bottom: 10px;">세탁 규칙</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 10px;">

      <div style="width: calc(50% - 5px); background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
        <div style="width: 44px; height: 44px; border-radius: 10px; background: #fef3c7; color: #b45309; display: flex; align-items: center; justify-content: center;">
          <svg class="icon-lg" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
        </div>
        <div>
          <p style="font-size: 12px; color: #737373;">물세탁</p>
          <p style="font-size: 15px; font-weight: 600; margin-top: 2px;">손세탁만 (30° 이하)</p>
        </div>
      </div>

      <div style="width: calc(50% - 5px); background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
        <div style="width: 44px; height: 44px; border-radius: 10px; background: #fee2e2; color: #b91c1c; display: flex; align-items: center; justify-content: center;">
          <svg class="icon-lg" viewBox="0 0 24 24"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg>
        </div>
        <div>
          <p style="font-size: 12px; color: #737373;">건조기</p>
          <p style="font-size: 15px; font-weight: 600; margin-top: 2px; color: #b91c1c;">절대 금지</p>
        </div>
      </div>

      <div style="width: calc(50% - 5px); background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
        <div style="width: 44px; height: 44px; border-radius: 10px; background: #f5f5f5; color: #737373; display: flex; align-items: center; justify-content: center;">
          <svg class="icon-lg" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
        </div>
        <div>
          <p style="font-size: 12px; color: #737373;">건조 방법</p>
          <p style="font-size: 15px; font-weight: 600; margin-top: 2px;">눕혀서 그늘 건조</p>
        </div>
      </div>

      <div style="width: calc(50% - 5px); background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
        <div style="width: 44px; height: 44px; border-radius: 10px; background: #fee2e2; color: #b91c1c; display: flex; align-items: center; justify-content: center;">
          <svg class="icon-lg" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        </div>
        <div>
          <p style="font-size: 12px; color: #737373;">다림질</p>
          <p style="font-size: 15px; font-weight: 600; margin-top: 2px; color: #b91c1c;">금지</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Label photo -->
  <div style="padding: 20px;">
    <h3 style="font-size: 14px; font-weight: 600; color: #737373; margin-bottom: 10px;">케어라벨 원본</h3>
    <div style="background: #f5f5f5; border: 1px dashed #e5e5e5; border-radius: 12px; height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #a3a3a3;">
      <svg class="icon-lg" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      <span style="font-size: 13px;">라벨 사진 — 탭해서 크게 보기</span>
    </div>
  </div>

  <!-- Memo -->
  <div style="padding: 0 20px;">
    <h3 style="font-size: 14px; font-weight: 600; color: #737373; margin-bottom: 10px;">내 메모</h3>
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <p style="font-size: 14px; line-height: 22px; color: #0a0a0a;">지난번에 울샴푸로 빨았더니 괜찮았음. 탈수는 수건에 말아서 꾹꾹 누르기.</p>
    </div>
  </div>

  <!-- Wash history -->
  <div style="padding: 20px;">
    <h3 style="font-size: 14px; font-weight: 600; color: #737373; margin-bottom: 10px;">마지막 세탁</h3>
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg class="icon" viewBox="0 0 24 24" style="color: #737373;"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <span style="font-size: 14px; font-weight: 500;">7월 12일 (19일 전)</span>
      </div>
      <span style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 4px 12px; font-size: 12px; font-weight: 500;">오늘 세탁함</span>
    </div>
  </div>

</div>
</body>
</html>
