<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>돌려도돼 — 빨래 모드</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: Inter, system-ui, sans-serif; color: #0a0a0a; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 110px; }
  .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon-sm { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 24px 20px 8px 20px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      <h2 style="font-size: 20px; font-weight: 700;">빨래 모드</h2>
    </div>
    <p style="font-size: 14px; color: #737373; margin-top: 6px; margin-left: 32px;">오늘 빨 옷 5벌 — 이렇게 나눠서 돌려</p>
  </div>

  <!-- Group 1: 세탁기 OK -->
  <div style="margin: 16px 20px 0 20px;">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
      <div style="width: 28px; height: 28px; border-radius: 9999px; background: #dcfce7; color: #15803d; display: flex; align-items: center; justify-content: center;">
        <svg class="icon-sm" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h3 style="font-size: 15px; font-weight: 600;">세탁기 40° + 건조기 OK</h3>
      <span style="background: #f5f5f5; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500; color: #737373;">3벌</span>
    </div>
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden;">
      <div style="padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e5e5e5;">
        <div style="width: 36px; height: 36px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #737373;">
          <svg class="icon-sm" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
        </div>
        <span style="font-size: 14px; font-weight: 500;">기본 흰 티셔츠</span>
      </div>
      <div style="padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e5e5e5;">
        <div style="width: 36px; height: 36px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #737373;">
          <svg class="icon-sm" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
        </div>
        <span style="font-size: 14px; font-weight: 500;">회색 맨투맨</span>
      </div>
      <div style="padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 36px; height: 36px; border-radius: 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #737373;">
          <svg class="icon-sm" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
        </div>
        <span style="font-size: 14px; font-weight: 500;">청바지</span>
      </div>
    </div>
  </div>

  <!-- Group 2: 건조기 빼기 -->
  <div style="margin: 20px 20px 0 20px;">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
      <div style="width: 28px; height: 28px; border-radius: 9999px; background: #fef3c7; color: #b45309; display: flex; align-items: center; justify-content: center;">
        <svg class="icon-sm" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      </div>
      <h3 style="font-size: 15px; font-weight: 600;">같이 빨되, 건조기에서 빼기</h3>
      <span style="background: #f5f5f5; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500; color: #737373;">1벌</span>
    </div>
    <div style="background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 36px; height: 36px; border-radius: 8px; background: #fef3c7; display: flex; align-items: center; justify-content: center; color: #b45309;">
        <svg class="icon-sm" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
      </div>
      <div style="flex: 1;">
        <span style="font-size: 14px; font-weight: 500;">화이트 린넨 셔츠</span>
        <p style="font-size: 12px; color: #b45309; margin-top: 2px;">세탁 후 꺼내서 옷걸이 건조</p>
      </div>
    </div>
  </div>

  <!-- Group 3: 따로 -->
  <div style="margin: 20px 20px 0 20px;">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
      <div style="width: 28px; height: 28px; border-radius: 9999px; background: #fee2e2; color: #b91c1c; display: flex; align-items: center; justify-content: center;">
        <svg class="icon-sm" viewBox="0 0 24 24"><path d="M4.929 4.929 19.07 19.071"/><circle cx="12" cy="12" r="10"/></svg>
      </div>
      <h3 style="font-size: 15px; font-weight: 600;">세탁기 넣지 마</h3>
      <span style="background: #f5f5f5; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500; color: #737373;">1벌</span>
    </div>
    <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 36px; height: 36px; border-radius: 8px; background: #fee2e2; display: flex; align-items: center; justify-content: center; color: #b91c1c;">
        <svg class="icon-sm" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
      </div>
      <div style="flex: 1;">
        <span style="font-size: 14px; font-weight: 500;">회색 캐시미어 니트</span>
        <p style="font-size: 12px; color: #b91c1c; margin-top: 2px;">손세탁만 — 울샴푸, 눕혀서 건조</p>
      </div>
    </div>
  </div>

  <!-- Bottom CTA -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px 32px 20px; background: #ffffff; border-top: 1px solid #e5e5e5;">
    <div style="background: #171717; color: #fafafa; border-radius: 10px; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600;">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      세탁 완료 기록하기
    </div>
  </div>

</div>
</body>
</html>
