<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>돌려도돼 — 홈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: Inter, system-ui, sans-serif; color: #0a0a0a; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 96px; }
  .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon-sm { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 24px 20px 16px 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h1 style="font-size: 24px; line-height: 32px; font-weight: 800; letter-spacing: -0.025em;">돌려도돼</h1>
      <div style="width: 40px; height: 40px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #737373;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>
    <p style="font-size: 14px; line-height: 20px; color: #737373; margin-top: 4px;">내 옷 23벌의 세탁법을 기억 중</p>
  </div>

  <!-- Search -->
  <div style="padding: 0 20px 12px 20px;">
    <div style="display: flex; align-items: center; gap: 8px; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px; color: #737373;">
      <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span style="font-size: 14px;">회색 니트, 린넨 셔츠…</span>
    </div>
  </div>

  <!-- Filter chips -->
  <div style="display: flex; gap: 8px; padding: 0 20px 16px 20px; overflow-x: hidden;">
    <div style="background: #171717; color: #fafafa; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500; white-space: nowrap;">전체</div>
    <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500; white-space: nowrap;">건조기 가능</div>
    <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500; white-space: nowrap;">건조기 금지</div>
    <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500; white-space: nowrap;">드라이만</div>
  </div>

  <!-- Clothes list -->
  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 10px;">

    <!-- Item 1 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; display: flex; gap: 12px; align-items: center;">
      <div style="width: 48px; height: 48px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #737373; flex-shrink: 0;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 15px; font-weight: 600;">회색 캐시미어 니트</span>
        </div>
        <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
          <span style="display: inline-flex; align-items: center; gap: 4px; background: #fef3c7; color: #b45309; border-radius: 9999px; padding: 3px 8px; font-size: 11px; font-weight: 500;">
            <svg class="icon-sm" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>손세탁만
          </span>
          <span style="display: inline-flex; align-items: center; gap: 4px; background: #fee2e2; color: #b91c1c; border-radius: 9999px; padding: 3px 8px; font-size: 11px; font-weight: 500;">
            <svg class="icon-sm" viewBox="0 0 24 24"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg>건조기 금지
          </span>
        </div>
      </div>
      <svg class="icon" viewBox="0 0 24 24" style="color: #a3a3a3; width:16px;height:16px;"><path d="m9 18 6-6-6-6"/></svg>
    </div>

    <!-- Item 2 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; display: flex; gap: 12px; align-items: center;">
      <div style="width: 48px; height: 48px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #737373; flex-shrink: 0;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <span style="font-size: 15px; font-weight: 600;">화이트 린넨 셔츠</span>
        <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
          <span style="display: inline-flex; align-items: center; gap: 4px; background: #dcfce7; color: #15803d; border-radius: 9999px; padding: 3px 8px; font-size: 11px; font-weight: 500;">
            <svg class="icon-sm" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>물세탁 30°
          </span>
          <span style="display: inline-flex; align-items: center; gap: 4px; background: #fee2e2; color: #b91c1c; border-radius: 9999px; padding: 3px 8px; font-size: 11px; font-weight: 500;">
            <svg class="icon-sm" viewBox="0 0 24 24"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg>건조기 금지
          </span>
          <span style="display: inline-flex; align-items: center; gap: 4px; background: #fef3c7; color: #b45309; border-radius: 9999px; padding: 3px 8px; font-size: 11px; font-weight: 500;">
            <svg class="icon-sm" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>다림질 중온
          </span>
        </div>
      </div>
      <svg class="icon" viewBox="0 0 24 24" style="color: #a3a3a3; width:16px;height:16px;"><path d="m9 18 6-6-6-6"/></svg>
    </div>

    <!-- Item 3 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; display: flex; gap: 12px; align-items: center;">
      <div style="width: 48px; height: 48px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #737373; flex-shrink: 0;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <span style="font-size: 15px; font-weight: 600;">네이비 수트 자켓</span>
        <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
          <span style="display: inline-flex; align-items: center; gap: 4px; background: #dbeafe; color: #1d4ed8; border-radius: 9999px; padding: 3px 8px; font-size: 11px; font-weight: 500;">
            <svg class="icon-sm" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>드라이클리닝만
          </span>
        </div>
      </div>
      <svg class="icon" viewBox="0 0 24 24" style="color: #a3a3a3; width:16px;height:16px;"><path d="m9 18 6-6-6-6"/></svg>
    </div>

    <!-- Item 4 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; display: flex; gap: 12px; align-items: center;">
      <div style="width: 48px; height: 48px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; color: #737373; flex-shrink: 0;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <span style="font-size: 15px; font-weight: 600;">기본 흰 티셔츠</span>
        <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
          <span style="display: inline-flex; align-items: center; gap: 4px; background: #dcfce7; color: #15803d; border-radius: 9999px; padding: 3px 8px; font-size: 11px; font-weight: 500;">
            <svg class="icon-sm" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>물세탁 40°
          </span>
          <span style="display: inline-flex; align-items: center; gap: 4px; background: #dcfce7; color: #15803d; border-radius: 9999px; padding: 3px 8px; font-size: 11px; font-weight: 500;">
            <svg class="icon-sm" viewBox="0 0 24 24"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></svg>건조기 OK
          </span>
        </div>
      </div>
      <svg class="icon" viewBox="0 0 24 24" style="color: #a3a3a3; width:16px;height:16px;"><path d="m9 18 6-6-6-6"/></svg>
    </div>

  </div>

  <!-- FAB -->
  <div style="position: absolute; bottom: 92px; right: 20px; width: 56px; height: 56px; border-radius: 9999px; background: #171717; color: #fafafa; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);">
    <svg class="icon" viewBox="0 0 24 24" style="width:24px;height:24px;"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
  </div>

  <!-- Bottom nav -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #e5e5e5; display: flex; padding: 10px 0 24px 0;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #171717;">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
      <span style="font-size: 11px; font-weight: 600;">옷장</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a3a3a3;">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h3"/><path d="M17 6h.01"/><rect width="18" height="20" x="3" y="2" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M12 18a2.5 2.5 0 0 0 0-5 2.5 2.5 0 0 1 0-5"/></svg>
      <span style="font-size: 11px; font-weight: 500;">빨래 모드</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a3a3a3;">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span style="font-size: 11px; font-weight: 500;">기호 사전</span>
    </div>
  </div>

</div>
</body>
</html>
