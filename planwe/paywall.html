<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlanWe · Plus</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Inter, system-ui, sans-serif; background:#e5e5e5; display:flex; justify-content:center; min-height:100vh; }
  .frame { width:100%; max-width:390px; min-height:844px; background:#fafafa; position:relative; display:flex; flex-direction:column; }
</style>
</head>
<body>
<div class="frame">
  <!-- hero -->
  <div style="background:linear-gradient(160deg, #0f766e 0%, #134e4a 100%); padding:56px 24px 32px; border-radius:0 0 28px 28px; position:relative;">
    <div style="position:absolute; top:52px; right:20px; width:32px; height:32px; border-radius:9999px; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>
    <div style="width:56px; height:56px; border-radius:16px; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    </div>
    <h1 style="font-size:28px; line-height:34px; font-weight:800; letter-spacing:-0.02em; color:#ffffff; margin-top:18px;">PlanWe Plus</h1>
    <p style="font-size:15px; line-height:22px; color:#99f6e4; margin-top:8px;">준비의 모든 순간을 더 편하게.<br>한 명만 구독해도 방 전체가 누려요.</p>
  </div>

  <div style="padding:24px 20px 0; flex:1;">
    <!-- benefits -->
    <div style="display:flex; flex-direction:column; gap:14px;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="width:42px; height:42px; border-radius:12px; background:#f0fdfa; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v1H8a4 4 0 0 0 0 8h1v1a3 3 0 0 0 6 0v-1h1a4 4 0 0 0 0-8h-1V6a3 3 0 0 0-3-3z"/><path d="M9 12h.01M15 12h.01"/></svg>
        </div>
        <div>
          <div style="font-size:15px; font-weight:600; color:#0a0a0a;">AI 입력 무제한</div>
          <div style="font-size:13px; color:#737373; margin-top:1px;">말하듯 기록하고, 언제든 물어보세요</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="width:42px; height:42px; border-radius:12px; background:#f0fdfa; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        </div>
        <div>
          <div style="font-size:15px; font-weight:600; color:#0a0a0a;">방 무제한</div>
          <div style="font-size:13px; color:#737373; margin-top:1px;">결혼도, 여행도, 이사도 동시에</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="width:42px; height:42px; border-radius:12px; background:#f0fdfa; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.73 21a2 2 0 0 1-3.46 0"/><path d="M18.63 13A17.89 17.89 0 0 1 18 8"/><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.33-5"/><path d="M1 1l22 22"/></svg>
        </div>
        <div>
          <div style="font-size:15px; font-weight:600; color:#0a0a0a;">광고 제거</div>
          <div style="font-size:13px; color:#737373; margin-top:1px;">방해 없이 깔끔한 화면</div>
        </div>
      </div>
    </div>

    <!-- shared benefit callout -->
    <div style="margin-top:20px; background:#fffbeb; border:1px solid #fde68a; border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:12px;">
      <div style="display:flex; flex-shrink:0;">
        <span style="width:28px; height:28px; border-radius:9999px; background:#0f766e; color:#fff; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; border:2px solid #fffbeb;">윤</span>
        <span style="width:28px; height:28px; border-radius:9999px; background:#f59e0b; color:#fff; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; margin-left:-10px; border:2px solid #fffbeb;">소</span>
      </div>
      <div style="font-size:13px; line-height:19px; color:#78350f;"><b>1명만 구독하면 방 전체 혜택.</b> 함께 쓰는 사람 모두 Plus가 돼요.</div>
    </div>

    <!-- plans -->
    <div style="display:flex; gap:10px; margin-top:22px;">
      <!-- yearly -->
      <div style="flex:1; background:#ffffff; border:2px solid #0f766e; border-radius:14px; padding:16px 14px; position:relative;">
        <span style="position:absolute; top:-10px; left:12px; background:#0f766e; color:#fff; font-size:11px; font-weight:700; border-radius:9999px; padding:3px 10px;">17% 할인</span>
        <div style="font-size:13px; font-weight:600; color:#737373; margin-top:4px;">연간</div>
        <div style="font-size:20px; font-weight:800; color:#0a0a0a; margin-top:4px; letter-spacing:-0.01em;">₩29,000</div>
        <div style="font-size:12px; color:#a3a3a3; margin-top:2px;">월 ₩2,417 꼴</div>
      </div>
      <!-- monthly -->
      <div style="flex:1; background:#ffffff; border:1px solid #e5e5e5; border-radius:14px; padding:16px 14px;">
        <div style="font-size:13px; font-weight:600; color:#737373; margin-top:4px;">월간</div>
        <div style="font-size:20px; font-weight:800; color:#0a0a0a; margin-top:4px; letter-spacing:-0.01em;">₩2,900</div>
        <div style="font-size:12px; color:#a3a3a3; margin-top:2px;">매월 결제</div>
      </div>
    </div>
  </div>

  <!-- CTA -->
  <div style="padding:16px 20px 40px;">
    <div style="background:#0f766e; border-radius:14px; height:54px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 16px rgba(15,118,110,0.3);">
      <span style="font-size:16px; font-weight:700; color:#ffffff;">Plus 시작하기</span>
    </div>
    <div style="display:flex; justify-content:center; gap:16px; margin-top:14px;">
      <span style="font-size:12px; color:#a3a3a3;">구매 복원</span>
      <span style="font-size:12px; color:#d4d4d4;">·</span>
      <span style="font-size:12px; color:#a3a3a3;">이용약관</span>
      <span style="font-size:12px; color:#d4d4d4;">·</span>
      <span style="font-size:12px; color:#a3a3a3;">개인정보 처리방침</span>
    </div>
    <p style="text-align:center; font-size:11px; line-height:16px; color:#d4d4d4; margin-top:10px;">구독은 언제든 해지할 수 있어요. 결제는 App Store 계정으로 청구됩니다.</p>
  </div>
</div>

</html>
