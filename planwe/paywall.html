<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlanWe — Plus</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#EEECE9;display:flex;justify-content:center;min-height:100vh}
.frame{width:100%;max-width:390px;min-height:100vh;background:linear-gradient(175deg,#134E48 0%,#0F766E 42%,#FAFAF9 42.2%);display:flex;flex-direction:column}
.feat{display:flex;align-items:center;gap:12px}
.feat .ic{width:38px;height:38px;border-radius:11px;background:#F0FDFA;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>
<div class="frame">
  <div style="height:48px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 6px;font-size:14px;font-weight:600;color:#ffffff">
    <span>9:41</span>
    <span style="display:flex;gap:5px;align-items:center">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#ffffff"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="22" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="19" height="11" rx="3" stroke="#ffffff"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="#ffffff"/><path d="M21.5 4v4a2 2 0 0 0 0-4Z" fill="#ffffff"/></svg>
    </span>
  </div>

  <!-- close -->
  <div style="display:flex;justify-content:flex-end;padding:8px 16px 0">
    <button style="width:32px;height:32px;border-radius:9999px;background:rgba(255,255,255,0.16);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <!-- hero -->
  <div style="padding:8px 28px 26px;text-align:center">
    <div style="display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.25);border-radius:9999px;padding:7px 15px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
      <span style="font-size:13px;font-weight:800;color:#ffffff;letter-spacing:0.02em">PlanWe Plus</span>
    </div>
    <h1 style="margin-top:16px;font-size:26px;line-height:34px;font-weight:800;letter-spacing:-0.02em;color:#ffffff">둘이 준비하는 큰 일,<br>AI가 전부 받아 적을게요</h1>
    <!-- room-wide benefit highlight -->
    <div style="margin-top:16px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.95);border-radius:12px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,0.18)">
      <div style="display:flex">
        <div style="width:24px;height:24px;border-radius:9999px;background:#0F766E;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff">윤</div>
        <div style="width:24px;height:24px;border-radius:9999px;background:#F59E0B;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;margin-left:-7px">소</div>
      </div>
      <span style="font-size:13px;font-weight:700;color:#134E48">1명만 구독해도 방 전체가 Plus</span>
    </div>
  </div>

  <!-- feature card -->
  <div style="margin:0 20px;background:#ffffff;border:1px solid #E7E5E4;border-radius:20px;padding:22px 20px;box-shadow:0 12px 32px rgba(0,0,0,0.08);display:flex;flex-direction:column;gap:18px">
    <div class="feat">
      <div class="ic">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:700;color:#1C1917">AI 입력 무제한</div>
        <div style="font-size:12px;color:#78716C;margin-top:2px">월 20회 제한 없이 말하듯 기록 · 질문</div>
      </div>
    </div>
    <div class="feat">
      <div class="ic">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a2 2 0 0 1 .7-1.5l7-6.1a2 2 0 0 1 2.6 0l7 6.1A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M12 22V12"/><path d="M8 12h8"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:700;color:#1C1917">방 무제한</div>
        <div style="font-size:12px;color:#78716C;margin-top:2px">결혼 준비 + 신혼여행 + 이사, 동시에</div>
      </div>
    </div>
    <div class="feat">
      <div class="ic">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13.5 8.5-5 5"/><path d="m8.5 8.5 5 5"/><circle cx="12" cy="12" r="10"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:700;color:#1C1917">광고 제거</div>
        <div style="font-size:12px;color:#78716C;margin-top:2px">배너 없이 깔끔한 화면</div>
      </div>
    </div>
  </div>

  <!-- plans -->
  <div style="margin:16px 20px 0;display:flex;flex-direction:column;gap:10px">
    <!-- yearly (selected) -->
    <div style="position:relative;border:1.5px solid #0F766E;background:#F0FDFA;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:12px">
      <span style="position:absolute;top:-10px;right:14px;background:#F59E0B;color:#ffffff;font-size:11px;font-weight:800;border-radius:9999px;padding:3px 10px">2개월 무료</span>
      <div style="width:22px;height:22px;border-radius:9999px;background:#0F766E;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:800;color:#134E48">연간</div>
        <div style="font-size:12px;color:#0F766E;margin-top:1px">₩29,000/년 · 월 ₩2,417꼴</div>
      </div>
      <span style="font-size:17px;font-weight:800;color:#134E48">₩29,000</span>
    </div>
    <!-- monthly -->
    <div style="border:1px solid #E7E5E4;background:#ffffff;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:12px">
      <div style="width:22px;height:22px;border-radius:9999px;border:2px solid #D6D3D1;flex-shrink:0"></div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:700;color:#1C1917">월간</div>
        <div style="font-size:12px;color:#A8A29E;margin-top:1px">언제든 해지 가능</div>
      </div>
      <span style="font-size:17px;font-weight:800;color:#1C1917">₩2,900<span style="font-size:12px;font-weight:500;color:#A8A29E">/월</span></span>
    </div>
  </div>

  <!-- CTA -->
  <div style="padding:18px 20px 0;margin-top:auto">
    <button style="width:100%;height:54px;background:#0F766E;color:#ffffff;border:none;border-radius:15px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(15,118,110,0.3)">Plus 시작하기</button>
    <div style="display:flex;justify-content:center;gap:18px;padding:14px 0 30px">
      <span style="font-size:12px;color:#A8A29E">구매 복원</span>
      <span style="font-size:12px;color:#A8A29E">이용약관</span>
      <span style="font-size:12px;color:#A8A29E">개인정보 처리방침</span>
    </div>
  </div>
</div>
</body>
</html>
