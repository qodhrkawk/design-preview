<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlanWe · 투두</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Inter, system-ui, sans-serif; background:#e5e5e5; display:flex; justify-content:center; min-height:100vh; }
  .frame { width:100%; max-width:390px; min-height:844px; background:#fafafa; position:relative; }
  .scroll { padding:0 20px 200px; }
  .card { background:#ffffff; border:1px solid #e5e5e5; border-radius:14px; }
</style>
</head>
<body>
<div class="frame">
  <div style="height:48px;"></div>

  <!-- header -->
  <div style="padding:8px 20px 0; display:flex; align-items:center; justify-content:space-between;">
    <h2 style="font-size:26px; font-weight:700; letter-spacing:-0.02em; color:#0a0a0a;">투두</h2>
    <div style="width:38px; height:38px; border-radius:9999px; background:#0f766e; display:flex; align-items:center; justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  </div>

  <!-- segment -->
  <div style="padding:16px 20px 0;">
    <div style="display:flex; background:#f0f0f0; border-radius:10px; padding:3px;">
      <div style="flex:1; text-align:center; padding:8px; background:#ffffff; border-radius:8px; font-size:14px; font-weight:600; color:#0a0a0a; box-shadow:0 1px 2px rgba(0,0,0,0.06);">마감</div>
      <div style="flex:1; text-align:center; padding:8px; font-size:14px; font-weight:500; color:#737373;">예약</div>
    </div>
  </div>

  <!-- assignee chips -->
  <div style="padding:14px 20px 0; display:flex; gap:8px;">
    <span style="font-size:13px; font-weight:600; color:#fafafa; background:#0a0a0a; border-radius:9999px; padding:6px 14px;">전체</span>
    <span style="font-size:13px; font-weight:500; color:#171717; background:#ffffff; border:1px solid #e5e5e5; border-radius:9999px; padding:6px 14px; display:flex; align-items:center; gap:6px;"><span style="width:14px; height:14px; border-radius:9999px; background:#0f766e; color:#fff; font-size:8px; display:flex; align-items:center; justify-content:center;">윤</span>윤재</span>
    <span style="font-size:13px; font-weight:500; color:#171717; background:#ffffff; border:1px solid #e5e5e5; border-radius:9999px; padding:6px 14px; display:flex; align-items:center; gap:6px;"><span style="width:14px; height:14px; border-radius:9999px; background:#f59e0b; color:#fff; font-size:8px; display:flex; align-items:center; justify-content:center;">소</span>소정</span>
  </div>

  <div class="scroll">
    <!-- date group: 이번 주 -->
    <div style="padding:20px 4px 8px; font-size:13px; font-weight:600; color:#737373;">이번 주</div>
    <div class="card" style="overflow:hidden;">
      <div style="padding:15px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f5f5f5;">
        <span style="width:22px; height:22px; border:2px solid #d4d4d4; border-radius:7px; flex-shrink:0;"></span>
        <div style="flex:1;"><div style="font-size:15px; font-weight:500; color:#0a0a0a;">청첩장 시안 확정</div><div style="font-size:12px; color:#a3a3a3; margin-top:2px;">9/17 마감</div></div>
        <span style="width:22px; height:22px; border-radius:9999px; background:#f59e0b; color:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center;">소</span>
      </div>
      <div style="padding:15px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f5f5f5;">
        <span style="width:22px; height:22px; border:2px solid #d4d4d4; border-radius:7px; flex-shrink:0;"></span>
        <div style="flex:1;"><div style="font-size:15px; font-weight:500; color:#0a0a0a;">본식 스냅 계약</div><div style="font-size:12px; color:#a3a3a3; margin-top:2px;">9/19 마감</div></div>
        <span style="width:22px; height:22px; border-radius:9999px; background:#0f766e; color:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center;">윤</span>
      </div>
      <div style="padding:15px 16px; display:flex; align-items:center; gap:12px;">
        <span style="width:22px; height:22px; border:2px solid #d4d4d4; border-radius:7px; flex-shrink:0;"></span>
        <div style="flex:1;"><div style="font-size:15px; font-weight:500; color:#0a0a0a;">예물 방문 예약</div><div style="font-size:12px; color:#a3a3a3; margin-top:2px;">9/22 마감</div></div>
        <span style="width:22px; height:22px; border-radius:9999px; background:#f59e0b; color:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center;">소</span>
      </div>
    </div>

    <!-- date group: 완료 -->
    <div style="padding:24px 4px 8px; font-size:13px; font-weight:600; color:#737373;">완료</div>
    <div class="card" style="overflow:hidden;">
      <div style="padding:15px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f5f5f5;">
        <span style="width:22px; height:22px; background:#0f766e; border-radius:7px; flex-shrink:0; display:flex; align-items:center; justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        <div style="flex:1;"><div style="font-size:15px; font-weight:500; color:#a3a3a3; text-decoration:line-through;">웨딩홀 계약</div></div>
        <span style="width:22px; height:22px; border-radius:9999px; background:#e5e5e5; color:#737373; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center;">윤</span>
      </div>
      <div style="padding:15px 16px; display:flex; align-items:center; gap:12px;">
        <span style="width:22px; height:22px; background:#0f766e; border-radius:7px; flex-shrink:0; display:flex; align-items:center; justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        <div style="flex:1;"><div style="font-size:15px; font-weight:500; color:#a3a3a3; text-decoration:line-through;">스튜디오 촬영</div></div>
        <span style="width:22px; height:22px; border-radius:9999px; background:#e5e5e5; color:#737373; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center;">소</span>
      </div>
    </div>
  </div>

  <!-- AdMob + tab bar -->
  <div style="position:fixed; bottom:0; left:0; right:0; max-width:390px; margin:0 auto;">
    <div style="height:50px; background:#f0f0f0; border-top:1px solid #e5e5e5; display:flex; align-items:center; justify-content:center;"><span style="font-size:11px; color:#a3a3a3; letter-spacing:0.05em;">AdMob 배너 320×50</span></div>
    <div style="height:84px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; align-items:flex-start; padding:10px 8px 0;">
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">홈</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3M16 6H3M21 18H3"/><path d="M18 9l2 2 3-3"/></svg>
        <span style="font-size:10px; font-weight:600; color:#0f766e;">투두</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
        <div style="width:56px; height:56px; border-radius:9999px; background:#0f766e; display:flex; align-items:center; justify-content:center; margin-top:-24px; box-shadow:0 8px 16px rgba(15,118,110,0.35);">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v1H8a4 4 0 0 0 0 8h1v1a3 3 0 0 0 6 0v-1h1a4 4 0 0 0 0-8h-1V6a3 3 0 0 0-3-3z"/><path d="M9 12h.01M15 12h.01"/></svg>
        </div>
        <span style="font-size:10px; font-weight:600; color:#0f766e; margin-top:2px;">AI</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">지출</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">설정</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
