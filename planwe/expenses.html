<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlanWe · 지출</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Inter, system-ui, sans-serif; background:#e5e5e5; display:flex; justify-content:center; min-height:100vh; }
  .frame { width:100%; max-width:390px; min-height:844px; background:#fafafa; position:relative; }
  .scroll { padding:0 20px 200px; }
  .card { background:#ffffff; border:1px solid #e5e5e5; border-radius:14px; }
</style>
</head>
<body>
<div class="frame">
  <div style="height:48px;"></div>

  <!-- header -->
  <div style="padding:8px 20px 0; display:flex; align-items:center; justify-content:space-between;">
    <h2 style="font-size:26px; font-weight:700; letter-spacing:-0.02em; color:#0a0a0a;">지출</h2>
    <div style="width:38px; height:38px; border-radius:9999px; background:#0f766e; display:flex; align-items:center; justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  </div>

  <!-- member split header -->
  <div style="padding:14px 20px 0;">
    <div class="card" style="padding:16px; display:flex; gap:10px;">
      <div style="flex:1; text-align:center; padding:6px 0;">
        <div style="display:flex; align-items:center; justify-content:center; gap:5px;"><span style="width:16px; height:16px; border-radius:9999px; background:#0f766e; color:#fff; font-size:9px; display:flex; align-items:center; justify-content:center;">윤</span><span style="font-size:12px; color:#737373;">윤재</span></div>
        <div style="font-size:17px; font-weight:700; color:#0a0a0a; margin-top:6px;">1,180만</div>
      </div>
      <div style="width:1px; background:#f0f0f0;"></div>
      <div style="flex:1; text-align:center; padding:6px 0;">
        <div style="display:flex; align-items:center; justify-content:center; gap:5px;"><span style="width:16px; height:16px; border-radius:9999px; background:#f59e0b; color:#fff; font-size:9px; display:flex; align-items:center; justify-content:center;">소</span><span style="font-size:12px; color:#737373;">소정</span></div>
        <div style="font-size:17px; font-weight:700; color:#0a0a0a; margin-top:6px;">1,420만</div>
      </div>
      <div style="width:1px; background:#f0f0f0;"></div>
      <div style="flex:1; text-align:center; padding:6px 0;">
        <div style="font-size:12px; color:#737373;">합계</div>
        <div style="font-size:17px; font-weight:700; color:#0f766e; margin-top:6px;">2,600만</div>
      </div>
    </div>
  </div>

  <!-- segment -->
  <div style="padding:14px 20px 0;">
    <div style="display:flex; background:#f0f0f0; border-radius:10px; padding:3px;">
      <div style="flex:1; text-align:center; padding:8px; background:#ffffff; border-radius:8px; font-size:14px; font-weight:600; color:#0a0a0a; box-shadow:0 1px 2px rgba(0,0,0,0.06);">결제 완료</div>
      <div style="flex:1; text-align:center; padding:8px; font-size:14px; font-weight:500; color:#737373;">결제 예정</div>
    </div>
  </div>

  <div class="scroll">
    <!-- category budget bars -->
    <div style="padding:20px 4px 8px; font-size:13px; font-weight:600; color:#737373;">카테고리별 예산</div>
    <div class="card" style="padding:16px; display:flex; flex-direction:column; gap:16px;">
      <div>
        <div style="display:flex; justify-content:space-between; margin-bottom:7px;"><span style="font-size:14px; font-weight:500; color:#0a0a0a;">예식장</span><span style="font-size:13px; color:#737373;">1,800 / <b style="color:#0a0a0a;">2,000만</b></span></div>
        <div style="height:8px; background:#f5f5f5; border-radius:9999px; overflow:hidden;"><div style="width:90%; height:100%; background:#0f766e; border-radius:9999px;"></div></div>
      </div>
      <div>
        <div style="display:flex; justify-content:space-between; margin-bottom:7px;"><span style="font-size:14px; font-weight:500; color:#0a0a0a;">스드메</span><span style="font-size:13px; color:#737373;">520 / <b style="color:#0a0a0a;">600만</b></span></div>
        <div style="height:8px; background:#f5f5f5; border-radius:9999px; overflow:hidden;"><div style="width:87%; height:100%; background:#0f766e; border-radius:9999px;"></div></div>
      </div>
      <div>
        <div style="display:flex; justify-content:space-between; margin-bottom:7px;"><span style="font-size:14px; font-weight:500; color:#0a0a0a;">신혼여행</span><span style="font-size:13px; color:#ef4444;">720 / <b style="color:#0a0a0a;">700만</b></span></div>
        <div style="height:8px; background:#fef2f2; border-radius:9999px; overflow:hidden;"><div style="width:100%; height:100%; background:#ef4444; border-radius:9999px;"></div></div>
      </div>
    </div>

    <!-- expense list -->
    <div style="padding:24px 4px 8px; font-size:13px; font-weight:600; color:#737373;">9월</div>
    <div class="card" style="overflow:hidden;">
      <div style="padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f5f5f5;">
        <div style="width:38px; height:38px; border-radius:10px; background:#f0fdfa; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        <div style="flex:1;"><div style="font-size:14px; font-weight:600; color:#0a0a0a;">스튜디오 계약금</div><div style="font-size:12px; color:#a3a3a3; margin-top:1px;">9/15 · 소정 · 스드메</div></div>
        <span style="font-size:14px; font-weight:700; color:#0a0a0a;">75만</span>
      </div>
      <div style="padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f5f5f5;">
        <div style="width:38px; height:38px; border-radius:10px; background:#f0fdfa; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg></div>
        <div style="flex:1;"><div style="font-size:14px; font-weight:600; color:#0a0a0a;">예식장 계약금</div><div style="font-size:12px; color:#a3a3a3; margin-top:1px;">9/10 · 윤재 · 예식장</div><div style="display:inline-flex; align-items:center; gap:4px; margin-top:4px; font-size:11px; color:#0f766e; background:#f0fdfa; border-radius:6px; padding:2px 7px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h12M8 12h12M8 17h12M3 7h.01M3 12h.01M3 17h.01"/></svg>잔금 800만 예정</div></div>
        <span style="font-size:14px; font-weight:700; color:#0a0a0a;">200만</span>
      </div>
      <div style="padding:14px 16px; display:flex; align-items:center; gap:12px;">
        <div style="width:38px; height:38px; border-radius:10px; background:#f0fdfa; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9M14 17H5M17 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H5"/></svg></div>
        <div style="flex:1;"><div style="font-size:14px; font-weight:600; color:#0a0a0a;">예물 예약금</div><div style="font-size:12px; color:#a3a3a3; margin-top:1px;">9/8 · 윤재+소정 분할 · 예물</div></div>
        <span style="font-size:14px; font-weight:700; color:#0a0a0a;">120만</span>
      </div>
    </div>
  </div>

  <!-- AdMob + tab bar -->
  <div style="position:fixed; bottom:0; left:0; right:0; max-width:390px; margin:0 auto;">
    <div style="height:50px; background:#f0f0f0; border-top:1px solid #e5e5e5; display:flex; align-items:center; justify-content:center;"><span style="font-size:11px; color:#a3a3a3; letter-spacing:0.05em;">AdMob 배너 320×50</span></div>
    <div style="height:84px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; align-items:flex-start; padding:10px 8px 0;">
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">홈</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3M16 6H3M21 18H3"/><path d="M18 9l2 2 3-3"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">투두</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
        <div style="width:56px; height:56px; border-radius:9999px; background:#0f766e; display:flex; align-items:center; justify-content:center; margin-top:-24px; box-shadow:0 8px 16px rgba(15,118,110,0.35);">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v1H8a4 4 0 0 0 0 8h1v1a3 3 0 0 0 6 0v-1h1a4 4 0 0 0 0-8h-1V6a3 3 0 0 0-3-3z"/><path d="M9 12h.01M15 12h.01"/></svg>
        </div>
        <span style="font-size:10px; font-weight:600; color:#0f766e; margin-top:2px;">AI</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span style="font-size:10px; font-weight:600; color:#0f766e;">지출</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">설정</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
