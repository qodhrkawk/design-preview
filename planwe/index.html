<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanWe · 시안 v1 전체</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Inter, system-ui, sans-serif; background:#f0f0f0; padding:40px 24px 80px; }
  h1 { font-size:28px; font-weight:800; letter-spacing:-0.02em; color:#0a0a0a; }
  .sub { font-size:14px; color:#737373; margin-top:6px; }
  .grid { display:flex; flex-wrap:wrap; gap:32px; margin-top:32px; justify-content:center; }
  .shot { display:flex; flex-direction:column; gap:10px; }
  .shot .name { font-size:14px; font-weight:600; color:#0a0a0a; display:flex; align-items:center; gap:8px; }
  .shot .num { width:22px; height:22px; border-radius:9999px; background:#0f766e; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  iframe { width:390px; height:844px; border:1px solid #d4d4d4; border-radius:20px; background:#fff; }
  a { color:inherit; text-decoration:none; }
  .name a:hover { text-decoration:underline; }
</style>
</head>
