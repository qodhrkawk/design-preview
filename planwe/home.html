<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlanWe · 홈</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Inter, system-ui, sans-serif; background:#e5e5e5; display:flex; justify-content:center; min-height:100vh; }
  .frame { width:100%; max-width:390px; min-height:844px; background:#fafafa; position:relative; }
  .scroll { padding:0 20px 200px; }
  .card { background:#ffffff; border:1px solid #e5e5e5; border-radius:14px; }
</style>
</head>
<body>
<div class="frame">
  <div style="height:48px;"></div>

  <!-- top: room switcher + settings -->
  <div style="padding:6px 20px 0; display:flex; align-items:center; justify-content:space-between;">
    <div style="display:flex; align-items:center; gap:8px; background:#ffffff; border:1px solid #e5e5e5; border-radius:9999px; padding:7px 14px 7px 10px;">
      <div style="width:24px; height:24px; border-radius:8px; background:#0f766e; display:flex; align-items:center; justify-content:center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-4.5-8-11a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 6.5-8 11-8 11z"/></svg>
      </div>
      <span style="font-size:15px; font-weight:600; color:#0a0a0a;">우리 결혼</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <div style="width:28px; height:28px; border-radius:9999px; background:#0f766e; color:#fff; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center;">윤</div>
      <div style="width:28px; height:28px; border-radius:9999px; background:#f59e0b; color:#fff; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; margin-left:-12px; border:2px solid #fafafa;">소</div>
    </div>
  </div>

  <div class="scroll">
    <!-- D-day -->
    <div style="padding:20px 4px 12px;">
      <div style="font-size:13px; font-weight:500; color:#737373;">예식일까지</div>
      <div style="display:flex; align-items:baseline; gap:8px; margin-top:2px;">
        <span style="font-size:38px; line-height:40px; font-weight:800; letter-spacing:-0.03em; color:#0a0a0a;">D-88</span>
        <span style="font-size:14px; color:#a3a3a3;">2026. 12. 13 (토)</span>
      </div>
    </div>

    <!-- budget gauge -->
    <div class="card" style="padding:20px; margin-top:8px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:15px; font-weight:600; color:#0a0a0a;">예산 현황</span>
        <span style="font-size:13px; color:#737373;">총 <b style="color:#0a0a0a;">5,000</b>만원</span>
      </div>
      <!-- stacked bar -->
      <div style="display:flex; height:14px; border-radius:9999px; overflow:hidden; margin-top:16px; background:#f5f5f5;">
        <div style="width:52%; background:#0f766e;"></div>
        <div style="width:23%; background:#f59e0b;"></div>
      </div>
      <!-- legend -->
      <div style="display:flex; justify-content:space-between; margin-top:16px;">
        <div style="text-align:left;">
          <div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; border-radius:9999px; background:#0f766e;"></span><span style="font-size:12px; color:#737373;">집행</span></div>
          <div style="font-size:16px; font-weight:700; color:#0a0a0a; margin-top:3px;">2,600만</div>
        </div>
        <div style="text-align:center;">
          <div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; border-radius:9999px; background:#f59e0b;"></span><span style="font-size:12px; color:#737373;">예정</span></div>
          <div style="font-size:16px; font-weight:700; color:#0a0a0a; margin-top:3px;">1,150만</div>
        </div>
        <div style="text-align:right;">
          <div style="display:flex; align-items:center; gap:6px; justify-content:flex-end;"><span style="width:8px; height:8px; border-radius:9999px; background:#d4d4d4;"></span><span style="font-size:12px; color:#737373;">잔여</span></div>
          <div style="font-size:16px; font-weight:700; color:#0f766e; margin-top:3px;">1,250만</div>
        </div>
      </div>
    </div>

    <!-- 임박 투두 -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:24px; padding:0 4px;">
      <span style="font-size:16px; font-weight:700; color:#0a0a0a;">임박한 투두</span>
      <span style="font-size:13px; color:#0f766e; font-weight:500;">전체보기</span>
    </div>
    <div class="card" style="margin-top:10px; overflow:hidden;">
      <div style="padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f5f5f5;">
        <span style="width:20px; height:20px; border:2px solid #d4d4d4; border-radius:6px; flex-shrink:0;"></span>
        <div style="flex:1;"><div style="font-size:14px; font-weight:500; color:#0a0a0a;">청첩장 시안 확정</div></div>
        <span style="font-size:12px; font-weight:600; color:#ef4444; background:#fef2f2; border-radius:9999px; padding:3px 9px;">내일</span>
      </div>
      <div style="padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f5f5f5;">
        <span style="width:20px; height:20px; border:2px solid #d4d4d4; border-radius:6px; flex-shrink:0;"></span>
        <div style="flex:1;"><div style="font-size:14px; font-weight:500; color:#0a0a0a;">본식 스냅 계약</div></div>
        <span style="font-size:12px; font-weight:600; color:#f59e0b; background:#fffbeb; border-radius:9999px; padding:3px 9px;">3일 뒤</span>
      </div>
      <div style="padding:14px 16px; display:flex; align-items:center; gap:12px;">
        <span style="width:20px; height:20px; border:2px solid #d4d4d4; border-radius:6px; flex-shrink:0;"></span>
        <div style="flex:1;"><div style="font-size:14px; font-weight:500; color:#0a0a0a;">예물 방문 예약</div></div>
        <span style="font-size:12px; font-weight:600; color:#737373; background:#f5f5f5; border-radius:9999px; padding:3px 9px;">6일 뒤</span>
      </div>
    </div>

    <!-- 결제 예정 -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:24px; padding:0 4px;">
      <span style="font-size:16px; font-weight:700; color:#0a0a0a;">결제 예정</span>
      <span style="font-size:13px; color:#0f766e; font-weight:500;">전체보기</span>
    </div>
    <div class="card" style="margin-top:10px; overflow:hidden;">
      <div style="padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f5f5f5;">
        <div style="width:36px; height:36px; border-radius:10px; background:#f0fdfa; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></div>
        <div style="flex:1;"><div style="font-size:14px; font-weight:500; color:#0a0a0a;">예식장 잔금</div><div style="font-size:12px; color:#a3a3a3; margin-top:1px;">11/20 · 소정</div></div>
        <span style="font-size:14px; font-weight:700; color:#0a0a0a;">800만</span>
      </div>
      <div style="padding:14px 16px; display:flex; align-items:center; gap:12px;">
        <div style="width:36px; height:36px; border-radius:10px; background:#f0fdfa; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg></div>
        <div style="flex:1;"><div style="font-size:14px; font-weight:500; color:#0a0a0a;">신혼여행 항공권</div><div style="font-size:12px; color:#a3a3a3; margin-top:1px;">11/25 · 윤재</div></div>
        <span style="font-size:14px; font-weight:700; color:#0a0a0a;">350만</span>
      </div>
    </div>
  </div>

  <!-- AdMob banner + tab bar -->
  <div style="position:fixed; bottom:0; left:0; right:0; max-width:390px; margin:0 auto;">
    <div style="height:50px; background:#f0f0f0; border-top:1px solid #e5e5e5; display:flex; align-items:center; justify-content:center;">
      <span style="font-size:11px; color:#a3a3a3; letter-spacing:0.05em;">AdMob 배너 320×50</span>
    </div>
    <div style="height:84px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; align-items:flex-start; padding:10px 8px 0; position:relative;">
      <!-- home active -->
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span style="font-size:10px; font-weight:600; color:#0f766e;">홈</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3M16 6H3M21 18H3"/><path d="M18 9l2 2 3-3"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">투두</span>
      </div>
      <!-- AI FAB -->
      <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
        <div style="width:56px; height:56px; border-radius:9999px; background:#0f766e; display:flex; align-items:center; justify-content:center; margin-top:-24px; box-shadow:0 8px 16px rgba(15,118,110,0.35);">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v1H8a4 4 0 0 0 0 8h1v1a3 3 0 0 0 6 0v-1h1a4 4 0 0 0 0-8h-1V6a3 3 0 0 0-3-3z"/><path d="M9 12h.01M15 12h.01"/></svg>
        </div>
        <span style="font-size:10px; font-weight:600; color:#0f766e; margin-top:2px;">AI</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">지출</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">설정</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
