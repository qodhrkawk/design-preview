<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlanWe · AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Inter, system-ui, sans-serif; background:#e5e5e5; display:flex; justify-content:center; min-height:100vh; }
  .frame { width:100%; max-width:390px; min-height:844px; background:#fafafa; position:relative; display:flex; flex-direction:column; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid #f5f5f5; }
  .row:last-child { border-bottom:none; }
  .lbl { font-size:13px; color:#737373; }
  .val { font-size:14px; font-weight:600; color:#0a0a0a; display:flex; align-items:center; gap:6px; }
</style>
</head>
<body>
<div class="frame">
  <div style="height:48px;"></div>

  <!-- header + quota -->
  <div style="padding:8px 20px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #f0f0f0; background:#fafafa;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:34px; height:34px; border-radius:10px; background:#0f766e; display:flex; align-items:center; justify-content:center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v1H8a4 4 0 0 0 0 8h1v1a3 3 0 0 0 6 0v-1h1a4 4 0 0 0 0-8h-1V6a3 3 0 0 0-3-3z"/><path d="M9 12h.01M15 12h.01"/></svg>
      </div>
      <span style="font-size:18px; font-weight:700; color:#0a0a0a;">AI 입력</span>
    </div>
    <span style="font-size:12px; font-weight:600; color:#0f766e; background:#f0fdfa; border-radius:9999px; padding:5px 12px; display:flex; align-items:center; gap:5px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
      12 / 20 남음
    </span>
  </div>

  <!-- chat area -->
  <div style="flex:1; overflow-y:auto; padding:20px 16px 16px; display:flex; flex-direction:column; gap:14px;">
    <!-- assistant hint -->
    <div style="max-width:82%; align-self:flex-start; background:#ffffff; border:1px solid #e5e5e5; border-radius:4px 16px 16px 16px; padding:12px 14px;">
      <p style="font-size:14px; line-height:20px; color:#0a0a0a;">말하듯 입력해보세요. 지출·투두를 자동으로 정리해드려요.</p>
      <p style="font-size:12px; line-height:18px; color:#a3a3a3; margin-top:6px;">예) "어제 스튜디오 계약금 75만원 소정 카드로 냈어"</p>
    </div>

    <!-- user bubble -->
    <div style="max-width:82%; align-self:flex-end; background:#0f766e; border-radius:16px 16px 4px 16px; padding:12px 14px;">
      <p style="font-size:14px; line-height:20px; color:#ffffff;">어제 스튜디오 계약금 75만원 소정 카드로 냈어</p>
    </div>

    <!-- parsing confirm card -->
    <div style="max-width:88%; align-self:flex-start; width:88%;">
      <div style="background:#ffffff; border:1px solid #0f766e; border-radius:4px 16px 16px 16px; overflow:hidden; box-shadow:0 4px 12px rgba(15,118,110,0.10);">
        <!-- card header -->
        <div style="padding:12px 14px; background:#f0fdfa; display:flex; align-items:center; gap:8px; border-bottom:1px solid #ccfbf1;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span style="font-size:13px; font-weight:700; color:#0f766e;">지출로 인식했어요</span>
          <span style="margin-left:auto; font-size:11px; color:#0f766e; background:#ccfbf1; border-radius:9999px; padding:2px 8px;">확인 필요</span>
        </div>
        <!-- editable fields -->
        <div class="row"><span class="lbl">제목</span><span class="val">스튜디오 계약금 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></span></div>
        <div class="row"><span class="lbl">금액</span><span class="val" style="color:#0f766e; font-size:16px;">750,000원</span></div>
        <div class="row"><span class="lbl">결제자</span><span class="val"><span style="width:16px; height:16px; border-radius:9999px; background:#f59e0b; color:#fff; font-size:9px; display:flex; align-items:center; justify-content:center;">소</span>소정</span></div>
        <div class="row"><span class="lbl">수단</span><span class="val">소정 신한카드 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div>
        <div class="row"><span class="lbl">상태</span><span class="val"><span style="font-size:12px; font-weight:600; color:#0f766e; background:#f0fdfa; border-radius:9999px; padding:2px 9px;">결제 완료</span></span></div>
        <div class="row"><span class="lbl">날짜</span><span class="val">2026. 09. 15</span></div>
        <div class="row"><span class="lbl">카테고리</span><span class="val">스튜디오 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div>
        <!-- actions -->
        <div style="display:flex; gap:8px; padding:12px 14px; border-top:1px solid #f5f5f5;">
          <button style="flex:1; height:42px; border:1px solid #e5e5e5; border-radius:10px; background:#fff; color:#737373; font-size:14px; font-weight:600; cursor:pointer;">취소</button>
          <button style="flex:2; height:42px; border:none; border-radius:10px; background:#0f766e; color:#fafafa; font-size:14px; font-weight:600; cursor:pointer;">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- input bar -->
  <div style="padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:#ffffff; border-top:1px solid #e5e5e5; display:flex; align-items:center; gap:10px;">
    <div style="flex:1; height:44px; background:#f5f5f5; border-radius:9999px; display:flex; align-items:center; padding:0 16px;">
      <span style="font-size:14px; color:#a3a3a3;">메시지 입력…</span>
    </div>
    <button style="width:44px; height:44px; border:none; border-radius:9999px; background:#0f766e; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </div>
</div>
</body>
</html>
