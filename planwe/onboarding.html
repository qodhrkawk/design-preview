<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlanWe · 방 만들기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Inter, system-ui, sans-serif; background:#e5e5e5; display:flex; justify-content:center; min-height:100vh; }
  .frame { width:100%; max-width:390px; min-height:844px; background:#ffffff; position:relative; display:flex; flex-direction:column; }
  .tpl { border:1px solid #e5e5e5; border-radius:14px; padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:all .15s; }
  .tpl.sel { border-color:#0f766e; background:#f0fdfa; }
  .ic { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
</style>
</head>
<body>
<div class="frame">
  <div style="height:48px;"></div>

  <!-- header -->
  <div style="padding:8px 24px 0; display:flex; align-items:center; gap:14px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    <div style="flex:1; height:4px; background:#f5f5f5; border-radius:9999px; overflow:hidden;">
      <div style="width:33%; height:100%; background:#0f766e; border-radius:9999px;"></div>
    </div>
    <span style="font-size:13px; font-weight:500; color:#737373;">1/3</span>
  </div>

  <div style="padding:24px 24px 0;">
    <h2 style="font-size:26px; line-height:32px; font-weight:700; letter-spacing:-0.02em; color:#0a0a0a;">어떤 일을 준비해요?</h2>
    <p style="margin-top:8px; font-size:15px; line-height:22px; color:#737373;">템플릿을 고르면 투두와 지출 카테고리가<br>미리 채워져요.</p>
  </div>

  <!-- templates -->
  <div style="padding:24px; display:flex; flex-direction:column; gap:10px;">
    <div class="tpl sel">
      <div class="ic" style="background:#0f766e;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-4.5-8-11a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 6.5-8 11-8 11z"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:16px; font-weight:600; color:#0a0a0a;">결혼 준비</div>
        <div style="font-size:13px; color:#737373; margin-top:2px;">스드메·예식장·신혼여행 프리셋</div>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>

    <div class="tpl">
      <div class="ic" style="background:#f0fdfa;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:16px; font-weight:600; color:#0a0a0a;">여행</div>
        <div style="font-size:13px; color:#737373; margin-top:2px;">항공·숙소·교통·액티비티</div>
      </div>
    </div>

    <div class="tpl">
      <div class="ic" style="background:#f0fdfa;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:16px; font-weight:600; color:#0a0a0a;">이사</div>
        <div style="font-size:13px; color:#737373; margin-top:2px;">계약·이삿짐·가전·인테리어</div>
      </div>
    </div>

    <div class="tpl">
      <div class="ic" style="background:#f0fdfa;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:16px; font-weight:600; color:#0a0a0a;">이벤트</div>
        <div style="font-size:13px; color:#737373; margin-top:2px;">파티·기념일·모임 준비</div>
      </div>
    </div>

    <div class="tpl">
      <div class="ic" style="background:#f5f5f5;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:16px; font-weight:600; color:#0a0a0a;">빈 방에서 시작</div>
        <div style="font-size:13px; color:#737373; margin-top:2px;">직접 항목을 추가할게요</div>
      </div>
    </div>
  </div>

  <div style="flex:1;"></div>

  <!-- CTA -->
  <div style="padding:0 24px 44px;">
    <button style="width:100%; height:52px; border:none; border-radius:12px; background:#0f766e; color:#fafafa; font-size:15px; font-weight:600; cursor:pointer;">다음</button>
  </div>
</div>
</body>
</html>
