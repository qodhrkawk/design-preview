<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlanWe · 설정</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Inter, system-ui, sans-serif; background:#e5e5e5; display:flex; justify-content:center; min-height:100vh; }
  .frame { width:100%; max-width:390px; min-height:844px; background:#fafafa; position:relative; }
  .scroll { padding:0 20px 200px; }
  .card { background:#ffffff; border:1px solid #e5e5e5; border-radius:14px; }
  .row { padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .sect { padding:24px 4px 8px; font-size:13px; font-weight:600; color:#737373; }
</style>
</head>
<body>
<div class="frame">
  <div style="height:48px;"></div>

  <div style="padding:8px 20px 0;">
    <h2 style="font-size:26px; font-weight:700; letter-spacing:-0.02em; color:#0a0a0a;">설정</h2>
  </div>

  <div class="scroll">
    <!-- Plus banner -->
    <div style="margin-top:16px; background:linear-gradient(135deg, #0f766e 0%, #115e59 100%); border-radius:16px; padding:18px; display:flex; align-items:center; gap:14px;">
      <div style="width:44px; height:44px; border-radius:12px; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:16px; font-weight:700; color:#fff;">PlanWe Plus</div>
        <div style="font-size:12px; color:#99f6e4; margin-top:2px;">AI 무제한 · 광고 제거 · 방 무제한</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#99f6e4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <!-- room management -->
    <div class="sect">방 관리</div>
    <div class="card" style="overflow:hidden;">
      <div class="row" style="border-bottom:1px solid #f5f5f5;">
        <div style="width:36px; height:36px; border-radius:10px; background:#0f766e; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-4.5-8-11a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 6.5-8 11-8 11z"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-size:15px; font-weight:600; color:#0a0a0a;">우리 결혼</div>
          <div style="font-size:12px; color:#a3a3a3; margin-top:1px;">결혼 템플릿 · KRW · D-88</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <!-- members -->
      <div class="row" style="border-bottom:1px solid #f5f5f5;">
        <span style="font-size:14px; color:#737373; width:36px; text-align:center; flex-shrink:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <div style="flex:1; display:flex; align-items:center; gap:8px;">
          <span style="font-size:14px; font-weight:500; color:#0a0a0a;">멤버</span>
          <div style="display:flex;">
            <span style="width:24px; height:24px; border-radius:9999px; background:#0f766e; color:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center; border:2px solid #fff;">윤</span>
            <span style="width:24px; height:24px; border-radius:9999px; background:#f59e0b; color:#fff; font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center; margin-left:-8px; border:2px solid #fff;">소</span>
          </div>
        </div>
        <span style="font-size:13px; color:#a3a3a3;">2명</span>
      </div>
      <!-- invite code -->
      <div class="row">
        <span style="width:36px; text-align:center; flex-shrink:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
        </span>
        <span style="flex:1; font-size:14px; font-weight:500; color:#0a0a0a;">초대 코드</span>
        <div style="display:flex; align-items:center; gap:8px; background:#f0fdfa; border-radius:8px; padding:6px 12px;">
          <span style="font-size:15px; font-weight:700; color:#0f766e; letter-spacing:0.15em;">HK29XF</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </div>
      </div>
    </div>

    <!-- room settings -->
    <div class="sect">방 설정</div>
    <div class="card" style="overflow:hidden;">
      <div class="row" style="border-bottom:1px solid #f5f5f5;">
        <span style="flex:1; font-size:14px; font-weight:500; color:#0a0a0a;">목표일</span>
        <span style="font-size:14px; color:#737373;">2026. 12. 13</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="row" style="border-bottom:1px solid #f5f5f5;">
        <span style="flex:1; font-size:14px; font-weight:500; color:#0a0a0a;">총 예산</span>
        <span style="font-size:14px; color:#737373;">5,000만원</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="row" style="border-bottom:1px solid #f5f5f5;">
        <span style="flex:1; font-size:14px; font-weight:500; color:#0a0a0a;">카테고리 편집</span>
        <span style="font-size:13px; color:#a3a3a3;">6개</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="row">
        <span style="flex:1; font-size:14px; font-weight:500; color:#0a0a0a;">결제수단 관리</span>
        <span style="font-size:13px; color:#a3a3a3;">4개</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <!-- profile -->
    <div class="sect">프로필</div>
    <div class="card" style="overflow:hidden;">
      <div class="row" style="border-bottom:1px solid #f5f5f5;">
        <span style="width:32px; height:32px; border-radius:9999px; background:#0f766e; color:#fff; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0;">윤</span>
        <div style="flex:1;">
          <div style="font-size:14px; font-weight:600; color:#0a0a0a;">윤재</div>
          <div style="font-size:12px; color:#a3a3a3; margin-top:1px;">Apple로 로그인</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="row">
        <span style="flex:1; font-size:14px; font-weight:500; color:#0a0a0a;">언어</span>
        <span style="font-size:14px; color:#737373;">한국어</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <!-- etc -->
    <div class="sect">기타</div>
    <div class="card" style="overflow:hidden;">
      <div class="row" style="border-bottom:1px solid #f5f5f5;">
        <span style="flex:1; font-size:14px; font-weight:500; color:#0a0a0a;">이용약관</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="row" style="border-bottom:1px solid #f5f5f5;">
        <span style="flex:1; font-size:14px; font-weight:500; color:#0a0a0a;">개인정보 처리방침</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div class="row">
        <span style="flex:1; font-size:14px; font-weight:500; color:#ef4444;">방 나가기</span>
      </div>
    </div>
  </div>

  <!-- AdMob + tab bar -->
  <div style="position:fixed; bottom:0; left:0; right:0; max-width:390px; margin:0 auto;">
    <div style="height:50px; background:#f0f0f0; border-top:1px solid #e5e5e5; display:flex; align-items:center; justify-content:center;"><span style="font-size:11px; color:#a3a3a3; letter-spacing:0.05em;">AdMob 배너 320×50</span></div>
    <div style="height:84px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; align-items:flex-start; padding:10px 8px 0;">
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">홈</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3M16 6H3M21 18H3"/><path d="M18 9l2 2 3-3"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">투두</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
        <div style="width:56px; height:56px; border-radius:9999px; background:#0f766e; display:flex; align-items:center; justify-content:center; margin-top:-24px; box-shadow:0 8px 16px rgba(15,118,110,0.35);">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 0-3 3v1H8a4 4 0 0 0 0 8h1v1a3 3 0 0 0 6 0v-1h1a4 4 0 0 0 0-8h-1V6a3 3 0 0 0-3-3z"/><path d="M9 12h.01M15 12h.01"/></svg>
        </div>
        <span style="font-size:10px; font-weight:600; color:#0f766e; margin-top:2px;">AI</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span style="font-size:10px; color:#a3a3a3;">지출</span>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span style="font-size:10px; font-weight:600; color:#0f766e;">설정</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
