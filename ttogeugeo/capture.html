<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>또그거 — 기록</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Inter,system-ui,sans-serif; background:#f5f5f5; display:flex; justify-content:center; }
  .app { width:390px; min-height:844px; background:#ffffff; position:relative; padding-bottom:120px; }
  .icon { width:20px; height:20px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div style="padding:20px 20px 8px; display:flex; align-items:center; justify-content:space-between;">
    <div style="width:40px; height:40px; border-radius:9999px; background:#f5f5f5; display:flex; align-items:center; justify-content:center; color:#171717;">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </div>
    <div style="font-size:16px; line-height:24px; font-weight:600; color:#0a0a0a;">방금 뭐 했어?</div>
    <div style="width:40px;"></div>
  </div>

  <!-- Helper -->
  <div style="padding:8px 20px 0;">
    <div style="font-size:14px; line-height:20px; color:#737373;">대충 적어도 돼. AI가 다시 쓸 수 있는 단계로 정리해줄게.</div>
  </div>

  <!-- Raw note input -->
  <div style="padding:16px 20px 0;">
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; min-height:160px;">
      <div style="font-size:16px; line-height:24px; color:#0a0a0a;">공유기 인터넷 또 끊김. 모뎀 1분 뽑았다 꽂고 공유기도 30초 뽑으니까 됨. 클립으로 리셋까진 안 감. 관리자 비번은 영수증 사진에 있음</div>
    </div>
  </div>

  <!-- Tools row -->
  <div style="padding:12px 20px 0; display:flex; gap:8px;">
    <div style="flex:1; height:44px; background:#f5f5f5; border:1px solid #e5e5e5; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:6px; color:#171717; font-size:14px; font-weight:500;">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      음성
    </div>
    <div style="flex:1; height:44px; background:#f5f5f5; border:1px solid #e5e5e5; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:6px; color:#171717; font-size:14px; font-weight:500;">
      <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
      사진
    </div>
    <div style="flex:1; height:44px; background:#f5f5f5; border:1px solid #e5e5e5; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:6px; color:#171717; font-size:14px; font-weight:500;">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" x2="7.01" y1="7" y2="7"/></svg>
      태그
    </div>
  </div>

  <!-- AI preview card -->
  <div style="margin:20px 20px 0; background:#171717; border-radius:12px; padding:16px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
      <div style="color:#fafafa;"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2v4"/><path d="m6.4 6.4 2.8 2.8"/><path d="M2 12h4"/><path d="M12 18v4"/><path d="m17.6 17.6-2.8-2.8"/><path d="M18 12h4"/></svg></div>
      <div style="font-size:14px; line-height:20px; font-weight:600; color:#fafafa;">AI 정리 미리보기</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; gap:8px; align-items:flex-start;">
        <div style="font-size:12px; color:#737373; font-weight:600; width:14px; flex-shrink:0; padding-top:2px;">1</div>
        <div style="font-size:14px; line-height:20px; color:#e5e5e5;">모뎀 전원 1분 뽑았다 꽂기</div>
      </div>
      <div style="display:flex; gap:8px; align-items:flex-start;">
        <div style="font-size:12px; color:#737373; font-weight:600; width:14px; flex-shrink:0; padding-top:2px;">2</div>
        <div style="font-size:14px; line-height:20px; color:#e5e5e5;">공유기 전원 30초 뽑았다 꽂기</div>
      </div>
      <div style="display:flex; gap:8px; align-items:flex-start;">
        <div style="font-size:12px; color:#737373; font-weight:600; width:14px; flex-shrink:0; padding-top:2px;">3</div>
        <div style="font-size:14px; line-height:20px; color:#e5e5e5;">관리자 비번 = 영수증 사진 참고</div>
      </div>
    </div>
    <div style="margin-top:12px; padding-top:12px; border-top:1px solid #262626; display:flex; gap:8px; align-items:center;">
      <span style="background:#262626; color:#a3a3a3; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">제안 태그: 기기</span>
      <span style="background:#262626; color:#a3a3a3; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">유사 런북 1개</span>
    </div>
  </div>

  <!-- Bottom save -->
  <div style="position:absolute; bottom:0; left:0; right:0; padding:16px 20px 28px; background:#ffffff; border-top:1px solid #e5e5e5;">
    <div style="height:48px; background:#171717; color:#fafafa; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; font-weight:500;">
      <svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      런북으로 저장
    </div>
  </div>
</div>
</body>
</html>
