<!DOCTYPE html>
<html lang="ko">

      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">행정</span>

    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; display:flex; gap:12px; align-items:center;">

      </div>
      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">집</span>

    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; display:flex; gap:12px; align-items:center;">

        <div style="font-size:12px; line-height:16px; color:#737373; margin-top:2px;">6단계 · 2번 꺼내봄</div>

    <svg class="icon" viewBox="0 0 24 24" style="width:24px;height:24px;"><path d="M5 12h14"/><path d="M12 5v14"/></svg>

  <!-- Bottom nav -->
  <div style="position:absolute; bottom:0; left:0; right:0; height:64px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; align-items:center; justify-content:space-around; padding:0 24px;">
