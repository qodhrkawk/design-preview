<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말투변환기 - 변환 결과</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
  }
  .status-bar {
    height: 54px;
    padding: 14px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: #0a0a0a;
  }
  .status-icons {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .top-bar {
    padding: 8px 24px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .back-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    cursor: pointer;
  }
  .top-bar h2 {
    font-size: 20px;
    font-weight: 600;
    color: #0a0a0a;
    letter-spacing: -0.025em;
  }
  .original-card {
    margin: 0 24px 16px;
    background: #f5f5f5;
    border-radius: 12px;
    padding: 16px;
  }
  .card-label {
    font-size: 12px;
    font-weight: 500;
    color: #737373;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-label svg {
    flex-shrink: 0;
  }
  .original-text {
    font-size: 15px;
    line-height: 22px;
    color: #737373;
  }
  .arrow-divider {
    display: flex;
    justify-content: center;
    padding: 4px 0 12px;
  }
  .arrow-circle {
    width: 36px;
    height: 36px;
    background: #171717;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .result-card {
    margin: 0 24px 16px;
    background: #ffffff;
    border: 1.5px solid #171717;
    border-radius: 12px;
    padding: 16px;
    position: relative;
  }
  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #171717;
    color: #fafafa;
    border-radius: 9999px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .result-text {
    font-size: 16px;
    line-height: 26px;
    color: #0a0a0a;
    font-weight: 400;
  }
  .result-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #e5e5e5;
  }
  .action-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    font-family: Inter, system-ui, sans-serif;
    cursor: pointer;
    border: none;
  }
  .action-btn.primary {
    background: #171717;
    color: #fafafa;
  }
  .action-btn.secondary {
    background: #f5f5f5;
    color: #171717;
  }
  .variations-section {
    padding: 20px 24px 8px;
  }
  .variations-title {
    font-size: 14px;
    font-weight: 600;
    color: #0a0a0a;
    margin-bottom: 12px;
  }
  .variation-card {
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .variation-card:hover {
    border-color: #a3a3a3;
  }
  .variation-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .variation-badge {
    background: #f5f5f5;
    color: #171717;
    border-radius: 9999px;
    padding: 2px 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .variation-copy {
    font-size: 12px;
    color: #737373;
    cursor: pointer;
  }
  .variation-text {
    font-size: 14px;
    line-height: 22px;
    color: #0a0a0a;
  }
  .retry-section {
    padding: 8px 24px 24px;
  }
  .retry-btn {
    width: 100%;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    font-weight: 500;
    font-family: Inter, system-ui, sans-serif;
    color: #171717;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .bottom-spacer { height: 20px; }
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>11:24</span>
    <div class="status-icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#0a0a0a"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="#0a0a0a"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="#0a0a0a"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="#e5e5e5"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M7.5 3.5C9.16 3.5 10.67 4.16 11.78 5.27L13.19 3.86C11.69 2.36 9.67 1.5 7.5 1.5C5.33 1.5 3.31 2.36 1.81 3.86L3.22 5.27C4.33 4.16 5.84 3.5 7.5 3.5Z" fill="#0a0a0a"/><path d="M7.5 6.5C8.6 6.5 9.59 6.95 10.33 7.68L11.75 6.27C10.64 5.16 9.14 4.5 7.5 4.5C5.86 4.5 4.36 5.16 3.25 6.27L4.67 7.68C5.41 6.95 6.4 6.5 7.5 6.5Z" fill="#0a0a0a"/><circle cx="7.5" cy="10" r="1.5" fill="#0a0a0a"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0" y="1" width="21" height="10" rx="2" stroke="#0a0a0a" stroke-width="1"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#0a0a0a"/><rect x="1.5" y="2.5" width="15" height="7" rx="1" fill="#0a0a0a"/></svg>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h2>변환 결과</h2>
  </div>

  <!-- Original Text -->
  <div class="original-card">
    <div class="card-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
      원문
    </div>
    <div class="original-text">내일 회의 몇시야? 자료 보내줘.</div>
  </div>

  <!-- Arrow -->
  <div class="arrow-divider">
    <div class="arrow-circle">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
    </div>
  </div>

  <!-- Result -->
  <div class="result-card">
    <div class="result-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      존댓말
    </div>
    <div class="result-text">내일 회의 몇 시인지 알 수 있을까요? 자료도 보내주시면 감사하겠습니다.</div>
    <div class="result-actions">
      <button class="action-btn primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        복사하기
      </button>
      <button class="action-btn secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
        공유
      </button>
    </div>
  </div>

  <!-- Variations -->
  <div class="variations-section">
    <div class="variations-title">다른 톤으로 보기</div>
    
    <div class="variation-card">
      <div class="variation-header">
        <span class="variation-badge">비즈니스</span>
        <span class="variation-copy">복사</span>
      </div>
      <div class="variation-text">내일 회의 시간을 확인 부탁드립니다. 관련 자료 송부해 주시면 감사하겠습니다.</div>
    </div>

    <div class="variation-card">
      <div class="variation-header">
        <span class="variation-badge">부드럽게</span>
        <span class="variation-copy">복사</span>
      </div>
      <div class="variation-text">내일 회의 시간 알려주실 수 있을까요? 자료도 미리 보내주시면 정말 좋을 것 같아요 :)</div>
    </div>

    <div class="variation-card">
      <div class="variation-header">
        <span class="variation-badge">간결하게</span>
        <span class="variation-copy">복사</span>
      </div>
      <div class="variation-text">내일 회의 시간 + 자료 공유 부탁드려요.</div>
    </div>
  </div>

  <!-- Retry -->
  <div class="retry-section">
    <button class="retry-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      다시 변환하기
    </button>
  </div>

  <div class="bottom-spacer"></div>
</div>
</body>
</html>
