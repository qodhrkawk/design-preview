<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말투변환기 - 홈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }
  .status-bar {
    height: 54px;
    padding: 14px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: #0a0a0a;
  }
  .status-icons {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .header {
    padding: 8px 24px 20px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 800;
    color: #0a0a0a;
    letter-spacing: -0.025em;
    line-height: 36px;
  }
  .header p {
    font-size: 14px;
    color: #737373;
    margin-top: 4px;
    line-height: 20px;
  }
  .input-area {
    padding: 0 24px;
    margin-bottom: 16px;
  }
  .textarea-wrapper {
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px;
    position: relative;
    transition: border-color 0.2s;
  }
  .textarea-wrapper:focus-within {
    border-color: #a3a3a3;
  }
  .textarea-label {
    font-size: 12px;
    font-weight: 500;
    color: #737373;
    margin-bottom: 8px;
    display: block;
  }
  textarea {
    width: 100%;
    border: none;
    outline: none;
    font-family: Inter, system-ui, sans-serif;
    font-size: 16px;
    line-height: 24px;
    color: #0a0a0a;
    resize: none;
    min-height: 100px;
    background: transparent;
  }
  textarea::placeholder {
    color: #a3a3a3;
  }
  .char-count {
    text-align: right;
    font-size: 12px;
    color: #a3a3a3;
    margin-top: 8px;
  }
  .paste-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    color: #737373;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .section-title {
    padding: 0 24px;
    font-size: 14px;
    font-weight: 600;
    color: #0a0a0a;
    margin-bottom: 12px;
  }
  .tone-grid {
    padding: 0 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .tone-card {
    background: #ffffff;
    border: 1.5px solid #e5e5e5;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tone-card.selected {
    border-color: #171717;
    background: #fafafa;
  }
  .tone-card-icon {
    width: 32px;
    height: 32px;
    background: #f5f5f5;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .tone-card.selected .tone-card-icon {
    background: #171717;
    color: #fafafa;
  }
  .tone-card-title {
    font-size: 14px;
    font-weight: 600;
    color: #0a0a0a;
    margin-bottom: 2px;
  }
  .tone-card-desc {
    font-size: 12px;
    color: #737373;
    line-height: 16px;
  }
  .convert-btn {
    margin: 0 24px;
    width: calc(100% - 48px);
    background: #171717;
    color: #fafafa;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: Inter, system-ui, sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .convert-btn:disabled {
    background: #a3a3a3;
    cursor: not-allowed;
  }
  .quick-actions {
    padding: 0 24px;
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .quick-action {
    flex-shrink: 0;
    background: #f5f5f5;
    border: none;
    border-radius: 9999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    color: #171717;
    cursor: pointer;
    font-family: Inter, system-ui, sans-serif;
    white-space: nowrap;
  }
  .bottom-nav {
    position: fixed;
    bottom: 0;
    width: 390px;
    background: #ffffff;
    border-top: 1px solid #e5e5e5;
    display: flex;
    padding: 8px 0 28px;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px;
    cursor: pointer;
  }
  .nav-item span {
    font-size: 10px;
    font-weight: 500;
    color: #a3a3a3;
  }
  .nav-item.active span {
    color: #171717;
  }
  .nav-icon {
    width: 24px;
    height: 24px;
  }
  .bottom-spacer {
    height: 80px;
  }
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>11:24</span>
    <div class="status-icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="4" width="3" height="8" rx="1" fill="#0a0a0a"/><rect x="4.5" y="2.5" width="3" height="9.5" rx="1" fill="#0a0a0a"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="#0a0a0a"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="#e5e5e5"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M7.5 3.5C9.16 3.5 10.67 4.16 11.78 5.27L13.19 3.86C11.69 2.36 9.67 1.5 7.5 1.5C5.33 1.5 3.31 2.36 1.81 3.86L3.22 5.27C4.33 4.16 5.84 3.5 7.5 3.5Z" fill="#0a0a0a"/><path d="M7.5 6.5C8.6 6.5 9.59 6.95 10.33 7.68L11.75 6.27C10.64 5.16 9.14 4.5 7.5 4.5C5.86 4.5 4.36 5.16 3.25 6.27L4.67 7.68C5.41 6.95 6.4 6.5 7.5 6.5Z" fill="#0a0a0a"/><circle cx="7.5" cy="10" r="1.5" fill="#0a0a0a"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0" y="1" width="21" height="10" rx="2" stroke="#0a0a0a" stroke-width="1"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#0a0a0a"/><rect x="1.5" y="2.5" width="15" height="7" rx="1" fill="#0a0a0a"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <h1>말투변환기</h1>
    <p>텍스트를 원하는 말투로 바꿔보세요</p>
  </div>

  <!-- Quick Actions -->
  <div class="quick-actions">
    <button class="quick-action">반말 → 존댓말</button>
    <button class="quick-action">존댓말 → 반말</button>
    <button class="quick-action">부드럽게</button>
    <button class="quick-action">간결하게</button>
    <button class="quick-action">비즈니스</button>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="textarea-wrapper">
      <span class="textarea-label">원문</span>
      <button class="paste-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        붙여넣기
      </button>
      <textarea placeholder="변환할 텍스트를 입력하세요...&#10;&#10;예: 내일 회의 몇시야? 자료 보내줘.">내일 회의 몇시야? 자료 보내줘.</textarea>
      <div class="char-count">17 / 1,000</div>
    </div>
  </div>

  <!-- Tone Selection -->
  <div class="section-title">변환 말투 선택</div>
  <div class="tone-grid">
    <div class="tone-card selected">
      <div class="tone-card-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="tone-card-title">존댓말</div>
      <div class="tone-card-desc">정중한 해요체</div>
    </div>
    <div class="tone-card">
      <div class="tone-card-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
      </div>
      <div class="tone-card-title">비즈니스</div>
      <div class="tone-card-desc">격식체 이메일</div>
    </div>
    <div class="tone-card">
      <div class="tone-card-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      </div>
      <div class="tone-card-title">부드럽게</div>
      <div class="tone-card-desc">따뜻한 톤으로</div>
    </div>
    <div class="tone-card">
      <div class="tone-card-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
      </div>
      <div class="tone-card-title">간결하게</div>
      <div class="tone-card-desc">핵심만 짧게</div>
    </div>
  </div>

  <!-- Convert Button -->
  <button class="convert-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
    변환하기
  </button>

  <div class="bottom-spacer"></div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      <span>변환</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
      <span>기록</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>설정</span>
    </div>
  </div>
</div>
</body>
</html>
