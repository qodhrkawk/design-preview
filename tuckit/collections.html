<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 컬렉션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 24px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.025em;">컬렉션</div>
        <div style="width: 36px; height: 36px; background: #f5f5f5; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
    </div>

    <!-- Collection Grid -->
    <div style="padding: 0 20px; padding-bottom: 100px;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">

        <!-- 개발 (blue) -->
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 20px 16px; cursor: pointer;">
          <div style="width: 44px; height: 44px; background: #E3F2FD; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E88E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 4px;">개발</div>
          <div style="font-size: 12px; color: #a3a3a3;">12개 링크</div>
        </div>

        <!-- 요리 (orange) -->
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 20px 16px; cursor: pointer;">
          <div style="width: 44px; height: 44px; background: #FFF3E0; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F57C00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"/><path d="M7 21h10"/><path d="M19.5 12 22 6"/><path d="M16.25 3c.27.1.8.53.75 1.36-.06.83-.93 1.2-1 2.02-.05.78.34 1.24.73 1.62"/><path d="M11.25 3c.27.1.8.53.75 1.36-.06.83-.93 1.2-1 2.02-.05.78.34 1.24.73 1.62"/></svg>
          </div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 4px;">요리</div>
          <div style="font-size: 12px; color: #a3a3a3;">8개 링크</div>
        </div>

        <!-- 디자인 (purple) -->
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 20px 16px; cursor: pointer;">
          <div style="width: 44px; height: 44px; background: #F3E5F5; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8E24AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 13 2.5-3 2.5 3"/><path d="m7 13 2.5-3L12 13"/><path d="M9.5 5 12 2l2.5 3"/><path d="m17 13 2.5-3 2.5 3"/><path d="m12 13 2.5-3L17 13"/><path d="M2 21h20"/><path d="M6 17h12"/></svg>
          </div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 4px;">디자인</div>
          <div style="font-size: 12px; color: #a3a3a3;">5개 링크</div>
        </div>

        <!-- 투자 (green) -->
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 20px 16px; cursor: pointer;">
          <div style="width: 44px; height: 44px; background: #E8F5E9; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#43A047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 4px;">투자</div>
          <div style="font-size: 12px; color: #a3a3a3;">4개 링크</div>
        </div>

        <!-- 여행 (coral) -->
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 20px 16px; cursor: pointer;">
          <div style="width: 44px; height: 44px; background: #FFF0ED; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8563A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
          </div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 4px;">여행</div>
          <div style="font-size: 12px; color: #a3a3a3;">3개 링크</div>
        </div>

        <!-- 읽을거리 (teal) -->
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 20px 16px; cursor: pointer;">
          <div style="width: 44px; height: 44px; background: #E0F2F1; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00897B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </div>
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 4px;">읽을거리</div>
          <div style="font-size: 12px; color: #a3a3a3;">2개 링크</div>
        </div>

      </div>
    </div>

    <!-- Tab Bar -->
    <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: #ffffff; border-top: 1px solid #e5e5e5; padding-bottom: env(safe-area-inset-bottom, 0px);">
      <div style="display: flex; justify-content: space-around; padding: 10px 0 8px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span style="font-size: 10px; font-weight: 500; color: #a3a3a3;">홈</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span style="font-size: 10px; font-weight: 600; color: #0a0a0a;">컬렉션</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span style="font-size: 10px; font-weight: 500; color: #a3a3a3;">설정</span>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
