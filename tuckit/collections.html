<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 컬렉션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <!-- Status Bar Spacer -->
    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 24px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.025em;">컬렉션</div>
      <div style="display: flex; align-items: center; gap: 6px; background: #f5f5f5; border-radius: 9999px; padding: 6px 14px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span style="font-size: 13px; font-weight: 500; color: #737373;">새 컬렉션</span>
      </div>
    </div>

    <!-- AI Auto Categories Section -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F57C00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        <span style="font-size: 14px; font-weight: 600; color: #F57C00;">AI 자동 카테고리</span>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <!-- AI Card 1 -->
        <div style="background: #FFFDF5; border: 1px solid #FFE0B2; border-radius: 14px; padding: 16px; cursor: pointer;">
          <div style="width: 40px; height: 40px; background: #FFF3E0; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F57C00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </div>
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 2px;">개발</div>
          <div style="font-size: 12px; color: #a3a3a3;">12개</div>
        </div>
        <!-- AI Card 2 -->
        <div style="background: #FFFDF5; border: 1px solid #FFE0B2; border-radius: 14px; padding: 16px; cursor: pointer;">
          <div style="width: 40px; height: 40px; background: #FFF3E0; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F57C00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          </div>
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 2px;">디자인</div>
          <div style="font-size: 12px; color: #a3a3a3;">8개</div>
        </div>
        <!-- AI Card 3 -->
        <div style="background: #FFFDF5; border: 1px solid #FFE0B2; border-radius: 14px; padding: 16px; cursor: pointer;">
          <div style="width: 40px; height: 40px; background: #FFF3E0; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F57C00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 11h.01"/><path d="M11 15h.01"/><path d="M16 16c.5-1.5.17-2-.5-3"/><path d="M8.5 12.5c1-.5 1.5-.17 3 .5"/><path d="M17 8a5 5 0 0 0-10 0c0 3 2 5.5 5 8 3-2.5 5-5 5-8Z"/></svg>
          </div>
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 2px;">요리</div>
          <div style="font-size: 12px; color: #a3a3a3;">5개</div>
        </div>
        <!-- AI Card 4 -->
        <div style="background: #FFFDF5; border: 1px solid #FFE0B2; border-radius: 14px; padding: 16px; cursor: pointer;">
          <div style="width: 40px; height: 40px; background: #FFF3E0; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F57C00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 2px;">투자</div>
          <div style="font-size: 12px; color: #a3a3a3;">4개</div>
        </div>
      </div>
    </div>

    <!-- My Collections Section -->
    <div style="padding: 0 20px; padding-bottom: 140px;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span style="font-size: 14px; font-weight: 600; color: #737373;">내 컬렉션</span>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <!-- Manual Card 1 -->
        <div style="background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 14px; padding: 16px; cursor: pointer;">
          <div style="width: 40px; height: 40px; background: #ffffff; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; border: 1px solid #e5e5e5;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 2px;">즐겨찾기</div>
          <div style="font-size: 12px; color: #a3a3a3;">7개</div>
        </div>
        <!-- Manual Card 2 -->
        <div style="background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 14px; padding: 16px; cursor: pointer;">
          <div style="width: 40px; height: 40px; background: #ffffff; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; border: 1px solid #e5e5e5;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
          </div>
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 2px;">개발 레퍼런스</div>
          <div style="font-size: 12px; color: #a3a3a3;">3개</div>
        </div>
        <!-- Manual Card 3 -->
        <div style="background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 14px; padding: 16px; cursor: pointer;">
          <div style="width: 40px; height: 40px; background: #ffffff; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; border: 1px solid #e5e5e5;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 2px;">음악</div>
          <div style="font-size: 12px; color: #a3a3a3;">2개</div>
        </div>
      </div>
    </div>

    <!-- Ad Banner -->
    <div style="position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px;">
      <div style="height: 50px; background: #f5f5f5; border-top: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 12px; color: #a3a3a3;">AdMob 배너 광고</span>
      </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: #ffffff; border-top: 1px solid #e5e5e5; padding-bottom: env(safe-area-inset-bottom, 0px);">
      <div style="display: flex; justify-content: space-around; padding: 10px 0 8px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span style="font-size: 10px; font-weight: 500; color: #a3a3a3;">홈</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span style="font-size: 10px; font-weight: 600; color: #0a0a0a;">컬렉션</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span style="font-size: 10px; font-weight: 500; color: #a3a3a3;">설정</span>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
