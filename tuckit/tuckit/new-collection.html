<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 새 컬렉션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
    }
    .icon-cell {
      width: 44px;
      height: 44px;
      background: #f5f5f5;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-cell-selected {
      width: 44px;
      height: 44px;
      background: #E3F2FD;
      border: 2px solid #1E88E5;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .color-dot {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      border: 2px solid #e5e5e5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .color-dot-selected {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      border: 2.5px solid #1E88E5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 32px; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 20px; font-weight: 700; color: #0a0a0a;">새 컬렉션</div>
      <div style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <!-- Preview -->
    <div style="display: flex; justify-content: center; margin-bottom: 32px;">
      <div style="width: 80px; height: 80px; background: #E3F2FD; border-radius: 20px; display: flex; align-items: center; justify-content: center;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1E88E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      </div>
    </div>

    <!-- Name Input -->
    <div style="padding: 0 20px; margin-bottom: 28px;">
      <div style="font-size: 13px; font-weight: 600; color: #0a0a0a; margin-bottom: 8px;">이름</div>
      <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px;">
        <span style="font-size: 15px; color: #0a0a0a;">개발</span>
      </div>
    </div>

    <!-- Icon Select (Lucide 24개) -->
    <div style="padding: 0 20px; margin-bottom: 28px;">
      <div style="font-size: 13px; font-weight: 600; color: #0a0a0a; margin-bottom: 10px;">아이콘</div>
      <div style="display: grid; grid-template-columns: repeat(7, 44px); gap: 8px; justify-content: start;">
        <!-- 1. code (selected) -->
        <div class="icon-cell-selected">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E88E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </div>
        <!-- 2. utensils -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        </div>
        <!-- 3. palette -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="0.5" fill="#737373"/><circle cx="17.5" cy="10.5" r="0.5" fill="#737373"/><circle cx="8.5" cy="7.5" r="0.5" fill="#737373"/><circle cx="6.5" cy="12.5" r="0.5" fill="#737373"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
        </div>
        <!-- 4. wallet -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        </div>
        <!-- 5. plane -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
        </div>
        <!-- 6. book-open -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <!-- 7. music -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <!-- 8. camera -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </div>
        <!-- 9. dumbbell -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
        </div>
        <!-- 10. gamepad-2 -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></svg>
        </div>
        <!-- 11. home -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <!-- 12. clipboard -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        </div>
        <!-- 13. shopping-cart -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        </div>
        <!-- 14. star -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <!-- 15. lightbulb -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
        </div>
        <!-- 16. link -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </div>
        <!-- 17. smartphone -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
        </div>
        <!-- 18. flask -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16.5h10"/></svg>
        </div>
        <!-- 19. globe -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
        </div>
        <!-- 20. heart -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </div>
        <!-- 21. pencil -->
        <div class="icon-cell">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
        </div>
      </div>
    </div>

    <!-- Color Select -->
    <div style="padding: 0 20px; margin-bottom: 40px;">
      <div style="font-size: 13px; font-weight: 600; color: #0a0a0a; margin-bottom: 10px;">컬러</div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <div class="color-dot" style="background: #FFF0ED;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #E8563A;"></div></div>
        <div class="color-dot" style="background: #FFF3E0;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #F57C00;"></div></div>
        <div class="color-dot" style="background: #FFF8E1;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #F9A825;"></div></div>
        <div class="color-dot" style="background: #E8F5E9;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #43A047;"></div></div>
        <div class="color-dot" style="background: #E0F2F1;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #00897B;"></div></div>
        <div class="color-dot-selected" style="background: #E3F2FD;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #1E88E5;"></div></div>
        <div class="color-dot" style="background: #E8EAF6;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #5C6BC0;"></div></div>
        <div class="color-dot" style="background: #F3E5F5;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #8E24AA;"></div></div>
        <div class="color-dot" style="background: #FCE4EC;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #D81B60;"></div></div>
        <div class="color-dot" style="background: #F5F5F5;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #616161;"></div></div>
      </div>
    </div>

    <!-- Create Button -->
    <div style="padding: 0 20px; padding-bottom: 48px;">
      <div style="background: #0a0a0a; color: #fafafa; border-radius: 10px; padding: 14px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer;">만들기</div>
    </div>

  </div>
</body>
</html>
