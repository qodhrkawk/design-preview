<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 필터탭 비교</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <div style="height: 48px;"></div>

    <div style="padding: 16px 20px 12px; font-size: 11px; font-weight: 600; color: #a3a3a3; letter-spacing: 0.05em; text-transform: uppercase;">필터 탭 선택 스타일 비교</div>

    <!-- A: 검정 선택 -->
    <div style="padding: 0 20px; margin-bottom: 32px;">
      <div style="font-size: 12px; font-weight: 600; color: #F57C00; margin-bottom: 12px;">A. 검정 선택 (현재)</div>
      <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;">
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373; flex-shrink: 0;">전체</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #0a0a0a; color: #fafafa; flex-shrink: 0;">개발</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373; flex-shrink: 0;">디자인</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373; flex-shrink: 0;">요리</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373; flex-shrink: 0;">투자</div>
      </div>
    </div>

    <!-- B: 오렌지 선택 -->
    <div style="padding: 0 20px; margin-bottom: 32px;">
      <div style="font-size: 12px; font-weight: 600; color: #F57C00; margin-bottom: 12px;">B. 오렌지 선택</div>
      <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;">
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373; flex-shrink: 0;">전체</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #FFF3E0; color: #F57C00; border: 1px solid #FFE0B2; flex-shrink: 0;">개발</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373; flex-shrink: 0;">디자인</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373; flex-shrink: 0;">요리</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373; flex-shrink: 0;">투자</div>
      </div>
    </div>

    <!-- 구분선 -->
    <div style="height: 4px; background: #f5f5f5;"></div>

    <!-- 카드와 함께 비교 -->
    <div style="padding: 16px 20px 12px; font-size: 11px; font-weight: 600; color: #a3a3a3; letter-spacing: 0.05em; text-transform: uppercase;">카드와 함께 (A. 검정)</div>

    <div style="padding: 0 20px; margin-bottom: 16px;">
      <div style="display: flex; gap: 8px;">
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">전체</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #0a0a0a; color: #fafafa;">개발</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">디자인</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">요리</div>
      </div>
    </div>
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="display: flex; gap: 14px; padding: 14px; border: 1px solid #e5e5e5; border-radius: 12px;">
        <div style="width: 72px; height: 72px; background: #f5f5f5; border-radius: 10px; flex-shrink: 0;"></div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 3px;">React Native 성능 최적화 가이드</div>
          <div style="font-size: 12px; color: #a3a3a3; margin-bottom: 8px;">medium.com/@dev</div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <div><span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #FFF3E0; color: #F57C00;">개발</span></div>
            <div style="display: flex; gap: 6px;">
              <span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; border: 1px solid #e5e5e5; color: #737373;">React</span>
              <span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; border: 1px solid #e5e5e5; color: #737373;">성능</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 0 20px 12px; font-size: 11px; font-weight: 600; color: #a3a3a3; letter-spacing: 0.05em; text-transform: uppercase;">카드와 함께 (B. 오렌지)</div>

    <div style="padding: 0 20px; margin-bottom: 16px;">
      <div style="display: flex; gap: 8px;">
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">전체</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #FFF3E0; color: #F57C00; border: 1px solid #FFE0B2;">개발</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">디자인</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">요리</div>
      </div>
    </div>
    <div style="padding: 0 20px; padding-bottom: 40px;">
      <div style="display: flex; gap: 14px; padding: 14px; border: 1px solid #e5e5e5; border-radius: 12px;">
        <div style="width: 72px; height: 72px; background: #f5f5f5; border-radius: 10px; flex-shrink: 0;"></div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 3px;">React Native 성능 최적화 가이드</div>
          <div style="font-size: 12px; color: #a3a3a3; margin-bottom: 8px;">medium.com/@dev</div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <div><span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #FFF3E0; color: #F57C00;">개발</span></div>
            <div style="display: flex; gap: 6px;">
              <span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; border: 1px solid #e5e5e5; color: #737373;">React</span>
              <span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; border: 1px solid #e5e5e5; color: #737373;">성능</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
