<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 컬렉션 편집 바텀시트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: rgba(0,0,0,0.4); position: relative; display: flex; align-items: flex-end; }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <!-- Bottom Sheet -->
    <div style="width: 100%; background: #ffffff; border-radius: 20px 20px 0 0; padding: 12px 20px 40px;">

      <!-- Handle -->
      <div style="display: flex; justify-content: center; margin-bottom: 20px;">
        <div style="width: 36px; height: 4px; background: #e5e5e5; border-radius: 9999px;"></div>
      </div>

      <!-- Collection Info -->
      <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 16px; margin-bottom: 8px; border-bottom: 1px solid #f5f5f5;">
        <div style="width: 44px; height: 44px; background: #E3F2FD; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E88E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </div>
        <div>
          <div style="font-size: 16px; font-weight: 600; color: #0a0a0a;">개발</div>
          <div style="font-size: 12px; color: #a3a3a3;">12개 링크</div>
        </div>
      </div>

      <!-- Menu Items (아이콘 44px로 통일) -->
      <div style="display: flex; flex-direction: column;">

        <!-- 이름/아이콘 변경 -->
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer;">
          <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          </div>
          <span style="font-size: 15px; font-weight: 500; color: #0a0a0a;">이름 / 아이콘 변경</span>
        </div>

        <!-- 삭제 -->
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer;">
          <div style="width: 44px; height: 44px; background: #FEF2F2; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </div>
          <span style="font-size: 15px; font-weight: 500; color: #ef4444;">컬렉션 삭제</span>
        </div>

      </div>
    </div>

  </div>
</body>
</html>
