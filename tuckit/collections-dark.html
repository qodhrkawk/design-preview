<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 컬렉션 (다크)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!--
    다크모드 컬렉션 컬러 프리셋 10색
    coral:   bg #450a0a  fg #fca5a5  icon #f87171
    orange:  bg #431407  fg #fb923c  icon #f97316
    amber:   bg #451a03  fg #fbbf24  icon #f59e0b
    green:   bg #052e16  fg #4ade80  icon #22c55e
    teal:    bg #042f2e  fg #2dd4bf  icon #14b8a6
    blue:    bg #172554  fg #60a5fa  icon #3b82f6
    indigo:  bg #1e1b4b  fg #a5b4fc  icon #6366f1
    purple:  bg #3b0764  fg #c084fc  icon #a855f7
    pink:    bg #500724  fg #f9a8d4  icon #ec4899
    gray:    bg #1a1a1a  fg #a3a3a3  icon #737373
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #000000; display: flex; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #0a0a0a; position: relative; overflow-x: hidden; }
    .col-card {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 14px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 24px; font-weight: 800; color: #fafafa; letter-spacing: -0.025em;">컬렉션</div>
      <div style="width: 36px; height: 36px; background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>

    <!-- Grid -->
    <div style="padding: 0 20px; padding-bottom: 140px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">

      <!-- 개발 = blue -->
      <div class="col-card">
        <div style="width: 44px; height: 44px; background: #172554; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fafafa;">개발</div>
        <div style="font-size: 12px; color: #737373;">12개 링크</div>
      </div>

      <!-- 요리 = orange -->
      <div class="col-card">
        <div style="width: 44px; height: 44px; background: #431407; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fafafa;">요리</div>
        <div style="font-size: 12px; color: #737373;">8개 링크</div>
      </div>

      <!-- 디자인 = purple -->
      <div class="col-card">
        <div style="width: 44px; height: 44px; background: #3b0764; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="0.5" fill="#a855f7"/><circle cx="17.5" cy="10.5" r="0.5" fill="#a855f7"/><circle cx="8.5" cy="7.5" r="0.5" fill="#a855f7"/><circle cx="6.5" cy="12.5" r="0.5" fill="#a855f7"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fafafa;">디자인</div>
        <div style="font-size: 12px; color: #737373;">5개 링크</div>
      </div>

      <!-- 투자 = green -->
      <div class="col-card">
        <div style="width: 44px; height: 44px; background: #052e16; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fafafa;">투자</div>
        <div style="font-size: 12px; color: #737373;">4개 링크</div>
      </div>

      <!-- 여행 = coral -->
      <div class="col-card">
        <div style="width: 44px; height: 44px; background: #450a0a; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fafafa;">여행</div>
        <div style="font-size: 12px; color: #737373;">3개 링크</div>
      </div>

      <!-- 읽을거리 = teal -->
      <div class="col-card">
        <div style="width: 44px; height: 44px; background: #042f2e; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fafafa;">읽을거리</div>
        <div style="font-size: 12px; color: #737373;">6개 링크</div>
      </div>

      <!-- 음악 = amber -->
      <div class="col-card">
        <div style="width: 44px; height: 44px; background: #451a03; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fafafa;">음악</div>
        <div style="font-size: 12px; color: #737373;">2개 링크</div>
      </div>

      <!-- 영감 = indigo -->
      <div class="col-card">
        <div style="width: 44px; height: 44px; background: #1e1b4b; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fafafa;">영감</div>
        <div style="font-size: 12px; color: #737373;">7개 링크</div>
      </div>

      <!-- 쇼핑 = pink -->
      <div class="col-card">
        <div style="width: 44px; height: 44px; background: #500724; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fafafa;">쇼핑</div>
        <div style="font-size: 12px; color: #737373;">1개 링크</div>
      </div>

      <!-- 기타 = gray -->
      <div class="col-card">
        <div style="width: 44px; height: 44px; background: #1a1a1a; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #fafafa;">기타</div>
        <div style="font-size: 12px; color: #737373;">2개 링크</div>
      </div>

    </div>

    <!-- Tab Bar -->
    <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: #0a0a0a; border-top: 1px solid #262626; padding-bottom: env(safe-area-inset-bottom, 0px);">
      <div style="display: flex; justify-content: space-around; padding: 10px 0 8px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span style="font-size: 10px; font-weight: 500; color: #525252;">홈</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fafafa" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span style="font-size: 10px; font-weight: 600; color: #fafafa;">컬렉션</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span style="font-size: 10px; font-weight: 500; color: #525252;">설정</span>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
