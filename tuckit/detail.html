<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 링크 상세</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <!-- Status Bar Spacer -->
    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
        <span style="font-size: 15px; font-weight: 500; color: #0a0a0a;">뒤로</span>
      </div>
      <div style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </div>
    </div>

    <!-- Thumbnail -->
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <div style="width: 100%; height: 200px; background: linear-gradient(135deg, #e5e5e5 0%, #d4d4d4 100%); border-radius: 14px; display: flex; align-items: center; justify-content: center;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </div>
    </div>

    <!-- Title & URL -->
    <div style="padding: 0 20px; margin-bottom: 16px;">
      <div style="font-size: 20px; font-weight: 700; color: #0a0a0a; line-height: 1.4; margin-bottom: 8px;">React Native 성능 최적화 가이드</div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span style="font-size: 13px; color: #3b82f6;">medium.com/@dev/rn-performance-guide</span>
      </div>
    </div>

    <!-- Description -->
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <div style="font-size: 14px; color: #737373; line-height: 1.7;">React Native 앱의 성능을 극대화하는 10가지 팁과 실전 예제를 소개합니다. 렌더링 최적화부터 메모리 관리까지 전반적인 성능 개선 방법을 다룹니다.</div>
    </div>

    <!-- AI Tags -->
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <span style="display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; background: #FFF3E0; color: #F57C00;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F57C00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
          개발
        </span>
        <span style="padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">React Native</span>
        <span style="padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">성능</span>
        <span style="padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">모바일</span>
      </div>
    </div>

    <!-- Meta Info -->
    <div style="padding: 0 20px; margin-bottom: 32px;">
      <div style="display: flex; gap: 16px; align-items: center; font-size: 12px; color: #a3a3a3;">
        <div style="display: flex; align-items: center; gap: 4px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
          2026.03.25
        </div>
        <div style="display: flex; align-items: center; gap: 4px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          개발 레퍼런스
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div style="padding: 0 20px; padding-bottom: 48px;">
      <div style="display: flex; gap: 10px;">
        <div style="flex: 2; background: #0a0a0a; color: #fafafa; border-radius: 10px; padding: 14px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
          열기
        </div>
        <div style="flex: 1; background: #f5f5f5; color: #737373; border-radius: 10px; padding: 14px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
          편집
        </div>
        <div style="flex: 1; background: #FEF2F2; color: #ef4444; border-radius: 10px; padding: 14px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          삭제
        </div>
      </div>
    </div>

  </div>
</body>
</html>
