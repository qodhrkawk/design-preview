<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 링크 상세</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; }
    .chip-collection {
      display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 6px;
      font-size: 12px; font-weight: 500;
    }
    .chip-tag {
      display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px;
      font-size: 12px; font-weight: 500; color: #737373; border: 1px solid #e5e5e5;
    }
    .chip-tag-add {
      display: inline-flex; align-items: center; gap: 2px; padding: 4px 10px; border-radius: 6px;
      font-size: 12px; font-weight: 500; color: #a3a3a3; border: 1px dashed #d4d4d4;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <div style="height: 48px;"></div>

    <!-- Header (iOS nav) -->
    <div style="padding: 0 20px; margin-bottom: 24px; display: flex; align-items: center; position: relative; height: 44px;">
      <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </div>
      <div style="position: absolute; left: 48px; right: 48px; display: flex; justify-content: center; pointer-events: none;">
        <span style="font-size: 16px; font-weight: 600; color: #0a0a0a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">React Native 성능 최적화 가이드</span>
      </div>
      <!-- ⋯ 더보기 -->
      <div style="position: absolute; right: 20px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1" fill="#0a0a0a"/><circle cx="12" cy="12" r="1" fill="#0a0a0a"/><circle cx="12" cy="19" r="1" fill="#0a0a0a"/></svg>
      </div>
    </div>

    <!-- Thumbnail -->
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <div style="width: 100%; height: 200px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      </div>
    </div>

    <!-- URL -->
    <div style="padding: 0 20px; margin-bottom: 16px;">
      <div style="font-size: 13px; color: #a3a3a3;">medium.com/@dev/react-native-performance</div>
    </div>

    <!-- Collection -->
    <div style="padding: 0 20px; margin-bottom: 12px;">
      <div style="font-size: 12px; font-weight: 600; color: #a3a3a3; margin-bottom: 8px;">컬렉션</div>
      <div>
        <span class="chip-collection" style="background: #E3F2FD; color: #1E88E5;">개발</span>
      </div>
    </div>

    <!-- Tags (편집 가능) -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="font-size: 12px; font-weight: 600; color: #a3a3a3; margin-bottom: 8px;">태그</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <span class="chip-tag">React <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
        <span class="chip-tag">성능 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
        <span class="chip-tag-add"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> 추가</span>
      </div>
    </div>

    <!-- Memo / Summary -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="font-size: 12px; font-weight: 600; color: #a3a3a3; margin-bottom: 8px;">AI 요약</div>
      <div style="font-size: 14px; color: #0a0a0a; line-height: 1.6;">
        React Native 앱의 성능을 최적화하는 핵심 전략을 다룹니다. FlatList 최적화, 메모이제이션, 네이티브 모듈 활용 등 실전에서 바로 적용할 수 있는 팁을 소개합니다.
      </div>
    </div>

    <!-- Action Buttons -->
    <div style="padding: 0 20px; margin-bottom: 24px; display: flex; gap: 10px;">
      <div style="flex: 1; padding: 14px; text-align: center; font-size: 14px; font-weight: 600; color: #0a0a0a; background: #f5f5f5; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        복사
      </div>
      <div style="flex: 1; padding: 14px; text-align: center; font-size: 14px; font-weight: 600; color: #fafafa; background: #0a0a0a; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        열기
      </div>
    </div>

    <!-- Date -->
    <div style="padding: 0 20px; margin-bottom: 40px;">
      <div style="font-size: 12px; color: #a3a3a3;">저장일: 2026년 3월 25일</div>
    </div>

  </div>
</body>
</html>
