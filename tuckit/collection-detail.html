<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 컬렉션 상세</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
      overflow-x: hidden;
    }
    .chip-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      color: #737373;
      border: 1px solid #e5e5e5;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <div style="height: 48px;"></div>

    <!-- Header (iOS nav) -->
    <div style="padding: 0 20px; margin-bottom: 20px; display: flex; align-items: center; position: relative; height: 44px;">
      <div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </div>
      <div style="position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none;">
        <span style="font-size: 16px; font-weight: 600; color: #0a0a0a;">개발</span>
        <span style="font-size: 12px; color: #a3a3a3;">12개 링크</span>
      </div>
    </div>

    <!-- Cards (홈과 동일 레이아웃) -->
    <div style="padding: 0 20px; padding-bottom: 40px;">

      <!-- Card 1 -->
      <div style="display: flex; gap: 14px; padding: 14px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; margin-bottom: 10px;">
        <div style="width: 72px; height: 72px; background: #f5f5f5; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">React Native 성능 최적화 가이드</div>
          <div style="font-size: 12px; color: #a3a3a3; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">medium.com/@dev</div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div><span style="display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #E3F2FD; color: #1E88E5;">개발</span></div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              <span class="chip-tag">React</span>
              <span class="chip-tag">성능</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div style="display: flex; gap: 14px; padding: 14px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; margin-bottom: 10px;">
        <div style="width: 72px; height: 72px; background: #f5f5f5; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">TypeScript 5.0 새로운 기능 정리</div>
          <div style="font-size: 12px; color: #a3a3a3; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">dev.to/typescript</div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div><span style="display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #E3F2FD; color: #1E88E5;">개발</span></div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              <span class="chip-tag">TypeScript</span>
              <span class="chip-tag">업데이트</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div style="display: flex; gap: 14px; padding: 14px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; margin-bottom: 10px;">
        <div style="width: 72px; height: 72px; background: #f5f5f5; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Supabase vs Firebase 비교 분석</div>
          <div style="font-size: 12px; color: #a3a3a3; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">blog.logrocket.com</div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div><span style="display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #E3F2FD; color: #1E88E5;">개발</span></div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              <span class="chip-tag">Backend</span>
              <span class="chip-tag">비교</span>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
