<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 캐시 삭제 다이얼로그</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: rgba(0,0,0,0.4); position: relative; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <!-- Dialog -->
    <div style="background: #ffffff; border-radius: 16px; margin: 0 32px; padding: 28px 24px 20px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.15);">
      <!-- Icon -->
      <div style="display: flex; justify-content: center; margin-bottom: 16px;">
        <div style="width: 48px; height: 48px; background: #FEF2F2; border-radius: 9999px; display: flex; align-items: center; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </div>
      </div>
      <!-- Title -->
      <div style="text-align: center; font-size: 17px; font-weight: 600; color: #0a0a0a; margin-bottom: 8px;">캐시를 삭제할까요?</div>
      <!-- Description -->
      <div style="text-align: center; font-size: 14px; color: #737373; line-height: 1.5; margin-bottom: 24px;">저장된 썸네일과 임시 데이터가 삭제됩니다. 링크 데이터는 유지됩니다.</div>
      <!-- Buttons -->
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 600; color: #737373; background: #f5f5f5; border-radius: 10px; cursor: pointer;">취소</div>
        <div style="flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 600; color: #ffffff; background: #ef4444; border-radius: 10px; cursor: pointer;">삭제</div>
      </div>
    </div>
  </div>
</body>
</html>
