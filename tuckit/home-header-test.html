<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 헤더 + 버튼 비교</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <!-- Status Bar Spacer -->
    <div style="height: 48px;"></div>

    <!-- Label -->
    <div style="padding: 16px 20px 12px; font-size: 11px; font-weight: 600; color: #a3a3a3; letter-spacing: 0.05em; text-transform: uppercase;">헤더 + 버튼 스타일 비교</div>

    <!-- Option A: 검정 원 안에 흰색 + -->
    <div style="padding: 0 20px; margin-bottom: 32px;">
      <div style="font-size: 12px; font-weight: 600; color: #F57C00; margin-bottom: 12px;">A. 미니 서클</div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 0 16px; border-bottom: 1px solid #f5f5f5;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <div style="font-size: 24px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.025em;">Tuckit</div>
          <span style="font-size: 13px; color: #a3a3a3; font-weight: 500;">32</span>
        </div>
        <div style="width: 32px; height: 32px; background: #0a0a0a; border-radius: 9999px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
    </div>

    <!-- Option B: 회색 라운드 박스 -->
    <div style="padding: 0 20px; margin-bottom: 32px;">
      <div style="font-size: 12px; font-weight: 600; color: #F57C00; margin-bottom: 12px;">B. 라운드 박스</div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 0 16px; border-bottom: 1px solid #f5f5f5;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <div style="font-size: 24px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.025em;">Tuckit</div>
          <span style="font-size: 13px; color: #a3a3a3; font-weight: 500;">32</span>
        </div>
        <div style="width: 36px; height: 36px; background: #f5f5f5; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
    </div>

    <!-- Option C: pill 텍스트 버튼 -->
    <div style="padding: 0 20px; margin-bottom: 32px;">
      <div style="font-size: 12px; font-weight: 600; color: #F57C00; margin-bottom: 12px;">C. 필 버튼</div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 0 16px; border-bottom: 1px solid #f5f5f5;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <div style="font-size: 24px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.025em;">Tuckit</div>
          <span style="font-size: 13px; color: #a3a3a3; font-weight: 500;">32</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; padding: 6px 14px; background: #0a0a0a; border-radius: 9999px; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span style="font-size: 13px; font-weight: 500; color: #fafafa;">추가</span>
        </div>
      </div>
    </div>

    <!-- 실제 적용 시뮬레이션 -->
    <div style="padding: 16px 20px 12px; font-size: 11px; font-weight: 600; color: #a3a3a3; letter-spacing: 0.05em; text-transform: uppercase; border-top: 4px solid #f5f5f5;">카드와 함께 보기 (A 적용)</div>

    <!-- Header A applied -->
    <div style="padding: 0 20px; margin-bottom: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <div style="font-size: 24px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.025em;">Tuckit</div>
          <span style="font-size: 13px; color: #a3a3a3; font-weight: 500;">32</span>
        </div>
        <div style="width: 32px; height: 32px; background: #0a0a0a; border-radius: 9999px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div style="padding: 0 20px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 10px; background: #f5f5f5; border-radius: 10px; padding: 10px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span style="font-size: 14px; color: #a3a3a3;">링크 검색...</span>
      </div>
    </div>

    <!-- Category -->
    <div style="padding: 0 20px; margin-bottom: 16px; overflow-x: auto;">
      <div style="display: flex; gap: 8px; white-space: nowrap;">
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #0a0a0a; color: #fafafa;">전체</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #FFF3E0; color: #F57C00; border: 1px solid #FFE0B2;">개발</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">디자인</div>
        <div style="padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #f5f5f5; color: #737373;">요리</div>
      </div>
    </div>

    <!-- Cards -->
    <div style="padding: 0 20px;">
      <div style="display: flex; gap: 14px; padding: 14px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; margin-bottom: 10px;">
        <div style="width: 72px; height: 72px; background: #f5f5f5; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 3px;">React Native 성능 최적화 가이드</div>
          <div style="font-size: 12px; color: #a3a3a3; margin-bottom: 8px;">medium.com/@dev</div>
          <div style="display: flex; gap: 6px;">
            <span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #FFF3E0; color: #F57C00;">개발</span>
            <span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #f5f5f5; color: #737373;">React</span>
          </div>
        </div>
      </div>
      <div style="display: flex; gap: 14px; padding: 14px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px;">
        <div style="width: 72px; height: 72px; background: #f5f5f5; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
          <div style="font-size: 14px; font-weight: 600; color: #0a0a0a; margin-bottom: 3px;">집에서 만드는 크림파스타 레시피</div>
          <div style="font-size: 12px; color: #a3a3a3; margin-bottom: 8px;">blog.naver.com/cook</div>
          <div style="display: flex; gap: 6px;">
            <span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #FFF3E0; color: #F57C00;">요리</span>
            <span style="padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #f5f5f5; color: #737373;">파스타</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
