<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 새 컬렉션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 32px; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 20px; font-weight: 700; color: #0a0a0a;">새 컬렉션</div>
      <div style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <!-- Preview -->
    <div style="display: flex; justify-content: center; margin-bottom: 32px;">
      <div style="width: 80px; height: 80px; background: #E3F2FD; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px;">💻</div>
    </div>

    <!-- Name Input -->
    <div style="padding: 0 20px; margin-bottom: 28px;">
      <div style="font-size: 13px; font-weight: 600; color: #0a0a0a; margin-bottom: 8px;">이름</div>
      <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px;">
        <span style="font-size: 15px; color: #0a0a0a;">개발</span>
      </div>
    </div>

    <!-- Emoji Select -->
    <div style="padding: 0 20px; margin-bottom: 28px;">
      <div style="font-size: 13px; font-weight: 600; color: #0a0a0a; margin-bottom: 10px;">아이콘</div>
      <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;">
        <div style="width: 44px; height: 44px; background: #E3F2FD; border: 2px solid #1E88E5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">💻</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">🍳</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">🎨</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">💰</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">✈️</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">📖</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">🎵</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">📸</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">🏋️</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">🎮</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">🏠</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">📋</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">🛒</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">⭐</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">💡</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">🔗</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">📱</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">🧪</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">🌍</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">❤️</div>
        <div style="width: 44px; height: 44px; background: #f5f5f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;">📝</div>
      </div>
    </div>

    <!-- Color Select -->
    <div style="padding: 0 20px; margin-bottom: 40px;">
      <div style="font-size: 13px; font-weight: 600; color: #0a0a0a; margin-bottom: 10px;">컬러</div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #FFF0ED; border: 2px solid #e5e5e5; cursor: pointer; display: flex; align-items: center; justify-content: center;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #E8563A;"></div></div>
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #FFF3E0; border: 2px solid #e5e5e5; cursor: pointer; display: flex; align-items: center; justify-content: center;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #F57C00;"></div></div>
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #FFF8E1; border: 2px solid #e5e5e5; cursor: pointer; display: flex; align-items: center; justify-content: center;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #F9A825;"></div></div>
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #E8F5E9; border: 2px solid #e5e5e5; cursor: pointer; display: flex; align-items: center; justify-content: center;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #43A047;"></div></div>
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #E0F2F1; border: 2px solid #e5e5e5; cursor: pointer; display: flex; align-items: center; justify-content: center;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #00897B;"></div></div>
        <!-- blue = selected -->
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #E3F2FD; border: 2.5px solid #1E88E5; cursor: pointer; display: flex; align-items: center; justify-content: center;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #1E88E5;"></div></div>
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #E8EAF6; border: 2px solid #e5e5e5; cursor: pointer; display: flex; align-items: center; justify-content: center;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #5C6BC0;"></div></div>
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #F3E5F5; border: 2px solid #e5e5e5; cursor: pointer; display: flex; align-items: center; justify-content: center;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #8E24AA;"></div></div>
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #FCE4EC; border: 2px solid #e5e5e5; cursor: pointer; display: flex; align-items: center; justify-content: center;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #D81B60;"></div></div>
        <div style="width: 36px; height: 36px; border-radius: 9999px; background: #F5F5F5; border: 2px solid #e5e5e5; cursor: pointer; display: flex; align-items: center; justify-content: center;"><div style="width: 20px; height: 20px; border-radius: 9999px; background: #616161;"></div></div>
      </div>
    </div>

    <!-- Create Button -->
    <div style="padding: 0 20px; padding-bottom: 48px;">
      <div style="background: #0a0a0a; color: #fafafa; border-radius: 10px; padding: 14px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer;">만들기</div>
    </div>

  </div>
</body>
</html>
