<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit - Design Preview</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #050507; display: flex; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .container { width: 100%; max-width: 390px; background: #09090b; min-height: 100vh; padding: 56px 20px 24px; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 800; color: #fafafa; margin-bottom: 4px; letter-spacing: -0.03em; }
    .subtitle { font-size: 14px; color: rgba(255,255,255,0.35); margin-bottom: 28px; }
    .screen-list { display: flex; flex-direction: column; gap: 12px; }
    a { text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; transition: all 0.25s cubic-bezier(0.4,0,0.2,1); }
    a:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.10); transform: translateY(-1px); }
    .screen-name { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600; color: #fafafa; display: flex; align-items: center; gap: 8px; }
    .screen-desc { font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tuckit</h1>
    <div class="subtitle">링크 북마크 웹앱 — Design Preview v2</div>
    <div class="screen-list">
      <a href="home.html">
        <div>
          <div class="screen-name">
            <i data-lucide="home" style="width: 18px; height: 18px; color: #a78bfa;"></i>
            홈
          </div>
          <div class="screen-desc">링크 목록 + 검색 + 컬렉션 탭</div>
        </div>
        <i data-lucide="chevron-right" style="width: 18px; height: 18px; color: rgba(255,255,255,0.2);"></i>
      </a>
      <a href="add-link.html">
        <div>
          <div class="screen-name">
            <i data-lucide="plus-circle" style="width: 18px; height: 18px; color: #a78bfa;"></i>
            링크 추가
          </div>
          <div class="screen-desc">URL 입력 → 메타데이터 추출 → 저장</div>
        </div>
        <i data-lucide="chevron-right" style="width: 18px; height: 18px; color: rgba(255,255,255,0.2);"></i>
      </a>
      <a href="detail.html">
        <div>
          <div class="screen-name">
            <i data-lucide="file-text" style="width: 18px; height: 18px; color: #a78bfa;"></i>
            링크 상세
          </div>
          <div class="screen-desc">썸네일, 제목, 태그, 수정/삭제</div>
        </div>
        <i data-lucide="chevron-right" style="width: 18px; height: 18px; color: rgba(255,255,255,0.2);"></i>
      </a>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
