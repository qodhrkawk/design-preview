<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 설정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <!-- Status Bar Spacer -->
    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="font-size: 24px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.025em;">설정</div>
    </div>

    <!-- User Profile Card -->
    <div style="padding: 0 20px; margin-bottom: 28px;">
      <div style="display: flex; align-items: center; gap: 14px; background: #f5f5f5; border-radius: 14px; padding: 16px;">
        <div style="width: 48px; height: 48px; background: #0a0a0a; border-radius: 9999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <span style="font-size: 18px; font-weight: 700; color: #fafafa;">Y</span>
        </div>
        <div>
          <div style="font-size: 16px; font-weight: 600; color: #0a0a0a;">윤재</div>
          <div style="font-size: 13px; color: #a3a3a3;">yunjae@gmail.com</div>
        </div>
        <div style="margin-left: auto;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
    </div>

    <!-- General Section -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="font-size: 12px; font-weight: 600; color: #a3a3a3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding-left: 4px;">일반</div>
      <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden;">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span style="font-size: 14px; color: #0a0a0a;">알림 설정</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            <span style="font-size: 14px; color: #0a0a0a;">테마</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 13px; color: #a3a3a3;">시스템 설정</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Data Section -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="font-size: 12px; font-weight: 600; color: #a3a3a3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding-left: 4px;">데이터</div>
      <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden;">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            <span style="font-size: 14px; color: #0a0a0a;">데이터 내보내기</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            <span style="font-size: 14px; color: #0a0a0a;">캐시 삭제</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
    </div>

    <!-- Info Section -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="font-size: 12px; font-weight: 600; color: #a3a3a3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding-left: 4px;">정보</div>
      <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden;">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #f5f5f5;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <span style="font-size: 14px; color: #0a0a0a;">버전</span>
          </div>
          <span style="font-size: 13px; color: #a3a3a3;">1.0.0</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            <span style="font-size: 14px; color: #0a0a0a;">개인정보 처리방침</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/></svg>
            <span style="font-size: 14px; color: #0a0a0a;">이용약관</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
    </div>

    <!-- Logout -->
    <div style="padding: 0 20px; padding-bottom: 140px;">
      <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; overflow: hidden;">
        <div style="display: flex; align-items: center; justify-content: center; padding: 14px 16px; cursor: pointer;">
          <span style="font-size: 14px; font-weight: 500; color: #ef4444;">로그아웃</span>
        </div>
      </div>
    </div>

    <!-- Ad Banner -->
    <div style="position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px;">
      <div style="height: 50px; background: #f5f5f5; border-top: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 12px; color: #a3a3a3;">AdMob 배너 광고</span>
      </div>
    </div>

    <!-- Bottom Tab Bar -->
    <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: #ffffff; border-top: 1px solid #e5e5e5; padding-bottom: env(safe-area-inset-bottom, 0px);">
      <div style="display: flex; justify-content: space-around; padding: 10px 0 8px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span style="font-size: 10px; font-weight: 500; color: #a3a3a3;">홈</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span style="font-size: 10px; font-weight: 500; color: #a3a3a3;">컬렉션</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span style="font-size: 10px; font-weight: 600; color: #0a0a0a;">설정</span>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
