<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit - 링크 추가</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #050507; display: flex; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #09090b; position: relative; display: flex; flex-direction: column; }

    .glass { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 16px; }

    .input-field { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; font-size: 14px; color: #fafafa; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: rgba(139,92,246,0.5); }
    .input-field::placeholder { color: rgba(255,255,255,0.2); }

    .label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5); margin-bottom: 8px; letter-spacing: 0.03em; text-transform: uppercase; }

    .collection-chip { padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .collection-active { background: #fafafa; color: #09090b; }
    .collection-default { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }
    .collection-default:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }

    .tag-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; background: rgba(139,92,246,0.12); font-size: 13px; color: #a78bfa; font-weight: 500; }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <div style="height: 48px;"></div>

    <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 24px; flex: 1;">

      <!-- Header -->
      <div style="display: flex; align-items: center; gap: 14px;">
        <a href="home.html" style="text-decoration: none; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
          <i data-lucide="arrow-left" style="width: 18px; height: 18px; color: rgba(255,255,255,0.6);"></i>
        </a>
        <div style="font-family: 'Outfit', sans-serif; font-size: 21px; font-weight: 700; color: #fafafa; letter-spacing: -0.02em;">링크 추가</div>
      </div>

      <!-- URL Input -->
      <div>
        <div class="label">URL</div>
        <div style="display: flex; gap: 8px;">
          <div style="flex: 1; position: relative;">
            <div style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%);">
              <i data-lucide="globe" style="width: 16px; height: 16px; color: rgba(255,255,255,0.25);"></i>
            </div>
            <input class="input-field" style="padding-left: 38px;" value="https://ui.shadcn.com" readonly>
          </div>
          <button style="padding: 0 20px; background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s; white-space: nowrap; box-shadow: 0 4px 16px rgba(99,102,241,0.3);" onmouseover="this.style.boxShadow='0 6px 24px rgba(99,102,241,0.4)'" onmouseout="this.style.boxShadow='0 4px 16px rgba(99,102,241,0.3)'">
            <i data-lucide="download" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle; margin-right: 4px;"></i>
            가져오기
          </button>
        </div>
      </div>

      <!-- Preview Card -->
      <div class="glass" style="overflow: hidden;">
        <div style="position: relative; width: 100%; height: 150px; overflow: hidden; background: #1a1a2e;">
          <img src="https://repository-images.githubusercontent.com/535630065/0267c4c7-e9f4-4632-8e13-6d78e2270d9c" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.8;" onerror="this.style.display='none'">
          <div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(9,9,11,0.9) 100%);"></div>
          <div style="position: absolute; bottom: 10px; left: 14px; display: flex; align-items: center; gap: 6px;">
            <div style="width: 18px; height: 18px; border-radius: 5px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff;">s</div>
            <span style="font-size: 12px; color: rgba(255,255,255,0.5);">ui.shadcn.com</span>
          </div>
          <div style="position: absolute; top: 10px; right: 10px; padding: 3px 8px; border-radius: 6px; background: rgba(34,197,94,0.15); font-size: 11px; color: #4ade80; font-weight: 500; display: flex; align-items: center; gap: 4px;">
            <i data-lucide="check-circle" style="width: 12px; height: 12px;"></i>미리보기 로드됨
          </div>
        </div>
        <div style="padding: 14px 16px;">
          <div style="font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; color: #fafafa; line-height: 1.4;">shadcn/ui — Beautifully designed components</div>
          <div style="font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 4px; line-height: 1.4;">Beautifully designed components built with Radix UI and Tailwind CSS.</div>
        </div>
      </div>

      <!-- Title -->
      <div>
        <div class="label">제목</div>
        <input class="input-field" value="shadcn/ui — Beautifully designed components" readonly>
      </div>

      <!-- Collection -->
      <div>
        <div class="label">컬렉션</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <div class="collection-chip collection-active">개발</div>
          <div class="collection-chip collection-default">디자인</div>
          <div class="collection-chip collection-default">읽을거리</div>
          <div class="collection-chip collection-default" style="border-style: dashed; display: flex; align-items: center; gap: 4px;">
            <i data-lucide="plus" style="width: 14px; height: 14px;"></i>새 컬렉션
          </div>
        </div>
      </div>

      <!-- Tags -->
      <div>
        <div class="label">태그</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
          <div class="tag-pill">UI <i data-lucide="x" style="width: 12px; height: 12px; cursor: pointer; opacity: 0.6;"></i></div>
          <div class="tag-pill">React <i data-lucide="x" style="width: 12px; height: 12px; cursor: pointer; opacity: 0.6;"></i></div>
        </div>
        <div style="position: relative;">
          <div style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%);">
            <i data-lucide="tag" style="width: 14px; height: 14px; color: rgba(255,255,255,0.2);"></i>
          </div>
          <input class="input-field" style="padding-left: 36px;" placeholder="태그 입력 후 Enter">
        </div>
      </div>

      <!-- Spacer -->
      <div style="flex: 1;"></div>

      <!-- Save Button -->
      <div style="padding-bottom: 36px;">
        <button style="width: 100%; padding: 16px; background: linear-gradient(135deg, #8b5cf6, #6366f1); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.25s; box-shadow: 0 8px 32px rgba(99,102,241,0.3); display: flex; align-items: center; justify-content: center; gap: 8px;" onmouseover="this.style.boxShadow='0 12px 40px rgba(99,102,241,0.45)';this.style.transform='translateY(-1px)'" onmouseout="this.style.boxShadow='0 8px 32px rgba(99,102,241,0.3)';this.style.transform='none'">
          <i data-lucide="bookmark-plus" style="width: 20px; height: 20px;"></i>
          저장하기
        </button>
      </div>

    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
