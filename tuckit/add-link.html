<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 링크 추가</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
    }
    .radio-selected {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      border: 1.5px solid #0a0a0a;
      background: #fafafa;
      color: #0a0a0a;
      cursor: pointer;
    }
    .radio-unselected {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #e5e5e5;
      background: #ffffff;
      color: #737373;
      cursor: pointer;
    }
    .chip-tag-active {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      color: #0a0a0a;
      border: 1px solid #d4d4d4;
      cursor: pointer;
    }
    .chip-tag-inactive {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      color: #d4d4d4;
      border: 1px solid #e5e5e5;
      cursor: pointer;
      text-decoration: line-through;
    }
    .chip-tag-add {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      color: #a3a3a3;
      border: 1px dashed #d4d4d4;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 20px; font-weight: 700; color: #0a0a0a;">링크 추가</div>
      <div style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <!-- URL Input -->
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 6px;">URL</div>
      <div style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span style="font-size: 14px; color: #3b82f6; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">https://medium.com/@dev/rn-performance-guide</span>
      </div>
    </div>

    <!-- Preview Card -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 6px;">미리보기</div>
      <div style="background: #f5f5f5; border-radius: 12px; overflow: hidden;">
        <div style="width: 100%; height: 160px; background: linear-gradient(135deg, #e5e5e5 0%, #d4d4d4 100%); display: flex; align-items: center; justify-content: center;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="padding: 14px;">
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 4px; line-height: 1.4;">React Native 성능 최적화 가이드</div>
          <div style="font-size: 13px; color: #737373; line-height: 1.5; margin-bottom: 4px;">React Native 앱의 성능을 극대화하는 10가지 팁과 실전 예제를 소개합니다...</div>
          <div style="font-size: 12px; color: #a3a3a3;">medium.com</div>
        </div>
      </div>
    </div>

    <!-- 컬렉션 추천 (라디오) -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px;">
        <span style="font-size: 13px; font-weight: 600; color: #0a0a0a;">컬렉션</span>
        <span style="font-size: 11px; color: #a3a3a3;">AI 추천 · 1개 선택</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <!-- 기존 매칭 1: 개발 (blue) - 선택됨 -->
        <div class="radio-selected">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="#0a0a0a"/></svg>
          <span style="display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: #E3F2FD; color: #1E88E5;">개발</span>
          <span style="font-size: 12px; color: #a3a3a3;">기존 컬렉션</span>
        </div>
        <!-- 기존 매칭 2: 디자인 (purple) -->
        <div class="radio-unselected">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
          <span style="display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: #F3E5F5; color: #8E24AA;">디자인</span>
          <span style="font-size: 12px; color: #a3a3a3;">기존 컬렉션</span>
        </div>
        <!-- AI 신규 제안 -->
        <div class="radio-unselected">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
          <span style="display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: #E0F2F1; color: #00897B;">모바일 개발</span>
          <span style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: #F57C00; font-weight: 500;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#F57C00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            새로 만들기
          </span>
        </div>
        <!-- 직접 입력 -->
        <div class="radio-unselected">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          <span style="font-size: 14px; color: #a3a3a3;">직접 입력...</span>
        </div>
      </div>
    </div>

    <!-- 태그 -->
    <div style="padding: 0 20px; margin-bottom: 32px;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px;">
        <span style="font-size: 13px; font-weight: 600; color: #0a0a0a;">태그</span>
        <span style="font-size: 11px; color: #a3a3a3;">탭하여 제외</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <span class="chip-tag-active">React Native</span>
        <span class="chip-tag-active">성능</span>
        <span class="chip-tag-active">최적화</span>
        <span class="chip-tag-inactive">JavaScript</span>
        <span class="chip-tag-add">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          추가
        </span>
      </div>
    </div>

    <!-- Save Button -->
    <div style="padding: 0 20px; padding-bottom: 48px;">
      <div style="background: #0a0a0a; color: #fafafa; border-radius: 10px; padding: 14px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer;">저장하기</div>
    </div>

  </div>
</body>
</html>
