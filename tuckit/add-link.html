<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 링크 추가</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
    }
    .chip-category-selected {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      background: #FFF3E0;
      color: #F57C00;
      border: 1.5px solid #F57C00;
      cursor: pointer;
    }
    .chip-category-unselected {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      background: #ffffff;
      color: #737373;
      border: 1px solid #e5e5e5;
      cursor: pointer;
    }
    .chip-tag-active {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      color: #0a0a0a;
      border: 1px solid #d4d4d4;
      cursor: pointer;
    }
    .chip-tag-inactive {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      color: #d4d4d4;
      border: 1px solid #e5e5e5;
      cursor: pointer;
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 20px; font-weight: 700; color: #0a0a0a;">링크 추가</div>
      <div style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <!-- URL Input (자동 크롤링 완료 상태) -->
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 6px;">URL</div>
      <div style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span style="font-size: 14px; color: #3b82f6; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">https://medium.com/@dev/rn-performance-guide</span>
      </div>
    </div>

    <!-- Preview Card -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 6px;">미리보기</div>
      <div style="background: #f5f5f5; border-radius: 12px; overflow: hidden;">
        <div style="width: 100%; height: 160px; background: linear-gradient(135deg, #e5e5e5 0%, #d4d4d4 100%); display: flex; align-items: center; justify-content: center;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="padding: 14px;">
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 4px; line-height: 1.4;">React Native 성능 최적화 가이드</div>
          <div style="font-size: 13px; color: #737373; line-height: 1.5; margin-bottom: 4px;">React Native 앱의 성능을 극대화하는 10가지 팁과 실전 예제를 소개합니다...</div>
          <div style="font-size: 12px; color: #a3a3a3;">medium.com</div>
        </div>
      </div>
    </div>

    <!-- AI 카테고리 (3개 후보, 라디오 선택) -->
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px;">
        <span style="font-size: 13px; font-weight: 600; color: #0a0a0a;">카테고리</span>
        <span style="font-size: 11px; color: #a3a3a3;">AI 추천 · 1개 선택</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <!-- 선택됨 -->
        <span class="chip-category-selected">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F57C00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          개발
        </span>
        <!-- 비선택 -->
        <span class="chip-category-unselected">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
          테크
        </span>
        <span class="chip-category-unselected">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/></svg>
          모바일
        </span>
      </div>
    </div>

    <!-- AI 태그 (토글) -->
    <div style="padding: 0 20px; margin-bottom: 24px;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px;">
        <span style="font-size: 13px; font-weight: 600; color: #0a0a0a;">태그</span>
        <span style="font-size: 11px; color: #a3a3a3;">탭하여 제외</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <span class="chip-tag-active">React Native</span>
        <span class="chip-tag-active">성능</span>
        <span class="chip-tag-active">최적화</span>
        <span class="chip-tag-inactive">JavaScript</span>
      </div>
    </div>

    <!-- 컬렉션 선택 (풀스크린 전환) -->
    <div style="padding: 0 20px; margin-bottom: 32px;">
      <div style="font-size: 13px; font-weight: 600; color: #0a0a0a; margin-bottom: 6px;">컬렉션</div>
      <div style="display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px; cursor: pointer;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span style="font-size: 14px; color: #a3a3a3;">컬렉션에 추가...</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>

    <!-- Save Button -->
    <div style="padding: 0 20px; padding-bottom: 48px;">
      <div style="background: #0a0a0a; color: #fafafa; border-radius: 10px; padding: 14px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer;">저장하기</div>
    </div>

  </div>
</body>
</html>
