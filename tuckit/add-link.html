<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 링크 추가</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <!-- Status Bar Spacer -->
    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 20px; font-weight: 700; color: #0a0a0a;">링크 추가</div>
      <div style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <!-- URL Input -->
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 6px;">URL</div>
      <div style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span style="font-size: 14px; color: #3b82f6; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">https://medium.com/@dev/rn-performance-guide</span>
      </div>
    </div>

    <!-- Preview Card -->
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 6px;">미리보기</div>
      <div style="background: #f5f5f5; border-radius: 12px; overflow: hidden;">
        <div style="width: 100%; height: 160px; background: linear-gradient(135deg, #e5e5e5 0%, #d4d4d4 100%); display: flex; align-items: center; justify-content: center;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <div style="padding: 14px;">
          <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 4px; line-height: 1.4;">React Native 성능 최적화 가이드</div>
          <div style="font-size: 13px; color: #737373; line-height: 1.5;">React Native 앱의 성능을 극대화하는 10가지 팁과 실전 예제를 소개합니다...</div>
        </div>
      </div>
    </div>

    <!-- AI Auto Classification -->
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <div style="background: #FFF8E1; border: 1px solid #FFE0B2; border-radius: 12px; padding: 14px;">
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F57C00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
          <span style="font-size: 13px; font-weight: 600; color: #F57C00;">AI 자동 분류</span>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <span style="padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; background: #F57C00; color: #ffffff;">개발</span>
          <span style="padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; background: #ffffff; border: 1px solid #FFB74D; color: #F57C00;">React Native</span>
          <span style="padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; background: #ffffff; border: 1px solid #FFB74D; color: #F57C00;">성능</span>
          <span style="padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; background: #ffffff; border: 1px solid #FFB74D; color: #F57C00;">모바일</span>
        </div>
        <div style="margin-top: 8px; font-size: 11px; color: #a3a3a3;">탭하여 수정할 수 있어요</div>
      </div>
    </div>

    <!-- Collection Selector -->
    <div style="padding: 0 20px; margin-bottom: 32px;">
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 6px;">컬렉션 (선택)</div>
      <div style="display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px;">
        <span style="font-size: 14px; color: #a3a3a3;">컬렉션에 추가...</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <!-- Save Button -->
    <div style="padding: 0 20px; padding-bottom: 48px;">
      <div style="background: #0a0a0a; color: #fafafa; border-radius: 10px; padding: 14px; text-align: center; font-size: 15px; font-weight: 600; cursor: pointer;">저장하기</div>
    </div>

  </div>
</body>
</html>
