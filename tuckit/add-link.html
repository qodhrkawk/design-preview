<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuckit — 링크 추가 (초기)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #ffffff; position: relative; }
  </style>
</head>
<body>
  <div class="mobile-frame">

    <div style="height: 48px;"></div>

    <!-- Header -->
    <div style="padding: 0 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 20px; font-weight: 700; color: #0a0a0a;">링크 추가</div>
      <div style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <!-- Clipboard Banner -->
    <div style="padding: 0 20px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #F0F7FF; border: 1px solid #BFDBFE; border-radius: 12px; cursor: pointer;">
        <div style="width: 36px; height: 36px; background: #DBEAFE; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 13px; font-weight: 600; color: #1e40af;">클립보드에서 붙여넣기</div>
          <div style="font-size: 12px; color: #60a5fa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px;">https://medium.com/@dev/react-na...</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>

    <!-- URL Input -->
    <div style="padding: 0 20px; margin-bottom: 32px;">
      <div style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span style="font-size: 14px; color: #a3a3a3;">URL을 붙여넣으세요</span>
      </div>
    </div>

    <!-- Empty State -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px;">
      <!-- Link icon illustration -->
      <div style="width: 80px; height: 80px; background: #f5f5f5; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </div>
      <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 8px;">링크를 추가해보세요</div>
      <div style="font-size: 13px; color: #a3a3a3; text-align: center; line-height: 1.5;">URL을 붙여넣으면<br>AI가 자동으로 분류해드려요</div>
    </div>

  </div>
</body>
</html>
