<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꽉채워 — 납입 기록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: rgba(10,10,10,0.45); display: flex; flex-direction: column; justify-content: flex-end; position: relative; }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main class="screen">
  <!-- dimmed home behind -->
  <div style="position: absolute; top: 60px; left: 20px; right: 20px; height: 160px; border-radius: 16px; background: rgba(255,255,255,0.5);"></div>

  <!-- bottom sheet -->
  <section style="background: #ffffff; border-radius: 16px 16px 0 0; padding: 8px 20px 28px; display: flex; flex-direction: column; gap: 18px; position: relative;">
    <div style="width: 36px; height: 4px; border-radius: 9999px; background: #e5e5e5; align-self: center;"></div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 18px; font-weight: 600;">납입 기록</h2>
      <span style="font-size: 12px; color: #737373;">10월 22일 (목)</span>
    </div>

    <!-- account picker -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 14px; font-weight: 500;">어느 계좌에</span>
      <div style="display: flex; gap: 8px;">
        <button style="flex: 1; height: 56px; border-radius: 8px; border: 1px solid #e5e5e5; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
          <span style="font-size: 13px; font-weight: 600;">미래 연금저축</span>
          <span class="num" style="font-size: 11px; color: #737373;">300만</span>
        </button>
        <button style="flex: 1; height: 56px; border-radius: 8px; border: 2px solid #171717; background: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
          <span style="font-size: 13px; font-weight: 600;">삼성 IRP</span>
          <span class="num" style="font-size: 11px; color: #737373;">150만</span>
        </button>
        <button style="flex: 1; height: 56px; border-radius: 8px; border: 1px solid #e5e5e5; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
          <span style="font-size: 13px; font-weight: 600;">한화 보험</span>
          <span class="num" style="font-size: 11px; color: #737373;">100만</span>
        </button>
      </div>
    </div>

    <!-- amount -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 14px; font-weight: 500;">얼마</span>
      <div style="height: 56px; border: 1px solid #e5e5e5; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
        <span class="num" style="font-size: 24px; font-weight: 600;">1,000,000</span>
        <span style="font-size: 16px; color: #737373;">원</span>
      </div>
      <div style="display: flex; gap: 6px;">
        <button style="height: 32px; padding: 0 12px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #ffffff; font-size: 12px; font-weight: 500;">+10만</button>
        <button style="height: 32px; padding: 0 12px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #ffffff; font-size: 12px; font-weight: 500;">+50만</button>
        <button style="height: 32px; padding: 0 12px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #ffffff; font-size: 12px; font-weight: 500;">+100만</button>
        <button style="height: 32px; padding: 0 12px; border-radius: 9999px; border: none; background: #171717; color: #fafafa; font-size: 12px; font-weight: 500;">IRP 빈칸 150만</button>
      </div>
    </div>

    <!-- type -->
    <div style="display: flex; gap: 0; background: #f5f5f5; border-radius: 8px; padding: 3px;">
      <button style="flex: 1; height: 34px; border: none; border-radius: 6px; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); font-size: 13px; font-weight: 600;">개인 납입</button>
      <button style="flex: 1; height: 34px; border: none; border-radius: 6px; background: transparent; font-size: 13px; color: #737373;">퇴직금 입금</button>
      <button style="flex: 1; height: 34px; border: none; border-radius: 6px; background: transparent; font-size: 13px; color: #737373;">ISA 전환</button>
    </div>
    <span style="font-size: 12px; color: #737373; margin-top: -10px;">퇴직금·계좌이전분은 공제 대상에서 자동 제외돼요</span>

    <!-- preview -->
    <div style="background: #f5f5f5; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; font-size: 13px;">
        <span style="color: #737373;">빈칸</span>
        <span class="num" style="font-weight: 600;">270만 <span style="color: #a3a3a3; font-weight: 400;">→</span> 170만</span>
      </div>
      <div style="display: flex; height: 8px; border-radius: 9999px; overflow: hidden; background: #e5e5e5;">
        <div style="width: 61.1%; background: #171717;"></div>
        <div style="width: 11.1%; background: #22c55e;"></div>
        <div style="width: 8.9%; background: #a3a3a3;"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px;">
        <span style="color: #737373;">예상 환급</span>
        <span class="num" style="font-weight: 600; color: #16a34a;">+13.2만</span>
      </div>
    </div>

    <button style="height: 48px; border-radius: 8px; background: #171717; color: #fafafa; border: none; font-size: 15px; font-weight: 600;">저장</button>
  </section>
</main>
</body>
</html>
