<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowLog — 집중 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #0a0a0a;
  color: #fafafa;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.phone {
  width: 390px;
  min-height: 100vh;
  background: #0a0a0a;
  position: relative;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 24px 8px; font-size:12px; font-weight:600; color:#a3a3a3;">
    <span>15:47</span>
    <div style="display:flex; gap:4px; align-items:center;">
      <span>●●●●</span>
      <span>WiFi</span>
      <span>🔋</span>
    </div>
  </div>

  <!-- Back & Category -->
  <div style="padding:16px 24px 8px; display:flex; justify-content:space-between; align-items:center;">
    <div style="font-size:16px; color:#a3a3a3; cursor:pointer;">← 돌아가기</div>
    <div style="background:#262626; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px;">
      💻 코딩
    </div>
  </div>

  <!-- Timer Circle -->
  <div style="display:flex; flex-direction:column; align-items:center; padding:48px 24px 32px;">
    <!-- Outer Ring -->
    <div style="width:260px; height:260px; border-radius:9999px; position:relative; display:flex; align-items:center; justify-content:center;">
      <!-- SVG Progress Ring -->
      <svg width="260" height="260" style="position:absolute; top:0; left:0; transform:rotate(-90deg);">
        <circle cx="130" cy="130" r="120" fill="none" stroke="#262626" stroke-width="6"/>
        <circle cx="130" cy="130" r="120" fill="none" stroke="#22c55e" stroke-width="6" 
          stroke-dasharray="754" stroke-dashoffset="196" stroke-linecap="round"/>
      </svg>
      <!-- Inner Content -->
      <div style="text-align:center;">
        <div style="font-size:56px; font-weight:800; letter-spacing:-0.025em; font-variant-numeric:tabular-nums;">1:22:34</div>
        <div style="font-size:14px; color:#a3a3a3; margin-top:4px;">집중 중</div>
      </div>
    </div>

    <!-- Live Indicator -->
    <div style="display:flex; align-items:center; gap:6px; margin-top:24px;">
      <div style="width:8px; height:8px; border-radius:9999px; background:#22c55e; animation:pulse 2s ease-in-out infinite;"></div>
      <span style="font-size:13px; color:#a3a3a3;">실시간 집중 중</span>
    </div>
  </div>

  <!-- Current Session Info -->
  <div style="margin:0 24px 24px; padding:20px; background:#171717; border-radius:16px;">
    <div style="font-size:14px; font-weight:500; color:#a3a3a3; margin-bottom:16px;">현재 세션</div>
    <div style="display:flex; justify-content:space-around;">
      <div style="text-align:center;">
        <div style="font-size:24px; font-weight:700;">3</div>
        <div style="font-size:12px; color:#737373; margin-top:2px;">오늘 세션</div>
      </div>
      <div style="width:1px; background:#262626;"></div>
      <div style="text-align:center;">
        <div style="font-size:24px; font-weight:700;">3h 42m</div>
        <div style="font-size:12px; color:#737373; margin-top:2px;">오늘 총 집중</div>
      </div>
      <div style="width:1px; background:#262626;"></div>
      <div style="text-align:center;">
        <div style="font-size:24px; font-weight:700; color:#22c55e;">높음</div>
        <div style="font-size:12px; color:#737373; margin-top:2px;">집중도</div>
      </div>
    </div>
  </div>

  <!-- Focus Tip -->
  <div style="margin:0 24px 24px; padding:14px 16px; background:#171717; border-radius:12px; display:flex; align-items:center; gap:12px;">
    <div style="font-size:24px;">🎯</div>
    <div>
      <div style="font-size:13px; color:#a3a3a3;">지금 골든타임이야</div>
      <div style="font-size:14px; font-weight:500; color:#fafafa; margin-top:2px;">오후 14-16시 구간 집중도 78%</div>
    </div>
  </div>

  <!-- Memo Quick Add -->
  <div style="margin:0 24px 24px; padding:12px 16px; background:#171717; border:1px solid #262626; border-radius:12px;">
    <div style="font-size:13px; color:#737373;">✏️ 메모 남기기 (선택)</div>
  </div>

  <!-- Control Buttons -->
  <div style="padding:0 24px 48px; display:flex; gap:12px;">
    <button style="flex:1; height:56px; background:#262626; color:#fafafa; border:none; border-radius:12px; font-size:15px; font-weight:600; font-family:'Inter',system-ui,sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;">
      ⏸️ 일시정지
    </button>
    <button style="flex:1; height:56px; background:#ef4444; color:#fafafa; border:none; border-radius:12px; font-size:15px; font-weight:600; font-family:'Inter',system-ui,sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;">
      ⏹️ 종료
    </button>
  </div>
</div>
</body>
</html>
