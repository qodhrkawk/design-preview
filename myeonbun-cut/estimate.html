<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몇분컷 - 견적</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; min-height: 100vh; display: flex; justify-content: center; }
  .app { width: 390px; min-height: 100vh; background: #ffffff; display: flex; flex-direction: column; }
  input { font-family: inherit; outline: none; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div style="padding: 20px 20px 16px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 36px; height: 36px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </div>
    <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.02em;">새 태스크</span>
  </div>

  <!-- Title input -->
  <div style="padding: 12px 20px 8px;">
    <div style="font-size: 12px; color: #737373; margin-bottom: 8px; font-weight: 500;">무슨 일이야?</div>
    <input type="text" value="API 에러 핸들링 리팩터링" style="width: 100%; padding: 12px 14px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 15px; color: #0a0a0a; background: #ffffff;">
  </div>

  <!-- Category Chips -->
  <div style="padding: 16px 20px 8px;">
    <div style="font-size: 12px; color: #737373; margin-bottom: 10px; font-weight: 500;">카테고리</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <div style="padding: 8px 14px; background: #171717; color: #fafafa; border-radius: 9999px; font-size: 13px; font-weight: 500;">코딩</div>
      <div style="padding: 8px 14px; background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; font-size: 13px; font-weight: 500;">문서</div>
      <div style="padding: 8px 14px; background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; font-size: 13px; font-weight: 500;">미팅</div>
      <div style="padding: 8px 14px; background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; font-size: 13px; font-weight: 500;">이메일</div>
      <div style="padding: 8px 14px; background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; font-size: 13px; font-weight: 500;">디자인</div>
      <div style="padding: 8px 14px; background: #f5f5f5; color: #737373; border: 1px dashed #d4d4d4; border-radius: 9999px; font-size: 13px; font-weight: 500;">+ 새로</div>
    </div>
  </div>

  <!-- My Estimate -->
  <div style="padding: 24px 20px 8px;">
    <div style="font-size: 12px; color: #737373; margin-bottom: 12px; font-weight: 500;">내 예상 시간</div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 16px; padding: 24px 0; background: #fafafa; border-radius: 14px;">
      <div style="width: 40px; height: 40px; border-radius: 9999px; background: #ffffff; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-size: 48px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.03em;">30</span>
        <span style="font-size: 16px; color: #737373; font-weight: 500;">분</span>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 9999px; background: #171717; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
    </div>
  </div>

  <!-- AI Prediction Card -->
  <div style="margin: 24px 20px 0; padding: 18px; background: #ffffff; border: 1.5px solid #171717; border-radius: 14px;">
    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="m4.93 4.93 2.83 2.83"/><path d="m16.24 16.24 2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="m4.93 19.07 2.83-2.83"/><path d="m16.24 7.76 2.83-2.83"/></svg>
      <span style="font-size: 12px; font-weight: 600; color: #171717; letter-spacing: 0.02em;">AI 보정 예측</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px;">
      <span style="font-size: 32px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.025em;">48분</span>
      <span style="font-size: 13px; color: #dc2626; font-weight: 600;">+18분 (1.6x)</span>
    </div>
    <div style="padding: 10px 12px; background: #fafafa; border-radius: 10px; font-size: 12px; color: #404040; line-height: 18px;">
      과거 <span style="color: #171717; font-weight: 600;">코딩 + 리팩터링</span> 태스크 24회 분석. 평균 견적의 1.6배 소요.
    </div>
  </div>

  <!-- Buffer suggestion -->
  <div style="margin: 14px 20px 0; padding: 14px 16px; background: #fafafa; border-radius: 12px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 32px; height: 32px; border-radius: 9999px; background: #fef3c7; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <div style="flex: 1; font-size: 12px; color: #404040; line-height: 18px;">
      <span style="color: #0a0a0a; font-weight: 600;">15:18까지</span> 끝낼 가능성 78%. 미팅 16:00 전 여유 두려면 <span style="color: #d97706; font-weight: 600;">+10분 버퍼</span> 추천.
    </div>
  </div>

  <!-- Start button -->
  <div style="flex: 1;"></div>
  <div style="padding: 20px;">
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <div style="flex: 1; padding: 14px 0; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; font-size: 14px; font-weight: 500; color: #171717; text-align: center;">내 예상으로 (30분)</div>
    </div>
    <div style="padding: 16px 0; background: #171717; border-radius: 12px; font-size: 15px; font-weight: 600; color: #fafafa; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      AI 보정으로 시작 (48분)
    </div>
  </div>
</div>
</body>
</html>
