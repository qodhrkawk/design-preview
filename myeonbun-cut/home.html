<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몇분컷 - 홈</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; min-height: 100vh; display: flex; justify-content: center; }
  .app { width: 390px; min-height: 100vh; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div style="padding: 20px 20px 16px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 32px; height: 32px; background: #171717; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em;">몇분컷</span>
    </div>
    <div style="width: 36px; height: 36px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
  </div>

  <!-- Greeting -->
  <div style="padding: 8px 20px 20px;">
    <div style="font-size: 13px; color: #737373; margin-bottom: 4px;">월요일 오후 2:02</div>
    <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em;">오늘 몇 분 컷이야?</div>
  </div>

  <!-- Calibration Card -->
  <div style="margin: 0 20px 20px; padding: 20px; background: linear-gradient(135deg, #171717 0%, #404040 100%); border-radius: 16px; color: #fafafa;">
    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      <span style="font-size: 12px; color: #a3a3a3; font-weight: 500;">나의 시간 견적 정확도</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;">
      <span style="font-size: 36px; font-weight: 800; letter-spacing: -0.025em;">62%</span>
      <span style="font-size: 13px; color: #22c55e; font-weight: 500;">+8% 이번주</span>
    </div>
    <div style="font-size: 13px; color: #d4d4d4; line-height: 18px;">평균 1.6배 더 걸려. <span style="color: #fafafa; font-weight: 500;">코딩 태스크</span>에서 가장 낙관적이야.</div>
  </div>

  <!-- Section Title -->
  <div style="padding: 0 20px 12px; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 14px; font-weight: 600; color: #171717;">진행 중 (2)</span>
    <span style="font-size: 13px; color: #737373;">전체 →</span>
  </div>

  <!-- Active Task 1 -->
  <div style="margin: 0 20px 10px; padding: 16px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="padding: 2px 10px; background: #f5f5f5; border-radius: 9999px; font-size: 12px; font-weight: 500; color: #171717;">코딩</div>
        <span style="font-size: 12px; color: #737373;">12:30 시작</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 12px; line-height: 22px;">API 에러 핸들링 리팩터링</div>
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
      <div style="flex: 1; height: 6px; background: #f5f5f5; border-radius: 9999px; overflow: hidden;">
        <div style="width: 88%; height: 100%; background: #f59e0b; border-radius: 9999px;"></div>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #f59e0b;">88%</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px;">
      <span style="color: #737373;">예상 <span style="color: #171717; font-weight: 500;">45분</span> · 경과 <span style="color: #171717; font-weight: 500;">40분</span></span>
      <span style="color: #f59e0b; font-weight: 500;">5분 남음</span>
    </div>
  </div>

  <!-- Active Task 2 -->
  <div style="margin: 0 20px 20px; padding: 16px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="padding: 2px 10px; background: #f5f5f5; border-radius: 9999px; font-size: 12px; font-weight: 500; color: #171717;">문서</div>
        <span style="font-size: 12px; color: #737373;">13:55 시작</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div style="font-size: 15px; font-weight: 600; color: #0a0a0a; margin-bottom: 12px; line-height: 22px;">주간 리포트 작성</div>
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
      <div style="flex: 1; height: 6px; background: #f5f5f5; border-radius: 9999px; overflow: hidden;">
        <div style="width: 25%; height: 100%; background: #22c55e; border-radius: 9999px;"></div>
      </div>
      <span style="font-size: 12px; font-weight: 600; color: #22c55e;">25%</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px;">
      <span style="color: #737373;">예상 <span style="color: #171717; font-weight: 500;">30분</span> · 경과 <span style="color: #171717; font-weight: 500;">7분</span></span>
      <span style="color: #737373;">23분 남음</span>
    </div>
  </div>

  <!-- Recent Patterns -->
  <div style="padding: 0 20px 12px;">
    <span style="font-size: 14px; font-weight: 600; color: #171717;">최근 패턴</span>
  </div>

  <div style="margin: 0 20px 10px; padding: 14px 16px; background: #fafafa; border-radius: 12px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 36px; height: 36px; border-radius: 9999px; background: #fee2e2; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
    </div>
    <div style="flex: 1;">
      <div style="font-size: 13px; font-weight: 600; color: #0a0a0a; margin-bottom: 2px;">"잠깐만 보면 돼"</div>
      <div style="font-size: 12px; color: #737373;">평균 <span style="color: #dc2626; font-weight: 600;">2.4배</span> 더 걸림 (8회)</div>
    </div>
  </div>

  <div style="margin: 0 20px 24px; padding: 14px 16px; background: #fafafa; border-radius: 12px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 36px; height: 36px; border-radius: 9999px; background: #dcfce7; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    <div style="flex: 1;">
      <div style="font-size: 13px; font-weight: 600; color: #0a0a0a; margin-bottom: 2px;">"이메일 답장"</div>
      <div style="font-size: 12px; color: #737373;">예측 <span style="color: #16a34a; font-weight: 600;">정확도 92%</span> (12회)</div>
    </div>
  </div>

  <!-- FAB -->
  <div style="position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: 350px; display: flex; justify-content: flex-end; pointer-events: none;">
    <div style="width: 56px; height: 56px; background: #171717; border-radius: 9999px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px rgba(0,0,0,0.15), 0 4px 6px rgba(0,0,0,0.08); pointer-events: auto;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
  </div>

  <div style="height: 80px;"></div>
</div>
</body>
</html>
