<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몇분컷 - 인사이트</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; min-height: 100vh; display: flex; justify-content: center; }
  .app { width: 390px; min-height: 100vh; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div style="padding: 20px 20px 16px; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em;">인사이트</span>
    <div style="display: flex; gap: 6px;">
      <div style="padding: 6px 12px; background: #171717; color: #fafafa; border-radius: 9999px; font-size: 12px; font-weight: 600;">주간</div>
      <div style="padding: 6px 12px; background: #f5f5f5; color: #737373; border-radius: 9999px; font-size: 12px; font-weight: 500;">월간</div>
    </div>
  </div>

  <!-- Hero Stat -->
  <div style="margin: 8px 20px 20px; padding: 24px; background: #0a0a0a; border-radius: 16px; color: #fafafa; position: relative; overflow: hidden;">
    <div style="font-size: 12px; color: #a3a3a3; margin-bottom: 8px; font-weight: 500;">이번 주 캘리브레이션 점수</div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px;">
      <span style="font-size: 48px; font-weight: 800; letter-spacing: -0.03em;">70</span>
      <span style="font-size: 16px; color: #a3a3a3; font-weight: 500;">/ 100</span>
      <span style="font-size: 13px; color: #22c55e; font-weight: 600; margin-left: 4px;">▲ 8</span>
    </div>
    <!-- mini chart -->
    <div style="display: flex; align-items: flex-end; gap: 6px; height: 60px;">
      <div style="flex: 1; height: 40%; background: #404040; border-radius: 4px;"></div>
      <div style="flex: 1; height: 55%; background: #404040; border-radius: 4px;"></div>
      <div style="flex: 1; height: 50%; background: #404040; border-radius: 4px;"></div>
      <div style="flex: 1; height: 65%; background: #525252; border-radius: 4px;"></div>
      <div style="flex: 1; height: 72%; background: #525252; border-radius: 4px;"></div>
      <div style="flex: 1; height: 78%; background: #fafafa; border-radius: 4px;"></div>
      <div style="flex: 1; height: 85%; background: #fafafa; border-radius: 4px;"></div>
    </div>
    <div style="display: flex; gap: 6px; margin-top: 6px;">
      <div style="flex: 1; text-align: center; font-size: 10px; color: #737373;">월</div>
      <div style="flex: 1; text-align: center; font-size: 10px; color: #737373;">화</div>
      <div style="flex: 1; text-align: center; font-size: 10px; color: #737373;">수</div>
      <div style="flex: 1; text-align: center; font-size: 10px; color: #737373;">목</div>
      <div style="flex: 1; text-align: center; font-size: 10px; color: #737373;">금</div>
      <div style="flex: 1; text-align: center; font-size: 10px; color: #d4d4d4; font-weight: 600;">토</div>
      <div style="flex: 1; text-align: center; font-size: 10px; color: #d4d4d4; font-weight: 600;">일</div>
    </div>
  </div>

  <!-- Section -->
  <div style="padding: 0 20px 12px;">
    <span style="font-size: 14px; font-weight: 600; color: #171717;">카테고리별 정확도</span>
  </div>

  <!-- Category bars -->
  <div style="margin: 0 20px 10px; padding: 16px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
      <span style="font-size: 14px; font-weight: 600; color: #0a0a0a;">이메일</span>
      <span style="font-size: 13px; font-weight: 600; color: #16a34a;">92%</span>
    </div>
    <div style="height: 6px; background: #f5f5f5; border-radius: 9999px; overflow: hidden;">
      <div style="width: 92%; height: 100%; background: #22c55e; border-radius: 9999px;"></div>
    </div>
    <div style="margin-top: 6px; font-size: 12px; color: #737373;">평균 1.05배 · 12회</div>
  </div>

  <div style="margin: 0 20px 10px; padding: 16px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
      <span style="font-size: 14px; font-weight: 600; color: #0a0a0a;">미팅</span>
      <span style="font-size: 13px; font-weight: 600; color: #16a34a;">85%</span>
    </div>
    <div style="height: 6px; background: #f5f5f5; border-radius: 9999px; overflow: hidden;">
      <div style="width: 85%; height: 100%; background: #22c55e; border-radius: 9999px;"></div>
    </div>
    <div style="margin-top: 6px; font-size: 12px; color: #737373;">평균 1.15배 · 8회</div>
  </div>

  <div style="margin: 0 20px 10px; padding: 16px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
      <span style="font-size: 14px; font-weight: 600; color: #0a0a0a;">문서</span>
      <span style="font-size: 13px; font-weight: 600; color: #d97706;">68%</span>
    </div>
    <div style="height: 6px; background: #f5f5f5; border-radius: 9999px; overflow: hidden;">
      <div style="width: 68%; height: 100%; background: #f59e0b; border-radius: 9999px;"></div>
    </div>
    <div style="margin-top: 6px; font-size: 12px; color: #737373;">평균 1.5배 · 6회</div>
  </div>

  <div style="margin: 0 20px 24px; padding: 16px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
      <span style="font-size: 14px; font-weight: 600; color: #0a0a0a;">코딩</span>
      <span style="font-size: 13px; font-weight: 600; color: #dc2626;">42%</span>
    </div>
    <div style="height: 6px; background: #f5f5f5; border-radius: 9999px; overflow: hidden;">
      <div style="width: 42%; height: 100%; background: #ef4444; border-radius: 9999px;"></div>
    </div>
    <div style="margin-top: 6px; font-size: 12px; color: #737373;">평균 2.1배 · 24회 ⚠️ 가장 낙관적</div>
  </div>

  <!-- AI Coach Card -->
  <div style="padding: 0 20px 12px;">
    <span style="font-size: 14px; font-weight: 600; color: #171717;">AI 코치 한마디</span>
  </div>

  <div style="margin: 0 20px 24px; padding: 18px; background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-radius: 14px;">
    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
      <span style="font-size: 12px; font-weight: 700; color: #92400e; letter-spacing: 0.02em;">이번 주 패턴</span>
    </div>
    <div style="font-size: 14px; color: #451a03; line-height: 21px; margin-bottom: 12px;">
      <span style="font-weight: 700;">"잠깐만 보면 돼"</span>라고 시작한 코딩 태스크는 평균 <span style="font-weight: 700;">2.4배</span> 더 걸렸어. 다음엔 처음부터 1시간으로 잡아봐.
    </div>
    <div style="display: flex; gap: 8px;">
      <div style="padding: 6px 12px; background: rgba(255,255,255,0.6); border-radius: 9999px; font-size: 12px; font-weight: 600; color: #92400e;">유용해요</div>
      <div style="padding: 6px 12px; background: rgba(255,255,255,0.6); border-radius: 9999px; font-size: 12px; font-weight: 600; color: #92400e;">건너뛰기</div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div style="margin-top: auto; padding: 12px 20px 16px; border-top: 1px solid #e5e5e5; display: flex; justify-content: space-around; background: #ffffff;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span style="font-size: 10px; color: #a3a3a3; font-weight: 500;">홈</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span style="font-size: 10px; color: #a3a3a3; font-weight: 500;">기록</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      <span style="font-size: 10px; color: #171717; font-weight: 700;">인사이트</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span style="font-size: 10px; color: #a3a3a3; font-weight: 500;">설정</span>
    </div>
  </div>
</div>
</body>
</html>
