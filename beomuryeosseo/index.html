<!DOCTYPE html>
<html lang="ko">
<head>

<title>버무렸어 — 디자인 시안</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; padding: 32px 16px; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; }
  p { font-size: 14px; color: #737373; margin-top: 4px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; margin-top: 24px; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .item span { font-size: 13px; font-weight: 500; }

<body>
  <div style="text-align: center;">
    <h1>버무렸어 (Beomuryeosseo)</h1>
    <p>우리집 김장 김치통 장부 — 김장날 통 나눔 + 가져간 통 기준 비용 정산 + 김치냉장고 통별 숙성·먹을 순서 + "언제 바닥났나"로 내년 몫 추천</p>
  </div>
  <div class="grid">
    <div class="item"><span>1. 김치통 (남은 양 + 먹을 순서)</span><iframe src="home.html"></iframe></div>
    <div class="item"><span>2. 김장날 (나눔 + 비용 정산)</span><iframe src="day.html"></iframe></div>
    <div class="item"><span>3. 해마다 결산 (내년 몫 추천)</span><iframe src="review.html"></iframe></div>
  </div>
