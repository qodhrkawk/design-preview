<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모시는날 — 지방 쓰기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, -apple-system, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
  .serif { font-family: "Nanum Myeongjo", "Apple SD Gothic Neo", serif; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display:flex; align-items:center; gap:12px; padding:20px 20px 4px 20px;">
    <button style="width:40px; height:40px; border:none; background:transparent; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-left:-8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div style="flex:1;">
      <div style="font-size:20px; line-height:28px; font-weight:600; color:#0a0a0a;">지방 쓰기</div>
      <div style="font-size:14px; line-height:20px; color:#737373;">고인 정보만 고르면 완성돼요</div>
    </div>
  </div>

  <!-- Selection form -->
  <div style="padding:16px 20px 0 20px; display:flex; flex-direction:column; gap:12px;">

    <div>
      <div style="font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; margin-bottom:8px;">고인과의 관계</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <span style="background:#171717; color:#fafafa; border-radius:9999px; padding:8px 16px; font-size:14px; line-height:20px; font-weight:500;">아버지</span>
        <span style="background:#f5f5f5; color:#737373; border:1px solid #e5e5e5; border-radius:9999px; padding:8px 16px; font-size:14px; line-height:20px;">어머니</span>
        <span style="background:#f5f5f5; color:#737373; border:1px solid #e5e5e5; border-radius:9999px; padding:8px 16px; font-size:14px; line-height:20px;">할아버지</span>
        <span style="background:#f5f5f5; color:#737373; border:1px solid #e5e5e5; border-radius:9999px; padding:8px 16px; font-size:14px; line-height:20px;">할머니</span>
      </div>
    </div>

    <div style="display:flex; gap:10px;">
      <div style="flex:1;">
        <div style="font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; margin-bottom:8px;">본관</div>
        <div style="display:flex; align-items:center; justify-content:space-between; background:#ffffff; border:1px solid #e5e5e5; border-radius:8px; padding:8px 12px; height:40px;">
          <span style="font-size:14px; line-height:20px; color:#0a0a0a;">김해 김씨</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div style="flex:1;">
        <div style="font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; margin-bottom:8px;">모시는 사람</div>
        <div style="display:flex; align-items:center; justify-content:space-between; background:#ffffff; border:1px solid #e5e5e5; border-radius:8px; padding:8px 12px; height:40px;">
          <span style="font-size:14px; line-height:20px; color:#0a0a0a;">아들 (장남)</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
    </div>

  </div>

  <!-- Preview -->
  <div style="padding:20px; display:flex; flex-direction:column; align-items:center;">
    <div style="font-size:12px; line-height:16px; color:#737373; margin-bottom:12px;">미리보기</div>
    <div style="width:120px; height:340px; background:#fffdf7; border:1px solid #e5e5e5; border-radius:6px; box-shadow:0 4px 6px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06); display:flex; align-items:center; justify-content:center; padding:24px 0;">
      <div class="serif" style="writing-mode:vertical-rl; text-orientation:upright; font-size:26px; letter-spacing:8px; color:#0a0a0a; font-weight:600;">顯考學生府君神位</div>
    </div>
    <div style="margin-top:12px; font-size:14px; line-height:20px; color:#737373; text-align:center;">현고학생부군신위</div>
    <div style="margin-top:2px; font-size:12px; line-height:16px; color:#a3a3a3; text-align:center;">돌아가신 아버지의 신위 — 한글로 바꿔 쓸 수도 있어요</div>
  </div>

  <!-- Toggle -->
  <div style="padding:0 20px;">
    <div style="display:flex; background:#f5f5f5; border-radius:8px; padding:4px;">
      <div style="flex:1; text-align:center; background:#ffffff; border-radius:6px; padding:8px; font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a; box-shadow:0 1px 2px rgba(0,0,0,0.05);">한자</div>
      <div style="flex:1; text-align:center; padding:8px; font-size:14px; line-height:20px; color:#737373;">한글</div>
    </div>
  </div>

  <div style="flex:1;"></div>

  <!-- Bottom actions -->
  <div style="padding:16px 20px 24px 20px; display:flex; flex-direction:column; gap:10px;">
    <button style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:#171717; color:#fafafa; border:none; border-radius:8px; height:48px; font-size:14px; font-weight:500; font-family:inherit; cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
      A4 규격으로 인쇄 · PDF 저장
    </button>
    <button style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:#f5f5f5; color:#171717; border:1px solid #e5e5e5; border-radius:8px; height:48px; font-size:14px; font-weight:500; font-family:inherit; cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      이미지로 저장 (따라 쓰기용)
    </button>
  </div>

</div>
</body>
</html>
