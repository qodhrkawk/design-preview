<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모시는날 — 준비 체크리스트</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, -apple-system, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display:flex; align-items:center; gap:12px; padding:20px 20px 4px 20px;">
    <button style="width:40px; height:40px; border:none; background:transparent; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-left:-8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div style="flex:1;">
      <div style="font-size:20px; line-height:28px; font-weight:600; color:#0a0a0a;">아버지 기제사</div>
      <div style="font-size:14px; line-height:20px; color:#737373;">9월 2일 (수) · D-12</div>
    </div>
    <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; line-height:16px; font-weight:500;">작년 목록 복사됨</span>
  </div>

  <!-- Progress summary -->
  <div style="padding:16px 20px 0 20px;">
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; display:flex; align-items:center; gap:16px;">
      <div style="flex:1;">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span style="font-size:14px; line-height:20px; font-weight:500; color:#0a0a0a;">준비 진행률</span>
          <span style="font-size:14px; line-height:20px; color:#737373;">7 / 18</span>
        </div>
        <div style="height:8px; background:#f5f5f5; border-radius:9999px; overflow:hidden;">
          <div style="width:39%; height:100%; background:#171717; border-radius:9999px;"></div>
        </div>
      </div>
      <button style="display:inline-flex; align-items:center; gap:6px; background:#f5f5f5; color:#171717; border:1px solid #e5e5e5; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:500; font-family:inherit; cursor:pointer; flex-shrink:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
        공유
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div style="display:flex; gap:8px; padding:16px 20px 4px 20px;">
    <span style="background:#171717; color:#fafafa; border-radius:9999px; padding:6px 14px; font-size:14px; line-height:20px; font-weight:500;">장보기</span>
    <span style="background:#f5f5f5; color:#737373; border-radius:9999px; padding:6px 14px; font-size:14px; line-height:20px; font-weight:500;">음식 준비</span>
    <span style="background:#f5f5f5; color:#737373; border-radius:9999px; padding:6px 14px; font-size:14px; line-height:20px; font-weight:500;">당일 순서</span>
  </div>

  <!-- Checklist -->
  <div style="padding:12px 20px; display:flex; flex-direction:column; gap:8px;">

    <div style="font-size:12px; line-height:16px; font-weight:500; color:#737373; padding:4px 0; text-transform:none;">과일 · 나물</div>

    <!-- checked item -->
    <div style="display:flex; align-items:center; gap:12px; background:#fafafa; border:1px solid #e5e5e5; border-radius:10px; padding:12px 14px;">
      <div style="width:22px; height:22px; border-radius:9999px; background:#171717; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span style="flex:1; font-size:14px; line-height:20px; color:#737373; text-decoration:line-through;">사과 5개 · 배 5개</span>
      <span style="font-size:12px; line-height:16px; color:#a3a3a3;">엄마</span>
    </div>

    <div style="display:flex; align-items:center; gap:12px; background:#fafafa; border:1px solid #e5e5e5; border-radius:10px; padding:12px 14px;">
      <div style="width:22px; height:22px; border-radius:9999px; background:#171717; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span style="flex:1; font-size:14px; line-height:20px; color:#737373; text-decoration:line-through;">삼색나물 (고사리·도라지·시금치)</span>
      <span style="font-size:12px; line-height:16px; color:#a3a3a3;">엄마</span>
    </div>

    <!-- unchecked item -->
    <div style="display:flex; align-items:center; gap:12px; background:#ffffff; border:1px solid #e5e5e5; border-radius:10px; padding:12px 14px;">
      <div style="width:22px; height:22px; border-radius:9999px; border:1.5px solid #e5e5e5; flex-shrink:0;"></div>
      <span style="flex:1; font-size:14px; line-height:20px; color:#0a0a0a;">대추 · 밤 · 곶감</span>
      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; line-height:16px; font-weight:500;">나</span>
    </div>

    <div style="font-size:12px; line-height:16px; font-weight:500; color:#737373; padding:8px 0 4px 0;">전 · 적</div>

    <div style="display:flex; align-items:center; gap:12px; background:#ffffff; border:1px solid #e5e5e5; border-radius:10px; padding:12px 14px;">
      <div style="width:22px; height:22px; border-radius:9999px; border:1.5px solid #e5e5e5; flex-shrink:0;"></div>
      <span style="flex:1; font-size:14px; line-height:20px; color:#0a0a0a;">동태포 1kg (전용)</span>
      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; line-height:16px; font-weight:500;">나</span>
    </div>

    <div style="display:flex; align-items:center; gap:12px; background:#ffffff; border:1px solid #e5e5e5; border-radius:10px; padding:12px 14px;">
      <div style="width:22px; height:22px; border-radius:9999px; border:1.5px solid #e5e5e5; flex-shrink:0;"></div>
      <div style="flex:1;">
        <div style="font-size:14px; line-height:20px; color:#0a0a0a;">소고기 산적용 600g</div>
        <div style="display:flex; align-items:center; gap:4px; margin-top:2px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <span style="font-size:12px; line-height:16px; color:#f59e0b;">작년 메모: 미리 안 사서 당일 품절 고생함</span>
        </div>
      </div>
      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; line-height:16px; font-weight:500;">형</span>
    </div>

    <div style="display:flex; align-items:center; gap:12px; background:#ffffff; border:1px solid #e5e5e5; border-radius:10px; padding:12px 14px;">
      <div style="width:22px; height:22px; border-radius:9999px; border:1.5px solid #e5e5e5; flex-shrink:0;"></div>
      <span style="flex:1; font-size:14px; line-height:20px; color:#0a0a0a;">두부 2모 · 부침가루 · 식용유</span>
      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; line-height:16px; font-weight:500;">형</span>
    </div>

    <div style="font-size:12px; line-height:16px; font-weight:500; color:#737373; padding:8px 0 4px 0;">제수 용품</div>

    <div style="display:flex; align-items:center; gap:12px; background:#ffffff; border:1px solid #e5e5e5; border-radius:10px; padding:12px 14px;">
      <div style="width:22px; height:22px; border-radius:9999px; border:1.5px solid #e5e5e5; flex-shrink:0;"></div>
      <span style="flex:1; font-size:14px; line-height:20px; color:#0a0a0a;">청주 (정종) 1병</span>
      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; line-height:16px; font-weight:500;">나</span>
    </div>

    <div style="display:flex; align-items:center; gap:12px; background:#ffffff; border:1px solid #e5e5e5; border-radius:10px; padding:12px 14px;">
      <div style="width:22px; height:22px; border-radius:9999px; border:1.5px solid #e5e5e5; flex-shrink:0;"></div>
      <span style="flex:1; font-size:14px; line-height:20px; color:#0a0a0a;">향 · 초 (남은 수량 확인)</span>
      <span style="font-size:12px; line-height:16px; color:#a3a3a3;">미지정</span>
    </div>

    <!-- add item -->
    <button style="display:flex; align-items:center; justify-content:center; gap:8px; background:#ffffff; border:1px dashed #e5e5e5; border-radius:10px; padding:12px; font-size:14px; font-weight:500; font-family:inherit; color:#737373; cursor:pointer; margin-top:4px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      항목 추가
    </button>

  </div>

  <div style="flex:1;"></div>

  <!-- Bottom CTA -->
  <div style="padding:12px 20px 24px 20px; border-top:1px solid #e5e5e5; background:#ffffff;">
    <button style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:#171717; color:#fafafa; border:none; border-radius:8px; padding:12px; height:48px; font-size:14px; font-weight:500; font-family:inherit; cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
      가족에게 장보기 목록 공유 (카톡)
    </button>
  </div>

</div>
</body>
</html>
