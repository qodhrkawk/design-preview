<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모시는날 — 홈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, -apple-system, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; position: relative; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 20px 12px 20px;">
    <div style="font-size:24px; line-height:32px; font-weight:600; color:#0a0a0a;">모시는날</div>
    <button style="width:40px; height:40px; border:none; background:transparent; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <!-- Upcoming hero card -->
  <div style="padding:8px 20px 0 20px;">
    <div style="background:#171717; border-radius:16px; padding:24px; color:#fafafa;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="display:inline-flex; align-items:center; gap:6px; background:rgba(250,250,250,0.12); border-radius:9999px; padding:4px 12px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
          <span style="font-size:12px; line-height:16px; font-weight:500;">가장 가까운 기일</span>
        </div>
        <span style="font-size:12px; line-height:16px; color:#a3a3a3;">알림 D-7 · D-1 설정됨</span>
      </div>
      <div style="margin-top:16px; font-size:20px; line-height:28px; font-weight:600;">아버지 기제사</div>
      <div style="margin-top:4px; font-size:14px; line-height:20px; color:#a3a3a3;">음력 7월 12일 · 올해는 9월 2일 (수)</div>
      <div style="margin-top:16px; display:flex; align-items:flex-end; justify-content:space-between;">
        <div>
          <span style="font-size:36px; line-height:40px; font-weight:800; letter-spacing:-0.025em;">D-12</span>
        </div>
        <button style="display:inline-flex; align-items:center; gap:6px; background:#fafafa; color:#171717; border:none; border-radius:8px; padding:10px 16px; height:40px; font-size:14px; font-weight:500; font-family:inherit; cursor:pointer;">
          준비 시작하기
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
      <!-- progress -->
      <div style="margin-top:20px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span style="font-size:12px; line-height:16px; color:#a3a3a3;">장보기 준비</span>
          <span style="font-size:12px; line-height:16px; color:#fafafa; font-weight:500;">7 / 18</span>
        </div>
        <div style="height:6px; background:rgba(250,250,250,0.15); border-radius:9999px; overflow:hidden;">
          <div style="width:39%; height:100%; background:#fafafa; border-radius:9999px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Section: 등록된 날 -->
  <div style="padding:28px 20px 8px 20px; display:flex; align-items:center; justify-content:space-between;">
    <div style="font-size:16px; line-height:24px; font-weight:600; color:#0a0a0a;">우리집 모시는 날</div>
    <span style="font-size:14px; line-height:20px; color:#737373;">4건</span>
  </div>

  <div style="padding:0 20px; display:flex; flex-direction:column; gap:10px;">

    <!-- item -->
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; display:flex; align-items:center; gap:14px;">
      <div style="width:44px; height:44px; border-radius:9999px; background:#f5f5f5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:16px; line-height:24px; font-weight:500; color:#0a0a0a;">아버지 기제사</div>
        <div style="font-size:14px; line-height:20px; color:#737373;">음력 7월 12일 → 9월 2일 (수)</div>
      </div>
      <span style="background:#171717; color:#fafafa; border-radius:9999px; padding:2px 10px; font-size:12px; line-height:16px; font-weight:500;">D-12</span>
    </div>

    <!-- item -->
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; display:flex; align-items:center; gap:14px;">
      <div style="width:44px; height:44px; border-radius:9999px; background:#f5f5f5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="m4 8 16-4"/><path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:16px; line-height:24px; font-weight:500; color:#0a0a0a;">추석 차례</div>
        <div style="font-size:14px; line-height:20px; color:#737373;">음력 8월 15일 → 10월 5일 (월)</div>
      </div>
      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; line-height:16px; font-weight:500;">D-45</span>
    </div>

    <!-- item -->
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; display:flex; align-items:center; gap:14px;">
      <div style="width:44px; height:44px; border-radius:9999px; background:#f5f5f5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:16px; line-height:24px; font-weight:500; color:#0a0a0a;">할머니 기제사</div>
        <div style="font-size:14px; line-height:20px; color:#737373;">음력 10월 3일 → 11월 21일 (토)</div>
      </div>
      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; line-height:16px; font-weight:500;">D-92</span>
    </div>

    <!-- item -->
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px; display:flex; align-items:center; gap:14px;">
      <div style="width:44px; height:44px; border-radius:9999px; background:#f5f5f5; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="m4 8 16-4"/><path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"/></svg>
      </div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:16px; line-height:24px; font-weight:500; color:#0a0a0a;">설 차례</div>
        <div style="font-size:14px; line-height:20px; color:#737373;">음력 1월 1일 → 2027년 2월 6일 (토)</div>
      </div>
      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; line-height:16px; font-weight:500;">D-180</span>
    </div>

  </div>

  <!-- Add button -->
  <div style="padding:16px 20px 24px 20px;">
    <button style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:#ffffff; color:#171717; border:1px dashed #e5e5e5; border-radius:12px; padding:14px; font-size:14px; font-weight:500; font-family:inherit; cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      기일 · 차례 추가
    </button>
  </div>

  <div style="flex:1;"></div>

  <!-- Bottom nav -->
  <div style="border-top:1px solid #e5e5e5; display:flex; padding:10px 0 24px 0; background:#ffffff;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size:12px; line-height:16px; font-weight:500; color:#171717;">홈</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      <span style="font-size:12px; line-height:16px; color:#a3a3a3;">지방 쓰기</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
      <span style="font-size:12px; line-height:16px; color:#a3a3a3;">지난 기록</span>
    </div>
  </div>

</div>
</body>
</html>
