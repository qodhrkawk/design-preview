<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몽글 — 패턴</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; justify-content: center; }
  .app { width: 390px; min-height: 100vh; background: #ffffff; padding-bottom: 96px; }
  .lucide { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header style="padding: 20px 20px 12px;">
    <h1 style="font-size:24px; line-height:32px; font-weight:600; letter-spacing:-0.025em; color:#0a0a0a;">패턴</h1>
    <p style="margin-top:4px; font-size:13px; color:#737373;">최근 30일 꿈 분석</p>
  </header>

  <!-- Period selector -->
  <div style="display:flex; gap:6px; padding: 4px 20px 16px;">
    <button style="padding:6px 14px; background:#0a0a0a; color:#fafafa; border:none; border-radius:9999px; font-size:12px; font-weight:500; cursor:pointer;">30일</button>
    <button style="padding:6px 14px; background:#f5f5f5; color:#171717; border:none; border-radius:9999px; font-size:12px; font-weight:500; cursor:pointer;">90일</button>
    <button style="padding:6px 14px; background:#f5f5f5; color:#171717; border:none; border-radius:9999px; font-size:12px; font-weight:500; cursor:pointer;">1년</button>
  </div>

  <!-- AI summary card -->
  <div style="margin: 0 20px 20px; padding:20px; background:#0a0a0a; color:#fafafa; border-radius:16px;">
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:10px;">
      <svg class="lucide" viewBox="0 0 24 24" style="width:16px;height:16px; color:#fafafa;"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
      <span style="font-size:12px; font-weight:600; color:#a3a3a3; letter-spacing:0.05em; text-transform:uppercase;">AI 리포트</span>
    </div>
    <p style="font-size:16px; line-height:24px; font-weight:500;">이번 달은 <span style="color:#fef3c7;">'통제불능'</span> 테마가 압도적이야. 추락·시험·미로 같은 압박 모티프가 73%야. 일·관계 중 부담 큰 게 있는 거 같아.</p>
  </div>

  <!-- Motif frequency -->
  <div style="padding: 0 20px 16px;">
    <h2 style="font-size:16px; font-weight:600; color:#0a0a0a; margin-bottom:12px;">자주 나타난 모티프</h2>

    <!-- Bar 1 -->
    <div style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">추락 / 떨어짐</span>
        <span style="font-size:13px; color:#737373;">8회</span>
      </div>
      <div style="height:8px; background:#f5f5f5; border-radius:9999px; overflow:hidden;">
        <div style="width:80%; height:100%; background:#0a0a0a;"></div>
      </div>
    </div>
    <!-- Bar 2 -->
    <div style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">시험 / 시간 압박</span>
        <span style="font-size:13px; color:#737373;">5회</span>
      </div>
      <div style="height:8px; background:#f5f5f5; border-radius:9999px; overflow:hidden;">
        <div style="width:50%; height:100%; background:#0a0a0a;"></div>
      </div>
    </div>
    <!-- Bar 3 -->
    <div style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">길 잃음 / 미로</span>
        <span style="font-size:13px; color:#737373;">4회</span>
      </div>
      <div style="height:8px; background:#f5f5f5; border-radius:9999px; overflow:hidden;">
        <div style="width:40%; height:100%; background:#0a0a0a;"></div>
      </div>
    </div>
    <!-- Bar 4 -->
    <div style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">과거 사람</span>
        <span style="font-size:13px; color:#737373;">3회</span>
      </div>
      <div style="height:8px; background:#f5f5f5; border-radius:9999px; overflow:hidden;">
        <div style="width:30%; height:100%; background:#737373;"></div>
      </div>
    </div>
    <!-- Bar 5 -->
    <div>
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">물 / 바다</span>
        <span style="font-size:13px; color:#737373;">2회</span>
      </div>
      <div style="height:8px; background:#f5f5f5; border-radius:9999px; overflow:hidden;">
        <div style="width:20%; height:100%; background:#737373;"></div>
      </div>
    </div>
  </div>

  <!-- Mood distribution -->
  <div style="padding: 20px 20px 16px;">
    <h2 style="font-size:16px; font-weight:600; color:#0a0a0a; margin-bottom:12px;">감정 분포</h2>
    <div style="display:flex; gap:4px; height:32px; border-radius:9999px; overflow:hidden;">
      <div style="flex:5; background:#0a0a0a;"></div>
      <div style="flex:2; background:#737373;"></div>
      <div style="flex:2; background:#a3a3a3;"></div>
      <div style="flex:1; background:#d4d4d4;"></div>
    </div>
    <div style="display:flex; gap:12px; margin-top:12px; flex-wrap:wrap;">
      <div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; background:#0a0a0a; border-radius:9999px;"></span><span style="font-size:12px; color:#737373;">불안 50%</span></div>
      <div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; background:#737373; border-radius:9999px;"></span><span style="font-size:12px; color:#737373;">신비 20%</span></div>
      <div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; background:#a3a3a3; border-radius:9999px;"></span><span style="font-size:12px; color:#737373;">기쁨 20%</span></div>
      <div style="display:flex; align-items:center; gap:6px;"><span style="width:8px; height:8px; background:#d4d4d4; border-radius:9999px;"></span><span style="font-size:12px; color:#737373;">우울 10%</span></div>
    </div>
  </div>

  <!-- Correlation insight -->
  <div style="margin: 20px 20px 16px; padding:16px; background:#fff7ed; border:1px solid #fed7aa; border-radius:12px;">
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
      <svg class="lucide" viewBox="0 0 24 24" style="width:16px;height:16px; color:#92400e;"><path d="M12 2v4"/><path d="M12 18v4"/><path d="m4.93 4.93 2.83 2.83"/><path d="m16.24 16.24 2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/></svg>
      <span style="font-size:12px; font-weight:600; color:#92400e; letter-spacing:0.05em; text-transform:uppercase;">상관관계 발견</span>
    </div>
    <p style="font-size:14px; line-height:20px; color:#7c2d12;">수면 시간 6시간 이하일 때 '추락' 꿈 발생률이 <strong>3.2배</strong> 높아.</p>
  </div>

  <!-- Recurring dream alert -->
  <div style="margin: 0 20px 16px; padding:16px; background:#f5f5f5; border-radius:12px;">
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
      <svg class="lucide" viewBox="0 0 24 24" style="width:16px;height:16px; color:#171717;"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      <span style="font-size:12px; font-weight:600; color:#171717;">반복 꿈 감지</span>
    </div>
    <p style="font-size:13px; line-height:20px; color:#737373;">'엘리베이터' 모티프가 3번 이상 등장. 자세히 보기 →</p>
  </div>

  <!-- Bottom Nav -->
  <nav style="position:fixed; bottom:0; width:390px; height:72px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; padding:8px 16px;">
    <button style="flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:#737373; cursor:pointer;">
      <svg class="lucide" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size:11px;">홈</span>
    </button>
    <button style="flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:#737373; cursor:pointer;">
      <svg class="lucide" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span style="font-size:11px;">일기</span>
    </button>
    <button style="flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:#0a0a0a; cursor:pointer;">
      <svg class="lucide" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span style="font-size:11px; font-weight:600;">패턴</span>
    </button>
    <button style="flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:#737373; cursor:pointer;">
      <svg class="lucide" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size:11px;">나</span>
    </button>
  </nav>
</div>
</body>
</html>
