<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몽글 — 홈</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; justify-content: center; }
  .app { width: 390px; min-height: 100vh; background: #ffffff; position: relative; padding-bottom: 96px; }
  .lucide { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header style="display:flex; align-items:center; justify-content:space-between; padding:20px 20px 8px;">
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:32px; height:32px; border-radius:9999px; background:#171717; display:flex; align-items:center; justify-content:center; color:#fafafa;">
        <svg class="lucide" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </div>
      <span style="font-size:18px; font-weight:600; letter-spacing:-0.025em; color:#0a0a0a;">몽글</span>
    </div>
    <button style="width:40px; height:40px; border:none; background:transparent; color:#0a0a0a; display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <svg class="lucide" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <!-- Greeting -->
  <div style="padding: 16px 20px 24px;">
    <h1 style="font-size:30px; line-height:36px; font-weight:600; letter-spacing:-0.025em; color:#0a0a0a;">좋은 아침이야</h1>
    <p style="margin-top:6px; font-size:14px; color:#737373;">오늘은 어떤 꿈을 꿨어?</p>
  </div>

  <!-- Quick record card -->
  <div style="margin: 0 20px 24px; padding: 20px; background:#0a0a0a; border-radius:16px; color:#fafafa;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
      <svg class="lucide" viewBox="0 0 24 24" style="color:#fafafa;"><path d="M12 2v4"/><path d="M12 18v4"/><path d="m4.93 4.93 2.83 2.83"/><path d="m16.24 16.24 2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="m4.93 19.07 2.83-2.83"/><path d="m16.24 7.76 2.83-2.83"/></svg>
      <span style="font-size:12px; font-weight:500; color:#a3a3a3; letter-spacing:0.05em; text-transform:uppercase;">아침 기록</span>
    </div>
    <p style="font-size:18px; line-height:26px; font-weight:600; margin-bottom:16px;">기억이 흐려지기 전에<br>꿈을 적어두자</p>
    <button style="display:flex; align-items:center; gap:8px; padding:10px 16px; background:#fafafa; color:#171717; border:none; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; height:40px;">
      <svg class="lucide" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      꿈 기록하기
    </button>
  </div>

  <!-- Stats row -->
  <div style="display:flex; gap:8px; padding: 0 20px 24px;">
    <div style="flex:1; padding:14px; background:#f5f5f5; border-radius:12px;">
      <div style="font-size:12px; color:#737373; font-weight:500;">연속 기록</div>
      <div style="margin-top:4px; font-size:20px; font-weight:600; color:#0a0a0a;">12<span style="font-size:12px; color:#737373; font-weight:500; margin-left:2px;">일</span></div>
    </div>
    <div style="flex:1; padding:14px; background:#f5f5f5; border-radius:12px;">
      <div style="font-size:12px; color:#737373; font-weight:500;">이번 달</div>
      <div style="margin-top:4px; font-size:20px; font-weight:600; color:#0a0a0a;">23<span style="font-size:12px; color:#737373; font-weight:500; margin-left:2px;">개</span></div>
    </div>
    <div style="flex:1; padding:14px; background:#f5f5f5; border-radius:12px;">
      <div style="font-size:12px; color:#737373; font-weight:500;">주요 무드</div>
      <div style="margin-top:4px; font-size:14px; font-weight:600; color:#0a0a0a;">불안</div>
    </div>
  </div>

  <!-- Recent dreams -->
  <div style="padding: 0 20px 16px; display:flex; justify-content:space-between; align-items:center;">
    <h2 style="font-size:16px; font-weight:600; color:#0a0a0a;">최근 꿈</h2>
    <button style="background:transparent; border:none; font-size:13px; color:#737373; cursor:pointer; display:flex; align-items:center; gap:2px;">
      전체보기
      <svg class="lucide" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <!-- Dream card 1 -->
  <div style="margin: 0 20px 12px; padding:16px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-size:12px; color:#737373; font-weight:500;">오늘 · 06:42</span>
      <span style="padding:2px 10px; background:#fef3c7; color:#92400e; border-radius:9999px; font-size:11px; font-weight:500;">반복 모티프</span>
    </div>
    <p style="font-size:15px; line-height:22px; color:#0a0a0a; font-weight:500; margin-bottom:10px;">엘리베이터가 끝없이 내려가는 꿈. 멈출 수가 없었음.</p>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <span style="padding:2px 10px; background:#f5f5f5; border-radius:9999px; font-size:11px; color:#171717; font-weight:500;">#추락</span>
      <span style="padding:2px 10px; background:#f5f5f5; border-radius:9999px; font-size:11px; color:#171717; font-weight:500;">#엘리베이터</span>
      <span style="padding:2px 10px; background:#f5f5f5; border-radius:9999px; font-size:11px; color:#171717; font-weight:500;">#불안</span>
    </div>
  </div>

  <!-- Dream card 2 -->
  <div style="margin: 0 20px 12px; padding:16px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-size:12px; color:#737373; font-weight:500;">어제 · 07:15</span>
      <span style="padding:2px 10px; background:#dbeafe; color:#1e40af; border-radius:9999px; font-size:11px; font-weight:500;">선명함</span>
    </div>
    <p style="font-size:15px; line-height:22px; color:#0a0a0a; font-weight:500; margin-bottom:10px;">초등학교 운동장에서 친구들이랑 노는데 풍경이 너무 또렷했음.</p>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <span style="padding:2px 10px; background:#f5f5f5; border-radius:9999px; font-size:11px; color:#171717; font-weight:500;">#과거</span>
      <span style="padding:2px 10px; background:#f5f5f5; border-radius:9999px; font-size:11px; color:#171717; font-weight:500;">#노스탤지어</span>
    </div>
  </div>

  <!-- Dream card 3 -->
  <div style="margin: 0 20px 12px; padding:16px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-size:12px; color:#737373; font-weight:500;">3일 전 · 06:58</span>
    </div>
    <p style="font-size:15px; line-height:22px; color:#0a0a0a; font-weight:500; margin-bottom:10px;">시험 시작 5분 전인데 교실을 못 찾고 있었다.</p>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <span style="padding:2px 10px; background:#f5f5f5; border-radius:9999px; font-size:11px; color:#171717; font-weight:500;">#시험</span>
      <span style="padding:2px 10px; background:#f5f5f5; border-radius:9999px; font-size:11px; color:#171717; font-weight:500;">#압박</span>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav style="position:fixed; bottom:0; width:390px; height:72px; background:#ffffff; border-top:1px solid #e5e5e5; display:flex; padding:8px 16px;">
    <button style="flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:#0a0a0a; cursor:pointer;">
      <svg class="lucide" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size:11px; font-weight:600;">홈</span>
    </button>
    <button style="flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:#737373; cursor:pointer;">
      <svg class="lucide" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span style="font-size:11px;">일기</span>
    </button>
    <button style="flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:#737373; cursor:pointer;">
      <svg class="lucide" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span style="font-size:11px;">패턴</span>
    </button>
    <button style="flex:1; background:transparent; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:#737373; cursor:pointer;">
      <svg class="lucide" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size:11px;">나</span>
    </button>
  </nav>
</div>
</body>
</html>
