<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어디뒀지 — 홈</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;display:flex;justify-content:center;min-height:100vh}
.app{width:390px;background:#ffffff;min-height:844px;position:relative;padding-bottom:96px}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div style="padding:24px 20px 16px 20px;display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-size:24px;line-height:32px;font-weight:600;color:#0a0a0a">어디뒀지</div>
      <div style="font-size:14px;line-height:20px;color:#737373;margin-top:2px">물건 42개를 기억하고 있어요</div>
    </div>
    <div style="width:40px;height:40px;border-radius:9999px;background:#f5f5f5;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>

  <!-- Search bar -->
  <div style="padding:0 20px 20px 20px">
    <div style="display:flex;align-items:center;gap:10px;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:12px;padding:14px 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span style="font-size:15px;color:#737373">여권 어디 뒀더라?</span>
      <div style="margin-left:auto;display:flex;align-items:center;gap:4px;background:#171717;border-radius:9999px;padding:4px 10px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        <span style="font-size:12px;font-weight:500;color:#fafafa">AI 검색</span>
      </div>
    </div>
  </div>

  <!-- Quick stats -->
  <div style="display:flex;gap:8px;padding:0 20px 24px 20px">
    <div style="flex:1;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:14px">
      <div style="font-size:20px;font-weight:600;color:#0a0a0a">42</div>
      <div style="font-size:12px;color:#737373;margin-top:2px">등록한 물건</div>
    </div>
    <div style="flex:1;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:14px">
      <div style="font-size:20px;font-weight:600;color:#f59e0b">3</div>
      <div style="font-size:12px;color:#737373;margin-top:2px">임시 보관 중</div>
    </div>
    <div style="flex:1;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:14px">
      <div style="font-size:20px;font-weight:600;color:#3b82f6">2</div>
      <div style="font-size:12px;color:#737373;margin-top:2px">빌려준 물건</div>
    </div>
  </div>

  <!-- Temporary storage alert -->
  <div style="margin:0 20px 24px 20px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:16px;display:flex;gap:12px;align-items:flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    <div style="flex:1">
      <div style="font-size:14px;font-weight:500;color:#0a0a0a">"일단 여기 둠" 3개가 2주째 그대로예요</div>
      <div style="font-size:13px;color:#737373;margin-top:2px">공구 세트, 선물 포장지, 여분 케이블</div>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px"><path d="m9 18 6-6-6-6"/></svg>
  </div>

  <!-- Recent items -->
  <div style="padding:0 20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:16px;font-weight:600;color:#0a0a0a">최근 기록</div>
      <span style="font-size:13px;color:#737373">전체 보기</span>
    </div>

    <!-- Item card 1 -->
    <div style="display:flex;gap:12px;align-items:center;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin-bottom:10px">
      <div style="width:48px;height:48px;border-radius:8px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/></svg>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:500;color:#0a0a0a">여권</div>
        <div style="font-size:13px;color:#737373;margin-top:2px;display:flex;align-items:center;gap:4px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
          안방 &gt; 화장대 서랍 2번째
        </div>
      </div>
      <span style="font-size:12px;color:#737373;flex-shrink:0">오늘</span>
    </div>

    <!-- Item card 2 -->
    <div style="display:flex;gap:12px;align-items:center;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin-bottom:10px">
      <div style="width:48px;height:48px;border-radius:8px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:500;color:#0a0a0a">겨울 패딩 (3벌)</div>
        <div style="font-size:13px;color:#737373;margin-top:2px;display:flex;align-items:center;gap:4px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
          베란다 &gt; 리빙박스 위칸
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
        <span style="font-size:12px;color:#737373">4월 12일</span>
        <span style="background:#f5f5f5;color:#171717;border-radius:9999px;padding:2px 8px;font-size:11px;font-weight:500">계절템</span>
      </div>
    </div>

    <!-- Item card 3 -->
    <div style="display:flex;gap:12px;align-items:center;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:14px;margin-bottom:10px">
      <div style="width:48px;height:48px;border-radius:8px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:500;color:#0a0a0a">닌텐도 스위치</div>
        <div style="font-size:13px;color:#737373;margin-top:2px;display:flex;align-items:center;gap:4px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          민수한테 빌려줌
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
        <span style="font-size:12px;color:#737373">6월 28일</span>
        <span style="background:#eff6ff;color:#3b82f6;border-radius:9999px;padding:2px 8px;font-size:11px;font-weight:500">빌려줌</span>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <div style="position:absolute;bottom:100px;right:20px;width:56px;height:56px;border-radius:9999px;background:#171717;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 15px rgba(0,0,0,0.1),0 4px 6px rgba(0,0,0,0.05)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
  </div>

  <!-- Bottom nav -->
  <div style="position:absolute;bottom:0;left:0;right:0;height:80px;background:#ffffff;border-top:1px solid #e5e5e5;display:flex;padding-bottom:20px">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span style="font-size:11px;font-weight:500;color:#171717">홈</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span style="font-size:11px;color:#a3a3a3">검색</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      <span style="font-size:11px;color:#a3a3a3">장소</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <span style="font-size:11px;color:#a3a3a3">설정</span>
    </div>
  </div>

</div>
</body>
</html>
