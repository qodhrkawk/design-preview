<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlitchLog - 기록하기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
  }
  .status-bar {
    height: 54px;
    padding: 14px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: #0a0a0a;
  }
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 24px 16px;
  }
  .nav-back {
    font-size: 16px;
    color: #737373;
    font-weight: 500;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-title {
    font-size: 18px;
    font-weight: 600;
    color: #0a0a0a;
  }
  .nav-save {
    font-size: 16px;
    font-weight: 600;
    color: #171717;
    text-decoration: none;
    background: #171717;
    color: #fafafa;
    padding: 8px 16px;
    border-radius: 8px;
  }
  .form-section {
    padding: 0 24px;
    margin-bottom: 24px;
  }
  .form-label {
    font-size: 14px;
    font-weight: 600;
    color: #0a0a0a;
    margin-bottom: 8px;
    display: block;
  }
  .form-sublabel {
    font-size: 12px;
    color: #737373;
    margin-bottom: 8px;
    display: block;
  }
  .input-field {
    width: 100%;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: Inter, system-ui, sans-serif;
    color: #0a0a0a;
    height: 40px;
  }
  .input-field:focus {
    outline: none;
    border-color: #a3a3a3;
    box-shadow: 0 0 0 2px rgba(163,163,163,0.2);
  }
  .input-field::placeholder {
    color: #a3a3a3;
  }
  .textarea-field {
    width: 100%;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-family: Inter, system-ui, sans-serif;
    color: #0a0a0a;
    resize: none;
    height: 120px;
    line-height: 20px;
  }
  .textarea-field:focus {
    outline: none;
    border-color: #a3a3a3;
    box-shadow: 0 0 0 2px rgba(163,163,163,0.2);
  }
  .textarea-field::placeholder {
    color: #a3a3a3;
  }
  .app-suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .app-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f5f5f5;
    border: 1px solid #e5e5e5;
    border-radius: 9999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    color: #171717;
    cursor: pointer;
  }
  .app-chip.selected {
    background: #171717;
    color: #fafafa;
    border-color: #171717;
  }
  .app-chip-dot {
    width: 8px;
    height: 8px;
    border-radius: 9999px;
  }
  .tag-row {
    display: flex;
    gap: 8px;
  }
  .tag-btn {
    flex: 1;
    padding: 10px;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    background: #ffffff;
    font-size: 13px;
    font-weight: 500;
    color: #171717;
    text-align: center;
    cursor: pointer;
    font-family: Inter, system-ui, sans-serif;
  }
  .tag-btn.selected {
    border-color: #171717;
    background: #171717;
    color: #fafafa;
  }
  .severity-selector {
    display: flex;
    gap: 8px;
  }
  .severity-btn {
    flex: 1;
    padding: 12px 8px;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    background: #ffffff;
    font-size: 13px;
    font-weight: 500;
    color: #171717;
    text-align: center;
    cursor: pointer;
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .severity-btn.selected {
    border-color: #171717;
    background: #f5f5f5;
  }
  .severity-emoji {
    font-size: 20px;
    line-height: 1;
  }
  .photo-attach {
    display: flex;
    gap: 10px;
  }
  .photo-btn {
    width: 72px;
    height: 72px;
    border: 1px dashed #e5e5e5;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: #a3a3a3;
    cursor: pointer;
    background: #fafafa;
  }
  .photo-btn svg {
    stroke: #a3a3a3;
  }
  .photo-btn-text {
    font-size: 11px;
    color: #a3a3a3;
  }
  .ai-suggest-box {
    margin: 0 24px 24px;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 14px;
    background: #fafafa;
  }
  .ai-suggest-title {
    font-size: 13px;
    font-weight: 600;
    color: #737373;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ai-suggest-text {
    font-size: 13px;
    color: #0a0a0a;
    line-height: 18px;
  }
  .ai-suggest-tag {
    display: inline-flex;
    align-items: center;
    background: #eff6ff;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 12px;
    color: #2563eb;
    font-weight: 500;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span style="display:flex;gap:6px;align-items:center;">
      <svg width="16" height="12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#0a0a0a"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#0a0a0a"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#0a0a0a"/><rect x="13" y="1" width="3" height="11" rx="1" fill="#e5e5e5"/></svg>
      <svg width="25" height="12" fill="none"><rect x="0" y="0" width="22" height="12" rx="3" stroke="#0a0a0a" stroke-width="1"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#0a0a0a"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#0a0a0a"/></svg>
    </span>
  </div>

  <div class="nav-bar">
    <a class="nav-back" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      취소
    </a>
    <span class="nav-title">기록하기</span>
    <a class="nav-save" href="#">저장</a>
  </div>

  <div class="form-section">
    <label class="form-label">어떤 앱/서비스?</label>
    <input class="input-field" type="text" placeholder="앱 이름 입력" value="쿠팡">
    <div class="app-suggestions">
      <span class="app-chip selected"><span class="app-chip-dot" style="background:#3b82f6;"></span>쿠팡</span>
      <span class="app-chip"><span class="app-chip-dot" style="background:#f59e0b;"></span>배민</span>
      <span class="app-chip"><span class="app-chip-dot" style="background:#22c55e;"></span>네이버</span>
      <span class="app-chip"><span class="app-chip-dot" style="background:#8b5cf6;"></span>카카오</span>
    </div>
  </div>

  <div class="form-section">
    <label class="form-label">무슨 일이 있었나요?</label>
    <textarea class="textarea-field" placeholder="어떤 불편함이나 버그를 겪었는지 적어주세요">장바구니에서 수량 변경하면 가격이 0원으로 표시됨. 새로고침하면 돌아오는데 매번 그럼. 결제할 때 불안함.</textarea>
  </div>

  <div class="form-section">
    <label class="form-label">카테고리</label>
    <div class="tag-row">
      <button class="tag-btn selected">버그</button>
      <button class="tag-btn">UX</button>
      <button class="tag-btn">느림</button>
      <button class="tag-btn">크래시</button>
    </div>
  </div>

  <div class="form-section">
    <label class="form-label">얼마나 짜증났나요?</label>
    <div class="severity-selector">
      <button class="severity-btn">
        <span class="severity-emoji">😐</span>
        <span>좀 불편</span>
      </button>
      <button class="severity-btn">
        <span class="severity-emoji">😤</span>
        <span>짜증남</span>
      </button>
      <button class="severity-btn selected">
        <span class="severity-emoji">🤬</span>
        <span>개빡침</span>
      </button>
    </div>
  </div>

  <div class="form-section">
    <label class="form-label">스크린샷 (선택)</label>
    <div class="photo-attach">
      <div class="photo-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span class="photo-btn-text">추가</span>
      </div>
    </div>
  </div>

  <div class="ai-suggest-box">
    <div class="ai-suggest-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      AI 분석
    </div>
    <div class="ai-suggest-text">쿠팡 장바구니 가격 오류 — 이전에도 비슷한 기록이 1건 있어요. 장바구니 관련 반복 이슈로 보입니다.</div>
    <span class="ai-suggest-tag">반복 패턴 감지</span>
  </div>
</div>
</body>
</html>
