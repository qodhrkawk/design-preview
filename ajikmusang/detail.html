<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아직무상 — 상세</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: Inter, system-ui, sans-serif; color: #0a0a0a; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px;">
    <div style="display:flex; align-items:center; gap:12px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <div style="font-size:20px; line-height:28px; font-weight:600;">LG OLED TV 65인치</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
  </div>

  <div style="display:flex; flex-direction:column; gap:16px; padding:0 20px; flex:1;">

    <!-- Status hero -->
    <div style="background:#fffbeb; border:1px solid #fde68a; border-radius:16px; padding:24px; text-align:center;">
      <div style="font-size:13px; line-height:18px; color:#b45309; font-weight:500;">본체 무상보증 만료까지</div>
      <div style="font-size:36px; line-height:40px; font-weight:800; letter-spacing:-0.025em; color:#b45309; margin-top:6px;">D-56</div>
      <div style="font-size:13px; line-height:18px; color:#b45309; margin-top:6px;">2026년 10월 2일까지 · 지금 이상 있으면 무료로 고칠 수 있어요</div>
    </div>

    <!-- Warranty timeline -->
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:20px;">
      <div style="font-size:15px; line-height:20px; font-weight:600; margin-bottom:16px;">보증 타임라인</div>

      <!-- Body warranty -->
      <div style="margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span style="font-size:13px; font-weight:500;">본체 1년</span>
          <span style="font-size:13px; font-weight:600; color:#b45309;">85% 경과</span>
        </div>
        <div style="height:8px; background:#f5f5f5; border-radius:9999px; overflow:hidden;">
          <div style="width:85%; height:100%; background:#f59e0b; border-radius:9999px;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:4px;">
          <span style="font-size:11px; color:#a3a3a3;">2025.10.02</span>
          <span style="font-size:11px; color:#a3a3a3;">2026.10.02</span>
        </div>
      </div>

      <!-- Panel warranty -->
      <div>
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span style="font-size:13px; font-weight:500;">패널 (핵심부품) 2년</span>
          <span style="font-size:13px; font-weight:600; color:#15803d;">42% 경과</span>
        </div>
        <div style="height:8px; background:#f5f5f5; border-radius:9999px; overflow:hidden;">
          <div style="width:42%; height:100%; background:#22c55e; border-radius:9999px;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:4px;">
          <span style="font-size:11px; color:#a3a3a3;">2025.10.02</span>
          <span style="font-size:11px; color:#a3a3a3;">2027.10.02</span>
        </div>
      </div>
    </div>

    <!-- Evidence vault -->
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:20px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <div style="font-size:15px; line-height:20px; font-weight:600;">증빙함</div>
        <span style="background:#f0fdf4; color:#15803d; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">준비 완료</span>
      </div>
      <div style="display:flex; gap:8px;">
        <div style="flex:1; background:#f5f5f5; border-radius:10px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:6px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 8h8"/><path d="M8 12h8"/></svg>
          <span style="font-size:12px; font-weight:500;">영수증</span>
        </div>
        <div style="flex:1; background:#f5f5f5; border-radius:10px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:6px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          <span style="font-size:12px; font-weight:500;">시리얼 사진</span>
        </div>
        <div style="flex:1; background:#ffffff; border:1px dashed #d4d4d4; border-radius:10px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:6px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span style="font-size:12px; font-weight:500; color:#a3a3a3;">추가</span>
        </div>
      </div>
    </div>

    <!-- AS info card -->
    <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:20px;">
      <div style="font-size:15px; line-height:20px; font-weight:600; margin-bottom:12px;">AS 신청 정보</div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:13px; color:#737373;">LG전자 고객센터</span>
          <span style="font-size:13px; font-weight:600;">1544-7777</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:13px; color:#737373;">모델명</span>
          <span style="font-size:13px; font-weight:600;">OLED65C4KNA</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:13px; color:#737373;">구매처</span>
          <span style="font-size:13px; font-weight:600;">쿠팡 (주문번호 보관됨)</span>
        </div>
      </div>
      <div style="background:#f5f5f5; border-radius:8px; height:40px; display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span style="font-size:14px; font-weight:600;">서비스센터 전화하기</span>
      </div>
    </div>

  </div>

  <div style="height:32px;"></div>
</div>
</body>
</html>
