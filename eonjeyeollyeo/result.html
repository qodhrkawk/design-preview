<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>언제열려 — 곳별 전적</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; color: #0a0a0a; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 32px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 9999px; padding: 2px 8px; font-size: 12px; font-weight: 500; }
  .opt { flex: 1; height: 64px; border: 1px solid #e5e5e5; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 500; }
  .hist { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e5e5e5; }
</style>
</head>
<body>
<div class="screen">

  <div style="display:flex; align-items:center; gap:8px; padding:16px 20px 8px 12px;">
    <button style="width:40px; height:40px; border:none; background:none; display:flex; align-items:center; justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div style="flex:1;">
      <div style="font-size:18px; font-weight:600;">연남동 오마카세</div>
      <div style="font-size:13px; color:#737373;">매주 월 12:00 · 2주 뒤분</div>
    </div>
  </div>

  <!-- Result prompt -->
  <div style="margin:8px 20px 0 20px; border:1px solid #e5e5e5; border-radius:16px; padding:16px;">
    <div style="font-size:15px; font-weight:600;">오늘 12:00 오픈, 어떻게 됐어?</div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <div class="opt" style="border-color:#22c55e; background:#f0fdf4;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        성공
      </div>
      <div class="opt">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        실패
      </div>
      <div class="opt">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22"/><path d="M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/></svg>
        대기 걸림
      </div>
    </div>
    <div style="margin-top:14px; font-size:13px; font-weight:500;">몇 분 만에 마감됐어?</div>
    <div style="display:flex; gap:6px; margin-top:8px;">
      <span class="chip" style="background:#171717; color:#fafafa; padding:4px 10px;">1분 안</span>
      <span class="chip" style="background:#f5f5f5; color:#171717; padding:4px 10px;">5분 안</span>
      <span class="chip" style="background:#f5f5f5; color:#171717; padding:4px 10px;">30분+</span>
      <span class="chip" style="background:#f5f5f5; color:#171717; padding:4px 10px;">안 막힘</span>
    </div>
    <div style="margin-top:12px; height:40px; border:1px solid #e5e5e5; border-radius:8px; padding:0 12px; display:flex; align-items:center; font-size:14px; color:#737373;">다음번 팁 (예: 카드 미리 등록, 2인석 먼저)</div>
  </div>

  <!-- Stats -->
  <div style="display:flex; gap:8px; padding:16px 20px 0 20px;">
    <div style="flex:1; border:1px solid #e5e5e5; border-radius:12px; padding:12px;">
      <div style="font-size:12px; color:#737373;">도전</div>
      <div style="font-size:20px; font-weight:600;">9<span style="font-size:13px; color:#737373; font-weight:400;">회</span></div>
    </div>
    <div style="flex:1; border:1px solid #e5e5e5; border-radius:12px; padding:12px;">
      <div style="font-size:12px; color:#737373;">성공</div>
      <div style="font-size:20px; font-weight:600;">3<span style="font-size:13px; color:#737373; font-weight:400;">회</span></div>
    </div>
    <div style="flex:1; border:1px solid #e5e5e5; border-radius:12px; padding:12px;">
      <div style="font-size:12px; color:#737373;">보통 마감</div>
      <div style="font-size:20px; font-weight:600;">1<span style="font-size:13px; color:#737373; font-weight:400;">분 안</span></div>
    </div>
  </div>

  <!-- Tip card -->
  <div style="margin:12px 20px 0 20px; background:#f5f5f5; border-radius:12px; padding:14px 16px; display:flex; gap:10px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px;"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
    <div>
      <div style="font-size:13px; font-weight:600;">지난번 내 팁</div>
      <div style="font-size:13px; color:#404040; margin-top:2px; line-height:19px;">카카오페이 미리 등록해둘 것. 평일 저녁 2인석이 제일 늦게 빠짐.</div>
    </div>
  </div>

  <!-- History -->
  <div style="padding:20px 20px 0 20px;">
    <div style="font-size:16px; font-weight:600; margin-bottom:4px;">전적</div>

    <div class="hist">
      <span class="chip" style="background:#fef2f2; color:#ef4444; width:44px; justify-content:center;">실패</span>
      <div style="flex:1; font-size:14px;">9/21 월 · 10/5분</div>
      <div style="font-size:13px; color:#737373;">40초 마감</div>
    </div>
    <div class="hist">
      <span class="chip" style="background:#f0fdf4; color:#16a34a; width:44px; justify-content:center;">성공</span>
      <div style="flex:1; font-size:14px;">9/14 월 · 9/28분</div>
      <div style="font-size:13px; color:#737373;">1분 안</div>
    </div>
    <div class="hist">
      <span class="chip" style="background:#fffbeb; color:#d97706; width:44px; justify-content:center;">대기</span>
      <div style="flex:1; font-size:14px;">9/7 월 · 9/21분</div>
      <div style="font-size:13px; color:#737373;">대기 3번</div>
    </div>
    <div class="hist" style="border-bottom:none;">
      <span class="chip" style="background:#fef2f2; color:#ef4444; width:44px; justify-content:center;">실패</span>
      <div style="flex:1; font-size:14px;">8/31 월 · 9/14분</div>
      <div style="font-size:13px; color:#737373;">1분 안</div>
    </div>
  </div>

</div>
</body>
</html>
