<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>먹혔어 — 급여 기록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 100px; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display:flex; align-items:center; gap:12px; padding:16px 20px;">
    <button style="width:40px; height:40px; border-radius:8px; border:1px solid #e5e5e5; background:#ffffff; display:flex; align-items:center; justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div style="font-size:18px; font-weight:600; color:#0a0a0a;">급여 기록</div>
  </div>

  <!-- Food selector -->
  <div style="padding:8px 20px 0 20px;">
    <div style="font-size:14px; font-weight:600; color:#0a0a0a; margin-bottom:8px;">사료 선택</div>
    <div style="display:flex; align-items:center; gap:10px; border:1px solid #e5e5e5; border-radius:8px; padding:12px;">
      <div style="width:44px; height:44px; border-radius:8px; background:#f5f5f5; display:flex; align-items:center; justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.25 16.25h1.5L12 17z"/><path d="M16 14v.5"/><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309"/><path d="M8 14v.5"/><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5"/></svg>
      </div>
      <div style="flex:1;">
        <div style="font-size:15px; font-weight:600; color:#0a0a0a;">챠오츄르 참치</div>
        <div style="font-size:13px; color:#737373;">이나바 · 간식 · 최근 급여</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div style="display:flex; gap:6px; margin-top:8px;">
      <span style="background:#f5f5f5; border:1px solid #e5e5e5; border-radius:9999px; padding:4px 12px; font-size:12px; font-weight:500; color:#171717;">최근: 오리젠</span>
      <span style="background:#f5f5f5; border:1px solid #e5e5e5; border-radius:9999px; padding:4px 12px; font-size:12px; font-weight:500; color:#171717;">쉬바 참치캔</span>
      <span style="display:flex; align-items:center; gap:4px; background:#ffffff; border:1px dashed #a3a3a3; border-radius:9999px; padding:4px 12px; font-size:12px; font-weight:500; color:#737373;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>새 사료
      </span>
    </div>
  </div>

  <!-- Divider -->
  <div style="height:1px; background:#e5e5e5; margin:20px 20px;"></div>

  <!-- Cat 1 verdict -->
  <div style="padding:0 20px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
      <span style="width:10px; height:10px; border-radius:9999px; background:#f59e0b;"></span>
      <span style="font-size:15px; font-weight:600; color:#0a0a0a;">치즈</span>
      <span style="font-size:12px; color:#737373;">는 어땠어?</span>
    </div>
    <div style="display:flex; gap:8px;">
      <div style="flex:1; text-align:center; border:2px solid #16a34a; background:#f0fdf4; border-radius:10px; padding:14px 0;">
        <div style="display:flex; justify-content:center; margin-bottom:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div style="font-size:13px; font-weight:600; color:#16a34a;">완탐</div>
      </div>
      <div style="flex:1; text-align:center; border:1px solid #e5e5e5; background:#ffffff; border-radius:10px; padding:14px 0;">
        <div style="display:flex; justify-content:center; margin-bottom:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h8"/><circle cx="12" cy="12" r="10"/></svg></div>
        <div style="font-size:13px; font-weight:500; color:#737373;">깨작</div>
      </div>
      <div style="flex:1; text-align:center; border:1px solid #e5e5e5; background:#ffffff; border-radius:10px; padding:14px 0;">
        <div style="display:flex; justify-content:center; margin-bottom:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div>
        <div style="font-size:13px; font-weight:500; color:#737373;">거부</div>
      </div>
      <div style="flex:1; text-align:center; border:1px solid #e5e5e5; background:#ffffff; border-radius:10px; padding:14px 0;">
        <div style="display:flex; justify-content:center; margin-bottom:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
        <div style="font-size:13px; font-weight:500; color:#737373;">탈 났음</div>
      </div>
    </div>
  </div>

  <!-- Cat 2 verdict -->
  <div style="padding:0 20px; margin-top:20px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
      <span style="width:10px; height:10px; border-radius:9999px; background:#3b82f6;"></span>
      <span style="font-size:15px; font-weight:600; color:#0a0a0a;">모리</span>
      <span style="font-size:12px; color:#737373;">는 어땠어?</span>
    </div>
    <div style="display:flex; gap:8px;">
      <div style="flex:1; text-align:center; border:1px solid #e5e5e5; background:#ffffff; border-radius:10px; padding:14px 0;">
        <div style="display:flex; justify-content:center; margin-bottom:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div style="font-size:13px; font-weight:500; color:#737373;">완탐</div>
      </div>
      <div style="flex:1; text-align:center; border:2px solid #f59e0b; background:#fffbeb; border-radius:10px; padding:14px 0;">
        <div style="display:flex; justify-content:center; margin-bottom:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h8"/><circle cx="12" cy="12" r="10"/></svg></div>
        <div style="font-size:13px; font-weight:600; color:#f59e0b;">깨작</div>
      </div>
      <div style="flex:1; text-align:center; border:1px solid #e5e5e5; background:#ffffff; border-radius:10px; padding:14px 0;">
        <div style="display:flex; justify-content:center; margin-bottom:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div>
        <div style="font-size:13px; font-weight:500; color:#737373;">거부</div>
      </div>
      <div style="flex:1; text-align:center; border:1px solid #e5e5e5; background:#ffffff; border-radius:10px; padding:14px 0;">
        <div style="display:flex; justify-content:center; margin-bottom:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
        <div style="font-size:13px; font-weight:500; color:#737373;">탈 났음</div>
      </div>
    </div>
  </div>

  <!-- Optional memo -->
  <div style="padding:0 20px; margin-top:24px;">
    <div style="font-size:14px; font-weight:600; color:#0a0a0a; margin-bottom:8px;">메모 <span style="font-weight:400; color:#a3a3a3;">(선택)</span></div>
    <div style="border:1px solid #e5e5e5; border-radius:8px; padding:12px; font-size:14px; color:#a3a3a3;">
      예) 츄르에 섞으니까 먹음, 그냥 주면 안 먹음
    </div>
  </div>

  <!-- Reaction tags -->
  <div style="padding:0 20px; margin-top:16px;">
    <div style="display:flex; flex-wrap:wrap; gap:6px;">
      <span style="background:#f5f5f5; border:1px solid #e5e5e5; border-radius:9999px; padding:5px 12px; font-size:12px; font-weight:500; color:#171717;">토함</span>
      <span style="background:#f5f5f5; border:1px solid #e5e5e5; border-radius:9999px; padding:5px 12px; font-size:12px; font-weight:500; color:#171717;">설사</span>
      <span style="background:#f5f5f5; border:1px solid #e5e5e5; border-radius:9999px; padding:5px 12px; font-size:12px; font-weight:500; color:#171717;">변 딱딱</span>
      <span style="background:#f5f5f5; border:1px solid #e5e5e5; border-radius:9999px; padding:5px 12px; font-size:12px; font-weight:500; color:#171717;">눈물 늘어남</span>
      <span style="background:#f5f5f5; border:1px solid #e5e5e5; border-radius:9999px; padding:5px 12px; font-size:12px; font-weight:500; color:#171717;">구토 없음</span>
    </div>
  </div>

  <!-- Save button -->
  <div style="position:absolute; bottom:24px; left:20px; right:20px;">
    <button style="width:100%; background:#171717; color:#fafafa; border:none; border-radius:10px; padding:16px 0; font-size:16px; font-weight:600; font-family:inherit;">저장</button>
  </div>

</div>
</body>
</html>
