<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>먹혔어 — 홈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 100px; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px 20px;">
    <div>
      <div style="font-size:24px; line-height:32px; font-weight:600; color:#0a0a0a;">먹혔어</div>
      <div style="font-size:14px; line-height:20px; color:#737373; margin-top:2px;">우리집 사료 이력서</div>
    </div>
    <button style="width:40px; height:40px; border-radius:8px; border:1px solid #e5e5e5; background:#ffffff; display:flex; align-items:center; justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  </div>

  <!-- Cat filter chips -->
  <div style="display:flex; gap:8px; padding:12px 20px 4px 20px;">
    <div style="display:flex; align-items:center; gap:6px; background:#171717; color:#fafafa; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:500;">전체</div>
    <div style="display:flex; align-items:center; gap:6px; background:#f5f5f5; color:#171717; border:1px solid #e5e5e5; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:500;">
      <span style="width:8px; height:8px; border-radius:9999px; background:#f59e0b; display:inline-block;"></span>치즈
    </div>
    <div style="display:flex; align-items:center; gap:6px; background:#f5f5f5; color:#171717; border:1px solid #e5e5e5; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:500;">
      <span style="width:8px; height:8px; border-radius:9999px; background:#3b82f6; display:inline-block;"></span>모리
    </div>
  </div>

  <!-- Segment -->
  <div style="display:flex; background:#f5f5f5; border-radius:10px; padding:4px; margin:12px 20px;">
    <div style="flex:1; text-align:center; padding:8px 0; background:#ffffff; border-radius:8px; font-size:13px; font-weight:600; color:#0a0a0a; box-shadow:0 1px 2px rgba(0,0,0,0.05);">전체 12</div>
    <div style="flex:1; text-align:center; padding:8px 0; font-size:13px; font-weight:500; color:#737373;">정착 후보 3</div>
    <div style="flex:1; text-align:center; padding:8px 0; font-size:13px; font-weight:500; color:#737373;">블랙리스트 4</div>
  </div>

  <!-- Settled candidate card -->
  <div style="margin:8px 20px 0 20px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between;">
      <div style="flex:1;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:16px; font-weight:600; color:#0a0a0a;">오리젠 캣 &amp; 키튼</span>
          <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">건식</span>
        </div>
        <div style="font-size:13px; color:#737373; margin-top:2px;">오리젠 · 마지막 급여 3일 전</div>
      </div>
      <span style="display:flex; align-items:center; gap:4px; background:#f0fdf4; color:#16a34a; border-radius:9999px; padding:4px 10px; font-size:12px; font-weight:600;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>정착 후보
      </span>
    </div>
    <!-- per-cat verdicts -->
    <div style="display:flex; gap:8px; margin-top:12px;">
      <div style="flex:1; display:flex; align-items:center; gap:8px; background:#f5f5f5; border-radius:8px; padding:8px 10px;">
        <span style="width:8px; height:8px; border-radius:9999px; background:#f59e0b;"></span>
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">치즈</span>
        <span style="font-size:13px; color:#16a34a; font-weight:600; margin-left:auto;">완탐</span>
      </div>
      <div style="flex:1; display:flex; align-items:center; gap:8px; background:#f5f5f5; border-radius:8px; padding:8px 10px;">
        <span style="width:8px; height:8px; border-radius:9999px; background:#3b82f6;"></span>
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">모리</span>
        <span style="font-size:13px; color:#16a34a; font-weight:600; margin-left:auto;">잘 먹음</span>
      </div>
    </div>
  </div>

  <!-- Testing card -->
  <div style="margin:12px 20px 0 20px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between;">
      <div style="flex:1;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:16px; font-weight:600; color:#0a0a0a;">챠오츄르 참치</span>
          <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">간식</span>
        </div>
        <div style="font-size:13px; color:#737373; margin-top:2px;">이나바 · 마지막 급여 오늘</div>
      </div>
      <span style="display:flex; align-items:center; gap:4px; background:#eff6ff; color:#3b82f6; border-radius:9999px; padding:4px 10px; font-size:12px; font-weight:600;">테스트 중</span>
    </div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <div style="flex:1; display:flex; align-items:center; gap:8px; background:#f5f5f5; border-radius:8px; padding:8px 10px;">
        <span style="width:8px; height:8px; border-radius:9999px; background:#f59e0b;"></span>
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">치즈</span>
        <span style="font-size:13px; color:#16a34a; font-weight:600; margin-left:auto;">완탐</span>
      </div>
      <div style="flex:1; display:flex; align-items:center; gap:8px; background:#f5f5f5; border-radius:8px; padding:8px 10px;">
        <span style="width:8px; height:8px; border-radius:9999px; background:#3b82f6;"></span>
        <span style="font-size:13px; font-weight:500; color:#737373;">모리</span>
        <span style="font-size:13px; color:#a3a3a3; font-weight:500; margin-left:auto;">기록 없음</span>
      </div>
    </div>
  </div>

  <!-- Blacklist card -->
  <div style="margin:12px 20px 0 20px; background:#ffffff; border:1px solid #fecaca; border-radius:12px; padding:16px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between;">
      <div style="flex:1;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:16px; font-weight:600; color:#0a0a0a;">로얄캐닌 인도어</span>
          <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">건식</span>
        </div>
        <div style="font-size:13px; color:#737373; margin-top:2px;">로얄캐닌 · 마지막 급여 2주 전</div>
      </div>
      <span style="display:flex; align-items:center; gap:4px; background:#fef2f2; color:#ef4444; border-radius:9999px; padding:4px 10px; font-size:12px; font-weight:600;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>블랙리스트
      </span>
    </div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <div style="flex:1; display:flex; align-items:center; gap:8px; background:#f5f5f5; border-radius:8px; padding:8px 10px;">
        <span style="width:8px; height:8px; border-radius:9999px; background:#f59e0b;"></span>
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">치즈</span>
        <span style="font-size:13px; color:#ef4444; font-weight:600; margin-left:auto;">거부</span>
      </div>
      <div style="flex:1; display:flex; align-items:center; gap:8px; background:#f5f5f5; border-radius:8px; padding:8px 10px;">
        <span style="width:8px; height:8px; border-radius:9999px; background:#3b82f6;"></span>
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">모리</span>
        <span style="font-size:13px; color:#ef4444; font-weight:600; margin-left:auto;">설사</span>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:6px; margin-top:10px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <span style="font-size:12px; color:#737373;">모리 설사 반응 2회 — 재구매 주의</span>
    </div>
  </div>

  <!-- Deukjjak card -->
  <div style="margin:12px 20px 0 20px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between;">
      <div style="flex:1;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:16px; font-weight:600; color:#0a0a0a;">쉬바 참치캔</span>
          <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">습식</span>
        </div>
        <div style="font-size:13px; color:#737373; margin-top:2px;">쉬바 · 마지막 급여 5일 전</div>
      </div>
      <span style="display:flex; align-items:center; gap:4px; background:#fffbeb; color:#f59e0b; border-radius:9999px; padding:4px 10px; font-size:12px; font-weight:600;">애매</span>
    </div>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <div style="flex:1; display:flex; align-items:center; gap:8px; background:#f5f5f5; border-radius:8px; padding:8px 10px;">
        <span style="width:8px; height:8px; border-radius:9999px; background:#f59e0b;"></span>
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">치즈</span>
        <span style="font-size:13px; color:#f59e0b; font-weight:600; margin-left:auto;">깨작</span>
      </div>
      <div style="flex:1; display:flex; align-items:center; gap:8px; background:#f5f5f5; border-radius:8px; padding:8px 10px;">
        <span style="width:8px; height:8px; border-radius:9999px; background:#3b82f6;"></span>
        <span style="font-size:13px; font-weight:500; color:#0a0a0a;">모리</span>
        <span style="font-size:13px; color:#16a34a; font-weight:600; margin-left:auto;">잘 먹음</span>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <div style="position:absolute; bottom:24px; left:0; right:0; display:flex; justify-content:center;">
    <button style="display:flex; align-items:center; gap:8px; background:#171717; color:#fafafa; border:none; border-radius:9999px; padding:14px 24px; font-size:15px; font-weight:600; box-shadow:0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05); font-family:inherit;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      급여 기록
    </button>
  </div>

</div>
</body>
</html>
