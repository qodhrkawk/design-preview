<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빌렸어 — 반납 가방</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; position: relative; }
  .num { font-variant-numeric: tabular-nums; }
  .badge { border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
  .who { height: 22px; padding: 0 8px; border-radius: 6px; background: #f5f5f5; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; color: #171717; }
</style>

<style>
  .cover { position: relative; border-radius: 8px; aspect-ratio: 3 / 4; display: flex; align-items: flex-end; padding: 8px; overflow: hidden; }
  .cover .t { font-size: 11px; line-height: 14px; font-weight: 600; color: #ffffff; }
  .done { position: absolute; inset: 0; background: rgba(10,10,10,0.55); display: flex; align-items: center; justify-content: center; }
  .done span { width: 32px; height: 32px; border-radius: 9999px; background: #22c55e; display: flex; align-items: center; justify-content: center; }
  .missing { outline: 2px dashed #ef4444; outline-offset: 2px; }
</style>
</head>
<body>
<main class="screen">
  <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 600;"><span>14:00</span><span style="display: flex; gap: 6px; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/></svg><svg width="20" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="10" x="2" y="7" rx="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg></span></div>


  <header style="display: flex; align-items: center; gap: 12px; padding: 8px 20px 12px;">
    <a href="home.html" style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h1 style="font-size: 18px; line-height: 24px; font-weight: 600;">반납 가방 싸기</h1>
      <span class="num" style="font-size: 12px; color: #737373;">해오름도서관 · 10/29 (목) 마감</span>
    </div>
  </header>

  <section style="padding: 0 20px 120px; display: flex; flex-direction: column; gap: 16px;">
    <!-- progress -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span class="num" style="font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.025em;">6<span style="font-size: 18px; color: #737373; font-weight: 600;"> / 9권</span></span>
        <span style="font-size: 12px; color: #737373;">표지 탭하면 가방에 넣음</span>
      </div>
      <div style="height: 8px; border-radius: 9999px; background: #f5f5f5; overflow: hidden;"><div style="width: 66.7%; height: 100%; background: #171717;"></div></div>
    </div>

    <!-- filter -->
    <div style="display: flex; gap: 8px;">
      <button style="height: 32px; padding: 0 12px; border-radius: 9999px; border: 2px solid #171717; background: #fafafa; font-size: 13px; font-weight: 600;">전체 9</button>
      <button style="height: 32px; padding: 0 12px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #ffffff; font-size: 13px; font-weight: 500;">엄마 5</button>
      <button style="height: 32px; padding: 0 12px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #ffffff; font-size: 13px; font-weight: 500;">지우 4</button>
      <button style="height: 32px; padding: 0 12px; border-radius: 9999px; border: 1px solid #e5e5e5; background: #ffffff; font-size: 13px; font-weight: 500;">남은 것 3</button>
    </div>

    <!-- grid -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
      <div class="cover" style="background: #3b82f6;"><span class="t">구름빵</span><div class="done"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div></div>
      <div class="cover" style="background: #f59e0b;"><span class="t">팥죽 할멈과 호랑이</span><div class="done"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div></div>
      <div class="cover missing" style="background: #22c55e;"><span class="t">수박 수영장</span></div>
      <div class="cover" style="background: #a855f7;"><span class="t">알사탕</span><div class="done"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div></div>
      <div class="cover" style="background: #ef4444;"><span class="t">이게 정말 사과일까?</span></div>
      <div class="cover" style="background: #0ea5e9;"><span class="t">긴긴밤</span><div class="done"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div></div>
      <div class="cover" style="background: #404040;"><span class="t">불편한 편의점</span><div class="done"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div></div>
      <div class="cover" style="background: #737373;"><span class="t">역행자</span><div class="done"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div></div>
      <div class="cover" style="background: #14b8a6;"><span class="t">요리 그림책 (CD 포함)</span></div>
    </div>

    <!-- missing hint -->
    <div style="border: 1px solid #fecaca; background: #fef2f2; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start;">
      <svg style="flex-shrink: 0; margin-top: 1px;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#991b1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 14px; font-weight: 600; color: #7f1d1d;">수박 수영장 — 어제도 못 찾았어요</span>
        <span style="font-size: 12px; line-height: 18px; color: #991b1b;">마지막 메모: "지우 방 침대 옆". 못 찾으면 이 책만 빼고 반납 → 연체 1권만 걸려요.</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; align-items: center; font-size: 12px; color: #737373;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      요리 그림책은 딸림자료(CD) 있음 — 무인반납기 안 돼요
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 32px; background: #ffffff; border-top: 1px solid #e5e5e5; display: flex; gap: 8px;">
    <button style="height: 48px; padding: 0 16px; border-radius: 8px; border: 1px solid #e5e5e5; background: #f5f5f5; font-size: 14px; font-weight: 500;">일부만 반납</button>
    <button style="flex: 1; height: 48px; border-radius: 8px; border: none; background: #171717; color: #fafafa; font-size: 15px; font-weight: 600;">반납 완료 처리</button>
  </div>
</main>
</body>
</html>
