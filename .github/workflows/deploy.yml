name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: line/package-lock.json

      - name: Install dependencies
        run: |
          cd line
          npm ci

      - name: Build
        run: |
          cd line
          npm run build

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='line' \
            --exclude='_site' \
            --exclude='.github' \
            --exclude='.git' \
            --exclude='node_modules' \
            . _site/
          cp -r line/dist _site/line

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
