name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 'line' is an optional Vite app. Its build must never block static previews.
      - name: Build line (optional)
        id: line
        continue-on-error: true
        run: |
          if [ -f line/package.json ]; then
            cd line
            npm install --no-audit --no-fund
            npm run build
          else
            echo "no line project; skipping"
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='line' \
            --exclude='_site' \
            --exclude='.github' \
            --exclude='.git' \
            --exclude='node_modules' \
            . _site/
          if [ -d line/dist ]; then
            cp -r line/dist _site/line
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
