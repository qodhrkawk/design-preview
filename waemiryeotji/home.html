<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>왜미뤘지 - 홈</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;justify-content:center}
  .app{width:390px;background:#ffffff;min-height:100vh;color:#0a0a0a}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div style="padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:12px;color:#737373;font-weight:500">2026. 5. 28 목요일</div>
      <div style="font-size:24px;font-weight:600;letter-spacing:-0.025em">안녕, 윤재</div>
    </div>
    <div style="width:40px;height:40px;border-radius:9999px;background:#f5f5f5;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 10v6m11-11h-6M7 12H1m17.07-7.07-4.24 4.24M9.17 14.83l-4.24 4.24m0-14.14 4.24 4.24m5.66 5.66 4.24 4.24"/></svg>
    </div>
  </div>

  <!-- Mirugi Score Card -->
  <div style="margin:16px 20px;padding:24px;background:linear-gradient(135deg,#171717 0%,#404040 100%);border-radius:16px;color:#fafafa">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
      <div style="font-size:14px;font-weight:500;opacity:0.7">이번 주 미루기 지수</div>
      <div style="font-size:12px;padding:4px 10px;background:rgba(255,255,255,0.15);border-radius:9999px">완벽주의형</div>
    </div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
      <div style="font-size:48px;font-weight:800;letter-spacing:-0.025em;line-height:1">62</div>
      <div style="font-size:14px;color:#a3a3a3">/ 100</div>
      <div style="margin-left:auto;font-size:13px;color:#22c55e;display:flex;align-items:center;gap:4px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        지난주보다 8↓
      </div>
    </div>
    <div style="height:6px;background:rgba(255,255,255,0.15);border-radius:9999px;overflow:hidden">
      <div style="width:62%;height:100%;background:#fafafa;border-radius:9999px"></div>
    </div>
  </div>

  <!-- Today section -->
  <div style="padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:18px;font-weight:600">오늘 미룬 일</div>
    <div style="font-size:13px;color:#737373">3건</div>
  </div>

  <!-- Card 1 -->
  <div style="margin:8px 20px;padding:16px;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <div style="font-size:15px;font-weight:600;line-height:1.4">세금 신고 서류 정리</div>
      <div style="font-size:11px;padding:2px 8px;background:#fef3c7;color:#92400e;border-radius:9999px;font-weight:500">3일째</div>
    </div>
    <div style="font-size:13px;color:#737373;margin-bottom:12px;line-height:1.5">"오늘 저녁에 할게" → 어제도 그 말 했음</div>
    <div style="display:flex;gap:8px">
      <button style="flex:1;height:36px;background:#171717;color:#fafafa;border:none;border-radius:8px;font-size:13px;font-weight:500;font-family:inherit">왜 미뤘지 진단</button>
      <button style="height:36px;width:36px;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:8px;display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Card 2 -->
  <div style="margin:8px 20px;padding:16px;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <div style="font-size:15px;font-weight:600;line-height:1.4">병원 예약 전화</div>
      <div style="font-size:11px;padding:2px 8px;background:#fee2e2;color:#991b1b;border-radius:9999px;font-weight:500">7일째</div>
    </div>
    <div style="font-size:13px;color:#737373;margin-bottom:12px;line-height:1.5">통화 자체가 부담 → 회피 패턴 의심</div>
    <div style="display:flex;gap:8px">
      <button style="flex:1;height:36px;background:#171717;color:#fafafa;border:none;border-radius:8px;font-size:13px;font-weight:500;font-family:inherit">왜 미뤘지 진단</button>
      <button style="height:36px;width:36px;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:8px;display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Card 3 -->
  <div style="margin:8px 20px;padding:16px;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <div style="font-size:15px;font-weight:600;line-height:1.4">사이드 프로젝트 PR 리뷰</div>
      <div style="font-size:11px;padding:2px 8px;background:#f5f5f5;color:#737373;border-radius:9999px;font-weight:500">1일째</div>
    </div>
    <div style="font-size:13px;color:#737373;margin-bottom:12px;line-height:1.5">아직 여유 있다고 생각 중</div>
    <div style="display:flex;gap:8px">
      <button style="flex:1;height:36px;background:#171717;color:#fafafa;border:none;border-radius:8px;font-size:13px;font-weight:500;font-family:inherit">왜 미뤘지 진단</button>
      <button style="height:36px;width:36px;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:8px;display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Add Button (Floating) -->
  <div style="position:sticky;bottom:0;background:linear-gradient(to top,#ffffff 70%,transparent);padding:24px 20px 24px">
    <button style="width:100%;height:52px;background:#171717;color:#fafafa;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      오늘 미룬 일 기록
    </button>
  </div>

  <!-- Bottom Nav -->
  <div style="display:flex;justify-content:space-around;padding:12px 20px 24px;border-top:1px solid #e5e5e5">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#171717">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <div style="font-size:11px;font-weight:600">홈</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      <div style="font-size:11px;font-weight:500">패턴</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#a3a3a3">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-3"/><path d="M9 11V7a3 3 0 0 1 6 0v4"/></svg>
      <div style="font-size:11px;font-weight:500">아카이브</div>
    </div>
  </div>
</div>
</body>
</html>
