<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몇점 — 경기 기록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 20px; display: flex; align-items: center; gap: 12px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <div style="font-size: 20px; line-height: 28px; font-weight: 600; color: #0a0a0a;">경기 기록</div>
  </div>

  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 20px;">

    <!-- Game type -->
    <div>
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 8px;">종목</div>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1; height: 44px; background: #171717; color: #fafafa; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500;">4구</div>
        <div style="flex: 1; height: 44px; background: #ffffff; color: #171717; border: 1px solid #e5e5e5; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500;">3구</div>
        <div style="flex: 1; height: 44px; background: #ffffff; color: #171717; border: 1px solid #e5e5e5; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500;">포켓</div>
      </div>
    </div>

    <!-- Opponent -->
    <div>
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 8px;">상대</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 6px; background: #171717; border-radius: 9999px; padding: 8px 14px;">
          <span style="font-size: 14px; font-weight: 500; color: #fafafa;">진우형</span>
          <span style="font-size: 12px; color: #a3a3a3;">200</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 14px;">
          <span style="font-size: 14px; font-weight: 500; color: #171717;">민수</span>
          <span style="font-size: 12px; color: #737373;">120</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 14px;">
          <span style="font-size: 14px; font-weight: 500; color: #171717;">태호 과장님</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; background: #f5f5f5; border-radius: 9999px; padding: 8px 14px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span style="font-size: 14px; font-weight: 500; color: #737373;">새 상대</span>
        </div>
      </div>
      <!-- head-to-head hint -->
      <div style="margin-top: 10px; background: #f5f5f5; border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; gap: 8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span style="font-size: 13px; line-height: 18px; color: #737373;">진우형과 상대전적 9승 14패 · 마지막 경기 8/19 패</span>
      </div>
    </div>

    <!-- Result -->
    <div>
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 8px;">결과</div>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1; height: 56px; background: #f0fdf4; border: 2px solid #22c55e; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <span style="font-size: 16px; font-weight: 600; color: #16a34a;">승리</span>
        </div>
        <div style="flex: 1; height: 56px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          <span style="font-size: 16px; font-weight: 600; color: #737373;">패배</span>
        </div>
      </div>
    </div>

    <!-- Optional details -->
    <div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
        <div style="font-size: 13px; font-weight: 500; color: #737373;">세부 기록 <span style="color: #a3a3a3;">(선택)</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; gap: 8px;">
          <div style="flex: 1; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; height: 44px; display: flex; flex-direction: column; justify-content: center;">
            <div style="font-size: 11px; color: #a3a3a3;">이닝</div>
            <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">18</div>
          </div>
          <div style="flex: 1; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; height: 44px; display: flex; flex-direction: column; justify-content: center;">
            <div style="font-size: 11px; color: #a3a3a3;">하이런</div>
            <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">25</div>
          </div>
          <div style="flex: 1; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; height: 44px; display: flex; flex-direction: column; justify-content: center;">
            <div style="font-size: 11px; color: #a3a3a3;">게임비</div>
            <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">12,000</div>
          </div>
        </div>
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px; min-height: 44px;">
          <div style="font-size: 11px; color: #a3a3a3; margin-bottom: 2px;">메모</div>
          <div style="font-size: 14px; color: #0a0a0a;">뒤돌리기 감 좋았음. 초반 밀리다가 역전</div>
        </div>
      </div>
    </div>

    <!-- Where -->
    <div>
      <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 8px;">당구장 <span style="color: #a3a3a3;">(선택)</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div style="background: #171717; border-radius: 9999px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: #fafafa;">역전당구클럽</div>
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: #171717;">블루문볼</div>
        <div style="background: #f5f5f5; border-radius: 9999px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: #737373;">+ 추가</div>
      </div>
    </div>

  </div>

  <!-- Save button -->
  <div style="margin-top: auto; padding: 16px 20px 32px;">
    <div style="background: #171717; color: #fafafa; border-radius: 10px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600;">저장</div>
    <div style="text-align: center; font-size: 12px; color: #a3a3a3; margin-top: 10px;">승/패만 골라도 저장돼요 — 10초면 끝</div>
  </div>

</div>
</body>
</html>
