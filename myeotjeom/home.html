<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몇점 — 홈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div style="font-size: 24px; line-height: 32px; font-weight: 600; color: #0a0a0a;">몇점</div>
      <div style="font-size: 14px; line-height: 20px; color: #737373;">8월 전적 12승 7패</div>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
  </div>

  <!-- My handicap card -->
  <div style="margin: 8px 20px 0; background: #171717; border-radius: 16px; padding: 20px; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div style="font-size: 12px; line-height: 16px; color: #a3a3a3; margin-bottom: 4px;">내 치수 · 4구</div>
      <div style="font-size: 36px; line-height: 40px; font-weight: 800; letter-spacing: -0.025em; color: #fafafa;">150</div>
      <div style="font-size: 12px; line-height: 16px; color: #a3a3a3; margin-top: 4px;">최근 10경기 승률 60%</div>
    </div>
    <div style="text-align: right;">
      <div style="display: inline-flex; align-items: center; gap: 4px; background: #262626; border-radius: 9999px; padding: 4px 12px; margin-bottom: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>
        <span style="font-size: 12px; font-weight: 500; color: #22c55e;">3연승 중</span>
      </div>
      <div style="font-size: 12px; line-height: 16px; color: #a3a3a3;">이번 달 게임비</div>
      <div style="font-size: 16px; line-height: 24px; font-weight: 600; color: #fafafa;">-24,000원</div>
    </div>
  </div>

  <!-- Quick record CTA -->
  <div style="margin: 12px 20px 0;">
    <div style="background: #171717; color: #fafafa; border-radius: 8px; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      경기 기록하기
    </div>
  </div>

  <!-- Section: 자주 치는 상대 -->
  <div style="padding: 24px 20px 8px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 16px; font-weight: 600; color: #0a0a0a;">자주 치는 상대</div>
    <div style="font-size: 13px; font-weight: 500; color: #737373;">전체 8명</div>
  </div>

  <!-- Rival list -->
  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 8px;">

    <!-- Rival 1 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 44px; height: 44px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #171717; flex-shrink: 0;">진</div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 15px; font-weight: 600; color: #0a0a0a;">진우형</span>
          <span style="background: #f5f5f5; border-radius: 9999px; padding: 2px 8px; font-size: 11px; font-weight: 500; color: #171717;">200</span>
        </div>
        <div style="font-size: 13px; line-height: 18px; color: #737373; margin-top: 2px;">상대전적 9승 14패 · 3일 전</div>
      </div>
      <div style="display: flex; gap: 3px; flex-shrink: 0;">
        <div style="width: 8px; height: 8px; border-radius: 9999px; background: #ef4444;"></div>
        <div style="width: 8px; height: 8px; border-radius: 9999px; background: #22c55e;"></div>
        <div style="width: 8px; height: 8px; border-radius: 9999px; background: #ef4444;"></div>
        <div style="width: 8px; height: 8px; border-radius: 9999px; background: #ef4444;"></div>
        <div style="width: 8px; height: 8px; border-radius: 9999px; background: #22c55e;"></div>
      </div>
    </div>

    <!-- Rival 2 — handicap alert -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 44px; height: 44px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #171717; flex-shrink: 0;">민</div>
        <div style="flex: 1; min-width: 0;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 15px; font-weight: 600; color: #0a0a0a;">민수</span>
            <span style="background: #f5f5f5; border-radius: 9999px; padding: 2px 8px; font-size: 11px; font-weight: 500; color: #171717;">120</span>
          </div>
          <div style="font-size: 13px; line-height: 18px; color: #737373; margin-top: 2px;">상대전적 11승 4패 · 어제</div>
        </div>
        <div style="display: flex; gap: 3px; flex-shrink: 0;">
          <div style="width: 8px; height: 8px; border-radius: 9999px; background: #22c55e;"></div>
          <div style="width: 8px; height: 8px; border-radius: 9999px; background: #22c55e;"></div>
          <div style="width: 8px; height: 8px; border-radius: 9999px; background: #22c55e;"></div>
          <div style="width: 8px; height: 8px; border-radius: 9999px; background: #22c55e;"></div>
          <div style="width: 8px; height: 8px; border-radius: 9999px; background: #ef4444;"></div>
        </div>
      </div>
      <div style="margin-top: 10px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <span style="font-size: 13px; line-height: 18px; color: #92400e;">최근 5경기 4승 — 치수 올릴 때가 됐어요</span>
      </div>
    </div>

    <!-- Rival 3 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 44px; height: 44px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #171717; flex-shrink: 0;">태</div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 15px; font-weight: 600; color: #0a0a0a;">태호 과장님</span>
          <span style="background: #f5f5f5; border-radius: 9999px; padding: 2px 8px; font-size: 11px; font-weight: 500; color: #171717;">3구 15</span>
        </div>
        <div style="font-size: 13px; line-height: 18px; color: #737373; margin-top: 2px;">상대전적 5승 6패 · 2주 전</div>
      </div>
      <div style="display: flex; gap: 3px; flex-shrink: 0;">
        <div style="width: 8px; height: 8px; border-radius: 9999px; background: #ef4444;"></div>
        <div style="width: 8px; height: 8px; border-radius: 9999px; background: #22c55e;"></div>
        <div style="width: 8px; height: 8px; border-radius: 9999px; background: #22c55e;"></div>
        <div style="width: 8px; height: 8px; border-radius: 9999px; background: #ef4444;"></div>
        <div style="width: 8px; height: 8px; border-radius: 9999px; background: #22c55e;"></div>
      </div>
    </div>

    <!-- Rival 4 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 44px; height: 44px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #171717; flex-shrink: 0;">동</div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 15px; font-weight: 600; color: #0a0a0a;">동네 사장님</span>
          <span style="background: #f5f5f5; border-radius: 9999px; padding: 2px 8px; font-size: 11px; font-weight: 500; color: #171717;">250</span>
        </div>
        <div style="font-size: 13px; line-height: 18px; color: #737373; margin-top: 2px;">상대전적 2승 8패 · 1달 전</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"/></svg>
    </div>

  </div>

  <!-- Bottom nav -->
  <div style="margin-top: auto; border-top: 1px solid #e5e5e5; display: flex; padding: 8px 0 24px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size: 11px; font-weight: 500; color: #171717;">홈</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span style="font-size: 11px; font-weight: 400; color: #a3a3a3;">상대</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      <span style="font-size: 11px; font-weight: 400; color: #a3a3a3;">통계</span>
    </div>
  </div>

</div>

</html>
