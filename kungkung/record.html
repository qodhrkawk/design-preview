<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿵쿵일지 — 기록 추가</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="display:flex; align-items:center; gap:12px; padding:16px 20px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <div style="font-size:20px; line-height:28px; font-weight:600; color:#0a0a0a;">소음 기록</div>
  </div>

  <div style="padding:8px 20px 0 20px; flex:1;">

    <!-- Time (auto-filled) -->
    <div style="background:#f5f5f5; border-radius:12px; padding:16px; display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <div>
          <div style="font-size:12px; color:#737373;">발생 시각 (자동 입력)</div>
          <div style="font-size:16px; font-weight:600; color:#0a0a0a; margin-top:2px;">8월 13일 (목) 22:41</div>
        </div>
      </div>
      <span style="font-size:14px; font-weight:500; color:#3b82f6;">수정</span>
    </div>

    <!-- Type -->
    <div style="margin-top:24px;">
      <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:10px;">소음 유형</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <div style="background:#171717; color:#fafafa; border-radius:9999px; padding:10px 16px; font-size:14px; font-weight:500;">발망치</div>
        <div style="background:#ffffff; color:#171717; border:1px solid #e5e5e5; border-radius:9999px; padding:10px 16px; font-size:14px; font-weight:500;">가구 끄는 소리</div>
        <div style="background:#ffffff; color:#171717; border:1px solid #e5e5e5; border-radius:9999px; padding:10px 16px; font-size:14px; font-weight:500;">음악 · TV</div>
        <div style="background:#ffffff; color:#171717; border:1px solid #e5e5e5; border-radius:9999px; padding:10px 16px; font-size:14px; font-weight:500;">아이 뛰는 소리</div>
        <div style="background:#ffffff; color:#171717; border:1px solid #e5e5e5; border-radius:9999px; padding:10px 16px; font-size:14px; font-weight:500;">반려동물</div>
        <div style="background:#ffffff; color:#171717; border:1px solid #e5e5e5; border-radius:9999px; padding:10px 16px; font-size:14px; font-weight:500;">기타</div>
      </div>
    </div>

    <!-- Severity -->
    <div style="margin-top:24px;">
      <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:10px;">체감 강도</div>
      <div style="display:flex; gap:8px;">
        <div style="flex:1; border:1px solid #e5e5e5; border-radius:8px; padding:12px 0; text-align:center; font-size:14px; font-weight:500; color:#737373;">약함</div>
        <div style="flex:1; border:1px solid #e5e5e5; border-radius:8px; padding:12px 0; text-align:center; font-size:14px; font-weight:500; color:#737373;">보통</div>
        <div style="flex:1; border:1px solid #ef4444; background:#fef2f2; border-radius:8px; padding:12px 0; text-align:center; font-size:14px; font-weight:600; color:#ef4444;">심함</div>
      </div>
    </div>

    <!-- Duration -->
    <div style="margin-top:24px;">
      <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:10px;">지속 시간</div>
      <div style="display:flex; gap:8px;">
        <div style="flex:1; border:1px solid #e5e5e5; border-radius:8px; padding:12px 0; text-align:center; font-size:14px; color:#737373;">잠깐</div>
        <div style="flex:1; border:1px solid #171717; background:#171717; border-radius:8px; padding:12px 0; text-align:center; font-size:14px; font-weight:600; color:#fafafa;">10분 내외</div>
        <div style="flex:1; border:1px solid #e5e5e5; border-radius:8px; padding:12px 0; text-align:center; font-size:14px; color:#737373;">30분 이상</div>
        <div style="flex:1; border:1px solid #e5e5e5; border-radius:8px; padding:12px 0; text-align:center; font-size:14px; color:#737373;">계속됨</div>
      </div>
    </div>

    <!-- Recording attach -->
    <div style="margin-top:24px;">
      <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:10px;">녹음 · 참고 자료 (선택)</div>
      <div style="border:1px dashed #e5e5e5; border-radius:12px; padding:20px; display:flex; align-items:center; justify-content:center; gap:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        <span style="font-size:14px; color:#737373;">탭해서 녹음 시작 · 30초 자동 저장</span>
      </div>
      <div style="margin-top:8px; background:#f5f5f5; border-radius:8px; padding:10px 12px; display:flex; align-items:center; gap:8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span style="font-size:12px; line-height:16px; color:#737373;">녹음은 기기에만 저장되며, 시각 정보와 함께 일지에 첨부돼요.</span>
      </div>
    </div>

    <!-- Memo -->
    <div style="margin-top:24px;">
      <div style="font-size:14px; font-weight:500; color:#0a0a0a; margin-bottom:10px;">메모 (선택)</div>
      <div style="border:1px solid #e5e5e5; border-radius:8px; padding:12px; min-height:72px; font-size:14px; color:#a3a3a3;">재택근무 중 회의하는데 천장에서 계속 쿵쿵…</div>
    </div>

  </div>

  <!-- Bottom CTA -->
  <div style="padding:16px 20px 32px 20px; background:#ffffff; border-top:1px solid #e5e5e5;">
    <div style="background:#171717; color:#fafafa; border-radius:10px; height:52px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600;">기록 저장</div>
    <div style="text-align:center; font-size:12px; color:#a3a3a3; margin-top:10px;">저장 후에도 언제든 수정할 수 있어요</div>
  </div>

</div>
</body>
</html>
