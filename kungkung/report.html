<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿵쿵일지 — 리포트</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px;">
    <div style="font-size:20px; line-height:28px; font-weight:600; color:#0a0a0a;">일지 리포트</div>
    <div style="display:flex; align-items:center; gap:6px; background:#f5f5f5; border-radius:9999px; padding:6px 14px;">
      <span style="font-size:14px; font-weight:500; color:#171717;">최근 30일</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
  </div>

  <div style="padding:0 20px; flex:1;">

    <!-- Summary stats -->
    <div style="display:flex; gap:8px;">
      <div style="flex:1; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px;">
        <div style="font-size:12px; color:#737373;">총 기록</div>
        <div style="font-size:24px; line-height:32px; font-weight:600; color:#0a0a0a; margin-top:4px;">64건</div>
      </div>
      <div style="flex:1; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px;">
        <div style="font-size:12px; color:#737373;">기록한 날</div>
        <div style="font-size:24px; line-height:32px; font-weight:600; color:#0a0a0a; margin-top:4px;">26일</div>
      </div>
      <div style="flex:1; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px;">
        <div style="font-size:12px; color:#737373;">야간 비율</div>
        <div style="font-size:24px; line-height:32px; font-weight:600; color:#ef4444; margin-top:4px;">48%</div>
      </div>
    </div>

    <!-- Time heatmap -->
    <div style="margin-top:16px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:20px;">
      <div style="font-size:14px; font-weight:600; color:#0a0a0a; margin-bottom:4px;">시간대별 발생 패턴</div>
      <div style="font-size:12px; color:#737373; margin-bottom:16px;">밤 10시~12시에 집중적으로 발생하고 있어요</div>
      <div style="display:flex; align-items:flex-end; gap:4px; height:96px;">
        <div style="flex:1; background:#f5f5f5; border-radius:4px 4px 0 0; height:12%;"></div>
        <div style="flex:1; background:#f5f5f5; border-radius:4px 4px 0 0; height:8%;"></div>
        <div style="flex:1; background:#e5e5e5; border-radius:4px 4px 0 0; height:22%;"></div>
        <div style="flex:1; background:#e5e5e5; border-radius:4px 4px 0 0; height:18%;"></div>
        <div style="flex:1; background:#e5e5e5; border-radius:4px 4px 0 0; height:26%;"></div>
        <div style="flex:1; background:#d4d4d4; border-radius:4px 4px 0 0; height:38%;"></div>
        <div style="flex:1; background:#d4d4d4; border-radius:4px 4px 0 0; height:34%;"></div>
        <div style="flex:1; background:#a3a3a3; border-radius:4px 4px 0 0; height:52%;"></div>
        <div style="flex:1; background:#737373; border-radius:4px 4px 0 0; height:68%;"></div>
        <div style="flex:1; background:#ef4444; border-radius:4px 4px 0 0; height:100%;"></div>
        <div style="flex:1; background:#ef4444; border-radius:4px 4px 0 0; height:88%;"></div>
        <div style="flex:1; background:#737373; border-radius:4px 4px 0 0; height:44%;"></div>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:8px;">
        <span style="font-size:12px; color:#a3a3a3;">06시</span>
        <span style="font-size:12px; color:#a3a3a3;">12시</span>
        <span style="font-size:12px; color:#a3a3a3;">18시</span>
        <span style="font-size:12px; color:#a3a3a3;">24시</span>
      </div>
    </div>

    <!-- Type breakdown -->
    <div style="margin-top:16px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:20px;">
      <div style="font-size:14px; font-weight:600; color:#0a0a0a; margin-bottom:16px;">유형별 비율</div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <div>
          <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <span style="font-size:14px; color:#0a0a0a;">발망치</span>
            <span style="font-size:14px; font-weight:600; color:#0a0a0a;">31건</span>
          </div>
          <div style="height:8px; background:#f5f5f5; border-radius:9999px;"><div style="width:48%; height:8px; background:#171717; border-radius:9999px;"></div></div>
        </div>
        <div>
          <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <span style="font-size:14px; color:#0a0a0a;">가구 끄는 소리</span>
            <span style="font-size:14px; font-weight:600; color:#0a0a0a;">17건</span>
          </div>
          <div style="height:8px; background:#f5f5f5; border-radius:9999px;"><div style="width:27%; height:8px; background:#737373; border-radius:9999px;"></div></div>
        </div>
        <div>
          <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <span style="font-size:14px; color:#0a0a0a;">음악 · TV</span>
            <span style="font-size:14px; font-weight:600; color:#0a0a0a;">11건</span>
          </div>
          <div style="height:8px; background:#f5f5f5; border-radius:9999px;"><div style="width:17%; height:8px; background:#a3a3a3; border-radius:9999px;"></div></div>
        </div>
        <div>
          <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
            <span style="font-size:14px; color:#0a0a0a;">기타</span>
            <span style="font-size:14px; font-weight:600; color:#0a0a0a;">5건</span>
          </div>
          <div style="height:8px; background:#f5f5f5; border-radius:9999px;"><div style="width:8%; height:8px; background:#d4d4d4; border-radius:9999px;"></div></div>
        </div>
      </div>
    </div>

    <!-- Export card -->
    <div style="margin-top:16px; background:#171717; border-radius:16px; padding:20px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
        <div style="font-size:16px; font-weight:600; color:#fafafa;">제출용 일지 PDF 내보내기</div>
      </div>
      <div style="font-size:13px; line-height:19px; color:#a3a3a3; margin-top:8px;">관리사무소·이웃사이센터·분쟁조정위 제출 형식에 맞춰 날짜, 시각, 유형, 지속시간, 강도가 표로 정리된 PDF를 만들어 드려요. 첨부 녹음 목록도 함께 표기돼요.</div>
      <div style="margin-top:16px; background:#fafafa; color:#171717; border-radius:8px; height:44px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600;">최근 30일 일지 내보내기</div>
    </div>

    <div style="height:24px;"></div>
  </div>

  <!-- Bottom tab bar -->
  <div style="border-top:1px solid #e5e5e5; display:flex; padding:12px 0 28px 0; background:#ffffff;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size:12px; color:#a3a3a3;">홈</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
      <span style="font-size:12px; color:#a3a3a3;">일지</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/></svg>
      <span style="font-size:12px; font-weight:500; color:#171717;">리포트</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      <span style="font-size:12px; color:#a3a3a3;">대응 가이드</span>
    </div>
  </div>

</div>
</body>
</html>
