<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘뭐했지 - 기록하기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; }
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div style="padding: 12px 24px 8px; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 14px; font-weight: 600; color: #0a0a0a;">21:35</span>
    <div style="display: flex; gap: 6px;">
      <span style="font-size: 12px;">📶</span>
      <span style="font-size: 12px;">🔋</span>
    </div>
  </div>

  <!-- Header -->
  <div style="padding: 16px 24px 12px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 36px; height: 36px; background: #f5f5f5; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 16px;">←</div>
    <h2 style="font-size: 20px; font-weight: 700; color: #0a0a0a;">기록하기</h2>
  </div>

  <!-- Quick Input -->
  <div style="margin: 8px 24px 20px; padding: 16px; background: #f5f5f5; border-radius: 16px;">
    <p style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 8px;">뭐 했어? 간단하게 적어봐 ✏️</p>
    <div style="padding: 12px; background: #ffffff; border-radius: 12px; border: 2px solid #0a0a0a;">
      <p style="font-size: 16px; color: #0a0a0a; line-height: 1.5;">오후에 카페에서 주식 전략 정리하고 저녁에 친구 만남</p>
    </div>
    <p style="font-size: 12px; color: #737373; margin-top: 8px;">💡 AI가 자동으로 활동을 분리하고 카테고리를 붙여줘</p>
  </div>

  <!-- AI Parsed Result -->
  <div style="padding: 0 24px;">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 14px;">
      <span style="font-size: 16px;">🤖</span>
      <p style="font-size: 15px; font-weight: 700; color: #0a0a0a;">AI가 분석한 결과</p>
    </div>

    <!-- Parsed Activity 1 -->
    <div style="padding: 16px; border: 1px solid #e5e5e5; border-radius: 14px; margin-bottom: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 36px; height: 36px; background: #dbeafe; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px;">📊</div>
          <div>
            <p style="font-size: 15px; font-weight: 600; color: #0a0a0a;">투자 공부</p>
            <p style="font-size: 12px; color: #737373;">카페에서 주식 전략 정리</p>
          </div>
        </div>
        <span style="font-size: 18px; color: #22c55e;">✓</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div style="padding: 6px 14px; background: #0a0a0a; color: #fafafa; border-radius: 9999px; font-size: 12px; font-weight: 500;">📊 투자</div>
        <div style="padding: 6px 14px; background: #f5f5f5; color: #525252; border-radius: 9999px; font-size: 12px; font-weight: 500;">☕ 카페</div>
        <div style="padding: 6px 14px; background: #f5f5f5; color: #525252; border-radius: 9999px; font-size: 12px; font-weight: 500;">💻 공부</div>
      </div>
      <div style="margin-top: 10px; display: flex; gap: 12px;">
        <div style="flex: 1;">
          <p style="font-size: 11px; color: #737373; margin-bottom: 4px;">시간대</p>
          <div style="padding: 8px 12px; background: #f5f5f5; border-radius: 8px; font-size: 13px; color: #0a0a0a; font-weight: 500;">오후</div>
        </div>
        <div style="flex: 1;">
          <p style="font-size: 11px; color: #737373; margin-bottom: 4px;">기분</p>
          <div style="padding: 8px 12px; background: #f5f5f5; border-radius: 8px; font-size: 13px; text-align: center;">😊 좋음</div>
        </div>
      </div>
    </div>

    <!-- Parsed Activity 2 -->
    <div style="padding: 16px; border: 1px solid #e5e5e5; border-radius: 14px; margin-bottom: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 36px; height: 36px; background: #fce7f3; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px;">🍻</div>
          <div>
            <p style="font-size: 15px; font-weight: 600; color: #0a0a0a;">친구 만남</p>
            <p style="font-size: 12px; color: #737373;">저녁에 친구 만남</p>
          </div>
        </div>
        <span style="font-size: 18px; color: #22c55e;">✓</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div style="padding: 6px 14px; background: #0a0a0a; color: #fafafa; border-radius: 9999px; font-size: 12px; font-weight: 500;">👥 사교</div>
        <div style="padding: 6px 14px; background: #f5f5f5; color: #525252; border-radius: 9999px; font-size: 12px; font-weight: 500;">🍽️ 식사</div>
      </div>
      <div style="margin-top: 10px; display: flex; gap: 12px;">
        <div style="flex: 1;">
          <p style="font-size: 11px; color: #737373; margin-bottom: 4px;">시간대</p>
          <div style="padding: 8px 12px; background: #f5f5f5; border-radius: 8px; font-size: 13px; color: #0a0a0a; font-weight: 500;">저녁</div>
        </div>
        <div style="flex: 1;">
          <p style="font-size: 11px; color: #737373; margin-bottom: 4px;">기분</p>
          <div style="padding: 8px 12px; background: #f5f5f5; border-radius: 8px; font-size: 13px; text-align: center;">😄 최고</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Save Button -->
  <div style="padding: 20px 24px;">
    <button style="width: 100%; height: 52px; border: none; background: #0a0a0a; border-radius: 14px; font-size: 16px; font-weight: 700; color: #fafafa; font-family: Inter, system-ui, sans-serif; cursor: pointer;">✓ 저장하기</button>
    <p style="text-align: center; margin-top: 8px; font-size: 12px; color: #737373;">카테고리나 기분은 탭해서 수정할 수 있어</p>
  </div>
</div>
</body>
</html>
