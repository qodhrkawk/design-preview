<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내놨어 — 판매완료</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: Inter, "Pretendard", system-ui, sans-serif; color: #0a0a0a; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 40px; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 20px; display: flex; align-items: center; gap: 12px;">
    <button style="width: 36px; height: 36px; border-radius: 9999px; background: #f5f5f5; border: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <span style="font-size: 16px; font-weight: 600;">판매완료 처리</span>
  </div>

  <!-- 완료 요약 -->
  <div style="margin: 8px 20px 24px 20px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <div style="width: 48px; height: 48px; border-radius: 9999px; background: #22c55e; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <span style="font-size: 18px; font-weight: 700;">에어팟 프로 2 판매!</span>
    <span style="font-size: 14px; color: #737373;">당근에서 170,000원 · 내놓은 지 15일 만에</span>
  </div>

  <!-- 판매 정보 입력 -->
  <div style="padding: 0 20px 24px 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 13px; font-weight: 500; color: #737373;">판매 플랫폼</label>
        <div style="height: 44px; border: 1px solid #e5e5e5; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;">
          <span style="font-size: 14px; font-weight: 500;">당근</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 13px; font-weight: 500; color: #737373;">최종 판매가</label>
        <div style="height: 44px; border: 1px solid #171717; border-radius: 8px; display: flex; align-items: center; padding: 0 12px;">
          <span style="font-size: 14px; font-weight: 600;">170,000</span>
          <span style="font-size: 13px; color: #737373; margin-left: 4px;">원</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 다른 플랫폼 내리기 체크리스트 -->
  <div style="margin: 0 20px 24px 20px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 16px;">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <span style="font-size: 14px; font-weight: 700; color: #92400e;">다른 곳에 올린 글 내리는 거 잊지 마!</span>
    </div>
    <span style="font-size: 12px; color: #b45309; display: block; margin-bottom: 12px;">글을 안 내리면 계속 연락 오고, 최악엔 사기 의심까지 받아요.</span>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="background: #ffffff; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px;">
        <div style="width: 22px; height: 22px; border-radius: 6px; background: #22c55e; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <span style="font-size: 14px; font-weight: 500; text-decoration: line-through; color: #a3a3a3;">번개장터 글 내리기</span>
        <span style="margin-left: auto; font-size: 12px; color: #22c55e; font-weight: 600;">완료</span>
      </div>
      <div style="background: #ffffff; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px;">
        <div style="width: 22px; height: 22px; border-radius: 6px; background: #ffffff; border: 1.5px solid #d4d4d4; flex-shrink: 0;"></div>
        <span style="font-size: 14px; font-weight: 500;">중고나라 글 내리기</span>
        <button style="margin-left: auto; background: #171717; color: #fafafa; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;">글 열기</button>
      </div>
    </div>
  </div>

  <!-- 이번 달 성과 -->
  <div style="padding: 0 20px 24px 20px;">
    <div style="font-size: 14px; font-weight: 600; margin-bottom: 10px;">이번 달 성과</div>
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 12px; color: #737373;">판 금액</span>
        <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.025em;">298,000원</span>
      </div>
      <div style="flex: 1; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 12px; color: #737373;">판 물건</span>
        <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.025em;">3개</span>
      </div>
      <div style="flex: 1; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 12px; color: #737373;">평균 소요</span>
        <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.025em;">11일</span>
      </div>
    </div>
  </div>

  <!-- CTA -->
  <div style="padding: 0 20px;">
    <button style="width: 100%; height: 48px; background: #171717; color: #fafafa; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;">완료</button>
  </div>

</div>
</body>
</html>
