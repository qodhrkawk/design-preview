<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그랬대 — 녹음</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: Inter, system-ui, sans-serif; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="display:flex; align-items:center; padding:16px 20px 8px 20px; gap:12px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    <span style="font-size:16px; font-weight:600; color:#0a0a0a;">이야기 녹음</span>
  </div>

  <!-- Question card -->
  <div style="margin:12px 20px 0 20px; background:#f5f5f5; border-radius:12px; padding:20px;">
    <div style="font-size:12px; font-weight:500; color:#737373; margin-bottom:6px;">13번째 질문</div>
    <div style="font-size:18px; font-weight:600; color:#0a0a0a; line-height:28px;">"엄마가 아빠를 처음 만난 날, 어땠어?"</div>
  </div>

  <!-- Follow-up prompts -->
  <div style="margin:20px 20px 0 20px;">
    <div style="font-size:13px; font-weight:500; color:#737373; margin-bottom:8px;">대화가 막히면 이렇게 여쭤보세요</div>
    <div style="display:flex; flex-direction:column; gap:6px;">
      <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:8px; padding:10px 14px; font-size:14px; color:#0a0a0a;">"어디서 만났어? 누가 소개해줬어?"</div>
      <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:8px; padding:10px 14px; font-size:14px; color:#0a0a0a;">"첫인상이 어땠는데?"</div>
      <div style="background:#ffffff; border:1px solid #e5e5e5; border-radius:8px; padding:10px 14px; font-size:14px; color:#0a0a0a;">"그때 엄마는 몇 살이었어?"</div>
    </div>
  </div>

  <!-- Recording area -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px;">
    <!-- Waveform -->
    <div style="display:flex; align-items:center; gap:3px; height:48px; margin-bottom:24px;">
      <div style="width:3px; height:12px; background:#d4d4d4; border-radius:9999px;"></div>
      <div style="width:3px; height:22px; background:#d4d4d4; border-radius:9999px;"></div>
      <div style="width:3px; height:34px; background:#a3a3a3; border-radius:9999px;"></div>
      <div style="width:3px; height:18px; background:#a3a3a3; border-radius:9999px;"></div>
      <div style="width:3px; height:42px; background:#171717; border-radius:9999px;"></div>
      <div style="width:3px; height:28px; background:#171717; border-radius:9999px;"></div>
      <div style="width:3px; height:46px; background:#171717; border-radius:9999px;"></div>
      <div style="width:3px; height:20px; background:#171717; border-radius:9999px;"></div>
      <div style="width:3px; height:36px; background:#171717; border-radius:9999px;"></div>
      <div style="width:3px; height:14px; background:#a3a3a3; border-radius:9999px;"></div>
      <div style="width:3px; height:30px; background:#a3a3a3; border-radius:9999px;"></div>
      <div style="width:3px; height:16px; background:#d4d4d4; border-radius:9999px;"></div>
      <div style="width:3px; height:24px; background:#d4d4d4; border-radius:9999px;"></div>
    </div>

    <div style="font-size:36px; font-weight:800; color:#0a0a0a; letter-spacing:-0.025em; font-variant-numeric:tabular-nums;">04:32</div>
    <div style="font-size:14px; color:#737373; margin-top:8px;">녹음 중... 편하게 대화하세요</div>

    <!-- Record button -->
    <div style="margin-top:40px; display:flex; align-items:center; gap:32px;">
      <div style="width:48px; height:48px; border-radius:9999px; background:#f5f5f5; border:1px solid #e5e5e5; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </div>
      <div style="width:72px; height:72px; border-radius:9999px; background:#ef4444; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 6px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06);">
        <div style="width:24px; height:24px; background:#fafafa; border-radius:4px;"></div>
      </div>
      <div style="width:48px; height:48px; border-radius:9999px; background:#f5f5f5; border:1px solid #e5e5e5; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </div>
    </div>
    <div style="display:flex; gap:56px; margin-top:12px;">
      <span style="font-size:11px; color:#737373; width:48px; text-align:center;">일시정지</span>
      <span style="font-size:11px; color:#737373; width:72px; text-align:center;">끝내기</span>
      <span style="font-size:11px; color:#737373; width:48px; text-align:center;">메모</span>
    </div>
  </div>

  <!-- Bottom hint -->
  <div style="margin:0 20px 32px 20px; background:#f5f5f5; border-radius:12px; padding:14px 16px; display:flex; gap:10px; align-items:flex-start;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:2px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <div style="font-size:13px; color:#737373; line-height:18px;">녹음이 끝나면 AI가 대화를 정리해 한 편의 이야기로 만들어드려요. 사투리와 말버릇은 최대한 살립니다.</div>
  </div>

</div>
</body>
</html>
