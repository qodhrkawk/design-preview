<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>얼렸어 — 리포트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; position: relative; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 20px 20px 16px;">
    <div style="font-size: 24px; font-weight: 600; line-height: 32px; color: #0a0a0a;">리포트</div>
    <div style="font-size: 14px; line-height: 20px; color: #737373; margin-top: 2px;">2026년 8월</div>
  </div>

  <div style="flex: 1; padding: 0 20px 100px; display: flex; flex-direction: column; gap: 16px;">

    <!-- Hero stat -->
    <div style="background: #171717; border-radius: 16px; padding: 24px;">
      <div style="font-size: 13px; font-weight: 500; color: #a3a3a3;">이번 달 제때 먹은 비율</div>
      <div style="font-size: 36px; font-weight: 800; line-height: 44px; color: #fafafa; margin-top: 4px;">86%</div>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        <span style="font-size: 13px; font-weight: 500; color: #22c55e;">지난달보다 12%p 올랐어</span>
      </div>
    </div>

    <!-- In/out summary -->
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
          <span style="font-size: 13px; font-weight: 500; color: #737373;">넣은 것</span>
        </div>
        <div style="font-size: 28px; font-weight: 800; color: #0a0a0a; margin-top: 6px;">14<span style="font-size: 14px; font-weight: 500; color: #737373;">개</span></div>
      </div>
      <div style="flex: 1; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          <span style="font-size: 13px; font-weight: 500; color: #737373;">꺼내 먹은 것</span>
        </div>
        <div style="font-size: 28px; font-weight: 800; color: #0a0a0a; margin-top: 6px;">12<span style="font-size: 14px; font-weight: 500; color: #737373;">개</span></div>
      </div>
      <div style="flex: 1; background: #ffffff; border: 1px solid #fecaca; border-radius: 12px; padding: 16px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span style="font-size: 13px; font-weight: 500; color: #737373;">버린 것</span>
        </div>
        <div style="font-size: 28px; font-weight: 800; color: #dc2626; margin-top: 6px;">2<span style="font-size: 14px; font-weight: 500; color: #737373;">개</span></div>
      </div>
    </div>

    <!-- Insight card -->
    <div style="background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 16px; display: flex; gap: 12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
      <div>
        <div style="font-size: 14px; font-weight: 600; color: #b45309;">냉동밥을 자주 버리고 있어</div>
        <div style="font-size: 13px; line-height: 19px; color: #737373; margin-top: 4px;">최근 3개월 동안 냉동밥 4개를 기한 넘겨서 버렸어. 한 번에 얼리는 양을 줄여보는 건 어때?</div>
      </div>
    </div>

    <!-- Aging list -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px;">
      <div style="font-size: 16px; font-weight: 600; color: #0a0a0a; margin-bottom: 14px;">오래 잠들어 있는 것들</div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f5f5f5;">
        <div style="flex: 1;">
          <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">곰국 소분</div>
          <div style="font-size: 12px; color: #737373; margin-top: 1px;">아래 서랍</div>
        </div>
        <span style="background: #fef2f2; color: #dc2626; border-radius: 9999px; padding: 3px 10px; font-size: 12px; font-weight: 600;">74일째</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f5f5f5;">
        <div style="flex: 1;">
          <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">냉동밥</div>
          <div style="font-size: 12px; color: #737373; margin-top: 1px;">위 칸</div>
        </div>
        <span style="background: #fef2f2; color: #dc2626; border-radius: 9999px; padding: 3px 10px; font-size: 12px; font-weight: 600;">71일째</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0;">
        <div style="flex: 1;">
          <div style="font-size: 14px; font-weight: 500; color: #0a0a0a;">대패삼겹살</div>
          <div style="font-size: 12px; color: #737373; margin-top: 1px;">가운데 서랍</div>
        </div>
        <span style="background: #fffbeb; color: #b45309; border-radius: 9999px; padding: 3px 10px; font-size: 12px; font-weight: 600;">58일째</span>
      </div>
    </div>

  </div>

  <!-- Bottom nav -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 72px; background: #ffffff; border-top: 1px solid #e5e5e5; display: flex; align-items: center; padding-bottom: 8px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/></svg>
      <span style="font-size: 11px; font-weight: 400; color: #a3a3a3;">냉동실</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      <span style="font-size: 11px; font-weight: 400; color: #a3a3a3;">장보기 체크</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #171717;">리포트</span>
    </div>
  </div>

</div>
</body>
</html>
