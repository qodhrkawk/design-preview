<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>얼렸어 — 넣기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .phone { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; position: relative; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="padding: 20px; display: flex; align-items: center; gap: 12px;">
    <button style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid #e5e5e5; background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div style="font-size: 20px; font-weight: 600; line-height: 28px; color: #0a0a0a;">냉동실에 넣기</div>
  </div>

  <div style="flex: 1; padding: 0 20px 120px; display: flex; flex-direction: column; gap: 24px;">

    <!-- Name -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">뭘 얼렸어?</div>
      <input value="돼지고기 목살" style="width: 100%; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 16px; height: 44px; font-family: inherit; color: #0a0a0a;">
      <div style="display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap;">
        <span style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 5px 12px; font-size: 12px; font-weight: 500;">냉동밥</span>
        <span style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 5px 12px; font-size: 12px; font-weight: 500;">국 소분</span>
        <span style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 5px 12px; font-size: 12px; font-weight: 500;">다진마늘</span>
        <span style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 5px 12px; font-size: 12px; font-weight: 500;">대파</span>
        <span style="background: #f5f5f5; color: #171717; border-radius: 9999px; padding: 5px 12px; font-size: 12px; font-weight: 500;">식빵</span>
      </div>
      <div style="font-size: 12px; color: #737373; margin-top: 6px;">최근에 얼린 것들 — 탭하면 바로 입력</div>
    </div>

    <!-- Category auto-detected -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">종류</div>
      <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <div style="flex: 1;">
          <div style="font-size: 14px; font-weight: 600; color: #15803d;">생고기 (돼지·소)</div>
          <div style="font-size: 12px; color: #737373; margin-top: 2px;">권장 보관기간 3개월 자동 적용</div>
        </div>
        <span style="font-size: 13px; font-weight: 500; color: #737373;">변경</span>
      </div>
    </div>

    <!-- Quantity -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">몇 개?</div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <button style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #e5e5e5; background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <div style="font-size: 24px; font-weight: 800; color: #0a0a0a; min-width: 60px; text-align: center;">3<span style="font-size: 14px; font-weight: 500; color: #737373;"> 팩</span></div>
        <button style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid #e5e5e5; background: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>
    </div>

    <!-- Location -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">어디에 넣었어?</div>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1; border: 1px solid #e5e5e5; background: #ffffff; border-radius: 8px; padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 500; color: #737373;">위 칸</div>
        <div style="flex: 1; border: 2px solid #171717; background: #ffffff; border-radius: 8px; padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 600; color: #171717;">가운데 서랍</div>
        <div style="flex: 1; border: 1px solid #e5e5e5; background: #ffffff; border-radius: 8px; padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 500; color: #737373;">아래 서랍</div>
        <div style="flex: 1; border: 1px solid #e5e5e5; background: #ffffff; border-radius: 8px; padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 500; color: #737373;">문쪽</div>
      </div>
    </div>

    <!-- Date -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">언제 얼렸어?</div>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1; border: 2px solid #171717; background: #ffffff; border-radius: 8px; padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 600; color: #171717;">오늘</div>
        <div style="flex: 1; border: 1px solid #e5e5e5; background: #ffffff; border-radius: 8px; padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 500; color: #737373;">어제</div>
        <div style="flex: 1; border: 1px solid #e5e5e5; background: #ffffff; border-radius: 8px; padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 500; color: #737373;">날짜 선택</div>
      </div>
    </div>

  </div>

  <!-- Bottom CTA -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px 32px; background: #ffffff; border-top: 1px solid #e5e5e5;">
    <button style="width: 100%; height: 52px; background: #171717; color: #fafafa; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;">넣었어</button>
  </div>

</div>
</body>
</html>
