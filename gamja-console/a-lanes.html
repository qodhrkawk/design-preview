<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>감자 콘솔 — A 미니멀 · 레인 목록</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Inter, system-ui, sans-serif; background: #171717; display: flex; justify-content: center; min-height: 100vh; }
.mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #0a0a0a; position: relative; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }
</style>
</head>
<body>
<div class="mobile-frame">
  <!-- status bar spacer -->
  <div style="height: 48px;"></div>

  <!-- top bar -->
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 16px 20px;">
    <h1 style="font-size: 20px; line-height: 28px; font-weight: 600; color: #fafafa; letter-spacing: -0.025em;">감자 콘솔</h1>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="width: 7px; height: 7px; border-radius: 9999px; background: #22c55e;"></span>
      <span style="font-size: 12px; line-height: 16px; color: #a3a3a3;">연결됨</span>
    </div>
  </header>

  <!-- lane list -->
  <main style="padding: 0 0 120px 0;">

    <!-- lane: running -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-top: 1px solid #262626;">
      <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #fafafa;">리팩토링 작업</div>
        <div style="font-size: 13px; line-height: 18px; color: #a3a3a3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">테스트 12개 통과, lint 정리 중…</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0;">
        <span style="font-size: 12px; line-height: 16px; color: #737373;">방금</span>
        <span style="font-size: 11px; line-height: 14px; font-weight: 500; color: #22c55e;">작업 중</span>
      </div>
    </div>

    <!-- lane: running -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-top: 1px solid #262626;">
      <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #fafafa;">주읽이 크롤러 디버깅</div>
        <div style="font-size: 13px; line-height: 18px; color: #a3a3a3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">공시 파서 타임아웃 원인 추적 중…</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0;">
        <span style="font-size: 12px; line-height: 16px; color: #737373;">2분 전</span>
        <span style="font-size: 11px; line-height: 14px; font-weight: 500; color: #22c55e;">작업 중</span>
      </div>
    </div>

    <!-- lane: idle -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-top: 1px solid #262626;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #fafafa;">블로그 초안</div>
        <div style="font-size: 13px; line-height: 18px; color: #a3a3a3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">초안 3개 완성. 검토 대기</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0;">
        <span style="font-size: 12px; line-height: 16px; color: #737373;">1시간 전</span>
        <span style="font-size: 11px; line-height: 14px; font-weight: 500; color: #737373;">대기</span>
      </div>
    </div>

    <!-- lane: idle -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-top: 1px solid #262626; border-bottom: 1px solid #262626;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #fafafa;">서버 로그 정리</div>
        <div style="font-size: 13px; line-height: 18px; color: #a3a3a3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">launchd 재등록 완료</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0;">
        <span style="font-size: 12px; line-height: 16px; color: #737373;">어제</span>
        <span style="font-size: 11px; line-height: 14px; font-weight: 500; color: #737373;">대기</span>
      </div>
    </div>
  </main>

  <!-- new lane button -->
  <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; padding: 16px 20px 32px 20px; background: linear-gradient(to top, #0a0a0a 60%, rgba(10,10,10,0));">
    <button style="width: 100%; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #fafafa; color: #171717; border: none; border-radius: 10px; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      새 레인
    </button>
  </div>
</div>
</body>
</html>
