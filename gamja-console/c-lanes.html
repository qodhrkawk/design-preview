<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>감자 콘솔 — C 카드 대시보드 · 레인 목록</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Inter, system-ui, sans-serif; background: #171717; display: flex; justify-content: center; min-height: 100vh; }
.mobile-frame { width: 100%; max-width: 390px; min-height: 100vh; background: #0a0a0a; position: relative; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }
</style>
</head>
<body>
<div class="mobile-frame">
  <div style="height: 48px;"></div>

  <!-- top bar -->
  <header style="padding: 8px 20px 4px 20px; display: flex; align-items: center; justify-content: space-between;">
    <h1 style="font-size: 24px; line-height: 32px; font-weight: 700; color: #fafafa; letter-spacing: -0.025em;">레인</h1>
    <div style="display: flex; align-items: center; gap: 6px; background: #171717; border: 1px solid #262626; border-radius: 9999px; padding: 6px 12px;">
      <span style="width: 7px; height: 7px; border-radius: 9999px; background: #22c55e;"></span>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #fafafa;">연결됨</span>
    </div>
  </header>

  <!-- summary chips -->
  <div style="display: flex; gap: 8px; padding: 12px 20px 16px 20px;">
    <div style="flex: 1; background: #171717; border: 1px solid #262626; border-radius: 12px; padding: 12px 14px;">
      <div style="font-size: 22px; line-height: 28px; font-weight: 700; color: #22c55e;">2</div>
      <div style="font-size: 12px; line-height: 16px; color: #a3a3a3; margin-top: 2px;">작업 중</div>
    </div>
    <div style="flex: 1; background: #171717; border: 1px solid #262626; border-radius: 12px; padding: 12px 14px;">
      <div style="font-size: 22px; line-height: 28px; font-weight: 700; color: #fafafa;">2</div>
      <div style="font-size: 12px; line-height: 16px; color: #a3a3a3; margin-top: 2px;">대기</div>
    </div>
    <div style="flex: 1; background: #171717; border: 1px solid #262626; border-radius: 12px; padding: 12px 14px;">
      <div style="font-size: 22px; line-height: 28px; font-weight: 700; color: #fafafa;">4</div>
      <div style="font-size: 12px; line-height: 16px; color: #a3a3a3; margin-top: 2px;">전체</div>
    </div>
  </div>

  <!-- lane cards -->
  <main style="padding: 0 20px 130px 20px; display: flex; flex-direction: column; gap: 12px;">

    <!-- running card -->
    <div style="background: #171717; border: 1px solid #262626; border-radius: 16px; padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06);">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
          <div style="width: 38px; height: 38px; border-radius: 10px; background: rgba(34,197,94,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          </div>
          <div style="min-width: 0;">
            <div style="font-size: 15px; line-height: 21px; font-weight: 600; color: #fafafa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">리팩토링 작업</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373; margin-top: 1px;">방금 활동</div>
          </div>
        </div>
        <span style="background: rgba(34,197,94,0.12); color: #22c55e; border-radius: 9999px; padding: 3px 10px; font-size: 11px; line-height: 16px; font-weight: 600; flex-shrink: 0;">작업 중</span>
      </div>
      <div style="font-size: 13px; line-height: 19px; color: #a3a3a3; margin-top: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">테스트 12개 통과, lint 정리 중…</div>
    </div>

    <!-- running card -->
    <div style="background: #171717; border: 1px solid #262626; border-radius: 16px; padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06);">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
          <div style="width: 38px; height: 38px; border-radius: 10px; background: rgba(34,197,94,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          </div>
          <div style="min-width: 0;">
            <div style="font-size: 15px; line-height: 21px; font-weight: 600; color: #fafafa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">주읽이 크롤러 디버깅</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373; margin-top: 1px;">2분 전 활동</div>
          </div>
        </div>
        <span style="background: rgba(34,197,94,0.12); color: #22c55e; border-radius: 9999px; padding: 3px 10px; font-size: 11px; line-height: 16px; font-weight: 600; flex-shrink: 0;">작업 중</span>
      </div>
      <div style="font-size: 13px; line-height: 19px; color: #a3a3a3; margin-top: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">공시 파서 타임아웃 원인 추적 중…</div>
    </div>

    <!-- idle card -->
    <div style="background: #171717; border: 1px solid #262626; border-radius: 16px; padding: 16px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
          <div style="width: 38px; height: 38px; border-radius: 10px; background: #262626; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
          </div>
          <div style="min-width: 0;">
            <div style="font-size: 15px; line-height: 21px; font-weight: 600; color: #fafafa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">블로그 초안</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373; margin-top: 1px;">1시간 전 활동</div>
          </div>
        </div>
        <span style="background: #262626; color: #a3a3a3; border-radius: 9999px; padding: 3px 10px; font-size: 11px; line-height: 16px; font-weight: 600; flex-shrink: 0;">대기</span>
      </div>
      <div style="font-size: 13px; line-height: 19px; color: #a3a3a3; margin-top: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">초안 3개 완성. 검토 대기</div>
    </div>

    <!-- idle card -->
    <div style="background: #171717; border: 1px solid #262626; border-radius: 16px; padding: 16px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
          <div style="width: 38px; height: 38px; border-radius: 10px; background: #262626; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
          </div>
          <div style="min-width: 0;">
            <div style="font-size: 15px; line-height: 21px; font-weight: 600; color: #fafafa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">서버 로그 정리</div>
            <div style="font-size: 12px; line-height: 16px; color: #737373; margin-top: 1px;">어제 활동</div>
          </div>
        </div>
        <span style="background: #262626; color: #a3a3a3; border-radius: 9999px; padding: 3px 10px; font-size: 11px; line-height: 16px; font-weight: 600; flex-shrink: 0;">대기</span>
      </div>
      <div style="font-size: 13px; line-height: 19px; color: #a3a3a3; margin-top: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">launchd 재등록 완료</div>
    </div>
  </main>

  <!-- FAB -->
  <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; display: flex; justify-content: flex-end; padding: 0 20px 36px 0; pointer-events: none;">
    <button style="pointer-events: auto; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #fafafa; border: none; border-radius: 9999px; box-shadow: 0 10px 15px rgba(0,0,0,0.4), 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>
  </div>
</div>
</body>
</html>
