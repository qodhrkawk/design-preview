<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyOrNot - 등록</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
.phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; overflow: hidden; }
input, textarea { outline: none; }
input::placeholder, textarea::placeholder { color: #a3a3a3; }
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 8px; font-size: 12px; font-weight: 600; color: #0a0a0a;">
    <span>14:04</span>
    <div style="display: flex; gap: 4px; align-items: center;">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#0a0a0a"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#0a0a0a"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#0a0a0a"/><rect x="13" y="0" width="3" height="12" rx="1" fill="#e5e5e5"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#0a0a0a"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#0a0a0a"/><rect x="22.5" y="3.5" width="1.5" height="5" rx="0.75" fill="#0a0a0a"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div style="display: flex; align-items: center; padding: 12px 24px 20px; gap: 12px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    <h1 style="font-size: 20px; font-weight: 600; color: #0a0a0a;">사고 싶은 거 등록</h1>
  </div>

  <!-- Form -->
  <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 20px;">
    <!-- Product Name -->
    <div>
      <label style="display: block; font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">무슨 물건이야?</label>
      <input type="text" placeholder="예: 에어팟 맥스 2" style="width: 100%; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; font-size: 15px; font-family: Inter, system-ui, sans-serif; color: #0a0a0a;">
    </div>

    <!-- Price -->
    <div>
      <label style="display: block; font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">얼마야?</label>
      <div style="position: relative;">
        <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; color: #737373;">₩</span>
        <input type="text" placeholder="769,000" style="width: 100%; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px 12px 12px 28px; font-size: 15px; font-family: Inter, system-ui, sans-serif; color: #0a0a0a;">
      </div>
    </div>

    <!-- Category -->
    <div>
      <label style="display: block; font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">카테고리</label>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <div style="background: #0a0a0a; color: #fafafa; border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500;">전자기기</div>
        <div style="background: #f5f5f5; color: #0a0a0a; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500;">패션</div>
        <div style="background: #f5f5f5; color: #0a0a0a; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500;">생활</div>
        <div style="background: #f5f5f5; color: #0a0a0a; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500;">취미</div>
        <div style="background: #f5f5f5; color: #0a0a0a; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500;">식품</div>
        <div style="background: #f5f5f5; color: #0a0a0a; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500;">기타</div>
      </div>
    </div>

    <!-- Cooling Period -->
    <div>
      <label style="display: block; font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">쿨다운 시간</label>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; text-align: center; font-size: 14px; color: #0a0a0a;">24h</div>
        <div style="flex: 1; background: #0a0a0a; border-radius: 8px; padding: 12px; text-align: center; font-size: 14px; font-weight: 600; color: #fafafa;">72h</div>
        <div style="flex: 1; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; text-align: center; font-size: 14px; color: #0a0a0a;">7일</div>
        <div style="flex: 1; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; text-align: center; font-size: 14px; color: #0a0a0a;">30일</div>
      </div>
    </div>

    <!-- Why -->
    <div>
      <label style="display: block; font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">왜 사고 싶어?</label>
      <textarea placeholder="지금 이 순간의 감정을 솔직하게 적어봐" style="width: 100%; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; font-size: 14px; font-family: Inter, system-ui, sans-serif; color: #0a0a0a; height: 80px; resize: none;"></textarea>
      <p style="font-size: 11px; color: #737373; margin-top: 4px;">AI가 72시간 후 다시 물어볼 때 이 감정을 비교해줘</p>
    </div>

    <!-- Link (optional) -->
    <div>
      <label style="display: block; font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">구매 링크 <span style="color: #a3a3a3; font-weight: 400;">(선택)</span></label>
      <input type="url" placeholder="https://..." style="width: 100%; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; font-size: 15px; font-family: Inter, system-ui, sans-serif; color: #0a0a0a;">
    </div>
  </div>

  <!-- Submit -->
  <div style="padding: 24px;">
    <button style="width: 100%; background: #0a0a0a; color: #fafafa; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: Inter, system-ui, sans-serif;">
      쿨다운 시작
    </button>
    <p style="text-align: center; font-size: 12px; color: #737373; margin-top: 8px;">72시간 후 다시 알려줄게</p>
  </div>
</div>
</body>
</html>
