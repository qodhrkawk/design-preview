<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyOrNot - 홈</title>
<style>

.phone { width: 390px; min-height: 844px; background: #ffffff; position: relative; overflow: hidden; }

<body>

    <div style="display: flex; gap: 4px; align-items: center;">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#0a0a0a"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#0a0a0a"/><rect x="9" y="0" width="3" height="12" rx="1" fill="#0a0a0a"/><rect x="13" y="0" width="3" height="12" rx="1" fill="#e5e5e5"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#0a0a0a"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#0a0a0a"/><rect x="22.5" y="3.5" width="1.5" height="5" rx="0.75" fill="#0a0a0a"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div style="padding: 16px 24px 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h1 style="font-size: 28px; font-weight: 800; color: #0a0a0a; letter-spacing: -0.025em;">살까말까</h1>
        <p style="font-size: 14px; color: #737373; margin-top: 2px;">충동구매, 72시간만 참아봐</p>
      </div>
      <div style="width: 40px; height: 40px; background: #f5f5f5; border-radius: 9999px; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>

  <!-- Summary Cards -->

    <div style="flex: 1; background: #0a0a0a; border-radius: 12px; padding: 16px;">
      <p style="font-size: 12px; color: #a3a3a3; margin-bottom: 4px;">이번 달 아낀 돈</p>
      <p style="font-size: 22px; font-weight: 800; color: #fafafa;">₩342,000</p>
      <p style="font-size: 11px; color: #22c55e; margin-top: 4px;">+₩89,000 이번 주</p>
    </div>
    <div style="flex: 1; background: #f5f5f5; border-radius: 12px; padding: 16px; border: 1px solid #e5e5e5;">
      <p style="font-size: 12px; color: #737373; margin-bottom: 4px;">대기 중</p>
      <p style="font-size: 22px; font-weight: 800; color: #0a0a0a;">5건</p>
      <p style="font-size: 11px; color: #f59e0b; margin-top: 4px;">2건 곧 만료</p>
    </div>
  </div>

  <!-- Section Title -->
  <div style="padding: 0 24px; margin-bottom: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 18px; font-weight: 600; color: #0a0a0a;">대기 중인 물건</h2>
      <span style="font-size: 13px; color: #737373;">전체 보기</span>
    </div>
  </div>

  <!-- Waiting Items -->
  <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 12px;">
    <!-- Item 1 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="display: flex; gap: 12px; align-items: center;">
          <div style="width: 48px; height: 48px; background: #f5f5f5; border-radius: 10px; display: flex; align-items: center; justify-content: center;">

          </div>
        </div>
        <div style="text-align: right;">
          <div style="background: #fef3c7; color: #92400e; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 9999px;">18h 남음</div>
        </div>
      </div>
      <!-- Progress Bar -->
      <div style="margin-top: 12px; background: #f5f5f5; border-radius: 9999px; height: 6px; overflow: hidden;">
        <div style="width: 75%; height: 100%; background: #f59e0b; border-radius: 9999px;"></div>
      </div>
      <p style="font-size: 11px; color: #737373; margin-top: 6px;">AI: "비슷한 제품을 3개월 전에 검토했어요. 그때는 안 샀죠?"</p>
    </div>

    <!-- Item 2 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="display: flex; gap: 12px; align-items: center;">
          <div style="width: 48px; height: 48px; background: #f5f5f5; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>

            <p style="font-size: 15px; font-weight: 600; color: #0a0a0a;">에어팟 맥스 2</p>
            <p style="font-size: 13px; color: #737373;">₩769,000</p>
          </div>
        </div>
        <div style="text-align: right;">
          <div style="background: #dcfce7; color: #166534; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 9999px;">48h 남음</div>
        </div>
      </div>
      <div style="margin-top: 12px; background: #f5f5f5; border-radius: 9999px; height: 6px; overflow: hidden;">
        <div style="width: 33%; height: 100%; background: #22c55e; border-radius: 9999px;"></div>
      </div>
      <p style="font-size: 11px; color: #737373; margin-top: 6px;">AI: "이번 달 전자기기 예산 초과 예정. 다음 달로 미루면 ₩50K 할인 가능성"</p>
    </div>

    <!-- Item 3 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div style="display: flex; gap: 12px; align-items: center;">
          <div style="width: 48px; height: 48px; background: #f5f5f5; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
          </div>
          <div>
            <p style="font-size: 15px; font-weight: 600; color: #0a0a0a;">나이키 에어맥스 DN</p>
            <p style="font-size: 13px; color: #737373;">₩219,000</p>
          </div>
        </div>
        <div style="text-align: right;">
          <div style="background: #fee2e2; color: #991b1b; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 9999px;">만료됨</div>
        </div>
      </div>
      <div style="margin-top: 12px; background: #f5f5f5; border-radius: 9999px; height: 6px; overflow: hidden;">
        <div style="width: 100%; height: 100%; background: #ef4444; border-radius: 9999px;"></div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button style="flex: 1; background: #0a0a0a; color: #fafafa; border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 500; cursor: pointer;">구매 확정</button>
        <button style="flex: 1; background: #f5f5f5; color: #0a0a0a; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 500; cursor: pointer;">안 살래</button>

    </div>
  </div>

  <div style="position: absolute; bottom: 100px; right: 24px;">
    <div style="width: 56px; height: 56px; background: #0a0a0a; border-radius: 9999px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06);">

      <span style="font-size: 10px; color: #a3a3a3;">통계</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span style="font-size: 10px; color: #a3a3a3;">설정</span>
    </div>
