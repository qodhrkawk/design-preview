<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뭐라셨지 — 홈</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Inter, system-ui, sans-serif; background:#f5f5f5; display:flex; justify-content:center; }
.phone { width:390px; min-height:844px; background:#ffffff; display:flex; flex-direction:column; }
</style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px 20px;">
    <div>
      <div style="font-size:24px; line-height:32px; font-weight:600; color:#0a0a0a; letter-spacing:-0.025em;">뭐라셨지</div>
      <div style="font-size:14px; line-height:20px; color:#737373; margin-top:2px;">진료실에서 들은 말, 하나도 놓치지 마세요</div>
    </div>
    <div style="width:40px; height:40px; border-radius:9999px; background:#f5f5f5; display:flex; align-items:center; justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>

  <!-- Profile chips -->
  <div style="display:flex; gap:8px; padding:12px 20px;">
    <div style="display:flex; align-items:center; gap:6px; background:#171717; color:#fafafa; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:500;">나</div>
    <div style="display:flex; align-items:center; gap:6px; background:#f5f5f5; color:#171717; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:500;">엄마</div>
    <div style="display:flex; align-items:center; gap:6px; background:#f5f5f5; color:#171717; border-radius:9999px; padding:6px 14px; font-size:13px; font-weight:500;">아빠</div>
    <div style="display:flex; align-items:center; gap:4px; background:#ffffff; border:1px dashed #e5e5e5; color:#737373; border-radius:9999px; padding:6px 12px; font-size:13px; font-weight:500;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>추가
    </div>
  </div>

  <!-- Upcoming visit card -->
  <div style="margin:8px 20px 0 20px; background:#171717; border-radius:16px; padding:20px;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span style="font-size:12px; line-height:16px; color:#a3a3a3; font-weight:500;">다가오는 진료</span>
      </div>
      <span style="background:#262626; color:#fafafa; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">D-2</span>
    </div>
    <div style="font-size:18px; line-height:28px; font-weight:600; color:#fafafa; margin-top:10px;">서울정형외과 · 어깨 재진</div>
    <div style="font-size:13px; line-height:20px; color:#a3a3a3; margin-top:2px;">7월 18일 (토) 오전 10:30</div>
    <div style="display:flex; align-items:center; gap:8px; background:#262626; border-radius:10px; padding:12px 14px; margin-top:14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      <span style="font-size:13px; line-height:18px; color:#fafafa; font-weight:500;">AI가 물어볼 질문 4개를 준비했어요</span>
      <svg style="margin-left:auto;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>

  <!-- Timeline -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:24px 20px 12px 20px;">
    <div style="font-size:16px; line-height:24px; font-weight:600; color:#0a0a0a;">진료 타임라인</div>
    <div style="font-size:13px; color:#737373; font-weight:500;">전체보기</div>
  </div>

  <!-- Record card 1 -->
  <div style="margin:0 20px 12px 20px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="width:32px; height:32px; border-radius:9999px; background:#f5f5f5; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2H4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2v-3a2 2 0 0 1 2-2h3a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2h-5z" transform="scale(0.9) translate(1.5 1.5)"/><path d="M12 8v8M8 12h8"/></svg>
        </div>
        <div>
          <div style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a;">서울정형외과 · 어깨 통증</div>
          <div style="font-size:12px; line-height:16px; color:#737373;">7월 4일 · 나</div>
        </div>
      </div>
      <span style="background:#f5f5f5; color:#171717; border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:500;">재진 예정</span>
    </div>
    <div style="display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;">
      <span style="background:#f5f5f5; border-radius:6px; padding:4px 8px; font-size:12px; color:#171717; font-weight:500;">회전근개 염좌</span>
      <span style="background:#f5f5f5; border-radius:6px; padding:4px 8px; font-size:12px; color:#171717; font-weight:500;">소염진통제 2주</span>
      <span style="background:#f5f5f5; border-radius:6px; padding:4px 8px; font-size:12px; color:#171717; font-weight:500;">무거운 것 금지</span>
    </div>
  </div>

  <!-- Record card 2 -->
  <div style="margin:0 20px 12px 20px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="width:32px; height:32px; border-radius:9999px; background:#f5f5f5; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <div>
          <div style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a;">하나내과 · 고혈압 정기검진</div>
          <div style="font-size:12px; line-height:16px; color:#737373;">6월 27일 · 엄마</div>
        </div>
      </div>
    </div>
    <div style="display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;">
      <span style="background:#f5f5f5; border-radius:6px; padding:4px 8px; font-size:12px; color:#171717; font-weight:500;">혈압 안정</span>
      <span style="background:#f5f5f5; border-radius:6px; padding:4px 8px; font-size:12px; color:#171717; font-weight:500;">약 용량 유지</span>
      <span style="background:#f5f5f5; border-radius:6px; padding:4px 8px; font-size:12px; color:#171717; font-weight:500;">3개월 후 재검</span>
    </div>
  </div>

  <!-- Record card 3 -->
  <div style="margin:0 20px 12px 20px; background:#ffffff; border:1px solid #e5e5e5; border-radius:12px; padding:16px;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="width:32px; height:32px; border-radius:9999px; background:#f5f5f5; display:flex; align-items:center; justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7z"/></svg>
        </div>
        <div>
          <div style="font-size:14px; line-height:20px; font-weight:600; color:#0a0a0a;">밝은안과 · 시력 검진</div>
          <div style="font-size:12px; line-height:16px; color:#737373;">6월 12일 · 나</div>
        </div>
      </div>
    </div>
    <div style="display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;">
      <span style="background:#f5f5f5; border-radius:6px; padding:4px 8px; font-size:12px; color:#171717; font-weight:500;">안구건조증</span>
      <span style="background:#f5f5f5; border-radius:6px; padding:4px 8px; font-size:12px; color:#171717; font-weight:500;">인공눈물 처방</span>
    </div>
  </div>

  <!-- AI search bar -->
  <div style="margin:8px 20px 20px 20px; display:flex; align-items:center; gap:10px; background:#f5f5f5; border-radius:12px; padding:14px 16px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <span style="font-size:14px; color:#737373;">"지난번 피부과에서 뭐 처방받았지?"</span>
  </div>

  <!-- FAB -->
  <div style="position:sticky; bottom:24px; display:flex; justify-content:flex-end; padding:0 20px; margin-top:auto;">
    <div style="width:56px; height:56px; border-radius:9999px; background:#171717; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
    </div>
  </div>
  <div style="height:24px;"></div>
</div>
</body>
</html>
