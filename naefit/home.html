<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내핏 — 홈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 96px; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="padding: 24px 20px 16px 20px; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div style="font-size: 24px; line-height: 32px; font-weight: 600; color: #0a0a0a;">내핏</div>
      <div style="font-size: 14px; line-height: 20px; color: #737373; margin-top: 2px;">브랜드마다 다른 내 사이즈, 한 곳에</div>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 9999px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </div>
  </div>

  <!-- Search -->
  <div style="padding: 0 20px 16px 20px;">
    <div style="display: flex; align-items: center; gap: 8px; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span style="font-size: 14px; color: #737373;">브랜드나 아이템 검색</span>
    </div>
  </div>

  <!-- Profile chips -->
  <div style="padding: 0 20px 20px 20px; display: flex; gap: 8px;">
    <div style="background: #171717; color: #fafafa; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500;">나</div>
    <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500;">아내</div>
    <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 6px 14px; font-size: 13px; font-weight: 500;">첫째 (7세)</div>
    <div style="display: flex; align-items: center; gap: 4px; background: #ffffff; color: #737373; border: 1px dashed #e5e5e5; border-radius: 9999px; padding: 6px 12px; font-size: 13px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      추가
    </div>
  </div>

  <!-- Section title -->
  <div style="padding: 0 20px 12px 20px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 16px; font-weight: 600; color: #0a0a0a;">내 브랜드 <span style="color: #737373; font-weight: 400;">12</span></div>
    <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #737373;">
      최근 기록순
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </div>

  <!-- Brand cards -->
  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 10px;">

    <!-- Card 1 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 10px; background: #171717; color: #fafafa; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">유</div>
          <div>
            <div style="font-size: 16px; font-weight: 600; color: #0a0a0a;">유니클로</div>
            <div style="font-size: 12px; color: #737373;">기록 5개 · 3일 전</div>
          </div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 5px; background: #f5f5f5; border-radius: 9999px; padding: 4px 10px;">
          <span style="font-size: 12px; color: #737373;">티셔츠</span>
          <span style="font-size: 12px; font-weight: 600; color: #0a0a0a;">L</span>
          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #22c55e;"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px; background: #f5f5f5; border-radius: 9999px; padding: 4px 10px;">
          <span style="font-size: 12px; color: #737373;">바지</span>
          <span style="font-size: 12px; font-weight: 600; color: #0a0a0a;">32</span>
          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #22c55e;"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px; background: #f5f5f5; border-radius: 9999px; padding: 4px 10px;">
          <span style="font-size: 12px; color: #737373;">아우터</span>
          <span style="font-size: 12px; font-weight: 600; color: #0a0a0a;">XL</span>
          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #f59e0b;"></span>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 10px; background: #3b82f6; color: #fafafa; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">나</div>
          <div>
            <div style="font-size: 16px; font-weight: 600; color: #0a0a0a;">나이키</div>
            <div style="font-size: 12px; color: #737373;">기록 3개 · 2주 전</div>
          </div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 5px; background: #f5f5f5; border-radius: 9999px; padding: 4px 10px;">
          <span style="font-size: 12px; color: #737373;">운동화</span>
          <span style="font-size: 12px; font-weight: 600; color: #0a0a0a;">270</span>
          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #22c55e;"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px; background: #f5f5f5; border-radius: 9999px; padding: 4px 10px;">
          <span style="font-size: 12px; color: #737373;">러닝화</span>
          <span style="font-size: 12px; font-weight: 600; color: #0a0a0a;">265</span>
          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #22c55e;"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px; background: #f5f5f5; border-radius: 9999px; padding: 4px 10px;">
          <span style="font-size: 12px; color: #737373;">반바지</span>
          <span style="font-size: 12px; font-weight: 600; color: #0a0a0a;">M</span>
          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #ef4444;"></span>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 40px; height: 40px; border-radius: 10px; background: #737373; color: #fafafa; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">자</div>
          <div>
            <div style="font-size: 16px; font-weight: 600; color: #0a0a0a;">자라</div>
            <div style="font-size: 12px; color: #737373;">기록 2개 · 1달 전</div>
          </div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 5px; background: #f5f5f5; border-radius: 9999px; padding: 4px 10px;">
          <span style="font-size: 12px; color: #737373;">셔츠</span>
          <span style="font-size: 12px; font-weight: 600; color: #0a0a0a;">M</span>
          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #22c55e;"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px; background: #f5f5f5; border-radius: 9999px; padding: 4px 10px;">
          <span style="font-size: 12px; color: #737373;">슬랙스</span>
          <span style="font-size: 12px; font-weight: 600; color: #0a0a0a;">EU 40</span>
          <span style="width: 6px; height: 6px; border-radius: 9999px; background: #f59e0b;"></span>
        </div>
      </div>
    </div>

  </div>

  <!-- Legend -->
  <div style="padding: 16px 20px 0 20px; display: flex; gap: 14px; align-items: center;">
    <div style="display: flex; align-items: center; gap: 5px;"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #22c55e;"></span><span style="font-size: 12px; color: #737373;">딱 맞음</span></div>
    <div style="display: flex; align-items: center; gap: 5px;"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #f59e0b;"></span><span style="font-size: 12px; color: #737373;">조금 큼/작음</span></div>
    <div style="display: flex; align-items: center; gap: 5px;"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #ef4444;"></span><span style="font-size: 12px; color: #737373;">실패</span></div>
  </div>

  <!-- FAB -->
  <div style="position: absolute; bottom: 32px; right: 20px; width: 56px; height: 56px; border-radius: 9999px; background: #171717; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </div>

</div>
</body>
</html>
