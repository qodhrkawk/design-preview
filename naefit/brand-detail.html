<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내핏 — 브랜드 상세</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 40px; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="padding: 20px; display: flex; align-items: center; gap: 12px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: #171717; color: #fafafa; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">유</div>
      <div>
        <div style="font-size: 18px; font-weight: 600; color: #0a0a0a;">유니클로</div>
        <div style="font-size: 12px; color: #737373;">기록 5개</div>
      </div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
  </div>

  <!-- Summary card -->
  <div style="margin: 0 20px 20px 20px; background: #f5f5f5; border-radius: 12px; padding: 16px;">
    <div style="font-size: 13px; font-weight: 500; color: #737373; margin-bottom: 10px;">이 브랜드에서 내 사이즈</div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 14px; color: #0a0a0a;">티셔츠 · 셔츠</span>
        <span style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 15px; font-weight: 600; color: #0a0a0a;">L</span>
          <span style="width: 7px; height: 7px; border-radius: 9999px; background: #22c55e;"></span>
        </span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 14px; color: #0a0a0a;">바지</span>
        <span style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 15px; font-weight: 600; color: #0a0a0a;">32인치</span>
          <span style="width: 7px; height: 7px; border-radius: 9999px; background: #22c55e;"></span>
        </span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 14px; color: #0a0a0a;">아우터</span>
        <span style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 15px; font-weight: 600; color: #0a0a0a;">XL</span>
          <span style="width: 7px; height: 7px; border-radius: 9999px; background: #f59e0b;"></span>
        </span>
      </div>
    </div>
    <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e5e5; display: flex; align-items: flex-start; gap: 8px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 1px; flex-shrink: 0;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <span style="font-size: 13px; line-height: 18px; color: #737373;">아우터는 한 치수 크게 입는 편 — 최근 2번 모두 XL 선택</span>
    </div>
  </div>

  <!-- Timeline title -->
  <div style="padding: 0 20px 12px 20px; font-size: 16px; font-weight: 600; color: #0a0a0a;">기록 타임라인</div>

  <!-- Timeline -->
  <div style="padding: 0 20px; display: flex; flex-direction: column;">

    <!-- Item 1 -->
    <div style="display: flex; gap: 12px;">
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="width: 10px; height: 10px; border-radius: 9999px; background: #22c55e; margin-top: 6px;"></div>
        <div style="width: 2px; flex: 1; background: #e5e5e5;"></div>
      </div>
      <div style="flex: 1; padding-bottom: 20px;">
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 14px; font-weight: 600; color: #0a0a0a;">에어리즘 코튼 티셔츠</span>
              <span style="background: #f5f5f5; border-radius: 9999px; padding: 2px 8px; font-size: 11px; font-weight: 500; color: #171717;">상의</span>
            </div>
            <span style="font-size: 12px; color: #737373;">7/29</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 16px; font-weight: 600; color: #0a0a0a;">L</span>
            <span style="font-size: 13px; color: #22c55e; font-weight: 500;">딱 맞음</span>
          </div>
          <div style="margin-top: 6px; font-size: 13px; line-height: 18px; color: #737373;">여름용으로 딱. 세탁 후에도 안 줄어듦.</div>
        </div>
      </div>
    </div>

    <!-- Item 2 -->
    <div style="display: flex; gap: 12px;">
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="width: 10px; height: 10px; border-radius: 9999px; background: #f59e0b; margin-top: 6px;"></div>
        <div style="width: 2px; flex: 1; background: #e5e5e5;"></div>
      </div>
      <div style="flex: 1; padding-bottom: 20px;">
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 14px; font-weight: 600; color: #0a0a0a;">포켓터블 파카</span>
              <span style="background: #f5f5f5; border-radius: 9999px; padding: 2px 8px; font-size: 11px; font-weight: 500; color: #171717;">아우터</span>
            </div>
            <span style="font-size: 12px; color: #737373;">5/14</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 16px; font-weight: 600; color: #0a0a0a;">XL</span>
            <span style="font-size: 13px; color: #f59e0b; font-weight: 500;">조금 큼</span>
          </div>
          <div style="margin-top: 6px; font-size: 13px; line-height: 18px; color: #737373;">이너 두껍게 입으면 딱. 봄가을엔 살짝 여유.</div>
        </div>
      </div>
    </div>

    <!-- Item 3 -->
    <div style="display: flex; gap: 12px;">
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="width: 10px; height: 10px; border-radius: 9999px; background: #ef4444; margin-top: 6px;"></div>
        <div style="width: 2px; flex: 1; background: transparent;"></div>
      </div>
      <div style="flex: 1; padding-bottom: 20px;">
        <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-size: 14px; font-weight: 600; color: #0a0a0a;">슬림핏 치노</span>
              <span style="background: #f5f5f5; border-radius: 9999px; padding: 2px 8px; font-size: 11px; font-weight: 500; color: #171717;">하의</span>
            </div>
            <span style="font-size: 12px; color: #737373;">3/02</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 16px; font-weight: 600; color: #0a0a0a;">31</span>
            <span style="font-size: 13px; color: #ef4444; font-weight: 500;">작음 · 반품함</span>
          </div>
          <div style="margin-top: 6px; font-size: 13px; line-height: 18px; color: #737373;">허벅지가 꽉 낌. 유니클로 바지는 무조건 32.</div>
        </div>
      </div>
    </div>

  </div>

</div>
</body>
</html>
