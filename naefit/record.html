<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내핏 — 기록 추가</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; position: relative; padding-bottom: 120px; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <div style="padding: 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e5e5e5;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    <div style="font-size: 18px; line-height: 28px; font-weight: 600; color: #0a0a0a;">사이즈 기록</div>
  </div>

  <div style="padding: 20px; display: flex; flex-direction: column; gap: 24px;">

    <!-- Who -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">누구 옷이에요?</div>
      <div style="display: flex; gap: 8px;">
        <div style="background: #171717; color: #fafafa; border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500;">나</div>
        <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500;">아내</div>
        <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 9999px; padding: 8px 16px; font-size: 13px; font-weight: 500;">첫째 (7세)</div>
      </div>
    </div>

    <!-- Brand -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">브랜드</div>
      <div style="display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px;">
        <span style="font-size: 14px; color: #0a0a0a; flex: 1;">유니클로</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <div style="display: flex; gap: 6px; margin-top: 8px;">
        <div style="background: #f5f5f5; border-radius: 9999px; padding: 4px 12px; font-size: 12px; color: #171717;">유니클로</div>
        <div style="background: #f5f5f5; border-radius: 9999px; padding: 4px 12px; font-size: 12px; color: #171717;">나이키</div>
        <div style="background: #f5f5f5; border-radius: 9999px; padding: 4px 12px; font-size: 12px; color: #171717;">자라</div>
        <div style="background: #f5f5f5; border-radius: 9999px; padding: 4px 12px; font-size: 12px; color: #171717;">무신사</div>
      </div>
    </div>

    <!-- Category -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">카테고리</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <div style="display: flex; align-items: center; gap: 6px; background: #171717; color: #fafafa; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 500;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"></path></svg>
          상의
        </div>
        <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 500;">하의</div>
        <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 500;">아우터</div>
        <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 500;">신발</div>
        <div style="background: #f5f5f5; color: #171717; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 500;">기타</div>
      </div>
    </div>

    <!-- Size -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">사이즈</div>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px; font-size: 14px; color: #0a0a0a;">L</div>
        <div style="width: 110px; display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px;">
          <span style="font-size: 14px; color: #737373;">표기</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
    </div>

    <!-- Fit verdict -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">핏은 어땠어요?</div>
      <div style="display: flex; gap: 8px;">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="19 12 12 19 5 12"></polyline><line x1="12" y1="5" x2="12" y2="19"></line></svg>
          <span style="font-size: 12px; color: #737373;">작음</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #171717; border: 1px solid #171717; border-radius: 12px; padding: 14px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span style="font-size: 12px; color: #fafafa; font-weight: 500;">딱 맞음</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 12 5 19 12"></polyline><line x1="12" y1="19" x2="12" y2="5"></line></svg>
          <span style="font-size: 12px; color: #737373;">큼</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 14px 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          <span style="font-size: 12px; color: #737373;">실패·반품</span>
        </div>
      </div>
    </div>

    <!-- Memo -->
    <div>
      <div style="font-size: 14px; font-weight: 500; color: #0a0a0a; margin-bottom: 8px;">메모 <span style="color: #737373; font-weight: 400;">(선택)</span></div>
      <div style="background: #ffffff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px; min-height: 72px; font-size: 14px; color: #737373;">
        어깨는 딱인데 소매가 살짝 김. 다음엔 슬림핏으로.
      </div>
    </div>

    <!-- Photo -->
    <div style="display: flex; align-items: center; gap: 10px; background: #f5f5f5; border: 1px dashed #e5e5e5; border-radius: 12px; padding: 14px 16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      <span style="font-size: 13px; color: #737373;">라벨 사진 첨부 (선택) — 나중에 실측 확인용</span>
    </div>

  </div>

  <!-- Bottom CTA -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px 32px 20px; background: #ffffff; border-top: 1px solid #e5e5e5;">
    <div style="background: #171717; color: #fafafa; border-radius: 8px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500;">저장</div>
  </div>

</div>
</body>
</html>
