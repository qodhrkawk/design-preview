<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; display: flex; justify-content: center; }
  .screen { width: 390px; min-height: 844px; background: #ffffff; display: flex; flex-direction: column; position: relative; }

  .seg span { flex: 1; text-align: center; font-size: 13px; font-weight: 500; padding: 7px 0; border-radius: 6px; color: #737373; }
  .seg span.on { background: #ffffff; color: #171717; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #e5e5e5; }
  .ico { width: 36px; height: 36px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
