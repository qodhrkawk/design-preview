<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>탔어 — 디자인 시안</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background: #f5f5f5; color: #0a0a0a; padding: 32px 16px; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; }
  p { font-size: 14px; color: #737373; margin-top: 4px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; margin-top: 24px; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .item span { font-size: 13px; font-weight: 500; }
  iframe { width: 390px; height: 844px; border: 1px solid #e5e5e5; border-radius: 16px; background: #ffffff; }
</style>
</head>
<body>
  <div style="text-align: center;">
    <h1>탔어 (Tasseo)</h1>
    <p>스키·보드 시즌권 본전 트래커 — 원탭 출석 + 리조트 정가표 기준 본전 게이지 + 폐장까지 페이스 예측 + 탄 일수 기준 왁싱 알림 + 시즌 결산으로 내년 얼리버드 판단</p>
  </div>
  <div class="grid">
    <div class="item"><span>1. 시즌 (본전 게이지 + 페이스)</span><iframe src="home.html"></iframe></div>
    <div class="item"><span>2. 오늘 탔어 (원탭 기록)</span><iframe src="checkin.html"></iframe></div>
    <div class="item"><span>3. 시즌 결산 (내년 뭘로 탈까)</span><iframe src="season.html"></iframe></div>
  </div>
</body>
</html>
